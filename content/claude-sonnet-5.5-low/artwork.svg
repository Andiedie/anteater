<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <g id="bottle">
      <rect x="-7" y="-6" width="14" height="24" rx="4"/>
      <rect x="-3" y="-17" width="6" height="12"/>
      <rect x="-4" y="-20" width="8" height="4" rx="1" fill="#555"/>
      <rect x="-7" y="2" width="14" height="6" fill="#fff" opacity=".5"/>
    </g>
  </defs>
  <rect width="400" height="400" fill="#bfe6ff"/>
  <rect y="372" width="400" height="28" fill="#7bbf6a"/>
  <!-- scrolling ground marks -->
  <g stroke="#5a9a4a" stroke-width="3">
    <line x1="0" y1="385" x2="30" y2="385"/><line x1="120" y1="385" x2="150" y2="385"/>
    <line x1="240" y1="385" x2="270" y2="385"/><line x1="360" y1="385" x2="390" y2="385"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- bobbing rider + unicycle -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="0.75s" repeatCount="indefinite"/>

    <!-- wheel -->
    <g transform="translate(200 325)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
        <circle r="44" fill="none" stroke="#333" stroke-width="6"/>
        <g stroke="#888" stroke-width="2">
          <line x1="-44" y1="0" x2="44" y2="0"/><line x1="0" y1="-44" x2="0" y2="44"/>
          <line x1="-31" y1="-31" x2="31" y2="31"/><line x1="-31" y1="31" x2="31" y2="-31"/>
        </g>
        <!-- pedals -->
        <line x1="-14" y1="0" x2="14" y2="0" stroke="#222" stroke-width="5"/>
        <rect x="-24" y="-3" width="12" height="6" fill="#c33"/>
        <rect x="12" y="-3" width="12" height="6" fill="#c33"/>
      </g>
      <circle r="6" fill="#222"/>
    </g>
    <!-- fork and seat -->
    <line x1="200" y1="325" x2="200" y2="255" stroke="#333" stroke-width="6"/>
    <rect x="182" y="246" width="36" height="9" rx="4" fill="#c33"/>

    <!-- tail -->
    <path d="M165 225 C120 230 85 200 70 160 C100 175 130 175 160 200 Z" fill="#7a6a5a" stroke="#4a3d30" stroke-width="2"/>
    <!-- legs -->
    <path d="M190 245 L185 285 L200 325" stroke="#6b5a4a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M210 245 L222 285 L200 325" stroke="#6b5a4a" stroke-width="9" fill="none" stroke-linecap="round"/>
    <!-- body -->
    <ellipse cx="195" cy="215" rx="38" ry="38" fill="#8a7867" stroke="#4a3d30" stroke-width="2"/>
    <ellipse cx="205" cy="225" rx="20" ry="24" fill="#d9c7a8"/>
    <!-- neck + head with long snout -->
    <path d="M205 190 L225 150 L245 160 L225 205 Z" fill="#8a7867"/>
    <path d="M222 135 C240 125 262 140 300 150 C305 153 305 158 300 160 C262 165 240 170 225 168 Z" fill="#8a7867" stroke="#4a3d30" stroke-width="2"/>
    <circle cx="302" cy="155" r="3.5" fill="#222"/>
    <circle cx="236" cy="142" r="5" fill="#fff"/><circle cx="238" cy="142" r="2.5" fill="#111"/>
    <path d="M222 135 L215 118 L233 128 Z" fill="#6b5a4a"/>
    <!-- tongue -->
    <path d="M300 158 q12 0 18 8" stroke="#e66" stroke-width="2.5" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M300 158 q12 0 18 8;M300 158 q14 -4 22 -2;M300 158 q12 0 18 8" dur="1s" repeatCount="indefinite"/>
    </path>
    <!-- arms (waving to catch) -->
    <path stroke="#6b5a4a" stroke-width="8" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M185 200 Q150 180 145 150;M185 200 Q160 190 160 150;M185 200 Q150 180 145 150" dur="1.5s" repeatCount="indefinite"/>
    </path>
    <path stroke="#6b5a4a" stroke-width="8" fill="none" stroke-linecap="round">
      <animate attributeName="d" values="M215 200 Q255 190 255 150;M215 200 Q240 180 240 150;M215 200 Q255 190 255 150" dur="1.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- juggled bottles -->
  <g fill="#2e9e5b" stroke="#145c33" stroke-width="1.5">
    <g>
      <use href="#bottle"/>
      <animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M145 150 C140 20 260 20 255 150 C250 60 150 60 145 150 Z"/>
    </g>
    <g fill="#3a7bd5" stroke="#1d3f7a">
      <use href="#bottle"/>
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M145 150 C140 20 260 20 255 150 C250 60 150 60 145 150 Z"/>
    </g>
    <g fill="#e08a2e" stroke="#7a4510">
      <use href="#bottle"/>
      <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" path="M145 150 C140 20 260 20 255 150 C250 60 150 60 145 150 Z"/>
    </g>
  </g>
</svg>
