<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="960" height="800" viewBox="0 0 960 800" role="img" aria-labelledby="title description">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="description">A cheerful, long-snouted anteater with a magnificent shaggy tail balances on a turning unicycle. Three colorful bottles tumble through the air above its paws in an endlessly looping circus act.</desc>
  <defs>
    <radialGradient id="paper" cx="55%" cy="38%" r="75%">
      <stop stop-color="#fff9e9"/>
      <stop offset="1" stop-color="#f0e5cf"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#b6aa8e"/>
      <stop offset="1" stop-color="#887b66"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#776c5c"/>
      <stop offset="1" stop-color="#3b4240"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="white" stop-opacity=".27"/>
      <stop offset=".45" stop-color="white" stop-opacity="0"/>
      <stop offset="1" stop-color="#173b39" stop-opacity=".22"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#173b39" opacity=".06"/>
    </pattern>
    <g id="bottle" stroke="#294540" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-5-29 H5 V-15 C5-10 13-9 13-2 V27 Q13 31 9 31 H-9 Q-13 31-13 27 V-2 C-13-9-5-10-5-15 Z" fill="currentColor"/>
      <path d="M-5-29 H5 V-15 C5-10 13-9 13-2 V27 Q13 31 9 31 H-9 Q-13 31-13 27 V-2 C-13-9-5-10-5-15 Z" fill="url(#glass)" stroke="none"/>
      <rect x="-7" y="-33" width="14" height="6" rx="2" fill="#f8efda"/>
      <path d="M-13 5 H13 V20 H-13" fill="#fff4d8"/>
      <path d="M0 8 4 12 0 16-4 12Z" fill="currentColor" stroke="none"/>
      <path d="M-8-3 V1 M-8 24 V26" stroke="white" stroke-opacity=".65" stroke-linecap="round"/>
    </g>
    <path id="juggling-arc" d="M492 357 C515 109 665 109 690 357 C663 392 522 392 492 357Z"/>
  </defs>

  <!-- Warm, lightly textured circus-poster backdrop. -->
  <rect width="960" height="800" rx="28" fill="url(#paper)"/>
  <rect width="960" height="800" rx="28" fill="url(#dots)"/>
  <rect x="25" y="25" width="910" height="750" rx="18" fill="none" stroke="#b8b294" stroke-opacity=".5"/>
  <path d="M241 621 C114 513 154 261 342 197 C529 123 791 234 806 430 C821 601 666 700 485 690Z" fill="#d7e6d8"/>
  <circle cx="707" cy="252" r="97" fill="#ebc877" opacity=".4"/>
  <path d="M137 688 H823" stroke="#b4b49b" stroke-width="2" stroke-linecap="round"/>
  <ellipse cx="545" cy="694" rx="149" ry="14" fill="#294540" opacity=".12">
    <animate attributeName="rx" values="149;139;149" dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <g fill="#294540" font-family="Georgia, 'Times New Roman', serif">
    <text x="71" y="90" font-size="15" letter-spacing="4">THE SMALL BIG TOP</text>
    <text x="69" y="139" font-size="38" font-style="italic">A very fine balance.</text>
  </g>
  <g fill="none" stroke="#b99752" stroke-width="2" stroke-linecap="round">
    <path d="M792 139 V157 M783 148 H801 M786 142 798 154 M798 142 786 154"/>
    <path d="M229 240 V252 M223 246 H235"/>
    <path d="M778 481 V493 M772 487 H784"/>
  </g>

  <!-- The wheel turns independently of the frame and the rider. -->
  <g stroke="#294540" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="560" cy="605" r="83" fill="#fff9e9" fill-opacity=".65" stroke-width="12"/>
    <circle cx="560" cy="605" r="74" fill="none" stroke="#b69b66" stroke-width="3"/>
    <g stroke="#78938b" stroke-width="2">
      <animateTransform attributeName="transform" type="rotate" from="0 560 605" to="360 560 605" dur="1.8s" repeatCount="indefinite"/>
      <path d="M560 531 V679 M486 605 H634 M508 553 612 657 M508 657 612 553 M532 537 588 673 M492 577 628 633 M492 633 628 577 M532 673 588 537"/>
      <path d="M592 537 A74 74 0 0 1 622 565" fill="none" stroke="#e58d62" stroke-width="5"/>
    </g>
    <path d="M540 482 560 605" fill="none" stroke-width="12"/>
    <path d="M541 491 553 565" fill="none" stroke="#e4c886" stroke-width="5"/>
    <path d="M509 476 Q533 463 560 476 Q566 479 562 486 H514 Q506 485 509 476Z" fill="#294540" stroke-width="3"/>
  </g>

  <!-- Rear leg: its foot follows the opposite pedal. -->
  <path d="M514 446 Q468 496 483 530 L519 605" fill="none" stroke="#4c5148" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M514 446 Q468 496 483 530 L519 605;M514 446 Q484 485 505 519 L560 564;M514 446 Q533 485 546 523 L601 605;M514 446 Q483 518 512 556 L560 646;M514 446 Q468 496 483 530 L519 605" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- The anteater: a giant feathery tail, diagonal vest, and long tapered snout. -->
  <g stroke="#39453e" stroke-linejoin="round" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.2s" repeatCount="indefinite"/>
      <path d="M479 425 C424 439 394 451 347 434 C294 416 291 347 249 316 L239 335 221 310 217 340 197 323 201 354 179 344 187 377 165 365 179 404 158 402 184 438 169 444 202 471 186 480 224 496 211 509 255 516 247 529 C345 551 435 499 492 456Z" fill="url(#tail)" stroke-width="4"/>
      <g fill="none" stroke="#b3a589" stroke-width="3" opacity=".55">
        <path d="M227 359 C246 426 310 482 400 463"/>
        <path d="M208 391 C247 461 308 487 362 479"/>
        <path d="M215 451 Q277 508 332 495"/>
        <path d="M251 348 Q286 427 359 449"/>
      </g>
      <path d="M480 330 C451 355 444 398 460 430 C473 453 506 468 536 458 C572 446 590 412 579 370 L571 329Z" fill="url(#fur)" stroke-width="4"/>
      <path d="M466 352 C476 367 490 370 507 366 L562 326 580 350 529 398 Q501 420 478 444 Q458 427 457 407Z" fill="#303e39" stroke="none"/>
      <path d="M463 347 Q487 382 509 366 L559 329" fill="none" stroke="#eee6d0" stroke-width="9"/>
      <path d="M479 441 Q499 408 532 393 L580 352" fill="none" stroke="#eee6d0" stroke-width="5"/>
      <!-- The farther arm, reaching up to catch. -->
      <path d="M558 365 Q609 392 644 368 L679 353" fill="none" stroke="#817866" stroke-width="17"/>
      <path d="M675 355 Q685 346 694 351 Q700 357 692 364 L680 368" fill="#b5aa8c" stroke-width="3"/>
      <path d="M686 360 696 365 M681 365 691 371" stroke="#f8edcf" stroke-width="3"/>
      <!-- Small round ears and a spectacularly long nose. -->
      <path d="M520 297 Q502 275 514 264 Q532 251 542 285" fill="#a3977e" stroke-width="3"/>
      <path d="M520 282 Q516 272 523 272 L534 288" fill="#d4b49a" stroke="none"/>
      <path d="M526 292 C546 275 570 280 584 299 C605 317 639 329 682 337 Q699 341 696 348 Q694 354 681 353 C634 353 603 351 576 339 C557 352 537 350 525 333 C517 321 517 305 526 292Z" fill="url(#fur)" stroke-width="4"/>
      <path d="M582 329 Q635 347 680 346" fill="none" stroke="#e9ddbf" stroke-width="7"/>
      <path d="M686 338 Q701 340 696 348 L686 348Z" fill="#294540" stroke="none"/>
      <path d="M645 352 Q666 357 681 351" fill="none" stroke-width="2"/>
      <circle cx="564" cy="308" r="4.5" fill="#253b35" stroke="none"/>
      <circle cx="565.5" cy="306.5" r="1.3" fill="#fff9e9" stroke="none"/>
      <path d="M556 297 Q562 291 569 295" fill="none" stroke-width="2"/>
      <ellipse cx="573" cy="322" rx="8" ry="5" fill="#d49779" opacity=".6" stroke="none"/>
      <!-- A jaunty little neckerchief. -->
      <path d="M525 339 Q543 355 570 337 L575 345 Q550 365 526 350Z" fill="#d97853" stroke-width="2.5"/>
      <path d="M534 353 515 379 537 372 544 383 548 355Z" fill="#e58d62" stroke-width="2.5"/>
      <!-- Near arm and open catching paw. -->
      <path d="M487 375 Q461 396 473 412 Q487 421 495 367" fill="none" stroke="#39453e" stroke-width="23"/>
      <path d="M487 375 Q461 396 473 412 Q487 421 495 367" fill="none" stroke="#a89c80" stroke-width="16"/>
      <path d="M491 372 Q481 363 484 355 Q487 350 492 357 Q504 350 510 356 Q514 364 502 371Z" fill="#b5aa8c" stroke-width="3"/>
      <path d="M493 358 491 348 M500 357 500 347 M507 358 510 350" stroke="#fff0d0" stroke-width="3"/>
    </g>
  </g>

  <!-- Crank, front leg, and level feet: one full pedal revolution per 2.4 seconds. -->
  <g stroke="#294540" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 560 605" to="360 560 605" dur="2.4s" repeatCount="indefinite"/>
      <path d="M519 605 H601" stroke-width="7"/>
      <circle cx="519" cy="605" r="5" fill="#e4c886" stroke-width="2"/>
      <circle cx="601" cy="605" r="5" fill="#e4c886" stroke-width="2"/>
    </g>
    <circle cx="560" cy="605" r="11" fill="#e4c886" stroke-width="4"/>
    <circle cx="560" cy="605" r="3" fill="#294540" stroke="none"/>
  </g>
  <g>
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M519 605 A41 41 0 0 1 601 605 A41 41 0 0 1 519 605"/>
    <path d="M-12-8 Q-4-13 3-5 L19-1 Q25 6 17 8 H-14Z" fill="#4c5148" stroke="#39453e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M-16 10 H20" stroke="#294540" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M533 446 Q601 466 592 521 L601 605" fill="none" stroke="#39453e" stroke-width="25" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M533 446 Q601 466 592 521 L601 605;M533 446 Q592 492 587 541 L560 646;M533 446 Q554 478 542 525 L519 605;M533 446 Q592 463 579 509 L560 564;M533 446 Q601 466 592 521 L601 605" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M533 446 Q601 466 592 521 L601 605" fill="none" stroke="#b1a487" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" values="M533 446 Q601 466 592 521 L601 605;M533 446 Q592 492 587 541 L560 646;M533 446 Q554 478 542 525 L519 605;M533 446 Q592 463 579 509 L560 564;M533 446 Q601 466 592 521 L601 605" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <g>
    <animateMotion dur="2.4s" repeatCount="indefinite" path="M601 605 A41 41 0 0 1 519 605 A41 41 0 0 1 601 605"/>
    <path d="M-12-8 Q-4-13 3-5 L19-1 Q25 6 17 8 H-14Z" fill="#b1a487" stroke="#39453e" stroke-width="3" stroke-linejoin="round"/>
    <path d="M12 1 19 5 M5 2 11 7" stroke="#fff0d0" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M-16 10 H20" stroke="#294540" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Three phase-shifted bottles: motion along the arc plus two somersaults. -->
  <g color="#368d83">
    <animateMotion dur="3s" begin="0s" repeatCount="indefinite" calcMode="paced">
      <mpath xlink:href="#juggling-arc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="3s" begin="0s" repeatCount="indefinite"/>
      <use xlink:href="#bottle"/>
    </g>
  </g>
  <g color="#dc7855">
    <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" calcMode="paced">
      <mpath xlink:href="#juggling-arc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="3s" begin="-1s" repeatCount="indefinite"/>
      <use xlink:href="#bottle"/>
    </g>
  </g>
  <g color="#d6ad48">
    <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" calcMode="paced">
      <mpath xlink:href="#juggling-arc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="3s" begin="-2s" repeatCount="indefinite"/>
      <use xlink:href="#bottle"/>
    </g>
  </g>

  <g fill="#53665b" font-family="Verdana, sans-serif" font-size="11" letter-spacing="3">
    <text x="480" y="742" text-anchor="middle">ONE WHEEL · THREE BOTTLES · ZERO WORRIES</text>
  </g>
</svg>
