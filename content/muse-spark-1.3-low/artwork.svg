<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<style>
  .fur { fill: #A67C52; }
  .fur-dark { fill: #7A5A3A; }
  .stripe { fill: #F5F0E6; stroke: #222; stroke-width:3; }
  .snout { fill: #C9A87A; }
  .wheel { fill:none; stroke:#222; stroke-width:6; }
  .spoke { stroke:#555; stroke-width:3; }
  .bottle-green { fill:#3EB34F; stroke:#1a5c26; stroke-width:2; }
  .bottle-blue { fill:#3EA8E0; stroke:#174e6b; stroke-width:2; }
  .bottle-orange { fill:#FF8C2F; stroke:#7a3c0a; stroke-width:2; }
  .cork { fill:#D9B382; stroke:#6b4a26; stroke-width:2; }
</style>
<rect width="800" height="600" fill="#BFE8FF" rx="20"/>
<circle cx="650" cy="90" r="50" fill="#FFEB6B"/>
<ellipse cx="400" cy="540" rx="350" ry="25" fill="#7ED17E"/>
<!-- moving ground dashes to imply riding -->
<g stroke="#5AA85A" stroke-width="6" stroke-linecap="round">
  <line x1="0" y1="540" x2="80" y2="540">
    <animate attributeName="x1" values="-80;720" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="0;800" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="300" y1="540" x2="380" y2="540">
    <animate attributeName="x1" values="220;1020" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="300;1100" dur="2s" repeatCount="indefinite"/>
  </line>
  <line x1="600" y1="540" x2="680" y2="540">
    <animate attributeName="x1" values="520;-280" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="600;-200" dur="2s" repeatCount="indefinite"/>
  </line>
</g>

<!-- Unicycle -->
<g transform="translate(400,450)">
  <g>
    <circle r="60" class="wheel"/>
    <circle r="8" fill="#222"/>
    <!-- spokes rotating -->
    <g class="spokes">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
      <line x1="-55" y1="0" x2="55" y2="0" class="spoke"/>
      <line x1="0" y1="-55" x2="0" y2="55" class="spoke"/>
      <line x1="-39" y1="-39" x2="39" y2="39" class="spoke"/>
      <line x1="-39" y1="39" x2="39" y2="-39" class="spoke"/>
      <line x1="0" y1="0" x2="0" y2="-55" stroke="#E53935" stroke-width="5"/>
    </g>
  </g>
  <line x1="0" y1="0" x2="0" y2="-100" stroke="#222" stroke-width="6"/>
  <rect x="-25" y="-115" width="50" height="12" rx="4" fill="#222"/>
</g>

<!-- Anteater group bobbing -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="0.6s" repeatCount="indefinite"/>
  <!-- tail -->
  <g transform="translate(320,350)">
    <path d="M0,0 C -60,-20 -90,40 -140,30 C -110,50 -80,80 -10,60 Z" class="fur-dark">
      <animate attributeName="d" values="M0,0 C -60,-20 -90,40 -140,30 C -110,50 -80,80 -10,60 Z;M0,0 C -60,-30 -100,20 -150,10 C -120,40 -80,70 -10,60 Z;M0,0 C -60,-20 -90,40 -140,30 C -110,50 -80,80 -10,60 Z" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
  <!-- body -->
  <ellipse cx="380" cy="350" rx="90" ry="60" class="fur"/>
  <!-- signature stripe -->
  <path d="M330,310 L380,350 L330,390 L350,350 Z" fill="#F5F0E6" stroke="#222" stroke-width="4"/>
  <path d="M350,350 L420,320 L420,380 Z" fill="#222" opacity="0.8"/>
  <!-- legs pedaling -->
  <g transform="translate(400,390)">
    <ellipse cx="0" cy="25" rx="14" ry="28" class="fur-dark">
      <animateTransform attributeName="rotate" type="rotate" values="-20 0 0;25 0 0;-20 0 0" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <g transform="translate(370,390)">
    <ellipse cx="0" cy="25" rx="14" ry="28" class="fur-dark">
      <animateTransform attributeName="rotate" type="rotate" values="25 0 0;-20 0 0;25 0 0" dur="1.2s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- neck + long snout -->
  <g transform="translate(450,320)">
    <rect x="0" y="-18" width="140" height="36" rx="18" class="snout" transform="rotate(-15)"/>
    <circle cx="15" cy="-10" r="8" fill="#222"/>
    <circle cx="17" cy="-12" r="2.5" fill="white"/>
    <ellipse cx="135" cy="-32" rx="6" ry="4" fill="#222"/>
    <!-- sniff wiggle -->
    <animateTransform attributeName="transform" type="rotate" values="0; -5; 0; 4; 0" dur="1s" repeatCount="indefinite"/>
  </g>
  <!-- arms juggling -->
  <g stroke="#7A5A3A" stroke-width="16" stroke-linecap="round" fill="none">
    <path d="M410,360 Q460,300 490,260">
      <animate attributeName="d" values="M410,360 Q460,300 490,260;M410,360 Q460,320 480,290;M410,360 Q460,300 490,260" dur="0.75s" repeatCount="indefinite"/>
    </path>
    <path d="M410,360 Q360,310 330,270">
      <animate attributeName="d" values="M410,360 Q360,310 330,270;M410,360 Q370,330 350,300;M410,360 Q360,310 330,270" dur="0.75s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="490" cy="255" r="12" fill="#7A5A3A"/>
  <circle cx="330" cy="265" r="12" fill="#7A5A3A"/>
  <!-- party hat for fun -->
  <g transform="translate(435,270) rotate(-15)">
    <polygon points="0,0 30,0 15,-45" fill="#E53935" stroke="#222" stroke-width="3"/>
    <circle cx="15" cy="-45" r="7" fill="#FFEB6B" stroke="#222" stroke-width="2"/>
  </g>
</g>

<!-- Juggling bottles on loop paths -->
<g>
  <!-- bottle 1 green -->
  <g>
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M330,250 C 330,120 490,120 490,240 C 490,260 470,260 460,250"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(-12,-25)">
      <rect x="0" y="10" width="24" height="35" rx="5" class="bottle-green"/>
      <rect x="7" y="0" width="10" height="12" class="cork"/>
      <rect x="0" y="22" width="24" height="8" fill="white" opacity="0.4"/>
    </g>
  </g>
  <!-- bottle 2 blue, offset -->
  <g>
    <animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite" path="M330,250 C 330,120 490,120 490,240 C 490,260 470,260 460,250"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(-12,-25)">
      <rect x="0" y="10" width="24" height="35" rx="5" class="bottle-blue"/>
      <rect x="7" y="0" width="10" height="12" class="cork"/>
      <rect x="0" y="22" width="24" height="8" fill="white" opacity="0.4"/>
    </g>
  </g>
  <!-- bottle 3 orange, offset -->
  <g>
    <animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite" path="M330,250 C 330,120 490,120 490,240 C 490,260 470,260 460,250"/>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite" additive="sum"/>
    <g transform="translate(-12,-25)">
      <rect x="0" y="10" width="24" height="35" rx="5" class="bottle-orange"/>
      <rect x="7" y="0" width="10" height="12" class="cork"/>
      <rect x="0" y="22" width="24" height="8" fill="white" opacity="0.4"/>
    </g>
  </g>
</g>

<text x="400" y="40" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="bold" fill="#333">Anteater Unicycling Juggler!</text>
</svg>