<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3f4"/>
      <stop offset="1" stop-color="#eef9ff"/>
    </linearGradient>
    <linearGradient id="headGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#85776b"/>
      <stop offset="0.3" stop-color="#85776b"/>
      <stop offset="1" stop-color="#c6baab"/>
    </linearGradient>

    <!-- one tile = 1/4 wheel circumference, so the ground scroll matches the wheel -->
    <pattern id="dirt" x="0" y="546" width="103.67" height="54" patternUnits="userSpaceOnUse">
      <ellipse cx="20" cy="14" rx="9" ry="2.5" fill="#b9975c"/>
      <ellipse cx="70" cy="32" rx="12" ry="3" fill="#b9975c"/>
      <circle cx="46" cy="44" r="2.5" fill="#9c7a48"/>
      <ellipse cx="92" cy="11" rx="4" ry="1.5" fill="#9c7a48"/>
      <circle cx="8" cy="36" r="1.8" fill="#9c7a48"/>
    </pattern>

    <clipPath id="torsoClip">
      <path d="M362,338 C338,310 340,225 378,192 C400,174 438,180 446,212 C456,262 448,312 428,338 C410,346 380,346 362,338 Z"/>
    </clipPath>

    <g id="cloud" fill="#fff" fill-opacity="0.9">
      <ellipse cx="0" cy="0" rx="48" ry="17"/>
      <ellipse cx="-20" cy="-12" rx="22" ry="16"/>
      <ellipse cx="12" cy="-17" rx="28" ry="20"/>
    </g>

    <!-- bottle, centred on its origin; glass colour is inherited from <use fill> -->
    <g id="bottle">
      <rect x="-5" y="-35" width="10" height="6" rx="1.5" fill="#e3c04a"/>
      <path d="M-10,28 L-10,-2 C-10,-10 -4,-12 -4,-20 L-4,-30 L4,-30 L4,-20 C4,-12 10,-10 10,-2 L10,28 Q10,31 7,31 L-7,31 Q-10,31 -10,28 Z"
            fill-opacity="0.9" stroke="#000" stroke-opacity="0.3" stroke-width="1.5"/>
      <rect x="-10" y="6" width="20" height="14" fill="#fff6dc"/>
      <circle cx="0" cy="13" r="3.5" fill="#d9534f"/>
      <path d="M-6,-1 V3 M-6,23 V27" stroke="#fff" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- foot + pedal, origin at the ankle; foot colour inherited -->
    <g id="foot">
      <rect x="-15" y="7" width="30" height="6" rx="2" fill="#333"/>
      <ellipse cx="5" cy="1" rx="17" ry="8"/>
      <path d="M20,0 l6,3 M19,4 l5,4" stroke="#2b2522" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- paw, origin at the wrist -->
    <g id="paw">
      <circle r="13" fill="#3b322d"/>
      <path d="M-8,-9 q-4,-9 2,-13 M0,-12 q-2,-9 5,-12 M8,-9 q0,-9 8,-10" stroke="#2b2522" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="675" cy="95" r="42" fill="#ffe27a"/>
  <circle cx="675" cy="95" r="56" fill="#ffe27a" fill-opacity="0.3"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-900 0" dur="70s" repeatCount="indefinite"/>
    <use href="#cloud" x="120" y="120"/>
    <use href="#cloud" transform="translate(440,75) scale(1.3)"/>
    <use href="#cloud" transform="translate(740,150) scale(0.8)"/>
    <use href="#cloud" x="1020" y="120"/>
    <use href="#cloud" transform="translate(1340,75) scale(1.3)"/>
    <use href="#cloud" transform="translate(1640,150) scale(0.8)"/>
  </g>

  <!-- rolling hills (800px period) -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="40s" repeatCount="indefinite"/>
    <path fill="#8cc474" d="M0,460 C100,400 200,400 300,450 C380,490 450,420 560,430 C680,440 750,490 800,460 C900,400 1000,400 1100,450 C1180,490 1250,420 1360,430 C1480,440 1550,490 1600,460 L1600,560 L0,560 Z"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="16s" repeatCount="indefinite"/>
    <path fill="#74b25c" d="M0,520 C120,490 220,500 330,515 C440,530 520,495 640,500 C720,503 760,530 800,520 C920,490 1020,500 1130,515 C1240,530 1320,495 1440,500 C1520,503 1560,530 1600,520 L1600,560 L0,560 Z"/>
  </g>

  <!-- ground -->
  <rect x="0" y="546" width="800" height="54" fill="#d4b278"/>
  <rect x="-110" y="546" width="1020" height="54" fill="url(#dirt)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-103.67 0" dur="0.5s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="546" width="800" height="4" fill="#b08d55"/>
  <ellipse cx="400" cy="553" rx="62" ry="6" fill="#000" fill-opacity="0.2"/>

  <!-- ===== Far side: crank, leg, foot ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="180 400 480" to="540 400 480" dur="2s" repeatCount="indefinite"/>
    <line x1="400" y1="480" x2="428" y2="480" stroke="#444" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path fill="none" stroke="#4a3e37" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" d="M392,335 L437,410.6 L372,470">
    <animate attributeName="d" dur="2s" begin="-1s" repeatCount="indefinite"
      values="M392,335 L461.7,388.7 L428,470;
              M392,335 L444.8,405.4 L419.8,489.8;
              M392,335 L428.9,414.9 L400,498;
              M392,335 L427.4,415.6 L380.2,489.8;
              M392,335 L437,410.6 L372,470;
              M392,335 L452,399.4 L380.2,450.2;
              M392,335 L465.6,383.3 L400,442;
              M392,335 L469.2,377.3 L419.8,450.2;
              M392,335 L461.7,388.7 L428,470"/>
  </path>
  <g fill="#4a3e37">
    <animateMotion dur="2s" begin="-1s" repeatCount="indefinite" path="M428,470 A28,28 0 1,1 372,470 A28,28 0 1,1 428,470"/>
    <use href="#foot"/>
  </g>

  <!-- ===== Unicycle ===== -->
  <circle cx="400" cy="480" r="62" fill="none" stroke="#2a2a2a" stroke-width="8"/>
  <circle cx="400" cy="480" r="56" fill="none" stroke="#cfd3d6" stroke-width="3"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 480" to="360 400 480" dur="2s" repeatCount="indefinite"/>
    <g stroke="#b9bec2" stroke-width="1.5">
      <line x1="344" y1="480" x2="456" y2="480"/>
      <line x1="344" y1="480" x2="456" y2="480" transform="rotate(30 400 480)"/>
      <line x1="344" y1="480" x2="456" y2="480" transform="rotate(60 400 480)"/>
      <line x1="344" y1="480" x2="456" y2="480" transform="rotate(90 400 480)"/>
      <line x1="344" y1="480" x2="456" y2="480" transform="rotate(120 400 480)"/>
      <line x1="344" y1="480" x2="456" y2="480" transform="rotate(150 400 480)"/>
    </g>
    <rect x="396" y="430" width="8" height="14" rx="2" fill="#ff8a1f"/>
    <circle cx="400" cy="536" r="3" fill="#f5f5f5"/>
  </g>
  <line x1="400" y1="480" x2="396" y2="346" stroke="#e0483a" stroke-width="7" stroke-linecap="round"/>
  <circle cx="400" cy="480" r="8" fill="#8d9296"/>
  <path d="M358,340 Q360,329 376,334 L412,334 Q430,327 432,340 Q432,351 418,351 L372,351 Q358,351 358,340 Z" fill="#222"/>

  <!-- ===== Upper body (gently wobbling for balance) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" dur="2.4s" repeatCount="indefinite"
      calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
      values="-1.5 392 338;1.5 392 338;-1.5 392 338"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" dur="1s" repeatCount="indefinite"
        calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
        values="-5 372 320;5 372 320;-5 372 320"/>
      <path d="M374,300 C330,290 250,296 186,316 Q168,326 182,340 C240,388 332,370 374,340 Z" fill="#5b4d43"/>
      <path d="M360,318 C310,312 250,318 200,328 M356,332 C310,340 260,346 215,344 M350,346 C320,357 285,361 250,358"
            stroke="#796a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- torso -->
    <path d="M362,338 C338,310 340,225 378,192 C400,174 438,180 446,212 C456,262 448,312 428,338 C410,346 380,346 362,338 Z" fill="#85776b"/>
    <g clip-path="url(#torsoClip)">
      <path d="M460,186 L460,264 L344,298 Z" fill="#ece3d4"/>
      <path d="M460,197 L460,252 L356,292 Z" fill="#2b2522"/>
    </g>

    <!-- head -->
    <g transform="translate(418,186)">
      <g>
        <animateTransform attributeName="transform" type="rotate" dur="1.6s" repeatCount="indefinite"
          calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"
          values="-16;-9;-16"/>
        <!-- tongue -->
        <path d="M126,13 q18,10 32,-2 q6,-6 11,-1" fill="none" stroke="#ec6f8e" stroke-width="3"
              pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
          <animate attributeName="stroke-dashoffset" dur="2.8s" repeatCount="indefinite"
            keyTimes="0;0.55;0.65;0.72;0.8;0.9;1" values="1;1;0;0.25;0;1;1"/>
        </path>
        <!-- ear -->
        <ellipse cx="-2" cy="-25" rx="7" ry="11" transform="rotate(-25 -2 -25)" fill="#6b5e54"/>
        <ellipse cx="-1" cy="-24" rx="3.5" ry="6.5" transform="rotate(-25 -1 -24)" fill="#b89f93"/>
        <!-- skull + snout -->
        <path d="M-6,-26 C20,-36 50,-6 120,3 Q131,5 131,12 Q131,20 120,20 C70,21 40,30 -2,30 C-26,26 -28,-18 -6,-26 Z" fill="url(#headGrad)"/>
        <ellipse cx="127" cy="11.500" rx="5" ry="6.500" fill="#2b2522"/>
        <path d="M98,18 q10,1 18,-1" stroke="#5c5047" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        <!-- eye -->
        <ellipse cx="27" cy="-8" rx="4.500" ry="4.500" fill="#1d1815">
          <animate attributeName="ry" dur="3.7s" repeatCount="indefinite" keyTimes="0;0.92;0.95;0.98;1" values="4.5;4.5;0.6;4.5;4.5"/>
        </ellipse>
        <circle cx="28.500" cy="-9.500" r="1.400" fill="#fff"/>
      </g>
    </g>

    <!-- left arm + paw (catches at t=0, throws at t=0.4) -->
    <path fill="none" stroke="#d2c7b6" stroke-width="20" stroke-linecap="round" d="M372,226 Q324,274 270,255">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0 0 1 1;0 0 1 1"
        values="M372,226 Q324,274 270,255;
                M372,226 Q340,290 300,277;
                M372,226 Q354,280 330,255;
                M372,226 Q340,272 300,245;
                M372,226 Q324,274 270,255"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0 0 1 1;0 0 1 1"
        values="270 255;300 277;330 255;300 245;270 255"/>
      <use href="#paw"/>
    </g>

    <!-- right arm + paw (throws at t=0, catches at t=0.4) -->
    <path fill="none" stroke="#d2c7b6" stroke-width="20" stroke-linecap="round" d="M426,226 Q446,280 470,255">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0 0 1 1;0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
        values="M426,226 Q446,280 470,255;
                M426,226 Q460,272 500,245;
                M426,226 Q476,274 530,255;
                M426,226 Q460,290 500,277;
                M426,226 Q446,280 470,255"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0 0 1 1;0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
        values="470 255;500 245;530 255;500 277;470 255"/>
      <use href="#paw"/>
    </g>

    <!-- ===== Bottles: 3-bottle cascade, 2.4s cycle, phases 0 / -0.8s / -1.6s ===== -->
    <!-- x: linear in flight; y: parabolic (quadratic ease out/in); in-hand scoop matches the paws -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33333;0.41667;0.5;0.83333;0.91667;1"
        keySplines="0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
        values="470 0;270 0;300 0;330 0;530 0;500 0;470 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.16667;0.33333;0.41667;0.5;0.66667;0.83333;0.91667;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
          values="0 255;0 55;0 255;0 277;0 255;0 55;0 255;0 277;0 255"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="0s" repeatCount="indefinite"
            keyTimes="0;0.33333;0.5;0.83333;1" values="0;-375;-360;15;0"/>
          <use href="#bottle" fill="#2e9e5b"/>
        </g>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33333;0.41667;0.5;0.83333;0.91667;1"
        keySplines="0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
        values="470 0;270 0;300 0;330 0;530 0;500 0;470 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.16667;0.33333;0.41667;0.5;0.66667;0.83333;0.91667;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
          values="0 255;0 55;0 255;0 277;0 255;0 55;0 255;0 277;0 255"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="-0.8s" repeatCount="indefinite"
            keyTimes="0;0.33333;0.5;0.83333;1" values="0;-375;-360;15;0"/>
          <use href="#bottle" fill="#d98a1f"/>
        </g>
      </g>
    </g>

    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.33333;0.41667;0.5;0.83333;0.91667;1"
        keySplines="0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0 0 1 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
        values="470 0;270 0;300 0;330 0;530 0;500 0;470 0"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.16667;0.33333;0.41667;0.5;0.66667;0.83333;0.91667;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.333 0.667 0.667 1;0.333 0 0.667 0.333"
          values="0 255;0 55;0 255;0 277;0 255;0 55;0 255;0 277;0 255"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="-1.6s" repeatCount="indefinite"
            keyTimes="0;0.33333;0.5;0.83333;1" values="0;-375;-360;15;0"/>
          <use href="#bottle" fill="#3a86d4"/>
        </g>
      </g>
    </g>
  </g>

  <!-- ===== Near side: crank, leg, foot ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 480" to="360 400 480" dur="2s" repeatCount="indefinite"/>
    <line x1="400" y1="480" x2="428" y2="480" stroke="#666" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="400" cy="480" r="4" fill="#555"/>
  <ellipse cx="395" cy="328" rx="25" ry="19" fill="#5d5047"/>
  <path fill="none" stroke="#5d5047" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" d="M392,335 L461.7,388.7 L428,470">
    <animate attributeName="d" dur="2s" repeatCount="indefinite"
      values="M392,335 L461.7,388.7 L428,470;
              M392,335 L444.8,405.4 L419.8,489.8;
              M392,335 L428.9,414.9 L400,498;
              M392,335 L427.4,415.6 L380.2,489.8;
              M392,335 L437,410.6 L372,470;
              M392,335 L452,399.4 L380.2,450.2;
              M392,335 L465.6,383.3 L400,442;
              M392,335 L469.2,377.3 L419.8,450.2;
              M392,335 L461.7,388.7 L428,470"/>
  </path>
  <g fill="#5d5047">
    <animateMotion dur="2s" repeatCount="indefinite" path="M428,470 A28,28 0 1,1 372,470 A28,28 0 1,1 428,470"/>
    <use href="#foot"/>
  </g>
</svg>
