<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect width="400" height="400" fill="#fdf3dc"/>
  <ellipse cx="200" cy="372" rx="110" ry="8" fill="#d9c9a3"/>

  <!-- whole rider sways -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-12 0;12 0;-12 0" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>

    <!-- wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 200 320;360 200 320;0 200 320" dur="4s" repeatCount="indefinite" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1"/>
      <circle cx="200" cy="320" r="46" fill="none" stroke="#333" stroke-width="7"/>
      <g stroke="#888" stroke-width="2">
        <line x1="154" y1="320" x2="246" y2="320"/>
        <line x1="200" y1="274" x2="200" y2="366"/>
        <line x1="167" y1="287" x2="233" y2="353"/>
        <line x1="233" y1="287" x2="167" y2="353"/>
      </g>
      <!-- cranks & pedals -->
      <line x1="184" y1="320" x2="216" y2="320" stroke="#555" stroke-width="5"/>
      <rect x="176" y="316" width="14" height="6" rx="2" fill="#c0392b"/>
      <rect x="210" y="316" width="14" height="6" rx="2" fill="#c0392b"/>
    </g>
    <circle cx="200" cy="320" r="5" fill="#555"/>
    <!-- post & seat -->
    <line x1="200" y1="320" x2="200" y2="246" stroke="#555" stroke-width="5"/>
    <path d="M178 246 q22 -12 44 0 q-22 8 -44 0z" fill="#c0392b"/>

    <!-- legs -->
    <g stroke="#6b5140" stroke-width="11" stroke-linecap="round" fill="none">
      <path d="M195 240 L172 280 L184 318">
        <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M195 240 L172 280 L184 318;M195 240 L178 272 L200 304;M195 240 L190 282 L216 320;M195 240 L176 290 L200 336;M195 240 L172 280 L184 318"/>
      </path>
      <path d="M205 240 L190 282 L216 320" stroke="#7d6150">
        <animate attributeName="d" dur="2s" repeatCount="indefinite" values="M205 240 L190 282 L216 320;M205 240 L180 290 L200 336;M205 240 L176 280 L184 318;M205 240 L184 272 L200 304;M205 240 L190 282 L216 320"/>
      </path>
    </g>

    <!-- tail -->
    <path d="M180 225 C120 230 95 190 110 140 C125 170 150 190 190 195z" fill="#4a382c">
      <animateTransform attributeName="transform" type="rotate" values="-6 185 215;6 185 215;-6 185 215" dur="2s" repeatCount="indefinite"/>
    </path>

    <!-- body -->
    <ellipse cx="200" cy="200" rx="34" ry="50" fill="#8a6e5a"/>
    <path d="M172 180 L228 215 L226 235 L170 200z" fill="#2e231c"/>
    <ellipse cx="203" cy="215" rx="18" ry="26" fill="#b79c86" opacity=".6"/>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 210 150;4 210 150;-4 210 150" dur="1.2s" repeatCount="indefinite"/>
      <path d="M190 160 C188 135 215 125 235 138 C260 150 290 168 305 178 C308 183 304 187 298 185 C275 180 245 178 225 176 C205 176 192 172 190 160z" fill="#8a6e5a"/>
      <ellipse cx="197" cy="134" rx="7" ry="11" fill="#6b5140" transform="rotate(-20 197 134)"/>
      <circle cx="228" cy="148" r="4" fill="#111"/>
      <circle cx="229" cy="147" r="1.3" fill="#fff"/>
      <circle cx="303" cy="181" r="3" fill="#222"/>
      <path d="M303 183 q12 6 8 16" stroke="#e57" stroke-width="2.5" fill="none" stroke-linecap="round">
        <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="M303 183 q12 6 8 16;M303 183 q16 0 20 -8;M303 183 q12 6 8 16"/>
      </path>
    </g>

    <!-- arms -->
    <g stroke="#6b5140" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M178 185 L140 195 L125 165">
        <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M178 185 L140 195 L125 165;M178 185 L142 200 L128 178;M178 185 L140 195 L125 165"/>
      </path>
      <path d="M222 190 L260 205 L280 172">
        <animate attributeName="d" dur="0.8s" begin="-0.4s" repeatCount="indefinite" values="M222 190 L260 205 L280 172;M222 190 L258 210 L277 185;M222 190 L260 205 L280 172"/>
      </path>
    </g>

    <!-- juggled bottles -->
    <defs>
      <g id="b">
        <rect x="-6" y="-8" width="12" height="22" rx="3"/>
        <rect x="-2.5" y="-18" width="5" height="11"/>
        <rect x="-3.5" y="-20" width="7" height="3" fill="#c9a227"/>
        <rect x="-6" y="-1" width="12" height="8" fill="#fff" opacity=".7"/>
      </g>
      <path id="arc" d="M125 160 C135 -10 270 -10 280 165 C240 215 165 215 125 160z"/>
    </defs>
    <g fill="#2e8b57">
      <g><use href="#b"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/></use>
        <animateMotion dur="2.4s" repeatCount="indefinite"><mpath href="#arc"/></animateMotion></g>
    </g>
    <g fill="#3b7dd8">
      <g><use href="#b"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/></use>
        <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"><mpath href="#arc"/></animateMotion></g>
    </g>
    <g fill="#a0522d">
      <g><use href="#b"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/></use>
        <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"><mpath href="#arc"/></animateMotion></g>
    </g>
  </g>
</svg>
