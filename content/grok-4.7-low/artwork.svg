<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" width="640" height="420">
  <title>Anteater riding a unicycle while juggling bottles</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87c6f0"/>
      <stop offset="100%" stop-color="#e8f6ff"/>
    </linearGradient>
    <radialGradient id="fur" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8a6244"/>
      <stop offset="100%" stop-color="#4e3424"/>
    </radialGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4a07a"/>
      <stop offset="100%" stop-color="#8d6b48"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b7ecff" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#6ec8ea" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="640" height="420" fill="url(#sky)"/>
  <ellipse cx="120" cy="70" rx="48" ry="22" fill="#fff" opacity="0.85">
    <animate attributeName="cx" values="120;560;120" dur="28s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="150" cy="78" rx="32" ry="16" fill="#fff" opacity="0.75">
    <animate attributeName="cx" values="150;590;150" dur="28s" repeatCount="indefinite"/>
  </ellipse>
  <rect y="330" width="640" height="90" fill="#7dba5a"/>
  <path d="M0 340 Q40 328 80 340 T160 340 T240 340 T320 340 T400 340 T480 340 T560 340 T640 340 V420 H0 Z" fill="#5aa03c"/>

  <!-- ground shadow -->
  <ellipse cx="300" cy="348" rx="78" ry="10" fill="#000" opacity="0.18">
    <animate attributeName="rx" values="78;70;78" dur="0.6s" repeatCount="indefinite"/>
  </ellipse>

  <!-- scene group bobs as the unicycle rolls -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0; 0 -3; 0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- unicycle -->
    <g transform="translate(300 250)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.8s" repeatCount="indefinite"/>
        <circle r="62" fill="none" stroke="#222" stroke-width="10"/>
        <circle r="48" fill="none" stroke="#555" stroke-width="2"/>
        <g stroke="#333" stroke-width="3">
          <line x1="0" y1="-48" x2="0" y2="48"/>
          <line x1="-48" y1="0" x2="48" y2="0"/>
          <line x1="-34" y1="-34" x2="34" y2="34"/>
          <line x1="-34" y1="34" x2="34" y2="-34"/>
        </g>
        <circle r="8" fill="#222"/>
      </g>
      <line x1="0" y1="-8" x2="0" y2="-78" stroke="#333" stroke-width="5"/>
      <rect x="-28" y="-86" width="56" height="10" rx="3" fill="#c45c26"/>
      <circle cx="-22" cy="-81" r="4" fill="#222"/>
      <circle cx="22" cy="-81" r="4" fill="#222"/>
    </g>

    <!-- anteater body, seated and swaying -->
    <g transform="translate(292 168)">
      <animateTransform attributeName="transform" type="rotate" values="-4 20 70; 5 20 70; -4 20 70" dur="0.9s" repeatCount="indefinite"/>

      <!-- tail -->
      <path d="M18 62 C-40 70 -90 40 -120 78" fill="none" stroke="url(#fur)" stroke-width="22" stroke-linecap="round">
        <animate attributeName="d" values="M18 62 C-40 70 -90 40 -120 78; M18 62 C-30 90 -100 90 -130 50; M18 62 C-40 70 -90 40 -120 78" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M18 62 C-40 70 -90 40 -120 78" fill="none" stroke="#2b1c12" stroke-width="6" stroke-linecap="round" opacity="0.35">
        <animate attributeName="d" values="M18 62 C-40 70 -90 40 -120 78; M18 62 C-30 90 -100 90 -130 50; M18 62 C-40 70 -90 40 -120 78" dur="1.2s" repeatCount="indefinite"/>
      </path>

      <!-- legs -->
      <path d="M28 78 Q40 110 22 128" fill="none" stroke="#3d291b" stroke-width="10" stroke-linecap="round"/>
      <path d="M48 74 Q70 108 58 128" fill="none" stroke="#3d291b" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="20" cy="130" rx="12" ry="6" fill="#2a1a10"/>
      <ellipse cx="60" cy="130" rx="12" ry="6" fill="#2a1a10"/>

      <!-- torso -->
      <ellipse cx="36" cy="48" rx="38" ry="32" fill="url(#fur)"/>
      <ellipse cx="30" cy="58" rx="18" ry="14" fill="#e7d3b0"/>

      <!-- head -->
      <g>
        <ellipse cx="78" cy="28" rx="26" ry="22" fill="url(#fur)"/>
        <ellipse cx="70" cy="36" rx="12" ry="9" fill="#e7d3b0"/>
        <!-- long snout -->
        <path d="M92 24 Q150 18 168 34 Q150 46 92 40 Z" fill="url(#snout)"/>
        <ellipse cx="166" cy="34" rx="6" ry="4" fill="#3a2416"/>
        <!-- eye -->
        <circle cx="86" cy="22" r="5" fill="#fff"/>
        <circle cx="88" cy="22" r="2.4" fill="#1a120c">
          <animate attributeName="cx" values="87;89;87" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <!-- ear -->
        <ellipse cx="66" cy="8" rx="8" ry="12" fill="#4e3424"/>
        <ellipse cx="66" cy="10" rx="4" ry="7" fill="#e7b7b0"/>
        <!-- tongue flick -->
        <path d="M168 36 Q180 40 168 42" fill="none" stroke="#e05a7a" stroke-width="2" stroke-linecap="round" opacity="0">
          <animate attributeName="opacity" values="0;0;1;0;0" dur="2.2s" repeatCount="indefinite"/>
        </path>
      </g>

      <!-- arms juggling -->
      <g>
        <path d="M40 36 Q8 10 -6 -8" fill="none" stroke="#4e3424" stroke-width="9" stroke-linecap="round">
          <animate attributeName="d" values="M40 36 Q8 10 -6 -8; M40 36 Q20 -8 8 -28; M40 36 Q8 10 -6 -8" dur="0.7s" repeatCount="indefinite"/>
        </path>
        <path d="M50 34 Q90 6 112 -6" fill="none" stroke="#4e3424" stroke-width="9" stroke-linecap="round">
          <animate attributeName="d" values="M50 34 Q90 6 112 -6; M50 34 Q78 -10 96 -30; M50 34 Q90 6 112 -6" dur="0.7s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>

    <!-- bottles in a juggling loop -->
    <g>
      <!-- bottle 1 -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="250 90; 300 28; 360 90; 300 150; 250 90" dur="1.4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0 8 18; 180 8 18; 360 8 18" dur="1.4s" repeatCount="indefinite"/>
          <path d="M5 8 h6 v6 h4 v22 a7 7 0 0 1 -14 0 V14 h4 z" fill="url(#glass)" stroke="#2a6d86" stroke-width="1.2"/>
          <rect x="5" y="4" width="6" height="5" rx="1" fill="#2a6d86"/>
          <rect x="3" y="18" width="10" height="8" fill="#e24b4b" opacity="0.85"/>
        </g>
      </g>
      <!-- bottle 2 offset -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="360 90; 300 150; 250 90; 300 28; 360 90" dur="1.4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="40 8 18; 220 8 18; 400 8 18" dur="1.4s" repeatCount="indefinite"/>
          <path d="M5 8 h6 v6 h4 v22 a7 7 0 0 1 -14 0 V14 h4 z" fill="url(#glass)" stroke="#2a6d86" stroke-width="1.2"/>
          <rect x="5" y="4" width="6" height="5" rx="1" fill="#2a6d86"/>
          <rect x="3" y="18" width="10" height="8" fill="#3aa35a" opacity="0.85"/>
        </g>
      </g>
      <!-- bottle 3 -->
      <g>
        <animateTransform attributeName="transform" type="translate"
          values="300 150; 250 90; 300 28; 360 90; 300 150" dur="1.4s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-30 8 18; 150 8 18; 330 8 18" dur="1.4s" repeatCount="indefinite"/>
          <path d="M5 8 h6 v6 h4 v22 a7 7 0 0 1 -14 0 V14 h4 z" fill="url(#glass)" stroke="#2a6d86" stroke-width="1.2"/>
          <rect x="5" y="4" width="6" height="5" rx="1" fill="#2a6d86"/>
          <rect x="3" y="18" width="10" height="8" fill="#f0c14a" opacity="0.9"/>
        </g>
      </g>
    </g>
  </g>
</svg>
