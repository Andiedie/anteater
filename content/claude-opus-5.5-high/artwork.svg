<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <title>Anteater riding a unicycle while juggling bottles</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0" stop-color="#3b2a5c"/>
      <stop offset="1" stop-color="#120b20"/>
    </radialGradient>
    <radialGradient id="spot" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff6c8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="curtain" x1="0" x2="1">
      <stop offset="0" stop-color="#7a0f1c"/>
      <stop offset=".5" stop-color="#c22436"/>
      <stop offset="1" stop-color="#7a0f1c"/>
    </linearGradient>
    <pattern id="planks" width="70" height="70" patternUnits="userSpaceOnUse">
      <rect width="70" height="70" fill="#8a5a2f"/>
      <line x1="0" y1="0" x2="0" y2="70" stroke="#5e3a1b" stroke-width="3"/>
      <line x1="35" y1="22" x2="55" y2="22" stroke="#73491f" stroke-width="2"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="-70 0" dur="0.3077s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="bodyClip">
      <ellipse cx="292" cy="328" rx="62" ry="46" transform="rotate(-12 292 328)"/>
    </clipPath>

    <!-- bottle, colored via currentColor -->
    <g id="bottle">
      <path d="M-7,14 L-7,-2 Q-7,-8 -3,-11 L-3,-18 L3,-18 L3,-11 Q7,-8 7,-2 L7,14 Q7,16 5,16 L-5,16 Q-7,16 -7,14Z"
            fill="currentColor" stroke="#1d1d1d" stroke-width="1.5"/>
      <rect x="-3.5" y="-21.5" width="7" height="4" rx="1" fill="#e8c547" stroke="#1d1d1d" stroke-width="1"/>
      <rect x="-7" y="1" width="14" height="7" fill="#f5ecd0" stroke="#1d1d1d" stroke-width=".8"/>
      <path d="M-4,-5 L-4,-1 M-4,10 L-4,13" stroke="#fff" stroke-opacity=".6" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- backdrop -->
  <rect width="600" height="600" fill="url(#bg)"/>
  <ellipse cx="300" cy="330" rx="230" ry="260" fill="url(#spot)">
    <animate attributeName="opacity" values="1;.8;1" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M0,0 H95 C80,120 110,260 70,400 C60,440 40,500 0,533 Z" fill="url(#curtain)"/>
  <path d="M600,0 H505 C520,120 490,260 530,400 C540,440 560,500 600,533 Z" fill="url(#curtain)"/>
  <path d="M0,0 H600 V30 Q570,55 540,30 Q510,55 480,30 Q450,55 420,30 Q390,55 360,30 Q330,55 300,30 Q270,55 240,30 Q210,55 180,30 Q150,55 120,30 Q90,55 60,30 Q30,55 0,30 Z" fill="#a51c2c" stroke="#e8c547" stroke-width="2"/>
  <text x="300" y="82" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#e8c547" stroke="#5a1010" stroke-width="1">★ The Amazing Anteater ★</text>

  <!-- stage floor -->
  <rect x="0" y="533" width="600" height="67" fill="url(#planks)"/>
  <rect x="0" y="531" width="600" height="4" fill="#3d2410"/>
  <ellipse cx="300" cy="537" rx="62" ry="6" fill="#000" opacity=".35"/>

  <!-- dust puffs -->
  <g fill="#d9c7a8">
    <circle cx="245" cy="527" r="3">
      <animate attributeName="cx" values="250;185" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;8" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;0" dur="0.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="245" cy="522" r="3">
      <animate attributeName="cx" values="250;195" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="2;6" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="0.6s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- everything that wobbles -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-3 300 533; 3 300 533; -3 300 533" dur="2s" repeatCount="indefinite"
      calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 248 322; -7 248 322; 0 248 322" dur="1.6s" repeatCount="indefinite"
        calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      <path d="M252,335 C205,338 160,312 146,262 C136,226 150,196 168,190 C162,215 180,262 210,282 C228,294 240,298 256,300 Z"
            fill="#4f433b" stroke="#2c2420" stroke-width="2"/>
      <path d="M168,190 l-10,-6 M158,214 l-12,-2 M150,240 l-12,2 M154,268 l-11,6 M170,294 l-8,9 M196,314 l-5,10"
            stroke="#2c2420" stroke-width="3" stroke-linecap="round"/>
      <path d="M175,215 C185,250 205,280 245,305" fill="none" stroke="#6e6056" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- far leg -->
    <path fill="none" stroke="#3a312b" stroke-width="15" stroke-linecap="round" stroke-linejoin="round"
          d="M300,375 L323.1,430.4 L278,470">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
        M300,375 L323.1,430.4 L278,470;
        M300,375 L335.7,423.2 L284.4,454.4;
        M300,375 L347.6,411.5 L300,448;
        M300,375 L351.3,406.2 L315.6,454.4;
        M300,375 L345.1,414.6 L322,470;
        M300,375 L329.5,427.2 L315.6,485.6;
        M300,375 L313.3,433.5 L300,492;
        M300,375 L313.9,433.4 L284.4,485.6;
        M300,375 L323.1,430.4 L278,470"/>
    </path>
    <!-- far crank -->
    <line x1="300" y1="470" x2="278" y2="470" stroke="#666" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 300 470" to="360 300 470" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <ellipse cx="4" cy="0" rx="12" ry="6" fill="#221c18">
      <animateMotion dur="1.6s" begin="-0.8s" repeatCount="indefinite"
        path="M322,470 A22,22 0 1,1 278,470 A22,22 0 1,1 322,470"/>
    </ellipse>

    <!-- wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 470" to="360 300 470" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="300" cy="470" r="58" fill="none" stroke="#1b1b1b" stroke-width="10"/>
      <circle cx="300" cy="470" r="52" fill="none" stroke="#b8b8c0" stroke-width="3"/>
      <g stroke="#d0d0d8" stroke-width="1.6">
        <line x1="300" y1="418" x2="300" y2="522"/>
        <line x1="300" y1="418" x2="300" y2="522" transform="rotate(30 300 470)"/>
        <line x1="300" y1="418" x2="300" y2="522" transform="rotate(60 300 470)"/>
        <line x1="300" y1="418" x2="300" y2="522" transform="rotate(90 300 470)"/>
        <line x1="300" y1="418" x2="300" y2="522" transform="rotate(120 300 470)"/>
        <line x1="300" y1="418" x2="300" y2="522" transform="rotate(150 300 470)"/>
      </g>
      <circle cx="300" cy="413" r="3" fill="#e8c547"/>
    </g>

    <!-- fork & seat -->
    <path d="M300,470 L300,392" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
    <path d="M297,440 L297,400" stroke="#e8705f" stroke-width="2" stroke-linecap="round"/>
    <circle cx="300" cy="470" r="7" fill="#888" stroke="#333" stroke-width="2"/>
    <ellipse cx="296" cy="386" rx="27" ry="8" fill="#1d1d1d"/>

    <!-- body -->
    <ellipse cx="292" cy="328" rx="62" ry="46" transform="rotate(-12 292 328)" fill="#7d6e62" stroke="#3a312b" stroke-width="2"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="300" cy="358" rx="50" ry="20" transform="rotate(-12 300 358)" fill="#a39385"/>
      <path d="M362,288 C332,318 290,312 228,300 L228,316 C290,330 338,332 368,306 Z"
            fill="#1f1a17" stroke="#f3ecdc" stroke-width="5"/>
      <path d="M255,340 l6,-5 M270,350 l6,-5 M285,345 l6,-5 M250,325 l6,-5" stroke="#5f5249" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- near crank, leg & foot -->
    <line x1="300" y1="470" x2="322" y2="470" stroke="#888" stroke-width="6" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 300 470" to="360 300 470" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <path fill="none" stroke="#4a3f38" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"
          d="M300,375 L345.1,414.6 L322,470">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite" values="
        M300,375 L345.1,414.6 L322,470;
        M300,375 L329.5,427.2 L315.6,485.6;
        M300,375 L313.3,433.5 L300,492;
        M300,375 L313.9,433.4 L284.4,485.6;
        M300,375 L323.1,430.4 L278,470;
        M300,375 L335.7,423.2 L284.4,454.4;
        M300,375 L347.6,411.5 L300,448;
        M300,375 L351.3,406.2 L315.6,454.4;
        M300,375 L345.1,414.6 L322,470"/>
    </path>
    <ellipse cx="4" cy="0" rx="12" ry="6" fill="#2c2420">
      <animateMotion dur="1.6s" repeatCount="indefinite"
        path="M322,470 A22,22 0 1,1 278,470 A22,22 0 1,1 322,470"/>
    </ellipse>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 330 292; -4 330 292; 0 330 292" dur="0.8s" repeatCount="indefinite"
        calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      <!-- tongue -->
      <line x1="462" y1="304" x2="462" y2="304" stroke="#e86a8a" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="462;462;520;462;462" keyTimes="0;.6;.68;.76;1" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="304;304;312;304;304" keyTimes="0;.6;.68;.76;1" dur="3s" repeatCount="indefinite"/>
      </line>
      <path d="M318,262 C345,250 380,262 405,280 L462,297 C471,299 471,308 462,309 L405,312 C380,318 345,326 320,318 Z"
            fill="#8d7f73" stroke="#3a312b" stroke-width="2"/>
      <path d="M405,296 L455,302" stroke="#6f6258" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="349" cy="261" rx="7" ry="9" fill="#6f6258" stroke="#3a312b" stroke-width="1.5"/>
      <ellipse cx="465" cy="303" rx="4.5" ry="4.5" fill="#1d1d1d"/>
      <circle cx="372" cy="277" r="5" fill="#fff" stroke="#3a312b" stroke-width="1"/>
      <circle cx="371" cy="275" r="2.8" fill="#111"/>
      <ellipse cx="372" cy="277" rx="5.6" ry="0" fill="#8d7f73">
        <animate attributeName="ry" values="0;0;5.6;0" keyTimes="0;.92;.96;1" dur="4s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- far (left) arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 272 300; -7 272 300; 0 272 300" dur="0.8s" repeatCount="indefinite"
        calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      <line x1="272" y1="300" x2="236" y2="256" stroke="#3a312b" stroke-width="16" stroke-linecap="round"/>
      <line x1="272" y1="300" x2="236" y2="256" stroke="#e6dcc4" stroke-width="12" stroke-linecap="round"/>
      <line x1="246" y1="268.5" x2="241" y2="262" stroke="#1f1a17" stroke-width="13"/>
      <circle cx="236" cy="254" r="8" fill="#e6dcc4" stroke="#3a312b" stroke-width="2"/>
      <path d="M231,248 q-3,-6 1,-10 M237,246 q-1,-7 4,-9" fill="none" stroke="#1f1a17" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- near (right) arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        values="0 302 308; 7 302 308; 0 302 308" dur="0.8s" begin="-0.4s" repeatCount="indefinite"
        calcMode="spline" keySplines=".45 0 .55 1; .45 0 .55 1"/>
      <line x1="302" y1="308" x2="314" y2="256" stroke="#3a312b" stroke-width="17" stroke-linecap="round"/>
      <line x1="302" y1="308" x2="314" y2="256" stroke="#efe6cf" stroke-width="13" stroke-linecap="round"/>
      <line x1="311" y1="269" x2="312.6" y2="262.2" stroke="#1f1a17" stroke-width="14"/>
      <circle cx="314" cy="254" r="8.5" fill="#efe6cf" stroke="#3a312b" stroke-width="2"/>
      <path d="M311,247 q-2,-7 3,-10 M318,248 q1,-7 6,-8" fill="none" stroke="#1f1a17" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- juggled bottles (3-bottle cascade) -->
    <g>
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite"
        path="M250,252 Q284,60 318,248 Q306,264 290,252 Q256,60 222,248 Q234,264 250,252 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <use href="#bottle" color="#2e9b5f"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite"
        path="M250,252 Q284,60 318,248 Q306,264 290,252 Q256,60 222,248 Q234,264 250,252 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <use href="#bottle" color="#c9822b"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite"
        path="M250,252 Q284,60 318,248 Q306,264 290,252 Q256,60 222,248 Q234,264 250,252 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <use href="#bottle" color="#3b6fc4"/>
      </g>
    </g>
  </g>
</svg>
