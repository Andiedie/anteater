<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <!-- Gradient for background -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <!-- Ground pattern -->
    <pattern id="ground" width="40" height="10" patternUnits="userSpaceOnUse">
      <rect width="40" height="10" fill="#8B7355"/>
      <circle cx="10" cy="5" r="1" fill="#7A6548" opacity="0.5"/>
      <circle cx="30" cy="3" r="1.5" fill="#9C8565" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>
  
  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="80" cy="60" rx="40" ry="20" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0;500,0;-500,0" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="60" cy="55" rx="30" ry="18" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0;500,0;-500,0" dur="30s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="350" cy="40" rx="50" ry="22" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0;-500,0;500,0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="380" cy="35" rx="35" ry="16" fill="white">
      <animateTransform attributeName="transform" type="translate" values="0,0;-500,0;500,0" dur="25s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Ground -->
  <rect x="0" y="430" width="500" height="70" fill="url(#ground)"/>
  <line x1="0" y1="430" x2="500" y2="430" stroke="#6B5B3A" stroke-width="3"/>

  <!-- Main anteater + unicycle group with bobbing -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="0.6s" repeatCount="indefinite"/>

    <!-- === UNICYCLE === -->
    <!-- Wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 250 415;360 250 415" dur="1s" repeatCount="indefinite"/>
      <circle cx="250" cy="415" r="28" fill="none" stroke="#444" stroke-width="3"/>
      <circle cx="250" cy="415" r="4" fill="#666"/>
      <!-- Spokes -->
      <line x1="250" y1="387" x2="250" y2="443" stroke="#888" stroke-width="1.5"/>
      <line x1="222" y1="415" x2="278" y2="415" stroke="#888" stroke-width="1.5"/>
      <line x1="229" y1="394" x2="271" y2="436" stroke="#888" stroke-width="1.5"/>
      <line x1="271" y1="394" x2="229" y2="436" stroke="#888" stroke-width="1.5"/>
      <line x1="250" y1="387" x2="250" y2="443" stroke="#888" stroke-width="1.5"/>
      <line x1="222" y1="415" x2="278" y2="415" stroke="#888" stroke-width="1.5"/>
      <line x1="229" y1="394" x2="271" y2="436" stroke="#888" stroke-width="1.5"/>
      <line x1="271" y1="394" x2="229" y2="436" stroke="#888" stroke-width="1.5"/>
    </g>
    
    <!-- Tire tread -->
    <circle cx="250" cy="415" r="30" fill="none" stroke="#333" stroke-width="4" stroke-dasharray="4 3">
      <animateTransform attributeName="transform" type="rotate" values="0 250 415;360 250 415" dur="1s" repeatCount="indefinite"/>
    </circle>

    <!-- Seat post -->
    <line x1="250" y1="387" x2="250" y2="340" stroke="#8B4513" stroke-width="4"/>
    
    <!-- Seat -->
    <ellipse cx="250" cy="337" rx="18" ry="6" fill="#8B4513"/>
    <ellipse cx="250" cy="335" rx="16" ry="5" fill="#A0522D"/>

    <!-- Pedals (rotating) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 250 415;360 250 415" dur="1s" repeatCount="indefinite"/>
      <!-- Crank arms -->
      <line x1="250" y1="405" x2="250" y2="395" stroke="#666" stroke-width="3" transform="rotate(0 250 415)"/>
      <line x1="250" y1="415" x2="235" y2="415" stroke="#666" stroke-width="3"/>
      <line x1="250" y1="415" x2="265" y2="415" stroke="#666" stroke-width="3"/>
      <!-- Pedal platforms -->
      <rect x="230" y="412" width="10" height="6" rx="1" fill="#555" transform="rotate(0 250 415)"/>
      <rect x="260" y="412" width="10" height="6" rx="1" fill="#555" transform="rotate(180 250 415)"/>
    </g>

    <!-- === ANTEATER BODY === -->
    
    <!-- Body (torso) -->
    <ellipse cx="250" cy="310" rx="30" ry="25" fill="#C4A265"/>
    <ellipse cx="250" cy="308" rx="28" ry="23" fill="#D4B275"/>
    
    <!-- Belly patch -->
    <ellipse cx="250" cy="315" rx="18" ry="15" fill="#E8D4A8"/>

    <!-- Legs (sitting on seat) -->
    <!-- Left leg -->
    <path d="M238,325 Q230,340 235,350 L240,350 Q242,340 245,330" fill="#C4A265" stroke="#B09255" stroke-width="1"/>
    <!-- Right leg -->
    <path d="M255,330 Q258,340 260,350 L265,350 Q270,340 262,325" fill="#C4A265" stroke="#B09255" stroke-width="1"/>
    
    <!-- Feet on pedals -->
    <ellipse cx="237" cy="353" rx="8" ry="4" fill="#B09255"/>
    <ellipse cx="263" cy="353" rx="8" ry="4" fill="#B09255"/>

    <!-- Tail -->
    <path d="M275,310 Q310,300 320,280 Q330,260 315,250 Q305,245 310,260 Q305,275 290,285" 
          fill="none" stroke="#C4A265" stroke-width="12" stroke-linecap="round">
      <animate attributeName="d" 
        values="M275,310 Q310,300 320,280 Q330,260 315,250 Q305,245 310,260 Q305,275 290,285;
                M275,310 Q315,305 325,285 Q335,265 320,255 Q310,250 315,265 Q310,280 295,290;
                M275,310 Q310,300 320,280 Q330,260 315,250 Q305,245 310,260 Q305,275 290,285"
        dur="1.2s" repeatCount="indefinite"/>
    </path>
    <!-- Tail fur detail -->
    <path d="M305,270 Q315,255 312,250" fill="none" stroke="#B09255" stroke-width="6" stroke-linecap="round"/>

    <!-- === ARMS === -->
    <!-- Left arm (juggling) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-30 235 295;30 235 295;-30 235 295" dur="0.8s" repeatCount="indefinite"/>
      <path d="M235,295 Q215,280 205,260" fill="none" stroke="#C4A265" stroke-width="10" stroke-linecap="round"/>
      <path d="M235,295 Q215,280 205,260" fill="none" stroke="#D4B275" stroke-width="8" stroke-linecap="round"/>
      <!-- Left paw -->
      <circle cx="205" cy="258" r="6" fill="#D4B275"/>
      <circle cx="200" cy="255" r="3" fill="#C4A265"/>
    </g>
    
    <!-- Right arm (juggling) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="30 265 295;-30 265 295;30 265 295" dur="0.8s" repeatCount="indefinite"/>
      <path d="M265,295 Q285,280 295,260" fill="none" stroke="#C4A265" stroke-width="10" stroke-linecap="round"/>
      <path d="M265,295 Q285,280 295,260" fill="none" stroke="#D4B275" stroke-width="8" stroke-linecap="round"/>
      <!-- Right paw -->
      <circle cx="295" cy="258" r="6" fill="#D4B275"/>
      <circle cx="300" cy="255" r="3" fill="#C4A265"/>
    </g>

    <!-- === HEAD === -->
    <g>
      <!-- Neck -->
      <path d="M245,285 Q240,275 238,265 L262,265 Q260,275 255,285" fill="#C4A265"/>
      
      <!-- Head base -->
      <ellipse cx="250" cy="250" rx="22" ry="20" fill="#D4B275"/>
      
      <!-- Snout (long anteater snout!) -->
      <path d="M250,255 Q250,270 230,290 Q220,298 215,295 Q210,292 220,285 Q235,270 238,255" fill="#D4B275" stroke="#C4A265" stroke-width="1"/>
      <path d="M248,258 Q248,272 230,290 Q222,296 218,294" fill="#E8D4A8" opacity="0.6"/>
      
      <!-- Snout tip (nose) -->
      <circle cx="218" cy="293" r="4" fill="#333"/>
      <circle cx="217" cy="292" r="1.5" fill="#555"/>
      
      <!-- Eye -->
      <ellipse cx="242" cy="244" rx="5" ry="5.5" fill="white"/>
      <circle cx="243" cy="244" r="3" fill="#222"/>
      <circle cx="244" cy="243" r="1.2" fill="white"/>
      
      <!-- Eye ring (characteristic eye patch) -->
      <ellipse cx="242" cy="244" rx="7" ry="7" fill="none" stroke="#8B6914" stroke-width="2"/>
      
      <!-- Ear -->
      <ellipse cx="260" cy="238" rx="6" ry="10" fill="#C4A265" transform="rotate(15 260 238)"/>
      <ellipse cx="260" cy="238" rx="4" ry="7" fill="#E8D4A8" transform="rotate(15 260 238)"/>
      
      <!-- Head fur tufts -->
      <path d="M240,232 Q245,225 250,230 Q255,225 260,232" fill="none" stroke="#B09255" stroke-width="2"/>
      
      <!-- Small smile -->
      <path d="M228,280 Q232,283 236,280" fill="none" stroke="#8B6914" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- === JUGGLING BOTTLES === -->
    
    <!-- Bottle 1 (left to right arc) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0;-40,-120;0,-150;40,-120;0,0" 
        dur="0.8s" repeatCount="indefinite"/>
      <g transform="translate(180, 200)">
        <animateTransform attributeName="transform" type="rotate" 
          values="0;20;0;-20;0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
        <!-- Bottle body -->
        <rect x="-8" y="-25" width="16" height="25" rx="3" fill="#2E8B57" stroke="#1E6B3A" stroke-width="1"/>
        <!-- Bottle neck -->
        <rect x="-4" y="-35" width="8" height="12" rx="2" fill="#2E8B57" stroke="#1E6B3A" stroke-width="1"/>
        <!-- Bottle cap -->
        <rect x="-5" y="-38" width="10" height="4" rx="1" fill="#C0C0C0"/>
        <!-- Label -->
        <rect x="-6" y="-18" width="12" height="10" rx="1" fill="#F5F5DC"/>
        <!-- Shine -->
        <rect x="-4" y="-22" width="3" height="15" rx="1" fill="white" opacity="0.3"/>
      </g>
    </g>

    <!-- Bottle 2 (middle arc) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0;0,-160;0,-160;0,0;0,0" 
        keyTimes="0;0.25;0.5;0.75;1"
        dur="0.8s" repeatCount="indefinite"/>
      <g transform="translate(250, 180)">
        <animateTransform attributeName="transform" type="rotate" 
          values="0;-15;0;15;0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
        <!-- Bottle body -->
        <rect x="-8" y="-25" width="16" height="25" rx="3" fill="#4169E1" stroke="#2850A8" stroke-width="1"/>
        <!-- Bottle neck -->
        <rect x="-4" y="-35" width="8" height="12" rx="2" fill="#4169E1" stroke="#2850A8" stroke-width="1"/>
        <!-- Bottle cap -->
        <rect x="-5" y="-38" width="10" height="4" rx="1" fill="#FFD700"/>
        <!-- Label -->
        <rect x="-6" y="-18" width="12" height="10" rx="1" fill="#F5F5DC"/>
        <!-- Shine -->
        <rect x="-4" y="-22" width="3" height="15" rx="1" fill="white" opacity="0.3"/>
      </g>
    </g>

    <!-- Bottle 3 (right arc) -->
    <g>
      <animateTransform attributeName="transform" type="translate" 
        values="0,0;40,-120;0,-150;-40,-120;0,0" 
        dur="0.8s" repeatCount="indefinite"/>
      <g transform="translate(320, 200)">
        <animateTransform attributeName="transform" type="rotate" 
          values="0;20;0;-20;0" dur="0.8s" repeatCount="indefinite" additive="sum"/>
        <!-- Bottle body -->
        <rect x="-8" y="-25" width="16" height="25" rx="3" fill="#DC143C" stroke="#A00020" stroke-width="1"/>
        <!-- Bottle neck -->
        <rect x="-4" y="-35" width="8" height="12" rx="2" fill="#DC143C" stroke="#A00020" stroke-width="1"/>
        <!-- Bottle cap -->
        <rect x="-5" y="-38" width="10" height="4" rx="1" fill="#C0C0C0"/>
        <!-- Label -->
        <rect x="-6" y="-18" width="12" height="10" rx="1" fill="#F5F5DC"/>
        <!-- Shine -->
        <rect x="-4" y="-22" width="3" height="15" rx="1" fill="white" opacity="0.3"/>
      </g>
    </g>

  </g>

  <!-- Motion lines for energy -->
  <g opacity="0.4">
    <line x1="160" y1="300" x2="140" y2="310" stroke="#666" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="155" y1="320" x2="135" y2="325" stroke="#666" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.4s" repeatCount="indefinite" begin="0.15s"/>
    </line>
    <line x1="340" y1="300" x2="360" y2="310" stroke="#666" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.4s" repeatCount="indefinite" begin="0.1s"/>
    </line>
    <line x1="345" y1="320" x2="365" y2="325" stroke="#666" stroke-width="2" stroke-linecap="round">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.4s" repeatCount="indefinite" begin="0.25s"/>
    </line>
  </g>

  <!-- Sparkle effects -->
  <g>
    <circle cx="190" cy="160" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1;3;1" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="310" cy="170" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="0.3s"/>
      <animate attributeName="r" values="1;3;1" dur="0.8s" repeatCount="indefinite" begin="0.3s"/>
    </circle>
    <circle cx="250" cy="130" r="2" fill="#FFD700">
      <animate attributeName="opacity" values="0;1;0" dur="0.8s" repeatCount="indefinite" begin="0.5s"/>
      <animate attributeName="r" values="1;3;1" dur="0.8s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>
</svg>