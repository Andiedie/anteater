<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Sky -->
  <rect width="800" height="500" fill="#bfe6f2"/>

  <!-- Sun -->
  <circle cx="700" cy="70" r="40" fill="#ffd93b">
    <animate attributeName="r" values="40;44;40" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.9">
    <g>
      <ellipse cx="120" cy="80" rx="45" ry="18"/>
      <ellipse cx="160" cy="70" rx="35" ry="15"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; 660 0; 0 0" dur="40s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="420" cy="120" rx="50" ry="16"/>
      <ellipse cx="465" cy="110" rx="30" ry="12"/>
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -520 0; 0 0" dur="55s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="400" width="800" height="100" fill="#8bc98a"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#5f9e5d" stroke-width="4"/>

  <!-- Grass tufts -->
  <g stroke="#5f9e5d" stroke-width="3" stroke-linecap="round">
    <path d="M80 400 q2 -14 0 -18 M88 400 q6 -10 10 -14"/>
    <path d="M300 400 q2 -14 0 -18 M308 400 q6 -10 10 -14"/>
    <path d="M520 400 q2 -14 0 -18 M528 400 q6 -10 10 -14"/>
    <path d="M700 400 q2 -14 0 -18 M708 400 q6 -10 10 -14"/>
  </g>

  <!-- Rider group: gentle bounce -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -8; 0 0" dur="1s" repeatCount="indefinite"/>

    <!-- Wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 400 330" to="360 400 330" dur="1s" repeatCount="indefinite"/>
      <circle cx="400" cy="330" r="70" fill="none" stroke="#333" stroke-width="10"/>
      <circle cx="400" cy="330" r="6" fill="#333"/>
      <g stroke="#666" stroke-width="4">
        <line x1="400" y1="266" x2="400" y2="394"/>
        <line x1="336" y1="330" x2="464" y2="330"/>
        <line x1="355" y1="285" x2="445" y2="375"/>
        <line x1="445" y1="285" x2="355" y2="375"/>
      </g>
    </g>

    <!-- Pedal crank -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 400 330" to="360 400 330" dur="1s" repeatCount="indefinite"/>
      <line x1="372" y1="302" x2="428" y2="358" stroke="#444" stroke-width="8" stroke-linecap="round"/>
      <circle cx="372" cy="302" r="9" fill="#777"/>
      <circle cx="428" cy="358" r="9" fill="#777"/>
    </g>

    <!-- Frame -->
    <path d="M400 330 L400 235" stroke="#c0392b" stroke-width="8" fill="none" stroke-linecap="round"/>
    <!-- Seat -->
    <rect x="372" y="222" width="56" height="12" rx="6" fill="#444"/>

    <!-- Anteater -->
    <g>
      <!-- Tail -->
      <path d="M340 205 Q280 230 270 290 Q265 330 290 335" fill="none"
            stroke="#7d5a3c" stroke-width="14" stroke-linecap="round">
        <animate attributeName="d"
          values="M340 205 Q280 230 270 290 Q265 330 290 335;
                  M340 205 Q270 235 262 295 Q258 335 285 340;
                  M340 205 Q280 230 270 290 Q265 330 290 335"
          dur="2s" repeatCount="indefinite"/>
      </path>

      <!-- Body -->
      <ellipse cx="370" cy="180" rx="48" ry="58" fill="#8a6642"/>

      <!-- Head -->
      <ellipse cx="425" cy="125" rx="30" ry="24" fill="#8a6642"/>

      <!-- Long snout -->
      <path d="M448 128 Q520 130 540 142 Q545 148 538 152 Q490 158 448 148 Z" fill="#7d5a3c"/>
      <circle cx="539" cy="147" r="3" fill="#3d2b1c"/>

      <!-- Ear -->
      <ellipse cx="415" cy="105" rx="8" ry="10" fill="#6b4c30"/>

      <!-- Eye -->
      <circle cx="432" cy="118" r="4" fill="#222"/>
      <circle cx="433.5" cy="116.5" r="1.5" fill="#fff"/>

      <!-- Leg to pedal -->
      <path d="M372 220 Q380 260 372 302" fill="none"
            stroke="#8a6642" stroke-width="14" stroke-linecap="round">
        <animate attributeName="d"
          values="M372 220 Q380 260 372 302;
                  M372 220 Q400 290 428 358;
                  M372 220 Q380 260 372 302"
          dur="1s" repeatCount="indefinite"/>
      </path>

      <!-- Arms (juggling) -->
      <g stroke="#8a6642" stroke-width="12" stroke-linecap="round" fill="none">
        <!-- Left arm -->
        <path d="M350 140 Q310 120 292 88">
          <animate attributeName="d"
            values="M350 140 Q310 120 292 88;
                    M350 140 Q308 108 296 70;
                    M350 140 Q310 120 292 88"
            dur="0.8s" repeatCount="indefinite"/>
        </path>
        <!-- Right arm -->
        <path d="M392 135 Q440 110 452 75">
          <animate attributeName="d"
            values="M392 135 Q440 110 452 75;
                    M392 135 Q444 100 462 92;
                    M392 135 Q440 110 452 75"
            dur="0.8s" begin="0.27s" repeatCount="indefinite"/>
        </path>
      </g>
    </g>
  </g>

  <!-- Juggling bottles -->
  <g>
    <!-- Bottle 1 -->
    <g>
      <animateMotion dur="0.8s" begin="0s" repeatCount="indefinite"
        path="M295 80 Q330 20 400 30 Q450 40 460 85"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-30;30;-30" dur="0.4s" repeatCount="indefinite"/>
        <rect x="-7" y="-18" width="14" height="30" rx="4" fill="#3aa655"/>
        <rect x="-4" y="-28" width="8" height="12" rx="3" fill="#3aa655"/>
        <rect x="-4" y="-30" width="8" height="4" fill="#2a7340"/>
      </g>
    </g>
    <!-- Bottle 2 -->
    <g>
      <animateMotion dur="0.8s" begin="0.27s" repeatCount="indefinite"
        path="M460 85 Q430 25 360 32 Q310 40 295 80"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="25;-25;25" dur="0.4s" repeatCount="indefinite"/>
        <rect x="-7" y="-18" width="14" height="30" rx="4" fill="#d9822b"/>
        <rect x="-4" y="-28" width="8" height="12" rx="3" fill="#d9822b"/>
        <rect x="-4" y="-30" width="8" height="4" fill="#a55f1c"/>
      </g>
    </g>
    <!-- Bottle 3 -->
    <g>
      <animateMotion dur="0.8s" begin="0.54s" repeatCount="indefinite"
        path="M375 40 Q420 10 460 85"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-20;20;-20" dur="0.4s" repeatCount="indefinite"/>
        <rect x="-7" y="-18" width="14" height="30" rx="4" fill="#4a7fd9"/>
        <rect x="-4" y="-28" width="8" height="12" rx="3" fill="#4a7fd9"/>
        <rect x="-4" y="-30" width="8" height="4" fill="#3360a5"/>
      </g>
    </g>
  </g>
</svg>
