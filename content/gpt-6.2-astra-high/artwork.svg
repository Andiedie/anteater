      <path d="M405 431q3 22 21 29m-16 -36q1 10 5 16m8 9 8 7" fill="none" stroke="#8c715e" stroke-width="2"/>
      <path d="M432 369L461 343Q476 359 504 356Q520 368 512 390L488 433L475 445L460 435L454 445Q429 438 410 417Q425 393 432 369Z" fill="#b75545" stroke-width="3.8"/>
      <path d="M439 371q17 15 7 31q-7 10 -18 9" fill="none" stroke="#753c38" stroke-width="6"/>
      <path d="M416 414q15 17 36 24m9 -10 14 10 12 -13M507 368q-2 25 -29 62" fill="none" stroke="#edbc7f" stroke-width="2.4"/>
      <path d="M457 352l-2 20 11 -3 4 14 24 -26" fill="#e4cfa3" stroke-width="2.5"/>
      <g fill="#f6ca7a" stroke-width="1.7"><circle cx="495" cy="385" r="3.8"/><circle cx="489" cy="399" r="3.8"/><circle cx="483" cy="413" r="3.8"/></g>
      <!-- The long tapered muzzle and black-and-cream cheek stripe. -->
