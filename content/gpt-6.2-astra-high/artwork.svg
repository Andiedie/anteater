<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 760" width="960" height="760" role="img" aria-labelledby="title description">
  <title id="title">The anteater's balancing act</title>
  <desc id="description">Under velvet curtains and a gold proscenium, a long-snouted anteater in a scarlet waistcoat pedals a unicycle and tosses three painted glass bottles.</desc>
  <defs>
    <radialGradient id="stage" cx="51%" cy="48%" r="71%">
      <stop stop-color="#386568"/><stop offset=".64" stop-color="#21484d"/><stop offset="1" stop-color="#102e36"/>
    </radialGradient>
    <linearGradient id="fur" x2=".85" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#e2bf8e"/><stop offset=".56" stop-color="#bd9674"/><stop offset="1" stop-color="#98745f"/>
    </linearGradient>
    <linearGradient id="plume" x2=".75" y2="1"><stop stop-color="#c4a88c"/><stop offset=".55" stop-color="#967d6e"/><stop offset="1" stop-color="#665953"/></linearGradient>
    <linearGradient id="velvet" x2="1" y2=".2"><stop stop-color="#552f36"/><stop offset=".45" stop-color="#b55447"/><stop offset=".7" stop-color="#86413e"/><stop offset="1" stop-color="#58323a"/></linearGradient>
    <pattern id="paper" width="39" height="31" patternUnits="userSpaceOnUse">
      <path d="m2 4 2 0m17 14 1 0m11 8 2 -1m-26 2 1 0m18 -23 1 0" stroke="#503d33" stroke-width="1.1" opacity=".24"/>
      <path d="m12 11 1 0m23 1 1 0m-14 16 1 0" stroke="#fff2d2" opacity=".44"/>
    </pattern>
    <path id="arch" d="M42 696V153Q42 114 83 112C175 112 180 53 285 53H675C780 53 785 112 877 112Q918 114 918 153V696Z"/>
    <clipPath id="inside"><use xlink:href="#arch"/></clipPath>
    <path id="star" d="M0 -10Q1 -1 7 0Q1 1 0 10Q-1 1 -7 0Q-1 -1 0 -10Z"/>
    <g id="corner" fill="none" stroke="#886846" stroke-width="1.4">
      <path d="M31 91V32H146M37 76C43 43 84 52 102 35M39 65C40 49 51 41 67 41C61 49 48 47 45 54M48 41Q46 34 39 38Q38 45 44 47"/>
      <path d="M77 41q7 -7 16 -5q-8 6 -16 5" fill="#98744d"/>
      <circle cx="31" cy="93" r="2" fill="#886846"/>
    </g>
    <g id="curtain">
      <path d="M38 44H234C189 119 151 156 91 204Q72 221 53 215L33 202Z" fill="url(#velvet)" stroke="#302e32" stroke-width="4"/>
      <path d="M53 213Q122 180 178 102M67 191Q110 146 137 97M43 183Q60 148 74 112" fill="none" stroke="#e08a69" stroke-width="2.4" opacity=".64"/>
      <path d="M47 216Q94 202 137 160Q183 121 226 60" fill="none" stroke="#d2a866" stroke-width="4"/>
      <path d="M47 222Q91 209 138 166Q188 119 230 66" fill="none" stroke="#d2a866" stroke-width="3" stroke-dasharray="1 7" stroke-linecap="round"/>
      <path d="M46 219Q64 247 60 286L52 301L45 287Z" fill="#c59b5f"/><path d="M52 228L53 285" stroke="#f6d58e" stroke-width="2"/>
    </g>
    <g id="bottle" stroke="#202e31" stroke-linejoin="round">
      <path d="M-5 -33H5V-17C5 -11 13 -11 13 -2V25Q13 30 8 30H-8Q-13 30 -13 25V-2C-13 -10 -5 -12 -5 -17Z" fill="currentColor" stroke-width="2.8"/>
      <rect x="-7" y="-36" width="14" height="6" rx="2" fill="#ecc78d" stroke-width="2"/>
      <path d="M-12 1Q0 4 12 1V17Q0 20 -12 17Z" fill="#f7deb0" stroke-width="1.4"/>
      <path d="M0 4l4 5 -4 6 -4 -6Z" fill="currentColor" stroke="none"/>
      <path d="M-7 -5q0 -3 3 -5m-4 31v3" fill="none" stroke="#ffedc5" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M6 -7q4 2 4 6m-1 21v5H5" fill="none" stroke-width="1.6" opacity=".46"/>
    </g>
    <g id="spokes" fill="none" stroke="#cbab75" stroke-width="2.2">
