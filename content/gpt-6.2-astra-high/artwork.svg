      <path d="M451 341Q465 303 495 299Q517 296 540 307Q524 311 510 326Q486 351 457 359Z" fill="#f2ddba" stroke="none"/>
      <path d="M452 333Q470 303 496 302Q516 300 533 307Q516 312 500 329Q480 348 456 352Z" fill="#41433e" stroke="none"/>
      <path d="M462 313Q450 307 452 295Q455 281 465 286Q475 291 473 305" fill="#bb9777" stroke-width="3"/>
      <path d="M459 301q-3 -9 2 -10q6 0 7 9" fill="#85685c" stroke="none"/>
      <path d="M489 288q-6 -7 -14 -7l2 8q-9 -5 -15 -2" fill="#cfad84" stroke-width="2.8"/>
      <path d="M624 289q11 -6 13 -1q3 5 -7 10q-6 -1 -6 -9Z" fill="#263332" stroke-width="2"/>
      <path d="M567 319q29 -5 52 -18" fill="none" stroke="#65584a" stroke-width="1.8"/>
      <path d="M513 296q6 -4 12 0" fill="none" stroke-width="2.2"/>
      <ellipse cx="522" cy="306" rx="5.6" ry="6.8" fill="#252d2b" stroke="#e9d7ae" stroke-width="1.3"/><circle cx="524" cy="303" r="1.9" fill="#fff3cd" stroke="none"/>
      <g stroke="#86705d" stroke-width="1.4"><path d="m479 342 -7 6m10 -3 -5 6m18 -13 -4 5m48 -25 4 -2m4 3 3 -2"/></g>
      <!-- Near arm, striped cuff and upturned claws. -->
      <g class="arm-right">
        <path d="M501 371Q514 367 524 377L551 392Q580 383 616 352L629 362Q591 406 559 418Q547 422 536 416L501 401Q486 392 490 382Z" fill="url(#fur)" stroke-width="3.8"/>
        <path d="M492 382q19 13 58 25q19 -2 53 -30q-27 29 -50 37q-7 2 -14 -2l-39 -17Z" fill="#655b51" stroke="none"/>
        <path d="M610 355l8 -8 16 14 -6 7Z" fill="#f0d9b0" stroke-width="2.5"/>
        <path d="M618 349q3 -7 0 -14q-1 -5 2 -5q5 1 7 11q8 1 17 -10q4 -3 5 0q0 5 -8 12q9 -3 14 -10q4 -3 5 1q-1 9 -13 17q-10 7 -16 8Z" fill="#c5a483" stroke-width="2.7"/>
        <path d="M630 350q10 -2 16 -8" fill="none" stroke="#7e6958" stroke-width="1.6"/>
      </g>
    </g>
    <!-- Independent horizontal travel and vertical acceleration give each throw a ballistic arc. -->
    <g class="throws" style="--phase:-.738s;color:#de8760" transform="translate(529 0)"><g class="lift" transform="translate(0 107)"><g class="tumble" transform="rotate(174)"><use xlink:href="#bottle"/></g></g></g>
    <g class="throws" style="--phase:-1.938s;color:#74b9a2" transform="translate(585 0)"><g class="lift" transform="translate(0 253)"><g class="tumble" transform="rotate(-23)"><use xlink:href="#bottle"/></g></g></g>
    <g class="throws" style="--phase:-3.138s;color:#e5b759" transform="translate(373 0)"><g class="lift" transform="translate(0 243)"><g class="tumble" transform="rotate(30)"><use xlink:href="#bottle"/></g></g></g>
  </g>
  <use xlink:href="#arch" fill="none" stroke="#e0bf82" stroke-width="2.8"/>
  <path d="M74 716H402m156 0h328" fill="none" stroke="#9c8059" stroke-width="1.3"/>
  <g fill="none" stroke="#967748" stroke-width="1.4"><path d="M421 716q9 -11 20 -4t23 4q-10 9 -22 2t-21 -2Zm118 0q-9 -11 -20 -4t-23 4q10 9 22 2t21 -2Z"/><path d="M466 716l14 -7 14 7 -14 7Z"/></g>
