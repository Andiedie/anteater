      <path d="M0 -76V76M-76 0H76M-53.74 -53.74l107.48 107.48M-53.74 53.74L53.74 -53.74" transform="rotate(22.5)"/>
    </g>
    <g id="shoe" stroke="#252d2d" stroke-width="3" stroke-linejoin="round">
      <path d="M-14 1l2 -16 14 1 4 9q14 -2 18 6q-1 5 -13 5h-24Z" fill="#a95842"/>
      <path d="M-12 2q18 4 34 -1M-6 -9l9 2" fill="none" stroke="#e2b67d" stroke-width="2"/>
      <rect x="-13" y="6" width="32" height="5" rx="2" fill="#d5b277" stroke-width="2"/>
    </g>
    <style>
      .wheel { animation: spin 2.4s linear infinite }
      @keyframes spin { to { transform: rotate(360deg) } }
      .sway { transform-origin: 446px 467px; animation: balance 2.4s ease-in-out infinite }
      @keyframes balance { 0%,100% {transform:rotate(-1deg)} 50% {transform:rotate(1deg)} }
      .tail { transform-origin: 417px 440px; animation: flick 2.4s ease-in-out infinite }
      @keyframes flick { 0%,100% {transform:rotate(1deg)} 50% {transform:rotate(-3deg)} }
      .throws,.lift,.tumble { animation-duration: 3.6s; animation-delay: var(--phase); animation-iteration-count: infinite; animation-timing-function: linear }
      .throws { animation-name: across } .lift { animation-name: altitude } .tumble { animation-name: turn }
      @keyframes across { 0%,100% {transform:translateX(400px)} 42% {transform:translateX(665px)} 50% {transform:translateX(609px)} 92% {transform:translateX(343px)} }
      @keyframes altitude {
        0%,100% {transform:translateY(313px);animation-timing-function:cubic-bezier(.33,.66,.67,1)}
        21% {transform:translateY(107px);animation-timing-function:cubic-bezier(.33,0,.67,.34)}
        42% {transform:translateY(315px);animation-timing-function:ease-out}
        46% {transform:translateY(328px);animation-timing-function:ease-in}
        50% {transform:translateY(312px);animation-timing-function:cubic-bezier(.33,.66,.67,1)}
        71% {transform:translateY(135px);animation-timing-function:cubic-bezier(.33,0,.67,.34)}
        92% {transform:translateY(315px);animation-timing-function:ease-out}
        96% {transform:translateY(327px);animation-timing-function:ease-in}
      }
      @keyframes turn { 0%,100% {transform:rotate(-12deg)} 42% {transform:rotate(370deg)} 50% {transform:rotate(372deg)} 92% {transform:rotate(-14deg)} }
      .arm-left {transform-origin:432px 382px;animation:catch-left 3.6s ease-in-out infinite -.612s}
      .arm-right {transform-origin:506px 381px;animation:catch-right 3.6s ease-in-out infinite -.612s}
      @keyframes catch-left {0%,33.33%,66.67%,100% {transform:rotate(6deg)} 16.67%,50%,83.33% {transform:rotate(-9deg)} }
      @keyframes catch-right {0%,33.33%,66.67%,100% {transform:rotate(-5deg)} 16.67%,50%,83.33% {transform:rotate(5deg)} }
      .foot {animation: pedal 2.4s linear infinite} .rear-foot {animation-delay:-1.2s}
      @keyframes pedal {
        0%,100% {transform:translate(28px,0)} 12.5% {transform:translate(20px,20px)}
        25% {transform:translate(0,28px)} 37.5% {transform:translate(-20px,20px)}
        50% {transform:translate(-28px,0)} 62.5% {transform:translate(-20px,-20px)}
        75% {transform:translate(0,-28px)} 87.5% {transform:translate(20px,-20px)}
      }
      .leg {animation: stride 2.4s linear infinite} .rear-leg {animation-delay:-1.2s}
      @keyframes stride {
        0%,100% {d:path('M446 452Q444 472 494 509Q500 523 484 575')}
        12.5% {d:path('M446 452Q439 477 489 520Q495 538 476 595')}
        25% {d:path('M446 452Q431 478 476 525Q482 544 456 603')}
        37.5% {d:path('M446 452Q428 477 463 518Q467 538 436 595')}
        50% {d:path('M446 452Q427 474 459 506Q464 526 428 575')}
        62.5% {d:path('M446 452Q427 470 464 495Q472 509 436 555')}
        75% {d:path('M446 452Q434 468 478 490Q487 501 456 547')}
        87.5% {d:path('M446 452Q441 468 491 497Q500 509 476 555')}
      }
      @media (prefers-reduced-motion:reduce) { * {animation-play-state:paused !important} }
    </style>
    <path id="front-leg" class="leg" d="M446 452Q444 472 494 509Q500 523 484 575"/>
    <path id="back-leg" class="leg rear-leg" d="M446 452Q427 474 459 506Q464 526 428 575"/>
  </defs>

  <!-- Layered paper frame and stage. -->
  <rect width="960" height="760" fill="#ecdbb5"/>
  <rect x="15" y="15" width="930" height="730" rx="3" fill="none" stroke="#423f35" stroke-width="2.5"/>
  <rect x="21" y="21" width="918" height="718" rx="2" fill="none" stroke="#a58a60"/>
  <use xlink:href="#corner"/><use xlink:href="#corner" transform="translate(960) scale(-1 1)"/>
  <use xlink:href="#arch" fill="url(#stage)" stroke="#343f39" stroke-width="10"/>
  <g clip-path="url(#inside)">
    <g fill="#d5c291" opacity=".68">
      <use xlink:href="#star" transform="translate(222 208) scale(.9)"/><use xlink:href="#star" transform="translate(275 290) scale(.53)"/>
      <use xlink:href="#star" transform="translate(356 119) scale(.7)"/><use xlink:href="#star" transform="translate(724 247) scale(.95)"/>
      <use xlink:href="#star" transform="translate(777 350) scale(.55)"/><use xlink:href="#star" transform="translate(693 455) scale(.6)"/>
      <use xlink:href="#star" transform="translate(143 368) scale(.7)"/><use xlink:href="#star" transform="translate(827 507) scale(.55)"/>
      <circle cx="266" cy="163" r="2"/><circle cx="309" cy="224" r="1.6"/><circle cx="186" cy="326" r="1.5"/><circle cx="751" cy="291" r="1.5"/><circle cx="672" cy="144" r="2"/><circle cx="812" cy="382" r="2"/><circle cx="663" cy="505" r="1.5"/>
    </g>
    <use xlink:href="#curtain"/><use xlink:href="#curtain" transform="translate(960) scale(-1 1)"/>
    <path d="M39 662Q476 626 921 662V701H39Z" fill="#a27353" stroke="#262f30" stroke-width="3"/>
    <path d="M39 669Q482 634 921 669M39 686Q480 670 921 686" fill="none" stroke="#e3b984" stroke-width="1.5"/>
    <path d="M112 696l102 -43m57 43 67 -48m213 48 -16 -52m190 52 -72 -48m214 48 -98 -43" stroke="#76553f" stroke-width="1.6"/>
    <ellipse cx="455" cy="676" rx="98" ry="7" fill="#5c4c41" opacity=".62"/>

    <!-- The wheel, far leg, fork and saddle. -->
    <g transform="translate(456 588)">
      <circle r="86" fill="none" stroke="#142b2d" stroke-width="12"/>
      <circle r="84" fill="none" stroke="#6f7970" stroke-width="2"/>
      <circle r="78.5" fill="none" stroke="#e3ba79" stroke-width="6"/>
      <g class="wheel"><use xlink:href="#spokes"/><path d="M-39 -68A78 78 0 0 1 -19 -76" stroke="#fff0bf" stroke-width="3" fill="none"/>
        <path d="M-28 0H28" stroke="#253536" stroke-width="9"/><path d="M-28 0H28" stroke="#b49367" stroke-width="5"/>
      </g>
    </g>
    <g fill="none" stroke-linecap="round"><use xlink:href="#back-leg" stroke="#253333" stroke-width="24"/><use xlink:href="#back-leg" stroke="#72675a" stroke-width="17"/></g>
    <g transform="translate(456 580)"><g class="foot rear-foot"><use xlink:href="#shoe"/></g></g>
    <path d="M439 463L456 588" stroke="#233335" stroke-width="15" stroke-linecap="round"/>
    <path d="M439 463L456 588" stroke="#d6ab67" stroke-width="8"/><path d="M442 498l7 50" stroke="#f7dca0" stroke-width="2"/>
    <path d="M435 481l15 -2m-14 9 15 -2" stroke="#323934" stroke-width="3"/>
    <circle cx="456" cy="588" r="10" fill="#bf9359" stroke="#283232" stroke-width="3"/><circle cx="456" cy="588" r="3" fill="#f6da9f"/>
    <path d="M406 456q12 -6 31 1q19 4 32 -4q10 -4 11 3q0 8 -16 13q-34 11 -56 1q-9 -5 -2 -14Z" fill="#743d35" stroke="#252e2c" stroke-width="3.5"/>
    <g fill="none" stroke-linecap="round"><use xlink:href="#front-leg" stroke="#263334" stroke-width="27"/><use xlink:href="#front-leg" stroke="#b08b6c" stroke-width="20"/></g>
    <g transform="translate(456 580)"><g class="foot"><use xlink:href="#shoe"/></g></g>

    <g class="sway" stroke="#283332" stroke-linejoin="round" stroke-linecap="round">
