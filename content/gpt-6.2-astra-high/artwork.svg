      <g class="tail">
        <path d="M429 421C387 409 361 418 335 443C290 479 235 487 199 484Q214 492 230 493Q182 507 128 493Q145 508 162 513L135 510Q161 529 190 533L165 531Q206 554 238 552L219 557Q259 563 295 549L278 561Q319 555 349 531L338 548Q373 531 391 496L389 510Q420 487 435 449Z" fill="url(#plume)" stroke-width="4"/>
        <g fill="none" stroke-width="2.2" stroke="#665b55">
          <path d="M413 431Q385 429 350 463T249 517M402 444Q369 458 344 484T263 535M388 467Q346 529 296 540M341 473Q295 513 217 515M307 504Q259 532 192 524M242 503Q208 512 169 505"/>
        </g>
        <g fill="none" stroke="#dcc3a0" stroke-width="2.4"><path d="M388 428q-20 5 -46 28m-9 9q-27 21 -58 29M356 474q-21 25 -52 41m-11 5 -16 6M235 537q27 3 53 -7M198 518l-17 -3"/></g>
      </g>
      <!-- The far forelimb reaches toward the left-hand catch. -->
      <g class="arm-left">
        <path d="M449 377Q433 363 419 378L399 392Q386 378 372 353L359 360Q366 396 390 412Q401 420 413 413L448 396Z" fill="#9b8069" stroke-width="3.6"/>
        <path d="M363 366q-10 -2 -16 -12q-4 -6 0 -7l10 7q-10 -15 -5 -16l13 14q-5 -12 -1 -13q5 0 12 18" fill="#b69a7d" stroke-width="2.6"/>
        <path d="M389 398q6 8 13 8" fill="none" stroke="#cbb496" stroke-width="2"/>
      </g>
      <!-- Haunch, striped shoulder, tailored waistcoat. -->
