<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">An animated circus scene: a cartoon anteater rides a spinning unicycle and juggles three colorful bottles under a spotlight, with falling confetti and twinkling stars.</desc>

  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#2b1f5e"/>
      <stop offset="55%" stop-color="#170f38"/>
      <stop offset="100%" stop-color="#0a061f"/>
    </radialGradient>
    <linearGradient id="spotGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0b4" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff0b4" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b3a48d"/>
      <stop offset="100%" stop-color="#8a7a66"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a4937c"/>
      <stop offset="100%" stop-color="#7c6d5b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <g fill="#ffe9a8">
    <circle cx="90" cy="80" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="140" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="60" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="520" cy="90" r="2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="50" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="140" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="120" cy="220" r="1.5"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="680" cy="240" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="310" r="2"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="750" cy="330" r="1.5"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Spotlights -->
  <polygon points="150,-40 350,-40 480,600 220,600" fill="url(#spotGrad)">
    <animate attributeName="opacity" values="0.14;0.2;0.14" dur="3s" repeatCount="indefinite"/>
  </polygon>
  <polygon points="450,-40 650,-40 780,600 520,600" fill="url(#spotGrad)">
    <animate attributeName="opacity" values="0.2;0.13;0.2" dur="3.6s" repeatCount="indefinite"/>
  </polygon>

  <!-- Circus ring and ground shadow -->
  <ellipse cx="400" cy="562" rx="250" ry="34" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <ellipse cx="400" cy="562" rx="205" ry="27" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  <ellipse cx="400" cy="552" rx="100" ry="16" fill="#000" opacity="0.38"/>

  <!-- Title -->
  <text x="400" y="64" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" fill="#f4e9c8" letter-spacing="6" font-weight="bold">
    THE GREAT ANTEATER
    <animate attributeName="opacity" values="0.75;1;0.75" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="92" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" fill="#d8c9a3" letter-spacing="4">UNICYCLE &amp; BOTTLE JUGGLING</text>

  <!-- Juggling guide arcs -->
  <path d="M 300,290 C 325,120 475,120 500,290" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="2" stroke-dasharray="3 7"/>
  <path d="M 500,290 C 478,324 322,324 300,290" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" stroke-dasharray="3 7"/>

  <!-- ===== UNICYCLE ===== -->
  <!-- Wheel (spinning) -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 480" to="360 400 480" dur="0.6s" repeatCount="indefinite"/>
      <circle cx="400" cy="480" r="62" fill="none" stroke="#b9b9c4" stroke-width="5"/>
      <circle cx="400" cy="480" r="9" fill="#6a6a78"/>
      <line x1="400" y1="420" x2="400" y2="540" stroke="#c9c9d4" stroke-width="3"/>
      <line x1="430" y1="428" x2="370" y2="532" stroke="#c9c9d4" stroke-width="3"/>
      <line x1="370" y1="428" x2="430" y2="532" stroke="#c9c9d4" stroke-width="3"/>
      <circle cx="400" cy="418" r="3.5" fill="#ff4d4d"/>
    </g>
    <circle cx="400" cy="480" r="70" fill="none" stroke="#26262e" stroke-width="13"/>
  </g>

  <!-- Frame, seat post and seat -->
  <line x1="400" y1="480" x2="400" y2="348" stroke="#565664" stroke-width="6" stroke-linecap="round"/>
  <ellipse cx="400" cy="342" rx="30" ry="10" fill="#7a4a2e"/>
  <ellipse cx="400" cy="339" rx="22" ry="5" fill="#96603f" opacity="0.6"/>

  <!-- Crank and pedals (static) -->
  <line x1="400" y1="480" x2="455" y2="460" stroke="#4a4a58" stroke-width="6" stroke-linecap="round"/>
  <line x1="400" y1="480" x2="345" y2="500" stroke="#4a4a58" stroke-width="6" stroke-linecap="round"/>
  <rect x="442" y="456" width="26" height="8" rx="3" fill="#33333d"/>
  <rect x="332" y="496" width="26" height="8" rx="3" fill="#33333d"/>

  <!-- ===== ANTEATER (bobbing group) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 4; 0 0" keyTimes="0;0.5;1" dur="1.2s" repeatCount="indefinite"/>

    <!-- Tail (wagging) -->
    <g transform="translate(454,276)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -7 0 0; 0 0 0; 6 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="0.9s" repeatCount="indefinite"/>
        <path d="M 0,-18 C 66,-51 121,-24 138,22 C 121,49 74,44 44,26 C 16,32 2,20 0,6 Z" fill="url(#tailGrad)"/>
        <path d="M 8,-10 C 58,-36 104,-16 116,16 C 102,36 66,32 42,20 C 22,24 12,16 10,8 Z" fill="#b3a48d" opacity="0.5"/>
      </g>
    </g>

    <!-- Back arm -->
    <g transform="translate(442,300)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; -8 0 0; 0 0 0; 6 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" begin="0.9s" repeatCount="indefinite"/>
        <path d="M 0,0 Q 28,-18 56,-10" fill="none" stroke="#6f6053" stroke-width="15" stroke-linecap="round"/>
        <circle cx="59" cy="-10" r="7.5" fill="#6f6053"/>
      </g>
    </g>

    <!-- Back leg -->
    <path d="M 430,330 C 440,360 448,390 452,420 L 455,460" fill="none" stroke="#6f6053" stroke-width="16" stroke-linecap="round"/>

    <!-- Body -->
    <ellipse cx="400" cy="275" rx="62" ry="48" fill="url(#bodyGrad)"/>
    <path d="M 358,220 C 380,255 396,292 402,322 L 424,320 C 416,288 400,250 380,214 Z" fill="#26222c" stroke="#e8e0d0" stroke-width="1.5" stroke-opacity="0.6"/>

    <!-- Front leg -->
    <path d="M 390,330 C 375,370 368,410 362,445 L 345,500" fill="none" stroke="#8a7a6a" stroke-width="17" stroke-linecap="round"/>

    <!-- Head -->
    <ellipse cx="340" cy="200" rx="9" ry="13" fill="#7a6b5c" transform="rotate(18 340 200)"/>
    <ellipse cx="340" cy="201" rx="5" ry="8" fill="#a99a86" transform="rotate(18 340 200)"/>
    <circle cx="333" cy="232" r="27" fill="url(#bodyGrad)"/>
    <path d="M 322,209 C 285,213 245,238 212,254 L 216,268 C 255,252 295,240 335,244 C 334,232 330,218 322,209 Z" fill="url(#bodyGrad)"/>
    <circle cx="214" cy="258" r="3.5" fill="#2b262e"/>
    <path d="M 213,263 Q 224,270 236,266" fill="none" stroke="#5a4a3a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eye (blinking) -->
    <g transform="translate(322,226)">
      <g>
        <animateTransform attributeName="transform" type="scale" values="1 1; 1 0.1; 1 1" keyTimes="0;0.5;1" dur="3.6s" begin="1.8s" repeatCount="indefinite"/>
        <ellipse cx="0" cy="0" rx="5" ry="6" fill="#1e1b24"/>
        <circle cx="1.5" cy="-1.5" r="1.6" fill="#fff"/>
      </g>
    </g>

    <!-- Party hat (wobbling) -->
    <g transform="translate(333,210)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 5 0 0; 0 0 0; -5 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="2.2s" repeatCount="indefinite"/>
        <path d="M -38,0 L 38,0 L 0,-80 Z" fill="#e63946"/>
        <circle cx="-17" cy="-26" r="3.2" fill="#fdf6e3"/>
        <circle cx="17" cy="-26" r="3.2" fill="#fdf6e3"/>
        <circle cx="0" cy="-54" r="3.2" fill="#fdf6e3"/>
        <circle cx="0" cy="-86" r="9" fill="#f4f1de"/>
      </g>
    </g>

    <!-- Front arm -->
    <g transform="translate(352,300)">
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 0 0; 9 0 0; 0 0 0; -7 0 0; 0 0 0" keyTimes="0;0.25;0.5;0.75;1" dur="1.8s" repeatCount="indefinite"/>
        <path d="M 0,0 Q -30,-20 -52,-9" fill="none" stroke="#8a7a6a" stroke-width="15" stroke-linecap="round"/>
        <circle cx="-55" cy="-9" r="7.5" fill="#8a7a6a"/>
      </g>
    </g>
  </g>

  <!-- ===== JUGGLED BOTTLES ===== -->
  <!-- Red bottle -->
  <g>
    <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" rotate="auto" path="M 300,290 C 325,120 475,120 500,290 C 478,324 322,324 300,290"/>
    <rect x="-11" y="-24" width="22" height="34" rx="6" fill="#e63946"/>
    <rect x="-8" y="-16" width="16" height="22" rx="4" fill="#ff8fa3" opacity="0.85"/>
    <rect x="-11" y="-8" width="22" height="12" rx="2" fill="#fdf6e3"/>
    <rect x="-11" y="-4" width="22" height="3" fill="#c1121f"/>
    <rect x="-4.5" y="-34" width="9" height="12" fill="#e63946"/>
    <rect x="-6" y="-36" width="12" height="3.5" rx="1.5" fill="#c1121f"/>
    <rect x="-4" y="-45" width="8" height="10" rx="2" fill="#c9a26b"/>
  </g>

  <!-- Blue bottle -->
  <g>
    <animateMotion dur="1.8s" begin="0.6s" repeatCount="indefinite" rotate="auto" path="M 300,290 C 325,120 475,120 500,290 C 478,324 322,324 300,290"/>
    <rect x="-11" y="-24" width="22" height="34" rx="6" fill="#3a86ff"/>
    <rect x="-8" y="-16" width="16" height="22" rx="4" fill="#9ec5ff" opacity="0.85"/>
    <rect x="-11" y="-8" width="22" height="12" rx="2" fill="#fdf6e3"/>
    <rect x="-11" y="-4" width="22" height="3" fill="#1d4ed8"/>
    <rect x="-4.5" y="-34" width="9" height="12" fill="#3a86ff"/>
    <rect x="-6" y="-36" width="12" height="3.5" rx="1.5" fill="#1d4ed8"/>
    <rect x="-4" y="-45" width="8" height="10" rx="2" fill="#c9a26b"/>
  </g>

  <!-- Gold bottle -->
  <g>
    <animateMotion dur="1.8s" begin="1.2s" repeatCount="indefinite" rotate="auto" path="M 300,290 C 325,120 475,120 500,290 C 478,324 322,324 300,290"/>
    <rect x="-11" y="-24" width="22" height="34" rx="6" fill="#ffb703"/>
    <rect x="-8" y="-16" width="16" height="22" rx="4" fill="#ffe08a" opacity="0.85"/>
    <rect x="-11" y="-8" width="22" height="12" rx="2" fill="#fdf6e3"/>
    <rect x="-11" y="-4" width="22" height="3" fill="#e85d04"/>
    <rect x="-4.5" y="-34" width="9" height="12" fill="#ffb703"/>
    <rect x="-6" y="-36" width="12" height="3.5" rx="1.5" fill="#e85d04"/>
    <rect x="-4" y="-45" width="8" height="10" rx="2" fill="#c9a26b"/>
  </g>

  <!-- ===== CONFETTI ===== -->
  <g>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#e63946">
      <animateMotion dur="5s" repeatCount="indefinite" rotate="auto" path="M 150,-20 Q 190,300 130,620"/>
    </rect>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#ffb703">
      <animateMotion dur="4.5s" begin="0.5s" repeatCount="indefinite" rotate="auto" path="M 250,-20 Q 290,300 230,620"/>
    </rect>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#3a86ff">
      <animateMotion dur="5.5s" begin="1s" repeatCount="indefinite" rotate="auto" path="M 520,-20 Q 480,300 540,620"/>
    </rect>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#2a9d8f">
      <animateMotion dur="4.8s" begin="1.5s" repeatCount="indefinite" rotate="auto" path="M 620,-20 Q 660,300 600,620"/>
    </rect>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#f4a261">
      <animateMotion dur="5.2s" begin="2s" repeatCount="indefinite" rotate="auto" path="M 360,-20 Q 400,300 340,620"/>
    </rect>
    <rect x="-4" y="-7" width="8" height="14" rx="2" fill="#e76f9e">
      <animateMotion dur="4.6s" begin="2.5s" repeatCount="indefinite" rotate="auto" path="M 700,-20 Q 740,300 680,620"/>
    </rect>
  </g>
</svg>
