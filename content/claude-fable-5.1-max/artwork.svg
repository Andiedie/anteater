<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A cartoon giant anteater pedals a red unicycle across rolling hills while juggling three glass bottles in a cascade pattern.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b6d9f2"/>
      <stop offset="1" stop-color="#f7ecd7"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff2b3" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff2b3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbc8a2"/>
      <stop offset="1" stop-color="#c7b087"/>
    </linearGradient>

    <!-- anteater body and head outlines (reused for fill + clipping) -->
    <path id="bodyPath" d="M378,340 C356,315 356,262 388,238 C402,230 420,236 430,248 C444,266 442,312 420,340 Z"/>
    <clipPath id="bodyClip"><use href="#bodyPath"/></clipPath>
    <path id="headPath" d="M428.7,237.8 Q468,265 500.6,302.3 Q504,308 495.4,309.7 Q450.5,290 411.3,262.2 Q408,246 428.7,237.8 Z"/>
    <clipPath id="headClip"><use href="#headPath"/></clipPath>

    <line id="spoke" x1="400" y1="405" x2="400" y2="505" stroke="#cfcfcf" stroke-width="1.6"/>

    <!-- bottle, centered on its middle so it spins about its center of mass -->
    <g id="bottleShape">
      <path d="M-8,20 Q-8,23 -5,23 L5,23 Q8,23 8,20 L8,-4 Q8,-8 4,-11 L3.5,-13 L3.5,-21 L-3.5,-21 L-3.5,-13 L-4,-11 Q-8,-8 -8,-4 Z"
            fill-opacity="0.88" stroke="#000" stroke-opacity="0.35" stroke-width="1"/>
      <rect x="-8" y="3" width="16" height="10" fill="#fff" fill-opacity="0.8"/>
      <rect x="-5" y="6.5" width="10" height="3" fill="#000" fill-opacity="0.22"/>
      <rect x="-4.6" y="-24.5" width="9.2" height="4" rx="1.2" fill="#3a3a3a"/>
      <path d="M-5,-2 L-5,1 M-5,15 L-5,19 M-1.5,-19 L-1.5,-14" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g id="cloud" fill="#fff" fill-opacity="0.85">
      <ellipse cx="0" cy="0" rx="36" ry="13"/>
      <ellipse cx="-14" cy="-9" rx="17" ry="13"/>
      <ellipse cx="10" cy="-12" rx="20" ry="16"/>
    </g>

    <!-- one wheel-circumference (389.56px) of pebbles, tiled and scrolled at rolling speed -->
    <g id="pebbles" fill="#b7a37c">
      <ellipse cx="30" cy="541" rx="6" ry="2.5"/>
      <ellipse cx="118" cy="566" rx="4" ry="2"/>
      <ellipse cx="200" cy="533" rx="5" ry="2"/>
      <ellipse cx="262" cy="579" rx="7" ry="2.5"/>
      <ellipse cx="338" cy="551" rx="4.5" ry="2"/>
    </g>
  </defs>

  <!-- ===== background ===== -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="655" cy="105" r="110" fill="url(#glow)"/>
  <circle cx="655" cy="105" r="40" fill="#ffe08a"/>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-800 0" dur="50s" repeatCount="indefinite"/>
    <g id="cloudRow">
      <use href="#cloud" transform="translate(110,110)"/>
      <use href="#cloud" transform="translate(250,72) scale(0.8)"/>
      <use href="#cloud" transform="translate(560,170) scale(0.65)"/>
    </g>
    <use href="#cloudRow" transform="translate(800,0)"/>
  </g>

  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="32s" repeatCount="indefinite"/>
    <path d="M0,472 Q100,432 200,472 T400,472 T600,472 T800,472 T1000,472 T1200,472 L1200,600 L0,600 Z" fill="#b9d0ae"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-320 0" dur="16s" repeatCount="indefinite"/>
    <path d="M0,488 Q80,454 160,488 T320,488 T480,488 T640,488 T800,488 T960,488 T1120,488 T1280,488 L1280,600 L0,600 Z" fill="#95bb8b"/>
  </g>

  <rect x="0" y="517" width="800" height="83" fill="url(#soil)"/>
  <line x1="0" y1="517" x2="800" y2="517" stroke="#b09a72" stroke-width="2"/>
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-389.56 0" dur="1.6s" repeatCount="indefinite"/>
    <use href="#pebbles"/>
    <use href="#pebbles" x="389.56"/>
    <use href="#pebbles" x="779.12"/>
    <use href="#pebbles" x="1168.68"/>
  </g>
  <ellipse cx="404" cy="519" rx="74" ry="7" fill="#000" opacity="0.15"/>

  <!-- ===== rider + unicycle (gentle balancing sway about the contact point) ===== -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 400 517;2 400 517;-2 400 517" keyTimes="0;0.5;1"
                      dur="3.2s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-3 378 332;3 378 332;-3 378 332" keyTimes="0;0.5;1"
                        dur="1.6s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
      <path d="M380,318 Q350,296 320,300 Q292,296 268,312 Q250,322 250,340 Q262,334 270,346 Q282,342 290,354 Q306,348 318,356 Q332,350 344,354 Q358,346 382,342 Z" fill="#7d6a57"/>
      <path d="M372,326 Q330,318 292,330 M372,334 Q334,334 300,347 M365,320 Q320,306 282,316" fill="none" stroke="#5c4c3e" stroke-width="2.5" stroke-linecap="round" opacity="0.55"/>
    </g>

    <!-- far leg (hip -> knee -> ankle, keyframed every 30 degrees of crank) -->
    <path fill="none" stroke="#352c25" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" d="M396,322 L433.9,403.6 L368,449">
      <animate attributeName="d" dur="1.6s" begin="-0.8s" repeatCount="indefinite"
        values="M396,322 L467.1,377.1 L432,449;M396,322 L455.1,389.9 L427.7,465;M396,322 L440.1,400.4 L416,476.7;M396,322 L428.1,406.1 L400,481;M396,322 L424.1,407.5 L384,476.7;M396,322 L426.9,406.5 L372.3,465;M396,322 L433.9,403.6 L368,449;M396,322 L444.2,398 L372.3,433;M396,322 L456.9,388.3 L384,421.3;M396,322 L468.4,375.5 L400,417;M396,322 L474.3,366.5 L416,421.3;M396,322 L473.7,367.5 L427.7,433;M396,322 L467.1,377.1 L432,449"/>
    </path>

    <!-- far crank, pedal and foot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 455" to="360 400 455" dur="1.6s" repeatCount="indefinite"/>
      <line x1="400" y1="455" x2="368" y2="455" stroke="#4a4a4a" stroke-width="5" stroke-linecap="round"/>
      <g transform="translate(368,455)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-9" y="-3" width="18" height="6" rx="1.5" fill="#222"/>
          <path d="M-10,-3 V-9 Q-10,-16 -2,-16 H9 Q17,-16 17,-8 V-3 Z" fill="#352c25"/>
          <path d="M17,-10 q6,0 7,4 M17,-6 q6,0 6,3" fill="none" stroke="#e9dcc3" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- far fork blade -->
    <line x1="397" y1="394" x2="397" y2="455" stroke="#b8302c" stroke-width="6" stroke-linecap="round"/>

    <!-- wheel -->
    <circle cx="400" cy="455" r="57" fill="none" stroke="#2b2b2b" stroke-width="10"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 455" to="360 400 455" dur="1.6s" repeatCount="indefinite"/>
      <circle cx="400" cy="455" r="57" fill="none" stroke="#484848" stroke-width="10" stroke-dasharray="5 8.78"/>
      <use href="#spoke"/>
      <use href="#spoke" transform="rotate(30 400 455)"/>
      <use href="#spoke" transform="rotate(60 400 455)"/>
      <use href="#spoke" transform="rotate(90 400 455)"/>
      <use href="#spoke" transform="rotate(120 400 455)"/>
      <use href="#spoke" transform="rotate(150 400 455)"/>
      <circle cx="400" cy="407" r="2.4" fill="#e0b040"/>
    </g>
    <circle cx="400" cy="455" r="50" fill="none" stroke="#d9d9d9" stroke-width="3"/>
    <circle cx="400" cy="455" r="8" fill="#9a9a9a" stroke="#555" stroke-width="2"/>

    <!-- frame and saddle -->
    <line x1="403" y1="394" x2="403" y2="455" stroke="#d64541" stroke-width="6" stroke-linecap="round"/>
    <rect x="390" y="386" width="20" height="12" rx="3" fill="#b8302c"/>
    <line x1="400" y1="388" x2="400" y2="338" stroke="#d64541" stroke-width="7" stroke-linecap="round"/>
    <path d="M370,336 Q368,326 380,325 L426,325 Q438,326 436,335 Q436,343 424,343 L382,343 Q370,344 370,336 Z" fill="#2b2b2b"/>

    <!-- back arm -->
    <path fill="none" stroke="#d8cbb2" stroke-width="13" stroke-linecap="round" d="M398,246 Q363.7,238.3 346,208">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="M398,246 Q363.7,238.3 346,208;M398,246 Q371.1,243.2 361,218;M398,246 Q374.9,234 376,208;M398,246 Q367.6,233.4 358,202;M398,246 Q363.7,238.3 346,208"/>
    </path>

    <!-- body with the giant anteater's black shoulder stripe -->
    <use href="#bodyPath" fill="#a48f74"/>
    <g clip-path="url(#bodyClip)">
      <path d="M378,340 C356,315 356,262 388,238 C384,262 386,310 402,340 Z" fill="#000" opacity="0.08"/>
      <path d="M434,254 L440,270 L376,336 L360,308 Z" fill="#241f1b"/>
      <path d="M434,254 L360,308 M440,270 L376,336" fill="none" stroke="#f1e8d6" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- head: long snout angled down, eye rolled up at the bottles, tongue flick -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 425 250;-3 425 250;0 425 250" keyTimes="0;0.5;1"
                        dur="1.6s" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" repeatCount="indefinite"/>
      <path d="M488,298 Q490,299 492,301" fill="none" stroke="#e27b8c" stroke-width="3" stroke-linecap="round">
        <animate attributeName="d" dur="3.6s" repeatCount="indefinite" keyTimes="0;0.06;0.14;1"
          values="M488,298 Q490,299 492,301;M488,298 Q508,306 524,326;M488,298 Q490,299 492,301;M488,298 Q490,299 492,301"/>
      </path>
      <use href="#headPath" fill="#a48f74"/>
      <g clip-path="url(#headClip)">
        <path d="M487.2,279.8 L520,300 L520,330 L469.8,304.2 Z" fill="#2b2622"/>
      </g>
      <circle cx="497.5" cy="301.5" r="1.4" fill="#fff" opacity="0.5"/>
      <ellipse cx="416" cy="238" rx="5" ry="7" transform="rotate(-25 416 238)" fill="#8a7660"/>
      <ellipse cx="416.5" cy="239" rx="2.4" ry="4" transform="rotate(-25 416 238)" fill="#5e4e40"/>
      <path d="M431,249.5 q5,-3 10,-1" fill="none" stroke="#5e4e40" stroke-width="1.6" stroke-linecap="round"/>
      <circle cx="437" cy="256" r="4.5" fill="#fff"/>
      <circle cx="436.2" cy="254.6" r="2.6" fill="#1a1a1a"/>
      <circle cx="437.2" cy="253.6" r="0.9" fill="#fff"/>
    </g>

    <!-- near leg -->
    <path fill="none" stroke="#4a3d33" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" d="M396,322 L467.1,377.1 L432,449">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M396,322 L467.1,377.1 L432,449;M396,322 L455.1,389.9 L427.7,465;M396,322 L440.1,400.4 L416,476.7;M396,322 L428.1,406.1 L400,481;M396,322 L424.1,407.5 L384,476.7;M396,322 L426.9,406.5 L372.3,465;M396,322 L433.9,403.6 L368,449;M396,322 L444.2,398 L372.3,433;M396,322 L456.9,388.3 L384,421.3;M396,322 L468.4,375.5 L400,417;M396,322 L474.3,366.5 L416,421.3;M396,322 L473.7,367.5 L427.7,433;M396,322 L467.1,377.1 L432,449"/>
    </path>

    <!-- near crank, pedal and foot -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 455" to="360 400 455" dur="1.6s" repeatCount="indefinite"/>
      <line x1="400" y1="455" x2="432" y2="455" stroke="#555" stroke-width="5" stroke-linecap="round"/>
      <circle cx="400" cy="455" r="3.5" fill="#333"/>
      <g transform="translate(432,455)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.6s" repeatCount="indefinite"/>
          <rect x="-9" y="-3" width="18" height="6" rx="1.5" fill="#222"/>
          <path d="M-10,-3 V-9 Q-10,-16 -2,-16 H9 Q17,-16 17,-8 V-3 Z" fill="#4a3d33"/>
          <path d="M17,-10 q6,0 7,4 M17,-6 q6,0 6,3" fill="none" stroke="#e9dcc3" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>
    </g>

    <!-- front arm -->
    <path fill="none" stroke="#ecdfc6" stroke-width="13" stroke-linecap="round" d="M420,244 Q442.9,233.3 442,208">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.25;0.5;0.75;1"
        keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="M420,244 Q442.9,233.3 442,208;M420,244 Q450.1,232.7 460,202;M420,244 Q454.8,237.6 474,208;M420,244 Q446.9,242.6 458,218;M420,244 Q442.9,233.3 442,208"/>
    </path>

    <!-- ===== bottles: 3-bottle cascade. x is linear in flight, y follows a true parabola
         (quadratic ease-out up, ease-in down), one full flip per throw, 0.8s offsets ===== -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline"
        values="442,0;346,0;361,0;376,0;474,0;458,0;442,0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
        keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline"
          values="0,208;0,92;0,208;0,218;0,208;0,92;0,208;0,218;0,208" keyTimes="0;0.1667;0.3333;0.4167;0.5;0.6667;0.8333;0.9167;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="spline"
            values="0;-360;-372;-360;0;12;0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
            keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
          <use href="#bottleShape" fill="#2f9e60"/>
        </g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline"
        values="442,0;346,0;361,0;376,0;474,0;458,0;442,0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
        keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline"
          values="0,208;0,92;0,208;0,218;0,208;0,92;0,208;0,218;0,208" keyTimes="0;0.1667;0.3333;0.4167;0.5;0.6667;0.8333;0.9167;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="-0.8s" repeatCount="indefinite" calcMode="spline"
            values="0;-360;-372;-360;0;12;0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
            keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
          <use href="#bottleShape" fill="#e08a2e"/>
        </g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
        values="442,0;346,0;361,0;376,0;474,0;458,0;442,0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
        keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
      <g>
        <animateTransform attributeName="transform" type="translate" dur="2.4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
          values="0,208;0,92;0,208;0,218;0,208;0,92;0,208;0,218;0,208" keyTimes="0;0.1667;0.3333;0.4167;0.5;0.6667;0.8333;0.9167;1"
          keySplines="0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1;0.333 0.667 0.667 1;0.333 0 0.667 0.333;0.5 0 0.5 1;0.5 0 0.5 1"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" dur="2.4s" begin="-1.6s" repeatCount="indefinite" calcMode="spline"
            values="0;-360;-372;-360;0;12;0" keyTimes="0;0.3333;0.4167;0.5;0.8333;0.9167;1"
            keySplines="0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1;0 0 1 1;0.5 0 0.5 1;0.5 0 0.5 1"/>
          <use href="#bottleShape" fill="#3b7fd6"/>
        </g>
      </g>
    </g>

    <!-- paws drawn over the bottles so the claws grip them -->
    <g>
      <animateTransform attributeName="transform" type="translate" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="346,208;361,218;376,208;358,202;346,208"/>
      <circle r="9" fill="#2b2622"/>
      <path d="M-6,3 Q-8,12 -3,15 M0,5 Q0,14 4,16 M6,3 Q9,11 10,14" fill="none" stroke="#f4ead6" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" dur="0.8s" repeatCount="indefinite" calcMode="spline"
        keyTimes="0;0.25;0.5;0.75;1" keySplines="0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1;0.5 0 0.5 1"
        values="442,208;460,202;474,208;458,218;442,208"/>
      <circle r="9" fill="#2b2622"/>
      <path d="M-6,3 Q-8,12 -3,15 M0,5 Q0,14 4,16 M6,3 Q9,11 10,14" fill="none" stroke="#f4ead6" stroke-width="2.2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
