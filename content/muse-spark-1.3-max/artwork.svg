<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
<title>Anteater Riding Unicycle While Juggling Bottles</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#4AA7DE"/>
    <stop offset="60%" stop-color="#AEE3FF"/>
    <stop offset="100%" stop-color="#E0F6FF"/>
  </linearGradient>
  <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7AC74F"/>
    <stop offset="100%" stop-color="#4A9A2E"/>
  </linearGradient>
  <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FFF9A0"/>
    <stop offset="100%" stop-color="#FFC93C"/>
  </radialGradient>
  <g id="bottle">
    <!-- centered at 0,0 -->
    <rect x="-6" y="-34" width="12" height="8" rx="2" fill="#6B3A1F" stroke="#333" stroke-width="1.5"/>
    <rect x="-5" y="-28" width="10" height="18" fill="currentColor" stroke="#222" stroke-width="2"/>
    <rect x="-14" y="-12" width="28" height="38" rx="8" fill="currentColor" stroke="#222" stroke-width="2.5"/>
    <rect x="-14" y="-12" width="10" height="38" rx="5" fill="white" opacity="0.35"/>
    <rect x="-10" y="2" width="20" height="14" rx="3" fill="#FFF" stroke="#222" stroke-width="1.5"/>
    <circle cx="0" cy="9" r="4" fill="#E74C3C"/>
  </g>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="530" fill="url(#sky)"/>
<circle cx="650" cy="90" r="50" fill="url(#sunGrad)" stroke="#FFAA00" stroke-width="3">
  <animate attributeName="r" values="50;54;50" dur="3s" repeatCount="indefinite"/>
</circle>

<!-- clouds -->
<g opacity="0.95">
  <animateTransform attributeName="transform" type="translate" values="-180 0; 850 0" dur="28s" repeatCount="indefinite"/>
  <g transform="translate(100,90)">
    <ellipse cx="0" cy="0" rx="45" ry="22" fill="white"/>
    <ellipse cx="35" cy="-8" rx="35" ry="20" fill="white"/>
    <ellipse cx="-35" cy="-5" rx="30" ry="18" fill="white"/>
  </g>
  <g transform="translate(350,150)">
    <ellipse cx="0" cy="0" rx="35" ry="18" fill="white" opacity="0.9"/>
    <ellipse cx="28" cy="-6" rx="28" ry="16" fill="white" opacity="0.9"/>
  </g>
</g>
<g opacity="0.9">
  <animateTransform attributeName="transform" type="translate" values="-250 0; 850 0" dur="40s" repeatCount="indefinite"/>
  <g transform="translate(200,60)">
    <ellipse cx="0" cy="0" rx="28" ry="14" fill="white"/>
    <ellipse cx="22" cy="-4" rx="22" ry="13" fill="white"/>
  </g>
</g>

<text x="400" y="55" text-anchor="middle" font-family="Verdana, sans-serif" font-size="28" font-weight="bold" fill="#2C3E50" stroke="white" stroke-width="4" paint-order="stroke">Anteater Unicyclist &amp; Juggler!</text>

<!-- distant hills -->
<ellipse cx="150" cy="530" rx="220" ry="70" fill="#6BBF4A" opacity="0.6"/>
<ellipse cx="650" cy="535" rx="260" ry="80" fill="#62B544" opacity="0.6"/>

<!-- ground -->
<rect x="0" y="515" width="800" height="85" fill="url(#groundGrad)"/>
<rect x="0" y="515" width="800" height="12" fill="#8FE36B"/>
<!-- road -->
<rect x="0" y="530" width="800" height="46" fill="#555" />
<rect x="0" y="530" width="800" height="6" fill="#777"/>
<line x1="0" y1="553" x2="800" y2="553" stroke="white" stroke-width="5" stroke-dasharray="32 24" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-112" dur="0.6s" repeatCount="indefinite"/>
</line>

<!-- grass tufts -->
<g stroke="#2E7D1F" stroke-width="3" stroke-linecap="round">
  <path d="M60 525 q3 -12 6 0 M66 525 q3 -14 6 0 M72 525 q3 -10 6 0"/>
  <path d="M700 525 q3 -12 6 0 M706 525 q3 -14 6 0 M712 525 q3 -10 6 0"/>
  <path d="M250 525 q3 -12 6 0 M256 525 q3 -14 6 0"/>
  <path d="M550 525 q3 -12 6 0 M556 525 q3 -14 6 0"/>
</g>

<!-- shadow -->
<ellipse cx="400" cy="543" rx="95" ry="14" fill="black" opacity="0.3">
  <animate attributeName="rx" values="95;85;95" dur="0.6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.3;0.22;0.3" dur="0.6s" repeatCount="indefinite"/>
</ellipse>

<!-- speed lines -->
<g stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.7">
  <line x1="190" y1="420" x2="260" y2="420">
    <animate attributeName="x1" values="210;150" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="280;220" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="180" y1="450" x2="270" y2="450">
    <animate attributeName="x1" values="200;130" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="290;220" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
  </line>
  <line x1="190" y1="480" x2="260" y2="480">
    <animate attributeName="x1" values="210;150" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="280;220" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>
</g>

<!-- WHOLE RIDER + UNICYCLE (bobbing) -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="0.6s" repeatCount="indefinite"/>

  <!-- TAIL (behind everything) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-7 340 300; 9 340 300; -7 340 300" dur="1.2s" repeatCount="indefinite"/>
    <path d="M 350 320 C 260 330 190 260 175 135 C 174 122 186 118 196 128 C 250 180 310 210 365 235 Z" fill="#5D4E42" stroke="#2E2620" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 335 295 C 275 295 225 250 212 165 C 250 200 295 225 340 245 Z" fill="#7A6A5E" opacity="0.9"/>
    <path d="M 200 150 C 230 190 270 215 320 235" stroke="#3E352D" stroke-width="3" fill="none" opacity="0.5"/>
  </g>

  <!-- UNICYCLE WHEEL -->
  <g>
    <!-- tire -->
    <circle cx="400" cy="460" r="72" fill="none" stroke="#1A1A1A" stroke-width="16"/>
    <circle cx="400" cy="460" r="72" fill="none" stroke="#333" stroke-width="10"/>
    <circle cx="400" cy="460" r="56" fill="#D6EAF8" stroke="#999" stroke-width="6"/>
    <!-- spinning spokes -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="0.9s" repeatCount="indefinite"/>
      <g stroke="#555" stroke-width="4" stroke-linecap="round">
        <line x1="400" y1="460" x2="400" y2="406"/>
        <line x1="400" y1="460" x2="400" y2="514"/>
        <line x1="400" y1="460" x2="346" y2="460"/>
        <line x1="400" y1="460" x2="454" y2="460"/>
        <line x1="400" y1="460" x2="362" y2="422"/>
        <line x1="400" y1="460" x2="438" y2="498"/>
        <line x1="400" y1="460" x2="362" y2="498"/>
        <line x1="400" y1="460" x2="438" y2="422"/>
      </g>
      <!-- reflector -->
      <circle cx="430" cy="435" r="6" fill="#FF3B30" stroke="white" stroke-width="2"/>
    </g>
    <!-- hub -->
    <circle cx="400" cy="460" r="12" fill="#444" stroke="#111" stroke-width="3"/>
    <circle cx="400" cy="460" r="4" fill="#DDD"/>
  </g>

  <!-- FRAME -->
  <g stroke="#E74C3C" stroke-width="10" stroke-linecap="round">
    <line x1="400" y1="460" x2="385" y2="360"/>
    <line x1="400" y1="460" x2="415" y2="360"/>
  </g>
  <rect x="392" y="320" width="16" height="50" rx="4" fill="#C0392B" stroke="#7A1F1F" stroke-width="2"/>
  <!-- seat -->
  <ellipse cx="400" cy="315" rx="42" ry="14" fill="#2C3E50" stroke="black" stroke-width="3"/>
  <ellipse cx="400" cy="310" rx="42" ry="10" fill="#34495E"/>

  <!-- PEDAL CRANKS (rotating) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="0.9s" repeatCount="indefinite"/>
    <line x1="400" y1="460" x2="428" y2="472" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <line x1="400" y1="460" x2="372" y2="448" stroke="#222" stroke-width="7" stroke-linecap="round"/>
    <rect x="420" y="464" width="28" height="10" rx="3" fill="black"/>
    <rect x="352" y="440" width="28" height="10" rx="3" fill="black"/>
  </g>

  <!-- FAR LEG (darker, behind) -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="-18 385 335; 18 385 335; -18 385 335" dur="0.9s" repeatCount="indefinite"/>
    <path d="M 385 335 L 365 395 L 375 452" fill="none" stroke="#6E5B4D" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <g transform="translate(375,452)">
      <ellipse cx="8" cy="0" rx="16" ry="9" fill="#4A3E35" stroke="black" stroke-width="2"/>
      <g stroke="#FFF" stroke-width="2.5" stroke-linecap="round">
        <line x1="20" y1="-4" x2="28" y2="-6"/>
        <line x1="21" y1="0" x2="29" y2="0"/>
        <line x1="20" y1="4" x2="28" y2="6"/>
      </g>
    </g>
  </g>

  <!-- FAR ARM -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" values="0 425 290; -12 425 290; 0 425 290" dur="0.7s" repeatCount="indefinite"/>
    <path d="M 425 290 Q 390 275 355 260" fill="none" stroke="#6E5B4D" stroke-width="16" stroke-linecap="round"/>
    <circle cx="352" cy="258" r="10" fill="#4A3E35" stroke="black" stroke-width="2"/>
  </g>

  <!-- BODY -->
  <ellipse cx="400" cy="290" rx="78" ry="57" fill="#A89A8E" stroke="#4A3E35" stroke-width="4"/>
  <!-- belly -->
  <ellipse cx="390" cy="305" rx="50" ry="35" fill="#C2B5A8" opacity="0.7"/>
  <!-- anteater stripe: white then black chevron -->
  <path d="M 465 245 L 390 295 L 455 348" fill="none" stroke="white" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 465 245 L 390 295 L 455 348" fill="none" stroke="#222" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- HEAD GROUP -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 3 -4; 0 0" dur="0.6s" repeatCount="indefinite"/>
    <!-- ear -->
    <g transform="translate(430,222) rotate(-15)">
      <ellipse cx="0" cy="0" rx="13" ry="20" fill="#8A7A6E" stroke="#4A3E35" stroke-width="3"/>
      <ellipse cx="0" cy="2" rx="6" ry="11" fill="#E8AFAF"/>
    </g>
    <!-- long snout -->
    <path d="M 430 235 L 590 268 L 592 288 L 432 282 Z" fill="#A89A8E" stroke="#4A3E35" stroke-width="3" stroke-linejoin="round"/>
    <path d="M 430 265 L 590 278 L 592 288 L 432 282 Z" fill="#8A7A6E" opacity="0.6"/>
    <!-- nose -->
    <ellipse cx="591" cy="278" rx="9" ry="12" fill="#111"/>
    <circle cx="594" cy="274" r="2" fill="white" opacity="0.7"/>
    <!-- smile -->
    <path d="M 570 288 Q 580 292 588 287" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- eye with blink -->
    <g>
      <ellipse cx="452" cy="248" rx="9" ry="10" fill="white" stroke="#333" stroke-width="2"/>
      <circle cx="454" cy="250" r="5" fill="black">
        <animate attributeName="r" values="5;5;0.5;5;5" keyTimes="0;0.85;0.9;0.95;1" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="456" cy="248" r="1.8" fill="white"/>
    </g>
  </g>

  <!-- NEAR LEG -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="18 410 335; -18 410 335; 18 410 335" dur="0.9s" repeatCount="indefinite"/>
    <path d="M 410 335 L 430 395 L 418 452" fill="none" stroke="#8A7A6E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 410 335 L 430 395 L 418 452" fill="none" stroke="#A89A8E" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <g transform="translate(418,452)">
      <ellipse cx="8" cy="0" rx="17" ry="10" fill="#5D4E42" stroke="black" stroke-width="2.5"/>
      <g stroke="white" stroke-width="2.8" stroke-linecap="round">
        <line x1="21" y1="-5" x2="31" y2="-8"/>
        <line x1="22" y1="0" x2="32" y2="0"/>
        <line x1="21" y1="5" x2="31" y2="8"/>
      </g>
    </g>
  </g>

  <!-- NEAR ARM -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 435 290; 12 435 290; 0 435 290" dur="0.7s" begin="-0.35s" repeatCount="indefinite"/>
    <path d="M 435 290 Q 445 275 452 260" fill="none" stroke="#8A7A6E" stroke-width="17" stroke-linecap="round"/>
    <circle cx="453" cy="255" r="11" fill="#5D4E42" stroke="black" stroke-width="2.5"/>
    <g stroke="#EEE" stroke-width="2" stroke-linecap="round">
      <line x1="453" y1="245" x2="450" y2="236"/>
      <line x1="458" y1="246" x2="460" y2="237"/>
    </g>
  </g>

  <!-- party hat? little hat to show circus -->
  <g transform="translate(415,200)">
    <animateTransform attributeName="transform" type="rotate" values="-5;5;-5" dur="1.2s" repeatCount="indefinite"/>
    <polygon points="0,0 28,0 14,-38" fill="#E74C3C" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
    <polygon points="6,-12 22,-12 18,-22 10,-22" fill="white" opacity="0.9"/>
    <circle cx="14" cy="-40" r="6" fill="#F9EBEA" stroke="black" stroke-width="2"/>
    <ellipse cx="14" cy="2" rx="18" ry="6" fill="#F1C40F" stroke="black" stroke-width="2"/>
  </g>

</g><!-- end whole rider -->

<!-- JUGGLING BOTTLES - cascade loop left(350,255) -> top -> right(452,250) -> bottom -> left -->
<g color="#27AE60">
  <animateMotion dur="2.1s" repeatCount="indefinite" path="M 352 258 C 352 60, 452 60, 452 255 C 452 325, 352 325, 352 258 Z"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite"/>
    <use xlink:href="#bottle" href="#bottle"/>
  </g>
</g>
<g color="#2980B9">
  <animateMotion dur="2.1s" begin="-0.7s" repeatCount="indefinite" path="M 352 258 C 352 60, 452 60, 452 255 C 452 325, 352 325, 352 258 Z"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.05s" repeatCount="indefinite"/>
    <use xlink:href="#bottle" href="#bottle"/>
  </g>
</g>
<g color="#E67E22">
  <animateMotion dur="2.1s" begin="-1.4s" repeatCount="indefinite" path="M 352 258 C 352 60, 452 60, 452 255 C 452 325, 352 325, 352 258 Z"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.05s" repeatCount="indefinite"/>
    <use xlink:href="#bottle" href="#bottle"/>
  </g>
</g>

<!-- juggling motion guide sparkles -->
<g fill="none" stroke="white" stroke-width="2" opacity="0.5" stroke-dasharray="6 10" stroke-linecap="round">
  <path d="M 352 258 C 352 60, 452 60, 452 255"/>
</g>

<!-- foreground flowers -->
<g>
  <g transform="translate(90,570)">
    <line x1="0" y1="0" x2="0" y2="-18" stroke="green" stroke-width="3"/>
    <circle cx="0" cy="-22" r="6" fill="#FF6B9D" stroke="black" stroke-width="1.5"/>
    <circle cx="0" cy="-22" r="2" fill="yellow"/>
  </g>
  <g transform="translate(720,575)">
    <line x1="0" y1="0" x2="0" y2="-18" stroke="green" stroke-width="3"/>
    <circle cx="0" cy="-22" r="6" fill="#9B59B6" stroke="black" stroke-width="1.5"/>
    <circle cx="0" cy="-22" r="2" fill="yellow"/>
    <animateTransform attributeName="transform" type="scale" values="1 1; 1.1 1.1; 1 1" dur="2s" repeatCount="indefinite" additive="sum"/>
  </g>
</g>

</svg>