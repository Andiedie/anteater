<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="wheelGrad" cx="0.4" cy="0.4" r="0.7">
      <stop offset="0%" stop-color="#7a5230"/>
      <stop offset="60%" stop-color="#3a2410"/>
      <stop offset="100%" stop-color="#1a0e04"/>
    </radialGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c89870"/>
      <stop offset="100%" stop-color="#9a6f48"/>
    </linearGradient>

    <!-- Reusable bottle -->
    <g id="bottle">
      <!-- Bottle body -->
      <path d="M -9,13 L 9,13 Q 11,13 11,11 L 11,5 Q 11,3 13,3 L 13,-7 Q 13,-9 11,-9 L -11,-9 Q -13,-9 -13,-7 L -13,3 Q -11,3 -11,5 L -11,11 Q -11,13 -9,13 Z"
            fill="#7eb84a" stroke="#3e6a1f" stroke-width="1.3"/>
      <!-- Bottle highlight -->
      <path d="M -7,10 L -7,-5" stroke="#a8d870" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <!-- Label -->
      <rect x="-7" y="2" width="14" height="7" fill="#fff8e0" opacity="0.85"/>
      <text x="0" y="7" text-anchor="middle" font-family="sans-serif" font-size="5" fill="#3e6a1f" font-weight="bold">★</text>
      <!-- Cap -->
      <rect x="-3.5" y="-12" width="7" height="3" fill="#3e6a1f" rx="0.5"/>
      <!-- Cork -->
      <ellipse cx="0" cy="-12" rx="3.5" ry="1.2" fill="#8a5a2a"/>
    </g>

    <!-- Star/sparkle -->
    <g id="sparkle">
      <path d="M 0,-4 L 1,-1 L 4,0 L 1,1 L 0,4 L -1,1 L -4,0 L -1,-1 Z" fill="#ffd966"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="400" height="400" fill="#fff8e7"/>

  <!-- Sun -->
  <g>
    <circle cx="345" cy="58" r="24" fill="#ffd966" opacity="0.85">
      <animate attributeName="r" values="24;27;24" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="345" cy="58" r="32" fill="#ffd966" opacity="0.25">
      <animate attributeName="r" values="32;38;32" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Clouds -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="75" cy="68" rx="32" ry="11">
      <animate attributeName="cx" values="75;95;75" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="100" cy="62" rx="22" ry="9">
      <animate attributeName="cx" values="100;120;100" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="55" cy="64" rx="16" ry="8">
      <animate attributeName="cx" values="55;75;55" dur="12s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <!-- Ground -->
  <rect x="0" y="380" width="400" height="20" fill="#c8a878"/>
  <line x1="0" y1="380" x2="400" y2="380" stroke="#7a563a" stroke-width="2"/>

  <!-- Grass tufts -->
  <g stroke="#5e8533" stroke-width="1.5" fill="none" stroke-linecap="round">
    <path d="M 50,378 L 50,371"/>
    <path d="M 53,378 L 55,369"/>
    <path d="M 47,378 L 45,370"/>
    <path d="M 320,378 L 320,371"/>
    <path d="M 323,378 L 325,369"/>
    <path d="M 317,378 L 315,370"/>
    <path d="M 360,378 L 360,372"/>
    <path d="M 100,378 L 100,373"/>
    <path d="M 270,378 L 270,373"/>
  </g>

  <!-- ============ Unicycle Wheel (rotating) ============ -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 200,335" to="360 200,335" dur="1.5s" repeatCount="indefinite"/>
    <!-- Tire -->
    <circle cx="200" cy="335" r="50" fill="#1a1208" stroke="#000" stroke-width="1.5"/>
    <circle cx="200" cy="335" r="50" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="3,2"/>
    <!-- Rim -->
    <circle cx="200" cy="335" r="44" fill="url(#wheelGrad)"/>
    <circle cx="200" cy="335" r="40" fill="none" stroke="#fff" stroke-width="0.8" opacity="0.4"/>
    <!-- Spokes -->
    <line x1="200" y1="293" x2="200" y2="377" stroke="#dddddd" stroke-width="1.4" opacity="0.65"/>
    <line x1="158" y1="335" x2="242" y2="335" stroke="#dddddd" stroke-width="1.4" opacity="0.65"/>
    <line x1="170" y1="305" x2="230" y2="365" stroke="#dddddd" stroke-width="1.4" opacity="0.65"/>
    <line x1="230" y1="305" x2="170" y2="365" stroke="#dddddd" stroke-width="1.4" opacity="0.65"/>
    <!-- Hub -->
    <circle cx="200" cy="335" r="7" fill="#777" stroke="#222" stroke-width="1.5"/>
    <circle cx="200" cy="335" r="3" fill="#222"/>
  </g>

  <!-- Wheel fork/posts -->
  <path d="M 197,335 L 195,300 L 205,300 L 203,335 Z" fill="#888" stroke="#333" stroke-width="1"/>
  <path d="M 200,300 L 200,288" stroke="#888" stroke-width="4"/>

  <!-- Seat -->
  <ellipse cx="200" cy="288" rx="22" ry="6" fill="#222"/>
  <ellipse cx="200" cy="286" rx="20" ry="4" fill="#555"/>

  <!-- ============ Pedals (rotating with wheel) ============ -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 200,335" to="360 200,335" dur="1.5s" repeatCount="indefinite"/>
    <line x1="200" y1="335" x2="224" y2="335" stroke="#333" stroke-width="2.5"/>
    <line x1="200" y1="335" x2="176" y2="335" stroke="#333" stroke-width="2.5"/>
    <rect x="221" y="331" width="11" height="8" fill="#2a2a2a" rx="1.5"/>
    <rect x="168" y="331" width="11" height="8" fill="#2a2a2a" rx="1.5"/>
  </g>

  <!-- ============ Anteater group (with riding bob) ============ -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,-3; 0,0; 0,-1; 0,0" dur="1.5s" repeatCount="indefinite"/>

    <!-- Tail (swaying) -->
    <g transform="translate(170, 270)">
      <animateTransform attributeName="transform" type="rotate"
                        values="-12; 14; -12" dur="2.5s" repeatCount="indefinite" additive="sum"/>
      <!-- Bushy tail shape -->
      <path d="M 0,0 Q -22,12 -42,38 Q -58,62 -54,82"
            stroke="#a0724a" stroke-width="20" stroke-linecap="round" fill="none"/>
      <path d="M 0,0 Q -22,12 -42,38 Q -58,62 -54,82"
            stroke="#8a5e3a" stroke-width="14" stroke-linecap="round" fill="none"/>
      <!-- Fur detail -->
      <path d="M -10,8 L -14,2" stroke="#5e3e22" stroke-width="1" stroke-linecap="round"/>
      <path d="M -25,22 L -30,16" stroke="#5e3e22" stroke-width="1" stroke-linecap="round"/>
      <path d="M -42,42 L -48,38" stroke="#5e3e22" stroke-width="1" stroke-linecap="round"/>
      <path d="M -52,62 L -58,60" stroke="#5e3e22" stroke-width="1" stroke-linecap="round"/>
      <!-- Tail tip fluff -->
      <ellipse cx="-54" cy="82" rx="14" ry="11" fill="#a0724a" stroke="#5e3e22" stroke-width="1"/>
      <path d="M -54,82 L -58,76 M -54,82 L -50,76 M -54,82 L -60,82 M -54,82 L -48,82"
            stroke="#5e3e22" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Back leg (behind body, pedaling) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="180 200,290; 540 200,290" dur="1.5s" repeatCount="indefinite"/>
      <line x1="200" y1="290" x2="200" y2="340" stroke="#7a563a" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="200" cy="343" rx="5" ry="2.5" fill="#222"/>
    </g>

    <!-- Body -->
    <ellipse cx="200" cy="263" rx="34" ry="28" fill="url(#bodyGrad)" stroke="#7a563a" stroke-width="2"/>
    <ellipse cx="200" cy="273" rx="22" ry="17" fill="#d4a87a" opacity="0.7"/>
    <!-- Shoulder shading -->
    <path d="M 174,253 Q 200,248 226,253" stroke="#7a563a" stroke-width="1" fill="none" opacity="0.6"/>

    <!-- Front leg (in front, pedaling) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 200,290; 360 200,290" dur="1.5s" repeatCount="indefinite"/>
      <line x1="200" y1="290" x2="200" y2="340" stroke="#a0724a" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="200" cy="343" rx="5" ry="2.5" fill="#333"/>
    </g>

    <!-- ============ Head / Long Snout ============ -->
    <g>
      <!-- Long tapered snout -->
      <path d="M 199,233
               Q 240,228 282,250
               Q 290,256 284,261
               Q 290,265 282,261
               Q 240,256 199,253 Z"
            fill="url(#bodyGrad)" stroke="#7a563a" stroke-width="1.5"/>
      <!-- Snout shading -->
      <path d="M 220,247 Q 250,247 280,253" stroke="#9a6f48" stroke-width="1" fill="none" opacity="0.6"/>
      <!-- Nostril/mouth tip -->
      <ellipse cx="284" cy="259" rx="3.5" ry="2.5" fill="#3e2615"/>
      <circle cx="285" cy="258" r="0.8" fill="#fff" opacity="0.5"/>

      <!-- Head -->
      <ellipse cx="199" cy="240" rx="18" ry="14" fill="url(#bodyGrad)" stroke="#7a563a" stroke-width="1.5"/>

      <!-- Eye -->
      <circle cx="210" cy="237" r="3" fill="#1a0e04"/>
      <circle cx="211" cy="236" r="0.9" fill="#fff"/>
      <!-- Eyelid (focused) -->
      <path d="M 207,234 Q 210,232 214,234" stroke="#3e2615" stroke-width="1" fill="none" stroke-linecap="round"/>

      <!-- Ear -->
      <ellipse cx="192" cy="225" rx="4" ry="6" fill="#7a563a"/>
      <ellipse cx="192" cy="226" rx="2" ry="4" fill="#b0875d"/>
      <!-- Topknot fur -->
      <path d="M 192,222 L 191,217" stroke="#3e2615" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 196,220 L 197,215" stroke="#3e2615" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M 200,220 L 201,215" stroke="#3e2615" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- ============ Arms (juggling hands) ============ -->
    <!-- Right arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-5 218,258; 5 218,258; -5 218,258" dur="1.5s" repeatCount="indefinite"/>
      <path d="M 218,258 Q 232,243 238,225"
            stroke="#a0724a" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <circle cx="238" cy="223" r="5" fill="#a0724a" stroke="#7a563a" stroke-width="1"/>
    </g>

    <!-- Left arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="5 182,258; -5 182,258; 5 182,258" dur="1.5s" repeatCount="indefinite"/>
      <path d="M 182,258 Q 168,243 162,225"
            stroke="#8a5e3a" stroke-width="6.5" stroke-linecap="round" fill="none"/>
      <circle cx="162" cy="223" r="5" fill="#8a5e3a" stroke="#5e3e22" stroke-width="1"/>
    </g>
  </g>

  <!-- ============ Juggling Bottles ============ -->
  <g>
    <!-- Bottle 1 -->
    <g transform="translate(200, 225)">
      <use href="#bottle">
        <animateMotion dur="1.5s" repeatCount="indefinite"
                       path="M 38,2 C 38,-130 -38,-130 -38,2 C -38,32 38,32 38,2 Z"/>
      </use>
    </g>
    <!-- Bottle 2 (offset 1/3 cycle) -->
    <g transform="translate(200, 225)">
      <use href="#bottle">
        <animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite"
                       path="M 38,2 C 38,-130 -38,-130 -38,2 C -38,32 38,32 38,2 Z"/>
      </use>
    </g>
    <!-- Bottle 3 (offset 2/3 cycle) -->
    <g transform="translate(200, 225)">
      <use href="#bottle">
        <animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite"
                       path="M 38,2 C 38,-130 -38,-130 -38,2 C -38,32 38,32 38,2 Z"/>
      </use>
    </g>
  </g>

  <!-- Sparkles near the apex -->
  <g opacity="0.9">
    <use href="#sparkle" x="160" y="105">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="245" y="115">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.4s" repeatCount="indefinite"/>
    </use>
    <use href="#sparkle" x="200" y="92">
      <animate attributeName="opacity" values="0;1;0" dur="1.2s" begin="0.8s" repeatCount="indefinite"/>
    </use>
  </g>

  <!-- Caption -->
  <text x="200" y="397" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#7a563a" font-style="italic">look ma, no hands!</text>
</svg>