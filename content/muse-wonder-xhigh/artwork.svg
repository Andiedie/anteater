<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A cheerful cartoon anteater with a long snout and bushy tail pedals a teal unicycle while three colourful bottles loop through the air above its paws.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ed8ff"/>
      <stop offset="0.62" stop-color="#dff7ff"/>
      <stop offset="1" stop-color="#fff3c9"/>
    </linearGradient>

    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c99a68"/>
      <stop offset="0.58" stop-color="#a97448"/>
      <stop offset="1" stop-color="#7c4f2e"/>
    </linearGradient>

    <linearGradient id="furDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="1" stop-color="#54341d"/>
    </linearGradient>

    <linearGradient id="glassGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ff0b3"/>
      <stop offset="0.5" stop-color="#2fbf71"/>
      <stop offset="1" stop-color="#087f4f"/>
    </linearGradient>

    <linearGradient id="glassBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#aee9ff"/>
      <stop offset="0.5" stop-color="#38a8e8"/>
      <stop offset="1" stop-color="#1769aa"/>
    </linearGradient>

    <linearGradient id="glassAmber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe49a"/>
      <stop offset="0.5" stop-color="#ffb02e"/>
      <stop offset="1" stop-color="#c66a00"/>
    </linearGradient>

    <clipPath id="bodyClip">
      <ellipse cx="475" cy="272" rx="102" ry="59" transform="rotate(-5 475 272)"/>
    </clipPath>

    <!-- One bottle, centred on (0,0) so it can spin while travelling. -->
    <g id="bottleShape">
      <path d="M -6 -27 L 6 -27 L 6 -13 C 6 -7 15 -4 15 5 L 15 22 C 15 30 11 34 4 34 L -4 34 C -11 34 -15 30 -15 22 L -15 5 C -15 -4 -6 -7 -6 -13 Z"/>
      <rect x="-8" y="-33" width="16" height="8" rx="3"/>
      <rect x="-10" y="-1" width="20" height="17" rx="3" fill="#fff8dc" opacity="0.92"/>
      <path d="M -8 -8 C -11 3 -11 16 -9 27" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.55"/>
      <circle cx="0" cy="7" r="3.2" fill="#e94f37"/>
    </g>

    <path id="jugglePath" d="M 398 208 C 420 62 592 62 614 208 C 594 274 418 274 398 208 Z"/>

    <style><![CDATA[
      .wheel-spin {
        transform-origin: 480px 432px;
        animation: spin 1.05s linear infinite;
      }
      .sun-rays {
        transform-origin: 118px 104px;
        animation: spin 24s linear infinite;
      }
      .rider-bob {
        animation: bob 0.55s ease-in-out infinite alternate;
      }
      .tail-wag {
        transform-origin: 386px 282px;
        animation: tail 1.1s ease-in-out infinite alternate;
      }
      .head-bob {
        transform-origin: 570px 232px;
        animation: head 1.1s ease-in-out infinite alternate;
      }
      .ear-wiggle {
        transform-origin: 552px 196px;
        animation: ear 0.9s ease-in-out infinite alternate;
      }
      .leg-a {
        transform-origin: 452px 318px;
        animation: pedal-a 1.05s ease-in-out infinite;
      }
      .leg-b {
        transform-origin: 505px 316px;
        animation: pedal-b 1.05s ease-in-out infinite;
      }
      .arm-a {
        transform-origin: 536px 274px;
        animation: juggle-a 0.7s ease-in-out infinite alternate;
      }
      .arm-b {
        transform-origin: 552px 282px;
        animation: juggle-b 0.7s ease-in-out infinite alternate;
      }
      .bottle-spin-a { animation: spin 0.68s linear infinite; }
      .bottle-spin-b { animation: spin-rev 0.78s linear infinite; }
      .bottle-spin-c { animation: spin 0.58s linear infinite; }
      .cloud-a { animation: drift-a 7s ease-in-out infinite alternate; }
      .cloud-b { animation: drift-b 9s ease-in-out infinite alternate; }
      .ground-lines { animation: ground 0.65s linear infinite; }
      .shadow-pulse { animation: shadow 0.55s ease-in-out infinite alternate; transform-origin: 480px 526px; }
      .tongue {
        transform-origin: 704px 254px;
        animation: tongue 3.6s ease-in-out infinite;
      }
      .dust-a { animation: dust-a 0.9s ease-out infinite; }
      .dust-b { animation: dust-b 0.9s ease-out 0.3s infinite; }
      .dust-c { animation: dust-a 0.9s ease-out 0.6s infinite; }
      .sparkle { animation: sparkle 1.4s ease-in-out infinite alternate; }
      .sparkle-late { animation: sparkle 1.4s ease-in-out 0.55s infinite alternate; }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes spin-rev { to { transform: rotate(-360deg); } }
      @keyframes bob {
        from { transform: translateY(3px); }
        to   { transform: translateY(-5px); }
      }
      @keyframes tail {
        from { transform: rotate(-4deg); }
        to   { transform: rotate(5deg); }
      }
      @keyframes head {
        from { transform: rotate(-2deg) translateY(1px); }
        to   { transform: rotate(2.5deg) translateY(-2px); }
      }
      @keyframes ear {
        from { transform: rotate(-7deg); }
        to   { transform: rotate(8deg); }
      }
      @keyframes pedal-a {
        0%, 100% { transform: rotate(19deg); }
        50%      { transform: rotate(-21deg); }
      }
      @keyframes pedal-b {
        0%, 100% { transform: rotate(-21deg); }
        50%      { transform: rotate(19deg); }
      }
      @keyframes juggle-a {
        from { transform: rotate(4deg) translateY(3px); }
        to   { transform: rotate(-5deg) translateY(-5px); }
      }
      @keyframes juggle-b {
        from { transform: rotate(-5deg) translateY(-4px); }
        to   { transform: rotate(4deg) translateY(4px); }
      }
      @keyframes drift-a {
        from { transform: translateX(-18px); }
        to   { transform: translateX(34px); }
      }
      @keyframes drift-b {
        from { transform: translateX(26px); }
        to   { transform: translateX(-24px); }
      }
      @keyframes ground {
        from { transform: translateX(0); }
        to   { transform: translateX(-92px); }
      }
      @keyframes shadow {
        from { transform: scaleX(1); opacity: 0.20; }
        to   { transform: scaleX(0.9); opacity: 0.14; }
      }
      @keyframes tongue {
        0%, 68%, 100% { transform: scaleX(0.18); opacity: 0; }
        76%, 86%      { transform: scaleX(1); opacity: 1; }
      }
      @keyframes dust-a {
        0%   { transform: translate(0, 0) scale(0.55); opacity: 0; }
        25%  { opacity: 0.55; }
        100% { transform: translate(-62px, -22px) scale(1.45); opacity: 0; }
      }
      @keyframes dust-b {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        25%  { opacity: 0.45; }
        100% { transform: translate(-78px, -10px) scale(1.25); opacity: 0; }
      }
      @keyframes sparkle {
        from { transform: scale(0.55) rotate(0deg); opacity: 0.25; }
        to   { transform: scale(1.15) rotate(28deg); opacity: 1; }
      }

      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
      }
    ]]></style>
  </defs>

  <!-- Sky -->
  <rect width="960" height="640" fill="url(#sky)"/>

  <!-- Sun -->
  <g>
    <g class="sun-rays" stroke="#ffc93c" stroke-width="8" stroke-linecap="round" opacity="0.85">
      <line x1="118" y1="24" x2="118" y2="48"/>
      <line x1="118" y1="160" x2="118" y2="184"/>
      <line x1="38" y1="104" x2="62" y2="104"/>
      <line x1="174" y1="104" x2="198" y2="104"/>
      <line x1="62" y1="48" x2="79" y2="65"/>
      <line x1="157" y1="143" x2="174" y2="160"/>
      <line x1="174" y1="48" x2="157" y2="65"/>
      <line x1="79" y1="143" x2="62" y2="160"/>
    </g>
    <circle cx="118" cy="104" r="46" fill="#ffd93d" stroke="#ffae00" stroke-width="5"/>
    <circle cx="104" cy="94" r="6" fill="#5d4037"/>
    <circle cx="134" cy="94" r="6" fill="#5d4037"/>
    <path d="M 100 116 Q 118 130 136 116" fill="none" stroke="#5d4037" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Clouds -->
  <g class="cloud-a" fill="#ffffff" opacity="0.94">
    <ellipse cx="330" cy="88" rx="58" ry="24"/>
    <ellipse cx="368" cy="72" rx="44" ry="28"/>
    <ellipse cx="292" cy="72" rx="34" ry="20"/>
  </g>
  <g class="cloud-b" fill="#ffffff" opacity="0.88">
    <ellipse cx="766" cy="128" rx="68" ry="25"/>
    <ellipse cx="810" cy="108" rx="46" ry="30"/>
    <ellipse cx="724" cy="110" rx="36" ry="21"/>
  </g>
  <g class="cloud-a" fill="#ffffff" opacity="0.65">
    <ellipse cx="646" cy="58" rx="42" ry="17"/>
    <ellipse cx="674" cy="46" rx="30" ry="19"/>
  </g>

  <!-- Distant hills and trees -->
  <path d="M 0 470 Q 150 382 330 458 T 680 442 T 960 452 L 960 530 L 0 530 Z" fill="#8ed081"/>
  <path d="M 0 492 Q 190 424 410 482 T 960 478 L 960 535 L 0 535 Z" fill="#5cb85c"/>
  <g stroke="#2e7d32" stroke-width="7" stroke-linecap="round">
    <line x1="86" y1="474" x2="86" y2="438"/>
    <line x1="874" y1="478" x2="874" y2="440"/>
    <line x1="716" y1="470" x2="716" y2="442"/>
  </g>
  <g fill="#2e9e4f">
    <circle cx="86" cy="420" r="30"/>
    <circle cx="62" cy="438" r="22"/>
    <circle cx="110" cy="438" r="22"/>
    <circle cx="874" cy="422" r="28"/>
    <circle cx="850" cy="440" r="20"/>
    <circle cx="898" cy="440" r="20"/>
    <circle cx="716" cy="428" r="22"/>
  </g>

  <!-- Ground / road -->
  <rect x="0" y="498" width="960" height="142" fill="#f4cf7a"/>
  <rect x="0" y="498" width="960" height="13" fill="#69a84f"/>
  <g class="ground-lines" stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <line x1="-70" y1="574" x2="8" y2="574"/>
    <line x1="22" y1="574" x2="100" y2="574"/>
    <line x1="114" y1="574" x2="192" y2="574"/>
    <line x1="206" y1="574" x2="284" y2="574"/>
    <line x1="298" y1="574" x2="376" y2="574"/>
    <line x1="390" y1="574" x2="468" y2="574"/>
    <line x1="482" y1="574" x2="560" y2="574"/>
    <line x1="574" y1="574" x2="652" y2="574"/>
    <line x1="666" y1="574" x2="744" y2="574"/>
    <line x1="758" y1="574" x2="836" y2="574"/>
    <line x1="850" y1="574" x2="928" y2="574"/>
    <line x1="942" y1="574" x2="1020" y2="574"/>
  </g>

  <!-- Contact shadow and dust -->
  <ellipse class="shadow-pulse" cx="480" cy="526" rx="118" ry="15" fill="#3d2b12"/>
  <g fill="#d9c49a">
    <circle class="dust-a" cx="382" cy="508" r="13"/>
    <circle class="dust-b" cx="396" cy="518" r="9"/>
    <circle class="dust-c" cx="368" cy="518" r="7"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <line x1="146" y1="318" x2="226" y2="318"/>
    <line x1="112" y1="356" x2="214" y2="356"/>
    <line x1="158" y1="394" x2="232" y2="394"/>
  </g>

  <!-- Unicycle wheel (behind the rider) -->
  <g>
    <circle cx="480" cy="432" r="82" fill="#e8f8ff" stroke="#263238" stroke-width="15"/>
    <circle cx="480" cy="432" r="61" fill="none" stroke="#90caf9" stroke-width="5"/>
    <g class="wheel-spin">
      <g stroke="#607d8b" stroke-width="6" stroke-linecap="round">
        <line x1="480" y1="432" x2="480" y2="374"/>
        <line x1="480" y1="432" x2="480" y2="490"/>
        <line x1="480" y1="432" x2="422" y2="432"/>
        <line x1="480" y1="432" x2="538" y2="432"/>
        <line x1="480" y1="432" x2="439" y2="391"/>
        <line x1="480" y1="432" x2="521" y2="473"/>
        <line x1="480" y1="432" x2="521" y2="391"/>
        <line x1="480" y1="432" x2="439" y2="473"/>
      </g>
      <!-- Cranks and pedals turn with the wheel -->
      <line x1="480" y1="432" x2="526" y2="466" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
      <line x1="480" y1="432" x2="434" y2="398" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
      <rect x="512" y="460" width="34" height="11" rx="5" fill="#263238"/>
      <rect x="414" y="392" width="34" height="11" rx="5" fill="#263238"/>
    </g>
    <!-- Fork, seat post and hub -->
    <path d="M 458 438 L 472 342 M 502 438 L 488 342" fill="none" stroke="#00838f" stroke-width="11" stroke-linecap="round"/>
    <line x1="480" y1="348" x2="480" y2="326" stroke="#37474f" stroke-width="9" stroke-linecap="round"/>
    <circle cx="480" cy="432" r="15" fill="#ffca28" stroke="#37474f" stroke-width="5"/>
  </g>

  <!-- Rider -->
  <g class="rider-bob">
    <!-- Bushy tail -->
    <g class="tail-wag">
      <path d="M 392 268 C 326 198 238 205 216 262 C 196 313 246 354 316 342 C 356 335 386 316 398 300 Z" fill="url(#furDark)"/>
      <path d="M 372 282 C 316 244 264 246 238 274 M 376 300 C 322 282 276 290 248 310 M 360 252 C 318 224 276 224 254 240"
            fill="none" stroke="#3e2723" stroke-width="6" stroke-linecap="round" opacity="0.45"/>
    </g>

    <!-- Far leg -->
    <g class="leg-b" opacity="0.88">
      <path d="M 505 316 Q 520 360 500 402" fill="none" stroke="#6d4527" stroke-width="19" stroke-linecap="round"/>
      <ellipse cx="498" cy="408" rx="19" ry="10" fill="#3e2723"/>
    </g>

    <!-- Far juggling arm -->
    <g class="arm-a">
      <path d="M 536 274 Q 466 252 410 214" fill="none" stroke="#6d4527" stroke-width="17" stroke-linecap="round"/>
      <circle cx="404" cy="210" r="14" fill="#5d3a22"/>
    </g>

    <!-- Body -->
    <ellipse cx="475" cy="272" rx="102" ry="59" fill="url(#fur)" transform="rotate(-5 475 272)"/>
    <g clip-path="url(#bodyClip)">
      <!-- The anteater's signature dark shoulder band, edged in cream -->
      <path d="M 500 202 L 566 224 L 500 342 L 442 330 Z" fill="#3e2723"/>
      <path d="M 488 202 L 504 202 L 452 336 L 438 330 Z" fill="#fff3d6"/>
      <ellipse cx="452" cy="294" rx="58" ry="31" fill="#e8c39a" opacity="0.75"/>
    </g>
    <path d="M 402 240 C 430 222 486 216 532 232 M 398 268 C 424 252 470 246 510 254"
          fill="none" stroke="#6d4527" stroke-width="5" stroke-linecap="round" opacity="0.35"/>

    <!-- Seat peeking out under the body -->
    <ellipse cx="480" cy="334" rx="42" ry="11" fill="#263238"/>
    <ellipse cx="480" cy="330" rx="42" ry="10" fill="#ef5350"/>

    <!-- Near leg -->
    <g class="leg-a">
      <path d="M 452 318 Q 436 362 462 402" fill="none" stroke="#8a5a34" stroke-width="20" stroke-linecap="round"/>
      <ellipse cx="466" cy="408" rx="20" ry="10" fill="#4e342e"/>
      <path d="M 478 404 L 492 404 M 480 410 L 494 410" stroke="#d7ccc8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Head and long snout -->
    <g class="head-bob">
      <g class="ear-wiggle">
        <ellipse cx="552" cy="190" rx="15" ry="25" fill="#7c4f2e" transform="rotate(-14 552 190)"/>
        <ellipse cx="554" cy="192" rx="8" ry="15" fill="#f2a7a7" transform="rotate(-14 554 192)"/>
      </g>

      <ellipse cx="574" cy="230" rx="40" ry="34" fill="url(#fur)"/>
      <!-- Long tapered snout -->
      <path d="M 600 216 C 646 220 684 234 708 249 C 686 264 642 264 602 252 C 594 240 594 226 600 216 Z" fill="#b98356"/>
      <ellipse cx="704" cy="250" rx="11" ry="8" fill="#4e342e" transform="rotate(18 704 250)"/>
      <circle cx="707" cy="247" r="2.4" fill="#ffffff" opacity="0.75"/>

      <!-- Flicking tongue -->
      <path class="tongue" d="M 704 254 Q 738 266 762 246" fill="none" stroke="#f06f8a" stroke-width="6" stroke-linecap="round"/>

      <!-- Eye, cheek and smile -->
      <circle cx="582" cy="220" r="10" fill="#ffffff"/>
      <circle cx="585" cy="221" r="5.5" fill="#263238"/>
      <circle cx="587" cy="218" r="1.8" fill="#ffffff"/>
      <path d="M 566 202 Q 582 194 596 203" fill="none" stroke="#5d3a22" stroke-width="4" stroke-linecap="round"/>
      <circle cx="594" cy="244" r="8" fill="#f2a7a7" opacity="0.65"/>
      <path d="M 650 258 Q 670 262 688 258" fill="none" stroke="#5d3a22" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- Near juggling arm -->
    <g class="arm-b">
      <path d="M 552 282 Q 604 258 610 216" fill="none" stroke="#8a5a34" stroke-width="18" stroke-linecap="round"/>
      <circle cx="612" cy="210" r="14" fill="#6d4527"/>
    </g>
  </g>

  <!-- Sparkles around the juggling arc -->
  <g fill="#ffca28" stroke="#ff8f00" stroke-width="2" stroke-linejoin="round">
    <path class="sparkle" transform="translate(506 54)" d="M 0 -13 L 4 -4 L 13 0 L 4 4 L 0 13 L -4 4 L -13 0 L -4 -4 Z"/>
    <path class="sparkle-late" transform="translate(356 132)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z"/>
    <path class="sparkle-late" transform="translate(662 126)" d="M 0 -10 L 3 -3 L 10 0 L 3 3 L 0 10 L -3 3 L -10 0 L -3 -3 Z"/>
  </g>

  <!-- Juggling bottles: one shared cascade path, staggered start times -->
  <g>
    <g>
      <animateMotion dur="2.1s" begin="0s" repeatCount="indefinite" path="M 398 208 C 420 62 592 62 614 208 C 594 274 418 274 398 208 Z"/>
      <g class="bottle-spin-a">
        <use href="#bottleShape" fill="url(#glassGreen)"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.1s" begin="-0.7s" repeatCount="indefinite" path="M 398 208 C 420 62 592 62 614 208 C 594 274 418 274 398 208 Z"/>
      <g class="bottle-spin-b">
        <use href="#bottleShape" fill="url(#glassBlue)"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.1s" begin="-1.4s" repeatCount="indefinite" path="M 398 208 C 420 62 592 62 614 208 C 594 274 418 274 398 208 Z"/>
      <g class="bottle-spin-c">
        <use href="#bottleShape" fill="url(#glassAmber)"/>
      </g>
    </g>
  </g>

  <!-- Caption -->
  <g>
    <rect x="252" y="588" width="456" height="38" rx="19" fill="#263238" opacity="0.88"/>
    <text x="480" y="614" text-anchor="middle" font-family="Verdana, Geneva, sans-serif" font-size="19" font-weight="bold" letter-spacing="2.5" fill="#ffffff">★ THE AMAZING ANTEATER ★</text>
  </g>
</svg>
