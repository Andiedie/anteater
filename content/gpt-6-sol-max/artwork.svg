<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title description">
  <title id="title">The Great Balancing Act</title>
  <desc id="description">An animated anteater rides a unicycle and juggles three colorful bottles beneath a circus-style title.</desc>

  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fff9ec"/>
      <stop offset="1" stop-color="#fcebd3"/>
    </linearGradient>
    <linearGradient id="spotlight" x2="1" y2="1">
      <stop stop-color="#fff1cb"/>
      <stop offset="1" stop-color="#f8dcb5"/>
    </linearGradient>
    <linearGradient id="fur" x2="1" y2="1">
      <stop stop-color="#dfbb8c"/>
      <stop offset="1" stop-color="#bb825f"/>
    </linearGradient>
    <linearGradient id="tailFur" x2="0" y2="1">
      <stop stop-color="#9d6651"/>
      <stop offset="1" stop-color="#694d49"/>
    </linearGradient>
    <g id="bottle" stroke-linejoin="round">
      <path d="M-8-26H8v8c0 5 7 5 8 12v27c0 6-4 8-9 8H-7c-5 0-9-2-9-8V-6c1-7 8-7 8-12z" fill="currentColor" stroke="#314448" stroke-width="3.5"/>
      <path d="M-9-28H9v-5H-9z" fill="#314448"/>
      <path d="M-12-2h24v19h-24z" fill="#fff4dc"/>
      <circle cy="7.5" r="5" fill="currentColor"/>
      <path d="M-9-18v8M-9 20v3" fill="none" stroke="#fff7e8" stroke-linecap="round" stroke-width="2.5" opacity=".8"/>
      <path d="M-8-23H8" stroke="#fff4dc" stroke-width="2" opacity=".8"/>
    </g>
  </defs>

  <style>
    .rider { animation: bounce 1.5s ease-in-out infinite; }
    .spokes { transform-origin: 332px 487px; animation: spin 2.5s linear infinite; }
    .tail { transform-origin: 282px 365px; animation: swish 2.5s ease-in-out infinite; }
    .left-arm { transform-origin: 326px 348px; animation: wave 1.5s ease-in-out infinite; }
    .right-arm { transform-origin: 389px 350px; animation: wave 1.5s ease-in-out -.75s infinite; }
    .shadow { transform-origin: 332px 564px; animation: shadow-pulse 1.5s ease-in-out infinite; }
    .sparkle { transform-box: fill-box; transform-origin: center; animation: shimmer 2.4s ease-in-out infinite; }
    .sparkle.late { animation-delay: -1.2s; }
    .eye { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
    @keyframes bounce { 50% { transform: translateY(-4px); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes swish { 50% { transform: rotate(-4deg); } }
    @keyframes wave { 50% { transform: rotate(4deg); } }
    @keyframes shadow-pulse { 50% { transform: scaleX(.87); opacity: .35; } }
    @keyframes shimmer { 50% { transform: scale(.65); opacity: .45; } }
    @keyframes blink { 0%, 43%, 46%, 100% { transform: scaleY(1); } 44%, 45% { transform: scaleY(.12); } }
    .still-bottles { visibility: hidden; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
      .flying-bottle { visibility: hidden; }
      .still-bottles { visibility: visible; }
    }
  </style>

  <!-- A warm, illustrated circus poster. -->
  <rect width="800" height="600" fill="url(#paper)"/>
  <rect x="17" y="17" width="766" height="566" rx="28" fill="none" stroke="#314448" stroke-width="2.5"/>
  <rect x="25" y="25" width="750" height="550" rx="22" fill="none" stroke="#dfa985" stroke-width="1.5" stroke-dasharray="3 9"/>
  <circle cx="398" cy="312" r="224" fill="url(#spotlight)" opacity=".79"/>
  <circle cx="398" cy="312" r="199" fill="none" stroke="#f7cfa9" stroke-width="2" stroke-dasharray="2 13" opacity=".65"/>

  <g fill="#314448" font-family="Trebuchet MS, Arial, sans-serif">
    <text x="62" y="69" font-size="13" font-weight="700" letter-spacing="4">THE LITTLE CIRCUS</text>
    <path d="M62 79h215" stroke="#dc8d6c" stroke-width="2"/>
    <text x="59" y="120" font-size="39" font-weight="900" letter-spacing="1">THE GREAT</text>
    <text x="59" y="158" font-size="30" font-weight="900" letter-spacing=".4">BALANCING ACT</text>
    <text x="62" y="181" font-size="11" font-weight="700" letter-spacing="2.4" fill="#986a56">ONE WHEEL · THREE BOTTLES</text>
  </g>

  <g fill="none" stroke="#d6a77f" stroke-width="2" stroke-linecap="round" opacity=".8">
    <path d="M633 112c24-14 45-14 66 0M652 129c13-8 27-8 40 0"/>
    <path d="M92 264c23-12 44-12 62 0M104 278c14-6 27-6 38 0"/>
    <path d="M658 412c21-12 40-12 57 0"/>
  </g>
  <g fill="#df9975" opacity=".8">
    <circle cx="679" cy="216" r="4"/><circle cx="706" cy="234" r="2.5"/>
    <circle cx="124" cy="210" r="3.5"/><circle cx="114" cy="434" r="3"/>
    <circle cx="632" cy="368" r="3.5"/>
  </g>
  <g transform="translate(600 129)"><g class="sparkle" fill="#e6a34f">
    <path d="M0-12 3-3 12 0 3 3 0 12-3 3-12 0-3-3z"/>
  </g></g>
  <g transform="translate(315 221)"><g class="sparkle late" fill="#d98870">
    <path d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2z"/>
  </g></g>
  <g transform="translate(642 305)"><g class="sparkle late" fill="#6baca5">
    <path d="M0-9 2-2 9 0 2 2 0 9-2 2-9 0-2-2z"/>
  </g></g>

  <!-- The flight path is a faint flourish behind the animated bottles. -->
  <path d="M426 183 C449 98 544 97 562 180" fill="none" stroke="#e3b58e" stroke-width="2" stroke-dasharray="3 11" stroke-linecap="round" opacity=".7"/>

  <ellipse class="shadow" cx="332" cy="565" rx="112" ry="9" fill="#8b776a" opacity=".5"/>
  <path d="M70 562h654" stroke="#314448" stroke-linecap="round" stroke-width="3"/>
  <path d="M74 569h121m304 0h219" stroke="#d39e79" stroke-linecap="round" stroke-width="2"/>

  <g class="rider">
    <!-- Tire, turning spokes, frame and pedals. -->
    <circle cx="332" cy="487" r="75" fill="#314448"/>
    <circle cx="332" cy="487" r="67" fill="#e7866f"/>
    <circle cx="332" cy="487" r="61" fill="#fff3dc"/>
    <circle cx="332" cy="487" r="58" fill="none" stroke="#77b3a9" stroke-width="3"/>
    <g class="spokes" fill="none" stroke="#98bdb3" stroke-width="2.5">
      <path d="M332 431v112M276 487h112M292.4 447.4l79.2 79.2m-79.2 0 79.2-79.2M304 438.5l56 97m-76.5-76.5 97 56m-97 0 97-56M304 535.5l56-97"/>
      <circle cx="332" cy="487" r="16" fill="#fff3dc" stroke="#77b3a9"/>
    </g>
    <path d="M332 486 324 443 334 412" fill="none" stroke="#314448" stroke-linecap="round" stroke-linejoin="round" stroke-width="11"/>
    <path d="M332 484 327 445 334 416" fill="none" stroke="#76b2a9" stroke-linecap="round" stroke-width="5"/>
    <path d="M306 410q23-13 49-1 5 4-2 10h-44q-10-1-3-9z" fill="#314448"/>
    <path d="M314 410q18-6 32 0" fill="none" stroke="#e78770" stroke-linecap="round" stroke-width="3"/>
    <path d="m332 487-31-21m31 21 32 22" stroke="#314448" stroke-linecap="round" stroke-width="7"/>
    <path d="M280 474h43m24 46h42" stroke="#314448" stroke-linecap="round" stroke-width="6"/>

    <!-- The broad, gently swaying tail sits behind the rider. -->
    <g class="tail" stroke-linejoin="round">
      <path d="M291 319c-50-33-100-30-139 8-32 32-58 57-83 43 9 48 44 88 91 91 58 5 108-26 143-61z" fill="url(#tailFur)" stroke="#314448" stroke-width="5"/>
      <path d="M276 341c-43-25-84-13-117 21-26 27-49 41-76 40 29 25 63 37 99 24 36-13 67-37 94-61z" fill="#edc59b" opacity=".96"/>
      <path d="M139 422q43-8 78-39m-84-5q30-7 53-31" fill="none" stroke="#b67c60" stroke-width="4" stroke-linecap="round" opacity=".65"/>
      <path d="m88 383-15-13m34 32-18 1m42 20-12 13" fill="none" stroke="#314448" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Two bent legs meet the unicycle's pedals. -->
    <path d="M318 389q-23 25-20 56l3 18m51-71q33 35 17 66l-9 46" fill="none" stroke="#314448" stroke-linecap="round" stroke-linejoin="round" stroke-width="27"/>
    <path d="M318 389q-23 25-20 56l3 18m51-71q33 35 17 66l-9 46" fill="none" stroke="#af795c" stroke-linecap="round" stroke-linejoin="round" stroke-width="19"/>
    <path d="M287 455q18-7 29 6l4 9q-17 10-38 0-7-5 5-15zm65 44q18-8 29 7l5 9q-18 10-39 0-7-6 5-16z" fill="#314448"/>
    <path d="M285 459q14-5 23 2m43 44q14-6 24 3" fill="none" stroke="#fff1da" stroke-linecap="round" stroke-width="3"/>

    <!-- Body, with the dark shoulder sash characteristic of an anteater. -->
    <path d="M296 304c30-17 72-13 96 8 26 24 32 61 11 87-18 24-62 35-101 19-32-13-48-38-45-65 2-23 16-40 39-49z" fill="url(#fur)" stroke="#314448" stroke-width="5"/>
    <path d="M281 351c24-19 68-14 91 8 19 19 21 39 9 56-24 15-62 12-86-2-23-15-31-39-14-62z" fill="#efcfaa"/>
    <path d="M313 299c37-9 74 13 95 45l-29 25c-20-28-44-47-82-55z" fill="#405052"/>
    <path d="M320 301c31 0 60 19 78 45l-12 10c-21-27-41-41-76-47z" fill="#fff0d5"/>
    <path d="M277 367q4 24 22 35m68-15q8 10 7 19" fill="none" stroke="#c08b69" stroke-linecap="round" stroke-width="3" opacity=".7"/>

    <!-- Reaching arms and little curved claws. -->
    <g class="left-arm">
      <path d="M327 347q39-16 61-59l18-27" fill="none" stroke="#314448" stroke-linecap="round" stroke-linejoin="round" stroke-width="26"/>
      <path d="M327 347q39-16 61-59l18-27" fill="none" stroke="#be8b69" stroke-linecap="round" stroke-linejoin="round" stroke-width="18"/>
      <ellipse cx="410" cy="256" rx="16" ry="12" transform="rotate(-22 410 256)" fill="#c99873" stroke="#314448" stroke-width="3.5"/>
      <path d="m405 247 2-8m6 9 5-7m2 13 8-2" fill="none" stroke="#314448" stroke-linecap="round" stroke-width="2.5"/>
    </g>
    <g class="right-arm">
      <path d="M386 351q35-47 91-62 47-12 73-37" fill="none" stroke="#314448" stroke-linecap="round" stroke-linejoin="round" stroke-width="25"/>
      <path d="M386 351q35-47 91-62 47-12 73-37" fill="none" stroke="#bc8968" stroke-linecap="round" stroke-linejoin="round" stroke-width="17"/>
      <ellipse cx="554" cy="247" rx="16" ry="12" transform="rotate(-24 554 247)" fill="#c99873" stroke="#314448" stroke-width="3.5"/>
      <path d="m549 238 2-8m7 8 5-8m1 15 8-2" fill="none" stroke="#314448" stroke-linecap="round" stroke-width="2.5"/>
    </g>

    <!-- Ear, smiling face and unmistakably long snout. -->
    <g class="ear">
      <path d="M385 302q-18-25-9-44 18 1 30 31z" fill="#bc896b" stroke="#314448" stroke-linejoin="round" stroke-width="4"/>
      <path d="M385 286q-7-15-5-19 9 5 14 17z" fill="#e89f91"/>
    </g>
    <path d="M375 310c7-28 35-39 65-31 20 5 35 21 50 27 23 8 58 17 88 28 8 3 12 7 10 13-2 8-12 9-21 6-33-7-64-12-90-10-21 1-31 8-51 9-30 3-60-14-51-42z" fill="url(#fur)" stroke="#314448" stroke-linejoin="round" stroke-width="5"/>
    <path d="M449 322c29 2 86 16 132 18 6 0 6 8-3 10-33 3-69-8-98-8-13 0-22 3-31 3 11-7 10-16 0-23z" fill="#f2d3ae"/>
    <path d="M466 314q32 7 64 18" fill="none" stroke="#ad795c" stroke-linecap="round" stroke-width="3" opacity=".55"/>
    <g class="eye">
      <ellipse cx="432" cy="310" rx="5" ry="6.5" fill="#273d3e"/>
      <circle cx="433.5" cy="308" r="1.6" fill="#fff8e8"/>
    </g>
    <path d="M422 297q10-5 19-1" fill="none" stroke="#314448" stroke-linecap="round" stroke-width="3"/>
    <ellipse cx="580" cy="342" rx="10" ry="7" transform="rotate(12 580 342)" fill="#314448"/>
    <path d="M533 350q10 11 24 5" fill="none" stroke="#314448" stroke-linecap="round" stroke-width="2.5"/>
    <circle cx="457" cy="330" r="8" fill="#e89784" opacity=".5"/>
    <circle cx="332" cy="487" r="11" fill="#314448"/>
    <circle cx="332" cy="487" r="5" fill="#f2bb6e"/>
  </g>

  <!-- Each bottle follows the same loop, one second apart. -->
  <g class="flying-bottle" color="#df806d">
    <animateMotion path="M420 218 C420 108 552 82 567 211 C577 258 520 257 482 246 C444 235 417 256 420 218 Z" dur="3s" begin="0s" repeatCount="indefinite" rotate="0"/>
    <g><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="3s" begin="0s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>
  <g class="flying-bottle" color="#63afa5">
    <animateMotion path="M420 218 C420 108 552 82 567 211 C577 258 520 257 482 246 C444 235 417 256 420 218 Z" dur="3s" begin="-1s" repeatCount="indefinite" rotate="0"/>
    <g><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="3s" begin="-1s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>
  <g class="flying-bottle" color="#e7ad52">
    <animateMotion path="M420 218 C420 108 552 82 567 211 C577 258 520 257 482 246 C444 235 417 256 420 218 Z" dur="3s" begin="-2s" repeatCount="indefinite" rotate="0"/>
    <g><animateTransform attributeName="transform" type="rotate" from="-18" to="342" dur="3s" begin="-2s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>
  <g class="still-bottles">
    <use href="#bottle" color="#df806d" transform="translate(420 218) rotate(-18)"/>
    <use href="#bottle" color="#63afa5" transform="translate(494 125) rotate(20)"/>
    <use href="#bottle" color="#e7ad52" transform="translate(565 210) rotate(-12)"/>
  </g>

  <g fill="#314448" font-family="Trebuchet MS, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2.5">
    <text x="62" y="548">LOOK, NO HANDS!*</text>
    <text x="561" y="548">*WELL, ALMOST.</text>
  </g>
</svg>
