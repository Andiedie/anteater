<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ad8f5"/>
      <stop offset="100%" stop-color="#e8f8ff"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e8b57"/>
      <stop offset="50%" stop-color="#66cdaa"/>
      <stop offset="100%" stop-color="#2e8b57"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#sky)"/>
  <rect y="265" width="400" height="35" fill="#8fbc5a"/>

  <!-- Ground motion lines -->
  <g stroke="#6b8e3a" stroke-width="2" stroke-linecap="round">
    <line x1="20" y1="280" x2="60" y2="280">
      <animate attributeName="x1" values="20;-20" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="60;20" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="290" x2="190" y2="290">
      <animate attributeName="x1" values="150;110" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="190;150" dur="0.6s" repeatCount="indefinite"/>
    </line>
    <line x1="280" y1="283" x2="320" y2="283">
      <animate attributeName="x1" values="280;240" dur="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="320;280" dur="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Unicycle + rider group, bobbing slightly -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-3; 0,0" dur="0.6s" repeatCount="indefinite"/>

    <!-- Wheel (rotating) -->
    <g transform="translate(200,235)">
      <circle r="38" fill="none" stroke="#333" stroke-width="5"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <line x1="-38" y1="0" x2="38" y2="0" stroke="#555" stroke-width="3"/>
        <line x1="0" y1="-38" x2="0" y2="38" stroke="#555" stroke-width="3"/>
        <line x1="-27" y1="-27" x2="27" y2="27" stroke="#555" stroke-width="3"/>
        <line x1="-27" y1="27" x2="27" y2="-27" stroke="#555" stroke-width="3"/>
      </g>
      <circle r="5" fill="#c0392b"/>
    </g>

    <!-- Fork / seat post -->
    <line x1="200" y1="235" x2="200" y2="170" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <rect x="186" y="160" width="28" height="8" rx="3" fill="#222"/>

    <!-- Anteater body -->
    <!-- Body -->
    <ellipse cx="200" cy="130" rx="36" ry="24" fill="#b8860b"/>
    <!-- Legs (pedaling) -->
    <g stroke="#8b6508" stroke-width="7" stroke-linecap="round">
      <line x1="195" y1="148" x2="188" y2="172">
        <animate attributeName="x2" values="188;212;188" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="172;160;172" dur="1.2s" repeatCount="indefinite"/>
      </line>
      <line x1="208" y1="148" x2="216" y2="168">
        <animate attributeName="x2" values="216;188;216" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="168;172;168" dur="1.2s" repeatCount="indefinite"/>
      </line>
    </g>
    <!-- Arms (juggling) -->
    <g stroke="#8b6508" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M180 118 Q160 110 150 92">
        <animate attributeName="d" values="M180 118 Q160 110 150 92;M180 118 Q160 100 165 72;M180 118 Q160 110 150 92" dur="1.2s" repeatCount="indefinite"/>
      </path>
      <path d="M220 118 Q240 110 250 92">
        <animate attributeName="d" values="M220 118 Q240 100 235 72;M220 118 Q240 110 250 92;M220 118 Q240 100 235 72" dur="1.2s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- Head -->
    <circle cx="212" cy="98" r="18" fill="#c99a2e"/>
    <!-- Long snout -->
    <path d="M226 96 Q252 96 262 106 Q254 104 226 104 Z" fill="#8b6508"/>
    <path d="M262 106 L266 108 L262 110 Z" fill="#333"/>
    <!-- Eye -->
    <circle cx="218" cy="94" r="2.5" fill="#111"/>
    <circle cx="219" cy="93" r="0.8" fill="#fff"/>
    <!-- Ear -->
    <ellipse cx="204" cy="84" rx="5" ry="8" fill="#8b6508"/>
    <!-- Striped tail -->
    <path d="M168 128 Q140 130 128 150 Q124 160 136 158 Q150 140 170 138 Z" fill="#8b6508"/>
    <path d="M136 152 L144 148 M130 144 L138 140" stroke="#333" stroke-width="3"/>
  </g>

  <!-- Juggling bottles (orbit in an arc above the rider) -->
  <g>
    <!-- Bottle 1 -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="150,80; 200,20; 250,80; 200,140; 150,80" dur="1.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-20;20;-20" dur="0.6s" repeatCount="indefinite"/>
        <rect x="-5" y="-14" width="10" height="28" rx="3" fill="url(#bottle)"/>
        <rect x="-2.5" y="-20" width="5" height="7" rx="1" fill="#2f4f4f"/>
      </g>
    </g>
    <!-- Bottle 2 (offset phase) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="250,80; 200,140; 150,80; 200,20; 250,80" dur="1.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="20;-20;20" dur="0.6s" repeatCount="indefinite"/>
        <rect x="-5" y="-14" width="10" height="28" rx="3" fill="#e74c3c"/>
        <rect x="-2.5" y="-20" width="5" height="7" rx="1" fill="#2f4f4f"/>
      </g>
    </g>
    <!-- Bottle 3 (third bottle, offset) -->
    <g>
      <animateTransform attributeName="transform" type="translate"
        values="200,20; 250,80; 200,140; 150,80; 200,20" dur="1.2s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="0;360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-5" y="-14" width="10" height="28" rx="3" fill="#3498db"/>
        <rect x="-2.5" y="-20" width="5" height="7" rx="1" fill="#2f4f4f"/>
      </g>
    </g>
  </g>

  <!-- Title -->
  <text x="200" y="22" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#5a3e00">Anteater Unicycle Juggler</text>
</svg>
