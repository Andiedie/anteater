<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="800" height="600" viewBox="0 0 800 600">
  <title>Anteater riding a unicycle while juggling bottles</title>
  <desc>A cartoon anteater with a bushy tail pedals a unicycle across a grassy field,
        juggling three bottles while a curious ant loops near its snout.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7EC8F5"/>
      <stop offset="60%" stop-color="#BDE5FA"/>
      <stop offset="100%" stop-color="#E8F8EF"/>
    </linearGradient>

    <g id="tuft" stroke="#4C9A3A" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0,0 C-1,-8 -6,-10 -8,-16"/>
      <path d="M0,0 C0,-10 0,-14 0,-18"/>
      <path d="M0,0 C1,-8 6,-10 8,-16"/>
    </g>

    <g id="flower">
      <circle cx="0" cy="-4" r="2.4" fill="#FFFFFF"/>
      <circle cx="3.8" cy="-1.2" r="2.4" fill="#FFFFFF"/>
      <circle cx="2.4" cy="2.8" r="2.4" fill="#FFFFFF"/>
      <circle cx="-2.4" cy="2.8" r="2.4" fill="#FFFFFF"/>
      <circle cx="-3.8" cy="-1.2" r="2.4" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="2.2" fill="#FFC107"/>
    </g>

    <g id="cloud" fill="#FFFFFF" opacity="0.92">
      <ellipse cx="0" cy="0" rx="36" ry="20"/>
      <ellipse cx="30" cy="-6" rx="26" ry="16"/>
      <ellipse cx="-30" cy="-4" rx="24" ry="14"/>
      <ellipse cx="4" cy="-16" rx="22" ry="14"/>
    </g>

    <g id="ant">
      <ellipse cx="-7" cy="0" rx="4" ry="3" fill="#3A2A1E"/>
      <ellipse cx="0" cy="0" rx="3.4" ry="2.8" fill="#3A2A1E"/>
      <ellipse cx="6" cy="-1" rx="3" ry="2.6" fill="#3A2A1E"/>
      <path d="M-2,2 L-4,7 M2,2 L4,7 M-9,2 L-11,6 M8,1 L11,5 M8,-3 L11,-7 M7,-3 L9,-8"
            stroke="#3A2A1E" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    </g>
  </defs>

  <!-- ======================= SKY ======================= -->
  <rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>

  <!-- Sun with slowly rotating rays -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 110 100" to="360 110 100"
                        dur="45s" repeatCount="indefinite"/>
      <g stroke="#FFB300" stroke-width="5" stroke-linecap="round">
        <line x1="158" y1="100" x2="172" y2="100"/>
        <line x1="62"  y1="100" x2="48"  y2="100"/>
        <line x1="110" y1="52"  x2="110" y2="38"/>
        <line x1="110" y1="148" x2="110" y2="162"/>
        <line x1="144" y1="66"  x2="154" y2="56"/>
        <line x1="76"  y1="66"  x2="66"  y2="56"/>
        <line x1="144" y1="134" x2="154" y2="144"/>
        <line x1="76"  y1="134" x2="66"  y2="144"/>
      </g>
    </g>
    <circle cx="110" cy="100" r="38" fill="#FFD54F" stroke="#FFB300" stroke-width="3"/>
  </g>

  <!-- Drifting clouds -->
  <g transform="translate(600,95)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;-60 0;0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="34s" repeatCount="indefinite"/>
      <use xlink:href="#cloud"/>
    </g>
  </g>
  <g transform="translate(320,55) scale(0.7)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;-90 0;0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="26s" repeatCount="indefinite"/>
      <use xlink:href="#cloud"/>
    </g>
  </g>
  <g transform="translate(730,160) scale(0.55)">
    <g>
      <animateTransform attributeName="transform" type="translate"
                        values="0 0;-70 0;0 0" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="20s" repeatCount="indefinite"/>
      <use xlink:href="#cloud"/>
    </g>
  </g>

  <!-- Distant hills -->
  <ellipse cx="140" cy="560" rx="280" ry="70" fill="#A9DB7F"/>
  <ellipse cx="640" cy="575" rx="330" ry="85" fill="#93CF6C"/>

  <!-- ======================= GROUND ======================= -->
  <rect x="0" y="516" width="800" height="84" fill="#7EC850"/>
  <line x1="0" y1="516" x2="800" y2="516" stroke="#5FA03C" stroke-width="3"/>

  <!-- Scrolling grass, flowers and pebbles (gives sense of forward motion) -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      from="0 0" to="-800 0" dur="3.3s" repeatCount="indefinite"/>
    <use xlink:href="#tuft"   transform="translate(70,530)"/>
    <use xlink:href="#tuft"   transform="translate(185,522) scale(0.8)"/>
    <use xlink:href="#tuft"   transform="translate(305,536) scale(1.1)"/>
    <use xlink:href="#tuft"   transform="translate(425,521) scale(0.9)"/>
    <use xlink:href="#tuft"   transform="translate(545,532)"/>
    <use xlink:href="#tuft"   transform="translate(665,524) scale(0.85)"/>
    <use xlink:href="#tuft"   transform="translate(760,538) scale(1.05)"/>
    <use xlink:href="#flower" transform="translate(130,548)"/>
    <use xlink:href="#flower" transform="translate(350,556)"/>
    <use xlink:href="#flower" transform="translate(610,549) scale(0.9)"/>
    <use xlink:href="#flower" transform="translate(715,558) scale(1.1)"/>
    <ellipse cx="250" cy="556" rx="7" ry="3.5" fill="#9CCB79"/>
    <ellipse cx="480" cy="551" rx="6" ry="3"   fill="#9CCB79"/>
    <!-- duplicate set for a seamless loop -->
    <use xlink:href="#tuft"   transform="translate(870,530)"/>
    <use xlink:href="#tuft"   transform="translate(985,522) scale(0.8)"/>
    <use xlink:href="#tuft"   transform="translate(1105,536) scale(1.1)"/>
    <use xlink:href="#tuft"   transform="translate(1225,521) scale(0.9)"/>
    <use xlink:href="#tuft"   transform="translate(1345,532)"/>
    <use xlink:href="#tuft"   transform="translate(1465,524) scale(0.85)"/>
    <use xlink:href="#tuft"   transform="translate(1560,538) scale(1.05)"/>
    <use xlink:href="#flower" transform="translate(930,548)"/>
    <use xlink:href="#flower" transform="translate(1150,556)"/>
    <use xlink:href="#flower" transform="translate(1410,549) scale(0.9)"/>
    <use xlink:href="#flower" transform="translate(1515,558) scale(1.1)"/>
    <ellipse cx="1050" cy="556" rx="7" ry="3.5" fill="#9CCB79"/>
    <ellipse cx="1280" cy="551" rx="6" ry="3"   fill="#9CCB79"/>
  </g>

  <!-- Shadow under the unicycle -->
  <ellipse cx="400" cy="523" rx="88" ry="7" fill="#000000" opacity="0.15">
    <animate attributeName="rx" values="88;78;88" keyTimes="0;0.5;1"
             calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
             dur="1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ======================= RIDER (bobs and sways) ======================= -->
  <g>
    <!-- gentle balance sway, additive with the bob -->
    <animateTransform attributeName="transform" type="rotate" additive="sum"
                      values="0 400 480;1.6 400 480;0 400 480;-1.6 400 480;0 400 480"
                      keyTimes="0;0.25;0.5;0.75;1"
                      calcMode="spline"
                      keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                      dur="2.4s" repeatCount="indefinite"/>
    <!-- pedalling bounce -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -6;0 0" keyTimes="0;0.5;1"
                      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
                      dur="1s" repeatCount="indefinite"/>

    <!-- ============ UNICYCLE ============ -->
    <!-- tire -->
    <circle cx="400" cy="440" r="70" fill="none" stroke="#2F2F2F" stroke-width="13"/>
    <!-- rim disc -->
    <circle cx="400" cy="440" r="59" fill="#F4F4F4" stroke="#7A7A7A" stroke-width="3"/>
    <!-- spinning spokes + marker -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 400 440" to="360 400 440" dur="2s" repeatCount="indefinite"/>
      <g stroke="#666666" stroke-width="4" stroke-linecap="round">
        <line x1="344" y1="440" x2="456" y2="440"/>
        <line x1="360" y1="400" x2="440" y2="480"/>
        <line x1="400" y1="384" x2="400" y2="496"/>
        <line x1="360" y1="480" x2="440" y2="400"/>
      </g>
      <circle cx="443" cy="415" r="4.5" fill="#E53935"/>
    </g>
    <!-- fork + seat post -->
    <g stroke="#D64545" stroke-linecap="round">
      <line x1="400" y1="342" x2="387" y2="434" stroke-width="7"/>
      <line x1="400" y1="342" x2="413" y2="434" stroke-width="7"/>
      <line x1="400" y1="440" x2="400" y2="336" stroke-width="9"/>
    </g>
    <!-- cranks + pedals -->
    <g stroke="#444444" stroke-width="6" stroke-linecap="round">
      <line x1="400" y1="440" x2="429" y2="423"/>
      <line x1="400" y1="440" x2="371" y2="457"/>
    </g>
    <rect x="416" y="418" width="26" height="10" rx="3" fill="#222222"/>
    <rect x="358" y="452" width="26" height="10" rx="3" fill="#222222"/>
    <!-- hub -->
    <circle cx="400" cy="440" r="9" fill="#444444" stroke="#222222" stroke-width="2"/>
    <!-- seat -->
    <rect x="372" y="332" width="56" height="12" rx="6" fill="#4A2F1B" stroke="#33241A" stroke-width="1.5"/>

    <!-- ============ ANTEATER ============ -->
    <!-- bushy tail (wagging) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 350 325;6 350 325;0 350 325;-5 350 325;0 350 325"
                        keyTimes="0;0.25;0.5;0.75;1"
                        calcMode="spline"
                        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="1.4s" repeatCount="indefinite"/>
      <path d="M352,308
               C330,290 300,258 262,252
               C276,276 268,280 250,272
               C266,296 256,302 238,298
               C258,318 250,326 234,324
               C256,342 252,352 240,354
               C268,366 268,376 258,382
               C296,382 330,358 348,342 Z"
            fill="#B08050" stroke="#8A5A32" stroke-width="3" stroke-linejoin="round"/>
      <path d="M338,318 C310,300 288,282 268,272"
            fill="none" stroke="#D9B48A" stroke-width="6" stroke-linecap="round"/>
    </g>

    <!-- far arm (tossing) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="5 449 284;0 449 284;-8 449 284;0 449 284;5 449 284"
                        keyTimes="0;0.25;0.5;0.75;1"
                        calcMode="spline"
                        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="1.8s" repeatCount="indefinite"/>
      <path d="M449,284 C441,266 437,248 437,230" fill="none" stroke="#7A4E2C" stroke-width="17" stroke-linecap="round"/>
      <path d="M449,284 C441,266 437,248 437,230" fill="none" stroke="#B78A5A" stroke-width="11" stroke-linecap="round"/>
      <circle cx="437" cy="228" r="8" fill="#B78A5A" stroke="#7A4E2C" stroke-width="2.5"/>
    </g>

    <!-- far leg + foot -->
    <path d="M388,338 C374,388 370,415 371,448" fill="none" stroke="#7A4E2C" stroke-width="19" stroke-linecap="round"/>
    <path d="M388,338 C374,388 370,415 371,448" fill="none" stroke="#B78A5A" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="371" cy="451" rx="13" ry="7" fill="#B78A5A" stroke="#7A4E2C" stroke-width="2.5"/>

    <!-- body -->
    <path d="M358,318
             C350,290 368,268 400,260
             C430,252 456,256 468,272
             C476,286 470,304 456,318
             C444,330 420,334 398,334
             C380,334 364,330 358,318 Z"
          fill="#C89F6B" stroke="#8A5A32" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="406" cy="322" rx="26" ry="13" fill="#E3C79A" transform="rotate(-15 406 322)"/>

    <!-- near leg + foot -->
    <path d="M402,336 C420,362 428,392 429,414" fill="none" stroke="#8A5A32" stroke-width="19" stroke-linecap="round"/>
    <path d="M402,336 C420,362 428,392 429,414" fill="none" stroke="#C89F6B" stroke-width="13" stroke-linecap="round"/>
    <ellipse cx="429" cy="417" rx="13" ry="7" fill="#C89F6B" stroke="#8A5A32" stroke-width="2.5"/>

    <!-- ear -->
    <ellipse cx="472" cy="236" rx="8" ry="12" fill="#B08050" stroke="#8A5A32" stroke-width="2.5"
             transform="rotate(25 472 236)"/>

    <!-- head + long snout -->
    <path d="M462,252
             C472,242 488,240 498,248
             C520,260 556,282 592,304
             C598,308 598,312 590,312
             C552,310 516,296 494,286
             C484,296 470,300 462,290 Z"
          fill="#C89F6B" stroke="#8A5A32" stroke-width="3" stroke-linejoin="round"/>
    <path d="M540,278 C560,290 580,300 592,304 C598,308 598,312 590,312 C570,308 552,302 536,296 Z"
          fill="#B78A5A" opacity="0.9"/>
    <circle cx="589" cy="301" r="2.5" fill="#6B4423"/>
    <path d="M496,284 Q504,289 512,287" fill="none" stroke="#8A5A32" stroke-width="2" stroke-linecap="round"/>

    <!-- eye (with a blink) -->
    <ellipse cx="487" cy="258" rx="4.5" ry="4.5" fill="#2F2418">
      <animate attributeName="ry" values="4.5;4.5;0.4;4.5;4.5" keyTimes="0;0.42;0.5;0.58;1"
               dur="4s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="488.5" cy="256.5" r="1.4" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.42;0.5;0.58;1"
               dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- near arm (tossing) -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="0 455 284;-8 455 284;0 455 284;5 455 284;0 455 284"
                        keyTimes="0;0.25;0.5;0.75;1"
                        calcMode="spline"
                        keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
                        dur="1.8s" repeatCount="indefinite"/>
      <path d="M455,284 C470,270 482,250 490,230" fill="none" stroke="#8A5A32" stroke-width="17" stroke-linecap="round"/>
      <path d="M455,284 C470,270 482,250 490,230" fill="none" stroke="#C89F6B" stroke-width="11" stroke-linecap="round"/>
      <circle cx="491" cy="228" r="8" fill="#C89F6B" stroke="#8A5A32" stroke-width="2.5"/>
    </g>

    <!-- ============ JUGGLED BOTTLES ============ -->
    <!-- green bottle -->
    <g>
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"
                     path="M491,228 Q464,80 437,228 Q462,184 491,228"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <rect x="-8" y="-6" width="16" height="20" rx="4" fill="#43A047" stroke="#2E7D32" stroke-width="1.5"/>
        <rect x="-3.5" y="-17" width="7" height="12" rx="2" fill="#43A047" stroke="#2E7D32" stroke-width="1.5"/>
        <rect x="-4.5" y="-22" width="9" height="6" rx="2" fill="#5D4037"/>
        <rect x="-6.5" y="-1" width="13" height="8" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>
    <!-- orange bottle -->
    <g>
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="-0.6s"
                     path="M491,228 Q464,80 437,228 Q462,184 491,228"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <rect x="-8" y="-6" width="16" height="20" rx="4" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
        <rect x="-3.5" y="-17" width="7" height="12" rx="2" fill="#FB8C00" stroke="#E65100" stroke-width="1.5"/>
        <rect x="-4.5" y="-22" width="9" height="6" rx="2" fill="#5D4037"/>
        <rect x="-6.5" y="-1" width="13" height="8" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>
    <!-- blue bottle -->
    <g>
      <animateMotion dur="1.8s" repeatCount="indefinite" begin="-1.2s"
                     path="M491,228 Q464,80 437,228 Q462,184 491,228"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
        <rect x="-8" y="-6" width="16" height="20" rx="4" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
        <rect x="-3.5" y="-17" width="7" height="12" rx="2" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
        <rect x="-4.5" y="-22" width="9" height="6" rx="2" fill="#5D4037"/>
        <rect x="-6.5" y="-1" width="13" height="8" rx="1.5" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>
  </g>

  <!-- Curious ant buzzing near the snout -->
  <g>
    <animateMotion dur="4s" repeatCount="indefinite"
                   path="M660,250 C620,235 585,250 575,275 C570,290 590,300 610,295 C640,288 655,270 660,250 Z"/>
    <use xlink:href="#ant"/>
  </g>
</svg>
