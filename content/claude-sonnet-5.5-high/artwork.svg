<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Anteater on a unicycle juggling bottles</title>
  <desc>A giant anteater in a top hat pedals a unicycle along a road while juggling three bottles in a cascade.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd0ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86c96f"/>
      <stop offset="1" stop-color="#5aa24f"/>
    </linearGradient>
    <pattern id="marks" width="125.66" height="70" patternUnits="userSpaceOnUse">
      <rect x="10" y="14" width="36" height="5" rx="2.5" fill="#fff" opacity=".55"/>
      <rect x="72" y="40" width="22" height="4" rx="2" fill="#3f7f3a" opacity=".5"/>
      <rect x="40" y="58" width="14" height="3" rx="1.5" fill="#fff" opacity=".35"/>
    </pattern>
    <clipPath id="torsoClip">
      <path d="M380,292 C368,325 368,360 384,388 L424,388 C442,360 446,322 430,288 C416,278 392,280 380,292 Z"/>
    </clipPath>
    <g id="bottle">
      <rect x="-7" y="-4" width="14" height="24" rx="4" fill="currentColor"/>
      <rect x="-3" y="-17" width="6" height="15" rx="2" fill="currentColor"/>
      <rect x="-3.5" y="-21" width="7" height="4" rx="1" fill="#e6b422"/>
      <rect x="-7" y="4" width="14" height="8" fill="#f6efd9" opacity=".9"/>
      <rect x="-4.5" y="-2" width="2" height="18" rx="1" fill="#fff" opacity=".45"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="690" cy="95" r="38" fill="#ffe27a">
    <animate attributeName="r" values="38;41;38" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g fill="#fff" opacity=".9">
    <g>
      <ellipse cx="0" cy="90" rx="46" ry="16"/>
      <ellipse cx="-20" cy="80" rx="24" ry="14"/>
      <ellipse cx="18" cy="78" rx="28" ry="16"/>
      <animateTransform attributeName="transform" type="translate" values="-120 0;920 0" dur="55s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="160" rx="38" ry="12"/>
      <ellipse cx="-14" cy="152" rx="20" ry="11"/>
      <ellipse cx="14" cy="151" rx="22" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="-120 0;920 0" dur="75s" begin="-40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- hills -->
  <path d="M0,520 C80,450 160,440 260,490 C340,450 440,430 540,485 C620,445 720,450 800,500 L800,540 L0,540 Z" fill="#a9dba0"/>

  <!-- ground -->
  <rect x="0" y="530" width="800" height="70" fill="url(#grass)"/>
  <rect x="0" y="530" width="1000" height="70" fill="url(#marks)">
    <animateTransform attributeName="transform" type="translate" values="0 0;-125.66 0" dur="0.75s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="528" width="800" height="4" fill="#4a8f45"/>

  <!-- shadow -->
  <ellipse cx="400" cy="534" rx="72" ry="6" fill="#000" opacity=".22"/>

  <!-- wheel -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 400 450;360 400 450" dur="3s" repeatCount="indefinite"/>
    <circle cx="400" cy="450" r="76" fill="none" stroke="#2b2b2b" stroke-width="9"/>
    <circle cx="400" cy="450" r="76" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="6 10" opacity=".18"/>
    <circle cx="400" cy="450" r="70" fill="none" stroke="#9aa5ad" stroke-width="2"/>
    <g stroke="#c4ccd2" stroke-width="1.5">
      <line x1="400" y1="450" x2="400" y2="380"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(30 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(60 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(90 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(120 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(150 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(180 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(210 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(240 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(270 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(300 400 450)"/>
      <line x1="400" y1="450" x2="400" y2="380" transform="rotate(330 400 450)"/>
    </g>
    <circle cx="400" cy="384" r="4" fill="#e04848"/>
    <line x1="374" y1="450" x2="426" y2="450" stroke="#333" stroke-width="6" stroke-linecap="round"/>
    <circle cx="374" cy="450" r="5" fill="#e8b030"/>
    <circle cx="426" cy="450" r="5" fill="#e8b030"/>
    <circle cx="400" cy="450" r="8" fill="#555"/>
  </g>

  <!-- frame post -->
  <line x1="400" y1="450" x2="400" y2="392" stroke="#444" stroke-width="6" stroke-linecap="round"/>

  <!-- far leg -->
  <path d="M400,385 L450,399.4 L426,450" fill="none" stroke="#54463a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M400,385 L426.3,429.9 L374,450;
      M400,385 L436.8,421.8 L381.6,431.6;
      M400,385 L450.1,399 L400,424;
      M400,385 L452,386.8 L418.4,431.6;
      M400,385 L450,399.4 L426,450;
      M400,385 L440.9,417.1 L418.4,468.4;
      M400,385 L429.1,428.1 L400,476;
      M400,385 L423.6,431.3 L381.6,468.4;
      M400,385 L426.3,429.9 L374,450"/>
  </path>
  <ellipse cx="379" cy="450" rx="10" ry="5" fill="#2c231b">
    <animate attributeName="cx" dur="3s" repeatCount="indefinite" values="379;386.6;405;423.4;431;423.4;405;386.6;379"/>
    <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="450;431.6;424;431.6;450;468.4;476;468.4;450"/>
  </ellipse>

  <!-- near leg -->
  <path d="M400,385 L450,399.4 L426,450" fill="none" stroke="#6e5c47" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <animate attributeName="d" dur="3s" repeatCount="indefinite" values="
      M400,385 L450,399.4 L426,450;
      M400,385 L440.9,417.1 L418.4,468.4;
      M400,385 L429.1,428.1 L400,476;
      M400,385 L423.6,431.3 L381.6,468.4;
      M400,385 L426.3,429.9 L374,450;
      M400,385 L436.8,421.8 L381.6,431.6;
      M400,385 L450.1,399 L400,424;
      M400,385 L452,386.8 L418.4,431.6;
      M400,385 L450,399.4 L426,450"/>
  </path>
  <ellipse cx="431" cy="450" rx="10" ry="5" fill="#3a2e24">
    <animate attributeName="cx" dur="3s" repeatCount="indefinite" values="431;423.4;405;386.6;379;386.6;405;423.4;431"/>
    <animate attributeName="cy" dur="3s" repeatCount="indefinite" values="450;468.4;476;468.4;450;431.6;424;431.6;450"/>
  </ellipse>

  <!-- seat -->
  <ellipse cx="402" cy="393" rx="26" ry="6" fill="#2f2f2f"/>

  <!-- upper body (sways at the hip) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 400 385;2 400 385;-2 400 385" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="2.4s" repeatCount="indefinite"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 392 375;6 392 375;-6 392 375" keyTimes="0;.5;1" calcMode="spline" keySplines=".45 0 .55 1;.45 0 .55 1" dur="1.5s" repeatCount="indefinite"/>
      <path d="M396,372 C355,392 300,370 270,310 C262,292 272,278 282,292 C305,330 350,338 400,335 Z" fill="#7a6a55"/>
      <path d="M380,360 C340,368 305,345 285,305 M385,350 C350,352 322,335 303,315" fill="none" stroke="#a8977e" stroke-width="2" stroke-linecap="round" opacity=".7"/>
      <path d="M345,345 C320,335 298,312 288,290" fill="none" stroke="#2a221c" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- far arm + hand (left) -->
    <path d="M390,314 Q370,350 355,335" fill="none" stroke="#5f503f" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" begin="-0.4s" repeatCount="indefinite" values="M390,314 Q370,350 355,335;M390,314 Q365,362 355,350;M390,314 Q370,350 355,335"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 15;0 0" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
      <g transform="translate(355 335)">
        <circle r="7" fill="#4f4132"/>
        <path d="M-4,-4 L-10,-8 M-6,0 L-13,-1 M-4,4 L-10,6" stroke="#f2ead8" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>

    <!-- torso -->
    <path d="M380,292 C368,325 368,360 384,388 L424,388 C442,360 446,322 430,288 C416,278 392,280 380,292 Z" fill="#8c7a64"/>
    <g clip-path="url(#torsoClip)" fill="none" stroke-linecap="round">
      <path d="M396,284 C418,300 432,325 440,352" stroke="#f2ead8" stroke-width="15"/>
      <path d="M396,284 C418,300 432,325 440,352" stroke="#1d1a18" stroke-width="7"/>
      <path d="M392,340 C392,360 396,376 404,388" stroke="#a8977e" stroke-width="10" opacity=".5"/>
    </g>
    <ellipse cx="408" cy="282" rx="22" ry="14" fill="#8c7a64"/>

    <!-- head -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 415 290;-3 415 290;0 415 290;3 415 290;0 415 290" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="400" cy="249" r="8" fill="#6e5d49"/>
      <circle cx="400" cy="249" r="4" fill="#3b2f25"/>
      <ellipse cx="425" cy="256" rx="26" ry="24" fill="#8c7a64"/>
      <path d="M430,236 C470,240 505,262 530,277 C534,283 528,289 520,288 C485,285 450,282 430,280 Z" fill="#9a8870"/>
      <path d="M440,282 C470,284 500,287 520,288" fill="none" stroke="#6e5d49" stroke-width="2" opacity=".6"/>
      <line x1="530" y1="283" x2="534" y2="285" stroke="#e0607a" stroke-width="3" stroke-linecap="round">
        <animate attributeName="x2" values="534;556;534;534" keyTimes="0;.15;.3;1" dur="1.6s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="285;293;285;285" keyTimes="0;.15;.3;1" dur="1.6s" repeatCount="indefinite"/>
      </line>
      <circle cx="529" cy="281" r="4.5" fill="#1d1a18"/>
      <circle cx="441" cy="253" r="6" fill="#fff"/>
      <circle cx="441" cy="253" r="3" fill="#1d1a18">
        <animateTransform attributeName="transform" type="translate" values="-1.5 -1.5;2 -2;-1.5 -1.5" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <!-- top hat -->
      <g>
        <rect x="410" y="208" width="26" height="26" rx="3" fill="#4a3a7a"/>
        <rect x="410" y="224" width="26" height="6" fill="#e04848"/>
        <ellipse cx="423" cy="234" rx="20" ry="4.5" fill="#3a2d63"/>
      </g>
    </g>

    <!-- near arm + hand (right) -->
    <path d="M428,314 Q458,350 465,335" fill="none" stroke="#7d6c58" stroke-width="11" stroke-linecap="round">
      <animate attributeName="d" dur="0.8s" repeatCount="indefinite" values="M428,314 Q458,350 465,335;M428,314 Q462,362 465,350;M428,314 Q458,350 465,335"/>
    </path>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 15;0 0" dur="0.8s" repeatCount="indefinite"/>
      <g transform="translate(465 335)">
        <circle r="7" fill="#5f503f"/>
        <path d="M4,-4 L10,-8 M6,0 L13,-1 M4,4 L10,6" stroke="#f2ead8" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- juggled bottles: x oscillates between the hands, y follows gravity-like arcs (high throw, then low throw) -->
  <g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="465 0;355 0;465 0" dur="2.4s" begin="0s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 335;0 95;0 335;0 150;0 335" keyTimes="0;.25;.5;.75;1" calcMode="spline" keySplines=".33 .67 .67 1;.33 0 .67 .33;.33 .67 .67 1;.33 0 .67 .33" dur="2.4s" begin="0s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;720" dur="2.4s" begin="0s" repeatCount="indefinite"/>
          <use href="#bottle" xlink:href="#bottle" color="#3fa66b"/>
        </g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="465 0;355 0;465 0" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 335;0 95;0 335;0 150;0 335" keyTimes="0;.25;.5;.75;1" calcMode="spline" keySplines=".33 .67 .67 1;.33 0 .67 .33;.33 .67 .67 1;.33 0 .67 .33" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;720" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
          <use href="#bottle" xlink:href="#bottle" color="#c77d2e"/>
        </g>
      </g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="465 0;355 0;465 0" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 335;0 95;0 335;0 150;0 335" keyTimes="0;.25;.5;.75;1" calcMode="spline" keySplines=".33 .67 .67 1;.33 0 .67 .33;.33 .67 .67 1;.33 0 .67 .33" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;720" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
          <use href="#bottle" xlink:href="#bottle" color="#4a8fd6"/>
        </g>
      </g>
    </g>
  </g>
</svg>
