<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The juggling anteater</title>
  <desc id="desc">A cheerful anteater pedals a unicycle and juggles three colorful bottles.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#fff7df"/>
      <stop offset="1" stop-color="#f3d8ad"/>
    </linearGradient>
    <linearGradient id="fur" x2="1" y2="1">
      <stop stop-color="#bc7044"/>
      <stop offset="1" stop-color="#85452f"/>
    </linearGradient>
    <linearGradient id="creamFur" x2="0" y2="1">
      <stop stop-color="#f2d7a5"/>
      <stop offset="1" stop-color="#d9aa70"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <g id="bottle">
      <path d="M-6-23h12v7c0 3 3 5 7 8 2 2 3 4 3 7v16c0 5-3 8-8 8h-16c-5 0-8-3-8-8V-1c0-3 1-5 3-7 4-3 7-5 7-8z" fill="currentColor" stroke="#613c35" stroke-width="2" stroke-linejoin="round"/>
      <path d="M-6-23h12v5H-6z" fill="#f7e5b7" stroke="#613c35" stroke-width="1.5"/>
      <path d="M-13 1h26v10h-26z" fill="#fff1cf" opacity=".96"/>
      <circle cx="0" cy="6" r="3" fill="#e4a84e"/>
      <path d="M-7-5v17" stroke="#fff" stroke-opacity=".42" stroke-width="2" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- warm little circus-stage -->
  <rect width="800" height="600" rx="28" fill="url(#sky)"/>
  <circle cx="400" cy="287" r="222" fill="#f8e9c7" opacity=".48"/>
  <path d="M82 447a318 318 0 0 1 636 0" fill="none" stroke="#dfb57f" stroke-width="3" stroke-dasharray="3 12" opacity=".7"/>
  <g fill="#c97c4b" opacity=".72">
    <path d="M135 308l7 15 16 2-12 11 3 16-14-8-14 8 3-16-12-11 16-2z"/>
    <path d="M669 294l5 11 12 2-9 8 2 12-10-6-10 6 2-12-9-8 12-2z"/>
    <circle cx="216" cy="184" r="4"/><circle cx="590" cy="173" r="4"/>
    <circle cx="620" cy="382" r="3"/><circle cx="181" cy="389" r="3"/>
  </g>
  <ellipse cx="400" cy="548" rx="139" ry="15" fill="#87553a" opacity=".15" filter="url(#softShadow)"/>
  <path d="M92 548h616" stroke="#c69663" stroke-width="3" stroke-linecap="round" opacity=".6"/>

  <!-- unicycle -->
  <g>
    <circle cx="400" cy="466" r="72" fill="#fff8e8" stroke="#394b50" stroke-width="9"/>
    <circle cx="400" cy="466" r="63" fill="none" stroke="#cf9660" stroke-width="2"/>
    <g stroke="#718184" stroke-width="3" opacity=".9">
      <path d="M400 466V397M400 466l49-49M400 466h69M400 466l49 49M400 466v69M400 466l-49 49M400 466h-69M400 466l-49-49"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 466" to="360 400 466" dur="3s" repeatCount="indefinite"/>
    </g>
    <path d="M400 466l-12-82h24z" fill="#5d6967" stroke="#394b50" stroke-width="3" stroke-linejoin="round"/>
    <path d="M377 382q23-12 46 0l-3 10h-40z" fill="#394b50" stroke="#263b40" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="400" cy="466" r="9" fill="#d88b4f" stroke="#394b50" stroke-width="3"/>
    <g stroke="#394b50" stroke-width="5" stroke-linecap="round">
      <path d="M400 466l-40-7M400 466l38 17"/>
      <path d="M353 459h14M431 483h14" stroke-width="7"/>
    </g>
  </g>

  <!-- rider bob -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="1.1s" repeatCount="indefinite"/>
    <!-- legs and little riding boots -->
    <path d="M366 337q-27 12-43 43l-11 43q-2 10 8 13l13 3q10 2 13-8l14-37 39-26z" fill="#754337" stroke="#60382f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M416 334q30 18 39 47l-8 37-28 30q-8 8-17 1l-8-7q-8-7 0-15l26-25-9-29-31-14z" fill="#8b4d36" stroke="#60382f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M314 426l23 5-2 14q-17 8-35-4l1-8q2-6 13-7z" fill="#35494d" stroke="#293b3f" stroke-width="3"/>
    <path d="M401 438l19 13-10 12q-19 0-27-16l5-7q5-5 13-2z" fill="#35494d" stroke="#293b3f" stroke-width="3"/>

    <!-- body -->
    <path d="M359 251q29-19 61 3 24 17 27 54l-12 65q-29 20-70 0l-25-47q-7-49 19-75z" fill="url(#fur)" stroke="#70402f" stroke-width="4"/>
    <path d="M379 274q27-14 43 8 14 20 8 61l-8 28q-17 10-42 4 17-30 5-55-8-17-6-46z" fill="url(#creamFur)" opacity=".95"/>
    <path d="M375 283q-8 27 5 45" fill="none" stroke="#f4dbb2" stroke-width="4" stroke-linecap="round" opacity=".7"/>

    <!-- arms reaching to the toss -->
    <path d="M360 274q-24-4-34-29l-22-34q-5-8 2-14l8-6q8-5 14 3l28 34 24 9z" fill="url(#fur)" stroke="#70402f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M429 274q24-8 35-32l20-35q5-9-2-15l-8-5q-8-5-14 3l-27 35-22 12z" fill="url(#fur)" stroke="#70402f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M304 205q-9-2-15 5l-7 9q-4 6 2 10l12 7q8 4 13-3l6-10z" fill="#d18b59" stroke="#70402f" stroke-width="3"/>
    <path d="M490 204q9-3 15 4l8 9q4 6-2 10l-12 8q-8 4-13-3l-6-10z" fill="#d18b59" stroke="#70402f" stroke-width="3"/>

    <!-- head, long tapering anteater muzzle -->
    <path d="M333 190q15-24 43-18 23 5 28 27 4 17-9 34-16 19-45 8l-14-10z" fill="url(#fur)" stroke="#70402f" stroke-width="4"/>
    <path d="M349 211q-33 2-72 20-20 9-47 11-9 1-11-7-2-7 7-11 39-17 77-35 18-9 37-7z" fill="url(#creamFur)" stroke="#70402f" stroke-width="4" stroke-linejoin="round"/>
    <path d="M226 234q-6 5-7 11 12 3 22-4z" fill="#302f35"/>
    <path d="M257 230q39-16 68-20" fill="none" stroke="#fff0ce" stroke-width="4" stroke-linecap="round" opacity=".6"/>
    <path d="M369 187q13-9 22 3-4 12-15 10-10-2-7-13z" fill="#d99561" stroke="#70402f" stroke-width="3"/>
    <circle cx="362" cy="192" r="4.5" fill="#262f34"/>
    <circle cx="360.5" cy="190.5" r="1.4" fill="#fff5dc"/>
    <path d="M332 183q-9-20 6-24 14-3 16 15" fill="#a95e3d" stroke="#70402f" stroke-width="4"/>
    <path d="M336 174q5-7 12 0" fill="none" stroke="#e5b27d" stroke-width="3" stroke-linecap="round"/>
    <path d="M350 173l-6-14 12 10 3-16 7 18 11-10-2 18" fill="#8b4d36" stroke="#70402f" stroke-width="3" stroke-linejoin="round"/>
    <path d="M344 228q12 8 27 5" fill="none" stroke="#6b3b30" stroke-width="2" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- three bottles loop through a cascading toss -->
  <g>
    <g color="#4e9b83">
      <use href="#bottle"/>
      <animateMotion dur="2.7s" repeatCount="indefinite" path="M300 218 C326 143 364 105 400 105 C442 105 477 151 500 218 C476 283 333 283 300 218"/>
      <animateTransform attributeName="transform" type="rotate" values="-18;16;-18" dur="1.35s" repeatCount="indefinite"/>
    </g>
    <g color="#e89b42">
      <use href="#bottle"/>
      <animateMotion begin="-0.9s" dur="2.7s" repeatCount="indefinite" path="M300 218 C326 143 364 105 400 105 C442 105 477 151 500 218 C476 283 333 283 300 218"/>
      <animateTransform attributeName="transform" type="rotate" values="16;-18;16" dur="1.35s" repeatCount="indefinite"/>
    </g>
    <g color="#d56c58">
      <use href="#bottle"/>
      <animateMotion begin="-1.8s" dur="2.7s" repeatCount="indefinite" path="M300 218 C326 143 364 105 400 105 C442 105 477 151 500 218 C476 283 333 283 300 218"/>
      <animateTransform attributeName="transform" type="rotate" values="-18;16;-18" dur="1.35s" repeatCount="indefinite"/>
    </g>
  </g>

  <text x="400" y="578" text-anchor="middle" fill="#87553a" font-family="Georgia,serif" font-size="14" letter-spacing="3" opacity=".8">THE AMAZING ANT-EATER</text>
</svg>
