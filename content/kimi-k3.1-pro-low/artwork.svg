<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 720" role="img" aria-labelledby="title desc">
  <title id="title">The Amazing Anteater's Bottle-Balancing Unicycle Act</title>
  <desc id="desc">A cheerful anteater rides a unicycle across a sunset stage, pedaling while juggling three colorful glass bottles.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18243f"/>
      <stop offset=".5" stop-color="#694b72"/>
      <stop offset="1" stop-color="#f3a56f"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe9ae" stop-opacity=".65"/>
      <stop offset="1" stop-color="#ffdca0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#263c45"/>
      <stop offset="1" stop-color="#101f2a"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c9a27b"/>
      <stop offset=".48" stop-color="#a77b59"/>
      <stop offset="1" stop-color="#77533f"/>
    </linearGradient>
    <linearGradient id="tailFur" x1="0" y1="0" x2="1" y2=".5">
      <stop stop-color="#6e4b3a"/>
      <stop offset=".45" stop-color="#a97b54"/>
      <stop offset="1" stop-color="#d0aa78"/>
    </linearGradient>
    <linearGradient id="snout" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d6b58e"/>
      <stop offset="1" stop-color="#9e7559"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7792a4"/>
      <stop offset=".45" stop-color="#e7f1ed"/>
      <stop offset=".7" stop-color="#8aa0aa"/>
      <stop offset="1" stop-color="#455d6d"/>
    </linearGradient>
    <linearGradient id="bottleMint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#174e54"/>
      <stop offset=".3" stop-color="#57c4ae"/>
      <stop offset=".55" stop-color="#b4f0cd"/>
      <stop offset="1" stop-color="#237578"/>
    </linearGradient>
    <linearGradient id="bottleAmber" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#793d26"/>
      <stop offset=".35" stop-color="#dc8d43"/>
      <stop offset=".6" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#a6542f"/>
    </linearGradient>
    <linearGradient id="bottleBlue" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#28366f"/>
      <stop offset=".35" stop-color="#637bc6"/>
      <stop offset=".6" stop-color="#c0d2ff"/>
      <stop offset="1" stop-color="#3d4d99"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="smallShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0b1720" flood-opacity=".35"/>
    </filter>
    <clipPath id="groundClip"><rect x="0" y="565" width="960" height="155"/></clipPath>

    <g id="bottleShape">
      <path d="M-7-38h14v12c0 5 10 9 11 18l3 35c1 9-5 14-13 14h-16c-8 0-14-5-13-14l3-35c1-9 11-13 11-18z" fill="currentColor" stroke="#142f38" stroke-width="2.5"/>
      <path d="M-7-38h14v7H-7z" fill="#e8d6a3" stroke="#443e39" stroke-width="2"/>
      <path d="M-13-5q15 5 28 0l1 21q-15 5-30 0z" fill="#fff2cf" opacity=".94"/>
      <path d="M-8 2h16M-6 8h12" stroke="#9e684c" stroke-width="2" stroke-linecap="round"/>
      <path d="M-9-20q-5 5-5 15" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    </g>
  </defs>

  <style>
    .rider { animation: bob 1.15s ease-in-out infinite; }
    .wheel-spin { transform-origin: 480px 557px; animation: spin 1.6s linear infinite; }
    .pedal-spin { transform-origin: 480px 557px; animation: spin 1.6s linear infinite; }
    .tail { transform-origin: 550px 406px; animation: tailwave 2.3s ease-in-out infinite; }
    .ear { transform-origin: 448px 285px; animation: earflick 3.2s ease-in-out infinite; }
    .left-arm { transform-origin: 429px 358px; animation: leftcatch 1.5s ease-in-out infinite; }
    .right-arm { transform-origin: 514px 357px; animation: rightcatch 1.5s ease-in-out infinite; }
    .leg-a { transform-origin: 464px 425px; animation: legA 1.6s ease-in-out infinite; }
    .leg-b { transform-origin: 497px 425px; animation: legB 1.6s ease-in-out infinite; }
    .bottle-spin-a { animation: bottleA 3s linear infinite; }
    .bottle-spin-b { animation: bottleB 3s linear infinite; }
    .bottle-spin-c { animation: bottleC 3s linear infinite; }
    .spark { animation: twinkle 2.4s ease-in-out infinite; }
    .spark:nth-of-type(2n) { animation-delay: -1.2s; }
    .wheel-shadow { transform-origin: 480px 653px; animation: shadowpulse 1.15s ease-in-out infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes tailwave { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(5deg); } }
    @keyframes earflick { 0%,80%,100% { transform: rotate(0); } 88% { transform: rotate(-13deg); } 94% { transform: rotate(6deg); } }
    @keyframes leftcatch { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
    @keyframes rightcatch { 0%,100% { transform: rotate(5deg); } 50% { transform: rotate(-4deg); } }
    @keyframes legA { 0%,100% { transform: rotate(7deg); } 50% { transform: rotate(-7deg); } }
    @keyframes legB { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
    @keyframes bottleA { from { transform: rotate(0); } to { transform: rotate(720deg); } }
    @keyframes bottleB { from { transform: rotate(120deg); } to { transform: rotate(840deg); } }
    @keyframes bottleC { from { transform: rotate(240deg); } to { transform: rotate(960deg); } }
    @keyframes twinkle { 0%,100% { opacity:.2; } 50% { opacity:1; } }
    @keyframes shadowpulse { 0%,100% { transform: scaleX(1); opacity:.42; } 50% { transform: scaleX(.94); opacity:.3; } }
    @media (prefers-reduced-motion: reduce) {
      .rider,.wheel-spin,.pedal-spin,.tail,.ear,.left-arm,.right-arm,.leg-a,.leg-b,
      .bottle-spin-a,.bottle-spin-b,.bottle-spin-c,.spark,.wheel-shadow { animation-play-state: paused; }
    }
  </style>

  <!-- Sunset big-top backdrop -->
  <rect width="960" height="720" fill="url(#sky)"/>
  <circle cx="745" cy="185" r="170" fill="url(#sunGlow)"/>
  <circle cx="745" cy="185" r="62" fill="#ffd79a" opacity=".88"/>
  <path d="M0 390Q120 275 240 390T480 390T720 390T960 390V590H0Z" fill="#263a49" opacity=".38"/>
  <path d="M0 458Q120 358 240 458T480 458T720 458T960 458V590H0Z" fill="#203640" opacity=".65"/>

  <g fill="#ffe7b0">
    <path class="spark" d="M120 135l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
    <path class="spark" d="M823 92l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <path class="spark" d="M208 245l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <circle class="spark" cx="319" cy="104" r="3"/>
    <circle class="spark" cx="645" cy="76" r="3"/>
    <circle class="spark" cx="882" cy="258" r="3"/>
    <circle class="spark" cx="71" cy="292" r="3"/>
  </g>

  <!-- Bunting -->
  <path d="M-20 60Q240 145 480 66T980 75" fill="none" stroke="#f8dcae" stroke-width="3" opacity=".7"/>
  <g opacity=".9">
    <path d="M75 84l37 10-27 31z" fill="#e97864"/>
    <path d="M171 105l37 5-23 32z" fill="#efc36c"/>
    <path d="M276 107l37-3-14 35z" fill="#6bb9a7"/>
    <path d="M383 91l37-9-9 37z" fill="#e97864"/>
    <path d="M493 64l37 2-18 32z" fill="#efc36c"/>
    <path d="M601 64l37 7-23 29z" fill="#6bb9a7"/>
    <path d="M710 77l37 9-26 28z" fill="#e97864"/>
    <path d="M820 82l37 3-20 31z" fill="#efc36c"/>
  </g>

  <rect y="565" width="960" height="155" fill="url(#ground)"/>
  <path d="M0 565H960" stroke="#efbc7c" stroke-width="4" opacity=".5"/>
  <g clip-path="url(#groundClip)" stroke="#81a295" stroke-width="2" opacity=".12">
    <path d="M0 625H960M0 684H960M110 565L30 720M280 565L240 720M480 565V720M680 565L720 720M850 565L930 720"/>
  </g>
  <ellipse class="wheel-shadow" cx="480" cy="654" rx="122" ry="17" fill="#07131c" filter="url(#softShadow)"/>

  <!-- Motion accent lines -->
  <g fill="none" stroke="#f8dcae" stroke-linecap="round" opacity=".42">
    <path d="M292 526h-63" stroke-width="5"/>
    <path d="M279 546h-92" stroke-width="3"/>
    <path d="M294 568h-48" stroke-width="4"/>
  </g>

  <!-- Unicycle -->
  <g filter="url(#smallShadow)">
    <g class="wheel-spin">
      <circle cx="480" cy="557" r="91" fill="#13222b" stroke="#0a151d" stroke-width="7"/>
      <circle cx="480" cy="557" r="78" fill="#243943" stroke="#d6ddd4" stroke-width="5"/>
      <circle cx="480" cy="557" r="72" fill="#1a3039"/>
      <g stroke="#9db4b5" stroke-width="2.2" opacity=".85">
        <path d="M480 485V629M408 557H552M429 506L531 608M429 608L531 506M458 489L502 625M412 535L548 579M412 579L548 535M458 625L502 489"/>
      </g>
      <circle cx="480" cy="557" r="13" fill="#e6b65e" stroke="#182a32" stroke-width="4"/>
      <path d="M472 472h16" stroke="#f2e5c6" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M480 557L464 448M480 557L496 448" fill="none" stroke="#263e48" stroke-width="13" stroke-linecap="round"/>
    <path d="M480 557L464 448M480 557L496 448" fill="none" stroke="url(#metal)" stroke-width="7" stroke-linecap="round"/>
    <path d="M480 468V444" stroke="#cbd6d2" stroke-width="9"/>
    <path d="M436 442q44-17 88 0l-8 17q-38 10-73 0z" fill="#d85e51" stroke="#542f35" stroke-width="4"/>
    <g class="pedal-spin">
      <path d="M450 557H510" stroke="#e5bd69" stroke-width="7" stroke-linecap="round"/>
      <path d="M437 552h27v10h-27zM496 552h27v10h-27z" fill="#192a33" stroke="#d1c8a8" stroke-width="2"/>
    </g>
  </g>

  <!-- Anteater rider -->
  <g class="rider">
    <!-- Luxurious tail behind the body -->
    <g class="tail">
      <path d="M535 390Q620 331 715 351Q670 363 735 376Q680 385 746 405Q677 407 729 442Q661 429 700 475Q625 443 628 477Q574 441 548 430Z" fill="url(#tailFur)" stroke="#49392f" stroke-width="5" stroke-linejoin="round"/>
      <path d="M567 397Q640 372 702 375M572 412Q653 403 712 418M574 426Q630 432 666 452" fill="none" stroke="#e0bd87" stroke-width="5" stroke-linecap="round" opacity=".48"/>
      <path d="M590 382l33-18M619 390l42-25M627 419l54 10M595 435l31 27" stroke="#674938" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    </g>

    <!-- Back leg -->
    <g class="leg-b">
      <path d="M496 414Q524 453 514 492L498 548" fill="none" stroke="#5f4538" stroke-width="29" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M496 414Q521 452 511 488" fill="none" stroke="#aa805d" stroke-width="20" stroke-linecap="round"/>
      <path d="M485 550q16-12 34 0l-2 12h-37z" fill="#33333a" stroke="#171d24" stroke-width="3"/>
    </g>

    <!-- Body and vest -->
    <path d="M428 344Q459 316 502 335Q544 356 550 409Q548 450 509 461Q456 464 423 427Q405 384 428 344Z" fill="url(#fur)" stroke="#4d3a32" stroke-width="5"/>
    <path d="M436 347Q466 330 495 344L516 430Q482 449 446 427Z" fill="#cf5e52" stroke="#673b3a" stroke-width="4"/>
    <path d="M462 340l12 91M442 378h59" stroke="#f5b279" stroke-width="3" opacity=".7"/>
    <circle cx="480" cy="384" r="5" fill="#f8d690"/>
    <circle cx="485" cy="408" r="5" fill="#f8d690"/>
    <path d="M455 343l17 26 15-30" fill="#fff0d0" stroke="#725647" stroke-width="3"/>

    <!-- Front pedaling leg -->
    <g class="leg-a">
      <path d="M459 418Q440 457 453 493L462 549" fill="none" stroke="#6a4b3a" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M459 418Q445 456 456 490" fill="none" stroke="#bd9169" stroke-width="22" stroke-linecap="round"/>
      <path d="M448 548q17-11 36 1l-1 13h-40z" fill="#3c3a40" stroke="#171d24" stroke-width="3"/>
      <path d="M449 555h29" stroke="#e2d7ba" stroke-width="3"/>
    </g>

    <!-- Left arm reaches to catch -->
    <g class="left-arm">
      <path d="M434 355Q393 360 370 327L339 288" fill="none" stroke="#5e4437" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M432 352Q395 354 375 324L344 285" fill="none" stroke="#ba8e68" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M337 290q-17-2-22-17m24 15q-4-18 4-25m-3 28q11-13 18-10" fill="none" stroke="#4f3c34" stroke-width="6" stroke-linecap="round"/>
      <circle cx="339" cy="288" r="12" fill="#b88a65"/>
    </g>

    <!-- Right arm reaches to catch -->
    <g class="right-arm">
      <path d="M512 355Q552 366 580 335L615 292" fill="none" stroke="#5e4437" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M514 352Q551 359 575 330L610 288" fill="none" stroke="#ba8e68" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M613 293q17-3 21-18m-23 16q4-18-4-25m5 28q-11-13-18-10" fill="none" stroke="#4f3c34" stroke-width="6" stroke-linecap="round"/>
      <circle cx="615" cy="290" r="12" fill="#b88a65"/>
    </g>

    <!-- Neck, head and unmistakable long snout -->
    <path d="M443 356Q413 339 412 313L444 278Q476 275 492 300L487 346Z" fill="url(#fur)" stroke="#4d3a32" stroke-width="5"/>
    <path d="M446 294Q412 271 382 287Q347 306 303 321L245 338Q232 344 241 356Q248 364 267 359L359 344Q406 344 442 328Z" fill="url(#snout)" stroke="#4d3a32" stroke-width="5" stroke-linejoin="round"/>
    <path d="M245 338q-16 4-13 15 4 13 24 10l14-4-5-20z" fill="#343238"/>
    <path d="M275 344Q343 323 400 313" fill="none" stroke="#edd0a8" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <path d="M396 287Q419 267 447 280Q467 297 451 322Q426 339 397 325Z" fill="#b88b64"/>
    <path d="M400 293Q418 284 434 289" stroke="#4a382f" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="411" cy="299" rx="8" ry="10" fill="#20252a"/>
    <circle cx="408" cy="296" r="2.8" fill="#fff8db"/>
    <path d="M377 332q15 10 29-1" fill="none" stroke="#66483c" stroke-width="3" stroke-linecap="round"/>
    <g class="ear">
      <path d="M438 284Q430 251 453 248Q479 252 464 285Z" fill="#a77959" stroke="#4d3a32" stroke-width="5"/>
      <path d="M445 275q-5-16 8-17 12 5 4 19z" fill="#e2a28a"/>
    </g>
    <!-- Tiny performer hat -->
    <path d="M421 269l9-39 48 8-8 39z" fill="#263a50" stroke="#152333" stroke-width="4"/>
    <path d="M426 250l48 8-3 12-48-8z" fill="#e6b65e"/>
    <path d="M406 272q38-9 78 6" fill="none" stroke="#172635" stroke-width="10" stroke-linecap="round"/>
    <circle cx="460" cy="231" r="7" fill="#e97662"/>
  </g>

  <!-- Three bottles sharing a continuous juggling circuit, evenly phase-shifted -->
  <g filter="url(#smallShadow)">
    <g>
      <animateMotion dur="3s" repeatCount="indefinite" path="M339 282 C300 120 365 84 480 102 C595 84 660 120 615 284 C570 205 395 205 339 282 Z"/>
      <g class="bottle-spin-a" style="color:#4cae9e"><use xlink:href="#bottleShape" fill="url(#bottleMint)"/></g>
    </g>
    <g>
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M339 282 C300 120 365 84 480 102 C595 84 660 120 615 284 C570 205 395 205 339 282 Z"/>
      <g class="bottle-spin-b" style="color:#d58b47"><use xlink:href="#bottleShape" fill="url(#bottleAmber)"/></g>
    </g>
    <g>
      <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" path="M339 282 C300 120 365 84 480 102 C595 84 660 120 615 284 C570 205 395 205 339 282 Z"/>
      <g class="bottle-spin-c" style="color:#687fc5"><use xlink:href="#bottleShape" fill="url(#bottleBlue)"/></g>
    </g>
  </g>

  <!-- Hand-drawn stage caption -->
  <g transform="translate(480 687)">
    <path d="M-176-17Q0-29 176-17L163 14Q0 25-163 14Z" fill="#172b34" stroke="#c49b64" stroke-width="2"/>
    <text x="0" y="5" text-anchor="middle" fill="#f5dcae" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="bold" letter-spacing="4">THE AMAZING ANTEATER</text>
  </g>
</svg>
