<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">The anteater's balancing act</title>
  <desc id="desc">Beneath a striped circus canopy, a giant anteater in a red neckerchief balances on a unicycle and tosses three glass bottles between its paws.</desc>
  <defs>
    <pattern id="awning" width="80" height="100" patternUnits="userSpaceOnUse">
      <rect width="80" height="100" fill="#f8daaa"/><rect width="40" height="100" fill="#dc6248"/>
      <path d="M4 0v100m40-100v100" stroke="#fff2c9" opacity=".28" stroke-width="3"/>
    </pattern>
    <pattern id="paper" width="7" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#fff2cc" opacity=".18"/></pattern>
    <path id="spark" d="M0-10Q1-1 7 0Q1 1 0 10Q-1 1-7 0Q-1-1 0-10" fill="#efc378"/>
    <path id="throw" d="M337 263 Q413 -66 526 263 Q514 279 502 266 Q427 -41 313 263 Q325 279 337 263Z"/>
    <g id="bottle" stroke="#172d36" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-5-26h10v15q0 4 5 8q3 3 3 8v21q0 4-4 4H-9q-4 0-4-4V5q0-5 3-8q5-4 5-8Z" fill="currentColor"/>
      <rect x="-6" y="-29" width="12" height="6" rx="2" fill="#edbf72"/>
      <path d="M-12 7h24v14h-24z" fill="#fff0c8" stroke-width="1.5"/><path d="m0 9 4 5-4 5-4-5Z" fill="#ad4e3e" stroke="none"/>
      <path d="M-8 2q0-4 4-7m-4 29v2" fill="none" stroke="#fff6d4" opacity=".85" stroke-linecap="round"/>
    </g>
    <g id="spokes" stroke="#cfad79" stroke-width="2"><path d="M-55 0H55M0-55V55m-39-94 78 78m-78 0 78-78"/></g>
    <g id="paw" fill="#493e3b" stroke="#1c2e34" stroke-width="3" stroke-linejoin="round"><path d="M-10 7q-9-6-9-16 4-4 9 4-3-15 2-15 4 0 7 12 1-14 5-13 5 2 2 14 9-10 12-5 3 6-11 18Z"/></g>
  </defs>
  <rect width="800" height="600" fill="#f6dfb4"/><rect x="18" y="18" width="764" height="564" rx="8" fill="#193744" stroke="#26343a" stroke-width="4"/>
  <path d="M31 490V34h738v456Z" fill="#234550"/>
  <g fill="#385961" opacity=".64"><path d="M130 34h113l153 495H151Z"/><path d="M575 34h90L512 529H358Z"/></g>
  <rect x="30" y="30" width="740" height="505" fill="url(#paper)"/>
  <g><use xlink:href="#spark" x="201" y="151"/><use xlink:href="#spark" x="600" y="176"/><use xlink:href="#spark" x="240" y="303"/><use xlink:href="#spark" x="654" y="306"/><use xlink:href="#spark" x="550" y="415"/><use xlink:href="#spark" x="295" y="104"/></g>
  <path d="M30 503Q400 472 770 503v64H30Z" fill="#cf9e65"/><path d="M30 519q370-30 740 0M30 546q370-25 740 0" fill="none" stroke="#aa7754" stroke-width="2"/>
  <ellipse cx="396" cy="535" rx="112" ry="7" fill="#815f4d" opacity=".48"/>
  <!-- Side drapes and scalloped canopy -->
  <g id="curtain" stroke="#723f3a" stroke-width="3" stroke-linejoin="round"><path d="M30 32h108q-5 142-79 227 23 94 21 237l-21-9-13 11-16-6Z" fill="#bc5344"/><path d="M104 49Q94 177 53 249M76 42q-3 126-28 201m2 28q15 117 12 202" fill="none"/><path d="m32 250 31-7 3 10-34 9Z" fill="#e6b96f"/></g>
  <use xlink:href="#curtain" transform="translate(800) scale(-1 1)"/>
  <path d="M30 30h740v32q-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0-37 34-74 0Z" fill="url(#awning)" stroke="#3f3736" stroke-width="3"/>
  <!-- Tire, fork, and rotating spokes -->
  <g transform="translate(409 474)"><circle r="61" fill="#21343c" stroke="#172d36" stroke-width="3"/><circle r="54" fill="#42606a" stroke="#f0c983" stroke-width="4"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="2.4s" repeatCount="indefinite"/><use xlink:href="#spokes"/><use xlink:href="#spokes" transform="rotate(22.5)"/><circle cx="48" cy="0" r="3" fill="#f5d392"/></g>
    <path d="M0 0-16-88" stroke="#172d36" stroke-width="12"/><path d="M0 0-16-88" stroke="#dfa956" stroke-width="6"/><circle r="9" fill="#e9bd79" stroke="#25343a" stroke-width="3"/>
  </g>
  <g stroke="#233039" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M368 387q14-8 31-4l20-5q10 1 5 9-21 13-50 9Z" fill="#803f37"/>
    <g><animateTransform attributeName="transform" type="rotate" values="-1 391 384;1 391 384;-1 391 384" dur="2.4s" repeatCount="indefinite"/>
      <!-- Long shaggy tail and its engraved fur lines -->
      <path d="M373 357q-32-43-84-28-34 9-71 53-27 34-65 42l19 6-22 11q34 4 65-4l-10 10q57-1 94-29l-4 11q46-21 78-55Z" fill="#8d7765"/>
      <path d="M351 351q-62-33-112 38m93-34q-54-7-93 50m74-36q-45 43-98 55m78-71q-36 9-64 48" stroke="#554e49" stroke-width="3" fill="none"/>
      <path d="M385 371q11 3 17 20l6 44 18 17-4 8-31-12-17-51Z" fill="#73655a"/>
      <!-- Pear-shaped torso, shoulder stripe, and tapered face -->
      <path d="M343 373q-13-25 8-53l38-53q16-22 40-16 20 2 26 21 11 23 62 37 12 4 10 10-3 8-19 5l-64-11q-15-2-23 20l-15 40q-10 24-38 16-17-4-25-16Z" fill="#c5a78b"/>
      <path d="M349 344q36-15 60-69l17 10q-12 53-75 72Z" fill="#f5dfb7" stroke="none"/><path d="M349 352q43-12 69-74l10 12q-18 59-77 72Z" fill="#353d40" stroke="none"/>
      <path d="M394 263q-11-4-9-15 2-12 13-8 10 5 5 17" fill="#b99b83"/><path d="M392 251q-1-8 5-4" fill="none" stroke="#765c50"/>
      <circle cx="437" cy="274" r="4" fill="#172930" stroke="none"/><circle cx="438" cy="273" r="1.2" fill="white" stroke="none"/><path d="M430 265q5-6 11-3" fill="none" stroke-width="2"/>
      <path d="M516 309q17 3 11 11-10 7-14-2Z" fill="#25333a"/><path d="M485 314q15 7 27 5" fill="none" stroke-width="1.8"/>
      <path d="M389 269q7 14 27 17l-6 11q-20-4-30-16Z" fill="#df6246"/><path d="M383 276q-17-13-32-4l13 6-16 9q22 3 36-5Z" fill="#df6246"/>
      <path d="M405 303q25 31 43 21l59-42 9 10q-36 44-65 53-32 8-58-22" fill="#ab907a"/><use xlink:href="#paw" transform="translate(516 285) rotate(21)"/>
      <path d="M388 314q-20 8-34-5l-25-30-11 5q5 28 29 50 21 16 44 1" fill="#cfb197"/><use xlink:href="#paw" transform="translate(322 284) rotate(-21)"/>
      <path d="M369 361q20-4 28 14l25 25q9 11 2 27l-14 37q10 7 7 13l-32 2q-7-5-3-13l15-45-34-30q-12-12-6-22" fill="#bda087"/>
      <path d="m384 466 23-3q5 4 13 5 8 4 3 10l-35 4q-11-4-4-16Z" fill="#4b4340"/>
    </g>
    <path d="m409 474-12 10m-16 0h32" stroke-width="6"/>
  </g>
  <!-- Offset each bottle by one third of the cycle. -->
  <g color="#78beb0"><animateMotion dur="3.6s" begin="-.32s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#throw"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3.6s" begin="-.32s" repeatCount="indefinite"/><use xlink:href="#bottle"/></g></g>
  <g color="#efaf56"><animateMotion dur="3.6s" begin="-1.52s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#throw"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3.6s" begin="-1.52s" repeatCount="indefinite"/><use xlink:href="#bottle"/></g></g>
  <g color="#e17c65"><animateMotion dur="3.6s" begin="-2.72s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#throw"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3.6s" begin="-2.72s" repeatCount="indefinite"/><use xlink:href="#bottle"/></g></g>
  <rect x="29" y="29" width="742" height="539" rx="2" fill="none" stroke="#deb272" stroke-width="3"/>
</svg>
