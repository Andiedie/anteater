<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A cheerful animated anteater balances on a spinning unicycle and tosses three colorful bottles in an endless loop.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171746"/>
      <stop offset="0.62" stop-color="#354a86"/>
      <stop offset="1" stop-color="#f19a72"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff7c2" stop-opacity=".75"/>
      <stop offset=".55" stop-color="#ffd884" stop-opacity=".2"/>
      <stop offset="1" stop-color="#ffd884" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wheelMetal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#eef7ff"/>
      <stop offset=".5" stop-color="#8ea8c6"/>
      <stop offset="1" stop-color="#405b83"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#704b3b"/>
      <stop offset=".6" stop-color="#3d2931"/>
      <stop offset="1" stop-color="#261d2b"/>
    </linearGradient>
    <linearGradient id="furLight" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#e8c39b"/>
      <stop offset="1" stop-color="#b8765d"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffef93"/>
      <stop offset=".45" stop-color="#ffba62"/>
      <stop offset="1" stop-color="#df5d61"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="7" result="blur"/>
      <feOffset dy="7"/>
      <feComponentTransfer><feFuncA type="linear" slope=".35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- A bottle is drawn around its center so the juggling paths stay simple. -->
    <g id="bottle" filter="url(#softShadow)">
      <path d="M-7-43h14v10c0 5 11 9 14 17l2 20c1 9-5 15-23 15S-24 13-23 4l2-20c1-8 14-12 14-17z" fill="url(#bottleGlass)" stroke="#542d49" stroke-width="3"/>
      <path d="M-7-43h14v9H-7z" fill="#f8f1dc" stroke="#542d49" stroke-width="3"/>
      <path d="M-17-3h34v17h-34z" fill="#6ac7b4" stroke="#542d49" stroke-width="2"/>
      <path d="M-10 1h20" stroke="#f7f4d1" stroke-width="3" stroke-linecap="round"/>
      <path d="M-11-28c3-5 5-7 7-8" fill="none" stroke="#fff8d8" stroke-width="3" stroke-linecap="round" opacity=".75"/>
    </g>
  </defs>

  <!-- Evening circus backdrop -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="610" cy="375" rx="445" ry="370" fill="url(#halo)" filter="url(#blur)"/>
  <g fill="#fff3bd" opacity=".8">
    <circle cx="120" cy="112" r="3"/><circle cx="224" cy="202" r="4"/><circle cx="330" cy="88" r="2.5"/>
    <circle cx="955" cy="132" r="3"/><circle cx="1080" cy="246" r="4"/><circle cx="1020" cy="82" r="2.5"/>
    <circle cx="88" cy="328" r="2"/><circle cx="1145" cy="375" r="2.5"/>
  </g>
  <g fill="none" stroke="#ffe7a3" stroke-width="4" stroke-linecap="round" opacity=".72">
    <path d="M175 138v22m-11-11h22"/><path d="M1010 300v28m-14-14h28"/>
    <path d="M290 272v18m-9-9h18"/><path d="M1100 152v18m-9-9h18"/>
  </g>
  <path d="M0 648 Q170 620 320 648T640 648T960 648T1200 645V800H0Z" fill="#20234c" opacity=".68"/>
  <path d="M0 680 Q200 651 400 678T800 676T1200 670V800H0Z" fill="#161b3b"/>
  <ellipse cx="600" cy="692" rx="260" ry="25" fill="#090d27" opacity=".6" filter="url(#blur)"/>

  <!-- Juggling bottles: the same looping arc, phase-shifted into a cascade. -->
  <g aria-label="three juggling bottles">
    <g>
      <use xlink:href="#bottle" href="#bottle"/>
      <animateTransform attributeName="transform" type="translate" dur="3.6s" repeatCount="indefinite" values="455 215;500 132;585 70;675 132;760 225;675 132;585 70;500 132;455 215" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" dur="3.6s" repeatCount="indefinite" values="-12;8;-4;10;-8;10;-4;8;-12"/>
    </g>
    <g>
      <use xlink:href="#bottle" href="#bottle"/>
      <animateTransform attributeName="transform" type="translate" begin="-1.2s" dur="3.6s" repeatCount="indefinite" values="455 215;500 132;585 70;675 132;760 225;675 132;585 70;500 132;455 215" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" begin="-1.2s" dur="3.6s" repeatCount="indefinite" values="-12;8;-4;10;-8;10;-4;8;-12"/>
    </g>
    <g>
      <use xlink:href="#bottle" href="#bottle"/>
      <animateTransform attributeName="transform" type="translate" begin="-2.4s" dur="3.6s" repeatCount="indefinite" values="455 215;500 132;585 70;675 132;760 225;675 132;585 70;500 132;455 215" keyTimes="0;.125;.25;.375;.5;.625;.75;.875;1"/>
      <animateTransform attributeName="transform" type="rotate" additive="sum" begin="-2.4s" dur="3.6s" repeatCount="indefinite" values="-12;8;-4;10;-8;10;-4;8;-12"/>
    </g>
  </g>

  <!-- Unicycle -->
  <g aria-label="unicycle" filter="url(#softShadow)">
    <g>
      <circle cx="600" cy="600" r="91" fill="#11182f" stroke="#d6e8ef" stroke-width="9"/>
      <circle cx="600" cy="600" r="72" fill="none" stroke="#324467" stroke-width="3"/>
      <g stroke="url(#wheelMetal)" stroke-width="4" opacity=".9">
        <path d="M600 600L600 516M600 600L659 540M600 600L684 600M600 600L660 660M600 600L600 684M600 600L540 660M600 600L516 600M600 600L540 540"/>
      </g>
      <circle cx="600" cy="600" r="13" fill="#f7cb68" stroke="#542d49" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 600 600" to="360 600 600" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <path d="M600 515V475" stroke="#b5cfde" stroke-width="12" stroke-linecap="round"/>
    <path d="M570 474h60" stroke="#201b32" stroke-width="16" stroke-linecap="round"/>
    <path d="M570 468h60" stroke="#f0bb68" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- The rider gently bounces with the wheel. -->
  <g id="anteater" filter="url(#softShadow)">
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" values="0 0;0 -7;0 0;0 5;0 0" keyTimes="0;.25;.5;.75;1"/>

    <!-- huge balancing tail -->
    <path d="M477 444 C395 453 352 413 305 371 C247 320 180 345 119 420 C177 342 222 300 292 313 C367 326 419 376 502 386Z" fill="url(#fur)" stroke="#241c2a" stroke-width="7" stroke-linejoin="round"/>
    <path d="M145 400 C216 337 260 345 328 395" fill="none" stroke="#a16c58" stroke-width="10" opacity=".55" stroke-linecap="round"/>

    <!-- body and pale diagonal anteater stripe -->
    <path d="M438 293 C487 257 596 267 653 316 C696 353 682 435 638 470 C585 512 470 489 425 437 C389 396 396 326 438 293Z" fill="url(#fur)" stroke="#241c2a" stroke-width="7"/>
    <path d="M430 291 C464 276 505 274 540 281 C510 327 500 386 530 480 C484 473 448 451 425 422 C399 388 403 321 430 291Z" fill="url(#furLight)" opacity=".95"/>
    <path d="M450 302 C424 355 439 425 483 458" fill="none" stroke="#f3d8a6" stroke-width="9" opacity=".65"/>
    <ellipse cx="551" cy="430" rx="72" ry="28" fill="#1f1a2a" opacity=".35"/>

    <!-- head, long snout and ears -->
    <path d="M613 300 C645 255 693 235 745 245 C781 252 802 275 810 302 C795 330 762 348 717 351 L646 352 C612 345 598 326 613 300Z" fill="url(#fur)" stroke="#241c2a" stroke-width="7"/>
    <path d="M733 273 C792 278 842 297 895 309 C916 314 919 326 897 333 L804 338 C774 338 744 326 724 313Z" fill="#bd8067" stroke="#241c2a" stroke-width="7"/>
    <path d="M875 306 C900 307 922 312 936 320 C921 332 903 337 884 335Z" fill="#272033"/>
    <path d="M656 267 C638 230 657 204 686 222 C704 233 711 252 704 270Z" fill="#714b3e" stroke="#241c2a" stroke-width="6"/>
    <path d="M706 256 C715 224 747 220 758 247 L748 278Z" fill="#714b3e" stroke="#241c2a" stroke-width="6"/>
    <ellipse cx="761" cy="286" rx="8" ry="10" fill="#18172a"/>
    <circle cx="764" cy="283" r="3" fill="#fff4c6"/>
    <path d="M810 302 C834 307 851 311 867 316" fill="none" stroke="#e4aa83" stroke-width="5" stroke-linecap="round" opacity=".7"/>

    <!-- outstretched juggling arms -->
    <path d="M467 321 C438 302 420 268 426 232 C430 211 448 207 460 225 C466 239 457 265 477 284 L507 315Z" fill="url(#furLight)" stroke="#241c2a" stroke-width="7"/>
    <path d="M638 321 C679 299 711 270 744 239 C758 226 775 236 771 252 C759 273 722 303 686 347Z" fill="url(#furLight)" stroke="#241c2a" stroke-width="7"/>
    <path d="M424 229q-13-13-24-2M432 224q-7-18-20-14M747 240q12-17 23-10M754 247q17-13 26-3" fill="none" stroke="#e8c39b" stroke-width="8" stroke-linecap="round"/>

    <!-- legs hooked around the pedals -->
    <path d="M510 438 C504 475 487 507 493 536 C498 557 526 569 557 574 L568 554 C544 537 535 520 545 491 L569 449Z" fill="url(#furLight)" stroke="#241c2a" stroke-width="7"/>
    <path d="M606 452 C629 476 656 497 675 519 C692 539 678 559 657 576 L635 566 C646 546 639 534 619 522 L578 493Z" fill="url(#furLight)" stroke="#241c2a" stroke-width="7"/>
    <path d="M548 568l27-2 16 12-45 5c-15 1-18-9 2-15Z" fill="#332438"/>
    <path d="M638 567l25 4 17 12-45-7c-14-3-13-13 3-9Z" fill="#332438"/>
    <circle cx="568" cy="580" r="7" fill="#f1c76d" stroke="#542d49" stroke-width="3"/>
    <circle cx="656" cy="582" r="7" fill="#f1c76d" stroke="#542d49" stroke-width="3"/>

    <!-- little fur tufts -->
    <path d="M442 337l-25-12 21 29-26 2 35 14M643 377l27 7-24 10 16 18-31-8" fill="#704b3b" stroke="#241c2a" stroke-width="5" stroke-linejoin="round"/>
  </g>

  <!-- Ground-level sparkles and motion marks -->
  <g fill="none" stroke="#f5d77e" stroke-linecap="round" opacity=".8">
    <path d="M330 582h38M349 563v38" stroke-width="4"/>
    <path d="M852 559h30M867 544v30" stroke-width="4"/>
    <path d="M292 622l20-12M895 622l-20-12" stroke-width="5"/>
  </g>
  <g fill="#f7d77b">
    <circle cx="381" cy="614" r="5"/><circle cx="824" cy="626" r="5"/><circle cx="920" cy="586" r="4"/>
  </g>
</svg>
