<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<title>Anteater Riding Unicycle While Juggling Bottles</title>
<style>
  .outline { stroke-linecap: round; stroke-linejoin: round; }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#8ec9ee"/>
    <stop offset="70%" stop-color="#d8f0ff"/>
    <stop offset="100%" stop-color="#fff4d6"/>
  </linearGradient>
  <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#9aa0a8"/>
    <stop offset="100%" stop-color="#7a8089"/>
  </linearGradient>
  <radialGradient id="sunGrad" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#fff9c4"/>
    <stop offset="60%" stop-color="#ffeb3b"/>
    <stop offset="100%" stop-color="#ffb300"/>
  </radialGradient>
  <!-- bottle symbol centered at 0,0, ~30x60 -->
  <g id="bottleShape">
    <rect x="-8" y="-30" width="16" height="8" rx="2" fill="#5d3a28"/>
    <rect x="-5" y="-22" width="10" height="8" fill="#c9e8e4"/>
    <path d="M -5 -14 L -14 -4 L -14 22 Q -14 30 0 30 Q 14 30 14 22 L 14 -4 L 5 -14 Z" fill="#4ecdc4" stroke="#1a6b66" stroke-width="2.5"/>
    <path d="M -14 -4 L 14 -4" stroke="#1a6b66" stroke-width="2"/>
    <rect x="-9" y="2" width="5" height="18" rx="2.5" fill="white" opacity="0.6"/>
    <text x="0" y="16" text-anchor="middle" font-family="sans-serif" font-size="9" font-weight="bold" fill="#0b3d3a">POP</text>
  </g>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>
<!-- sun -->
<g transform="translate(650,90)">
  <circle r="48" fill="url(#sunGrad)" opacity="0.95">
    <animate attributeName="r" values="48;52;48" dur="3s" repeatCount="indefinite"/>
  </circle>
</g>
<!-- clouds scrolling left to imply riding right -->
<g opacity="0.95">
  <g transform="translate(0,70)">
    <animateTransform attributeName="transform" type="translate" from="850 70" to="-250 70" dur="18s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="white"/>
    <ellipse cx="35" cy="-10" rx="40" ry="20" fill="white"/>
    <ellipse cx="-35" cy="-5" rx="35" ry="18" fill="white"/>
  </g>
  <g transform="translate(0,130)">
    <animateTransform attributeName="transform" type="translate" from="900 130" to="-250 130" dur="26s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="48" ry="18" fill="white" opacity="0.9"/>
    <ellipse cx="30" cy="-8" rx="32" ry="16" fill="white" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="800 45" to="-300 45" dur="32s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="35" ry="14" fill="white" opacity="0.8"/>
  </g>
</g>
<!-- distant hills -->
<path d="M0 430 Q150 340 300 420 Q450 500 600 400 Q700 350 800 430 L800 520 L0 520 Z" fill="#a8d5a2"/>
<path d="M0 460 Q200 400 400 455 Q600 510 800 450 L800 520 L0 520 Z" fill="#7fbf7a"/>

<!-- ROAD -->
<rect x="0" y="480" width="800" height="120" fill="url(#roadGrad)"/>
<rect x="0" y="478" width="800" height="8" fill="#5a6068"/>
<!-- moving dashes -->
<line x1="0" y1="540" x2="800" y2="540" stroke="white" stroke-width="8" stroke-dasharray="60 40" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-100" dur="0.5s" repeatCount="indefinite"/>
</line>
<!-- speed lines -->
<g stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6">
  <line x1="60" y1="380" x2="140" y2="380">
    <animate attributeName="x1" values="180;40" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="260;120" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="70" y1="410" x2="170" y2="410">
    <animate attributeName="x1" values="200;30" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="300;130" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="90" y1="350" x2="160" y2="350">
    <animate attributeName="x1" values="220;60" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="290;130" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
  </line>
</g>

<!-- TITLE -->
<text x="400" y="55" text-anchor="middle" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#4a2c1a" stroke="white" stroke-width="5" paint-order="stroke">Anteater Acrobat!</text>
<text x="400" y="55" text-anchor="middle" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#4a2c1a">Anteater Acrobat!</text>

<!-- RIDER GROUP with bob -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="0.7s" repeatCount="indefinite"/>

  <!-- shadow -->
  <ellipse cx="400" cy="540" rx="110" ry="14" fill="black" opacity="0.2">
    <animate attributeName="rx" values="110;95;110" dur="0.7s" repeatCount="indefinite"/>
  </ellipse>

  <!-- UNICYCLE WHEEL -->
  <g transform="translate(400,455)">
    <!-- tire -->
    <circle r="78" fill="none" stroke="#222" stroke-width="16"/>
    <circle r="78" fill="none" stroke="#444" stroke-width="4" stroke-dasharray="10 8" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle r="64" fill="none" stroke="#ddd" stroke-width="6"/>
    <!-- spokes rotating -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <g stroke="#888" stroke-width="4" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-60"/>
        <line x1="0" y1="0" x2="0" y2="60"/>
        <line x1="0" y1="0" x2="-60" y2="0"/>
        <line x1="0" y1="0" x2="60" y2="0"/>
        <line x1="0" y1="0" x2="-42" y2="-42"/>
        <line x1="0" y1="0" x2="42" y2="42"/>
        <line x1="0" y1="0" x2="42" y2="-42"/>
        <line x1="0" y1="0" x2="-42" y2="42"/>
      </g>
    </g>
    <!-- crank + pedals rotating with wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <g stroke="#222" stroke-width="8" stroke-linecap="round">
        <line x1="0" y1="0" x2="28" y2="0"/>
        <line x1="0" y1="0" x2="-28" y2="0"/>
      </g>
      <rect x="20" y="-6" width="26" height="12" rx="3" fill="#222"/>
      <rect x="-46" y="-6" width="26" height="12" rx="3" fill="#222"/>
    </g>
    <circle r="12" fill="#333" stroke="#eee" stroke-width="3"/>
  </g>

  <!-- fork -->
  <g stroke="#e53935" stroke-width="9" stroke-linecap="round" class="outline">
    <line x1="400" y1="455" x2="385" y2="325"/>
    <line x1="400" y1="455" x2="415" y2="325"/>
  </g>
  <!-- seat post + saddle -->
  <rect x="395" y="295" width="10" height="35" fill="#555"/>
  <ellipse cx="400" cy="292" rx="48" ry="14" fill="#222" stroke="black" stroke-width="2"/>
  <ellipse cx="400" cy="287" rx="48" ry="10" fill="#444"/>

  <!-- TAIL (behind body, wagging) -->
  <g transform="translate(310,285)">
    <animateTransform attributeName="transform" type="rotate" values="-8 0 0; 12 0 0; -8 0 0" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 0 0 C -60 -10 -110 -60 -145 -115 C -155 -135 -175 -125 -165 -100 C -140 -40 -80 20 5 25 Z" fill="#5d3a28" stroke="#3a2316" stroke-width="3"/>
    <path d="M -20 -2 C -60 -15 -100 -55 -125 -95" fill="none" stroke="#7d5a43" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- HIND LEGS pedaling (two legs out of phase) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -16; 0 0" dur="0.9s" repeatCount="indefinite"/>
    <path d="M 350 300 Q 365 360 385 430" fill="none" stroke="#8a6d4e" stroke-width="20" stroke-linecap="round"/>
    <path d="M 350 300 Q 365 360 385 430" fill="none" stroke="#5d3a28" stroke-width="20" stroke-linecap="round" stroke-dasharray="4 0" opacity="0.15"/>
    <ellipse cx="392" cy="435" rx="22" ry="10" fill="#3a2316"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -16; 0 0; 0 -16" dur="0.9s" repeatCount="indefinite"/>
    <path d="M 390 305 Q 405 365 415 435" fill="none" stroke="#a68a64" stroke-width="20" stroke-linecap="round"/>
    <ellipse cx="422" cy="440" rx="22" ry="10" fill="#3a2316"/>
  </g>

  <!-- BODY -->
  <g transform="rotate(-8 380 270)">
    <ellipse cx="380" cy="270" rx="95" ry="48" fill="#a68a64" stroke="#5d3a28" stroke-width="3"/>
    <!-- giant anteater stripe -->
    <path d="M 320 235 L 415 270 L 320 315 L 335 270 Z" fill="#222" stroke="white" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 320 235 L 415 270 L 320 315 L 335 270 Z" fill="#222"/>
  </g>

  <!-- HEAD + LONG SNOUT -->
  <g>
    <ellipse cx="515" cy="242" rx="72" ry="23" fill="#a68a64" stroke="#5d3a28" stroke-width="3" transform="rotate(-6 515 242)"/>
    <ellipse cx="475" cy="235" rx="28" ry="20" fill="#a68a64"/>
    <!-- ear -->
    <ellipse cx="452" cy="212" rx="13" ry="11" fill="#8a6d4e" stroke="#5d3a28" stroke-width="2.5"/>
    <ellipse cx="452" cy="212" rx="6" ry="5" fill="#e8d5b8"/>
    <!-- eye + happy -->
    <circle cx="482" cy="234" r="6.5" fill="black"/>
    <circle cx="484" cy="232" r="2" fill="white"/>
    <path d="M 490 250 Q 500 255 512 252" stroke="#5d3a28" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <!-- snout tip -->
    <ellipse cx="584" cy="232" rx="10" ry="9" fill="#3a2316"/>
    <circle cx="587" cy="230" r="2" fill="#aaa"/>
    <!-- nostril smile -->
    <path d="M 570 242 Q 580 248 590 242" stroke="#3a2316" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- ARMS juggling -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="0.75s" repeatCount="indefinite"/>
    <path d="M 425 280 Q 445 220 468 175" fill="none" stroke="#8a6d4e" stroke-width="16" stroke-linecap="round"/>
    <circle cx="470" cy="168" r="11" fill="#8a6d4e" stroke="#5d3a28" stroke-width="2"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -8; 0 0; 0 -8" dur="0.75s" repeatCount="indefinite"/>
    <path d="M 450 285 Q 485 235 542 175" fill="none" stroke="#a68a64" stroke-width="16" stroke-linecap="round"/>
    <circle cx="550" cy="168" r="11" fill="#a68a64" stroke="#5d3a28" stroke-width="2"/>
  </g>

  <!-- juggling guide arcs -->
  <path d="M 450 180 Q 505 10 560 180" fill="none" stroke="white" stroke-width="3" stroke-dasharray="8 8" opacity="0.7"/>
  <path d="M 450 180 Q 505 210 560 180" fill="none" stroke="white" stroke-width="2" stroke-dasharray="6 8" opacity="0.5"/>

  <!-- 3 JUGGLING BOTTLES on cascade loop -->
  <g>
    <animateMotion dur="1.5s" repeatCount="indefinite" path="M 450 180 Q 505 10 560 180 Q 505 210 450 180 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#bottleShape"/>
    </g>
  </g>
  <g>
    <animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite" path="M 450 180 Q 505 10 560 180 Q 505 210 450 180 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.5s" repeatCount="indefinite"/>
      <use href="#bottleShape" opacity="0.95"/>
      <!-- tint second bottle different via overlay? use second color by group -->
    </g>
  </g>
  <g>
    <animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite" path="M 450 180 Q 505 10 560 180 Q 505 210 450 180 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="-30" to="330" dur="1.5s" repeatCount="indefinite"/>
      <use href="#bottleShape"/>
    </g>
  </g>

  <!-- motion sparkles on bottles -->
  <g fill="#fff" opacity="0.9">
    <circle cx="505" cy="80" r="4">
      <animate attributeName="opacity" values="0.9;0;0.9" dur="0.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="110" r="3">
      <animate attributeName="opacity" values="0;0.9;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="110" r="3">
      <animate attributeName="opacity" values="0;0.9;0" dur="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>
</g>

<!-- foreground grass tufts bouncing past -->
<g fill="#4a8a44">
  <g>
    <animateTransform attributeName="transform" type="translate" from="850 490" to="-100 490" dur="4s" repeatCount="indefinite"/>
    <path d="M0 0 Q5 -20 10 0 Q15 -18 20 0 Z"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 495" to="-50 495" dur="6.5s" repeatCount="indefinite"/>
    <path d="M0 0 Q5 -22 10 0 Q15 -20 25 0 Z"/>
  </g>
</g>

</svg>