<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<title>Anteater Riding a Unicycle While Juggling Bottles</title>
<style>
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  @keyframes tilt { 0%,100%{transform:rotate(-2deg)} 50%{transform:rotate(2deg)} }
  .rider-bob { animation: bob 0.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .rider-tilt { animation: tilt 1.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  text { font-family: system-ui, sans-serif; }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7DD3FC"/>
    <stop offset="70%" stop-color="#E0F2FE"/>
    <stop offset="100%" stop-color="#FEF9C3"/>
  </linearGradient>
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#86EFAC"/>
    <stop offset="100%" stop-color="#22C55E"/>
  </linearGradient>
  <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#FEF08A"/>
    <stop offset="100%" stop-color="#FACC15"/>
  </radialGradient>
  <!-- bottle shape centered at 0,0 -->
  <g id="bottle-green">
    <rect x="-14" y="-20" width="28" height="48" rx="8" fill="#22C55E" stroke="#14532D" stroke-width="3"/>
    <rect x="-14" y="-10" width="28" height="10" fill="#BBF7D0" opacity="0.6"/>
    <rect x="-6" y="-38" width="12" height="20" fill="#22C55E" stroke="#14532D" stroke-width="3"/>
    <rect x="-8" y="-46" width="16" height="10" rx="2" fill="#92400E" stroke="#451A03" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-size="16" font-weight="900" fill="white">★</text>
  </g>
  <g id="bottle-amber">
    <rect x="-14" y="-20" width="28" height="48" rx="8" fill="#F59E0B" stroke="#78350F" stroke-width="3"/>
    <rect x="-14" y="-10" width="28" height="10" fill="#FDE68A" opacity="0.7"/>
    <rect x="-6" y="-38" width="12" height="20" fill="#F59E0B" stroke="#78350F" stroke-width="3"/>
    <rect x="-8" y="-46" width="16" height="10" rx="2" fill="#1F2937" stroke="black" stroke-width="2"/>
    <text x="0" y="10" text-anchor="middle" font-size="14" font-weight="900" fill="white">SIP</text>
  </g>
  <g id="bottle-blue">
    <rect x="-14" y="-20" width="28" height="48" rx="8" fill="#38BDF8" stroke="#0C4A6E" stroke-width="3"/>
    <rect x="-14" y="-10" width="28" height="10" fill="#E0F2FE" opacity="0.7"/>
    <rect x="-6" y="-38" width="12" height="20" fill="#38BDF8" stroke="#0C4A6E" stroke-width="3"/>
    <rect x="-8" y="-46" width="16" height="10" rx="2" fill="#DC2626" stroke="#7F1D1D" stroke-width="2"/>
    <text x="0" y="12" text-anchor="middle" font-size="16" fill="white">〜</text>
  </g>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
<circle cx="650" cy="90" r="55" fill="url(#sunG)" opacity="0.9">
  <animate attributeName="r" values="55;60;55" dur="4s" repeatCount="indefinite"/>
</circle>
<!-- clouds drifting -->
<g opacity="0.9" fill="white">
  <g>
    <ellipse cx="150" cy="100" rx="50" ry="22"/>
    <ellipse cx="185" cy="90" rx="35" ry="20"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="12s" repeatCount="indefinite"/>
  </g>
  <g>
    <ellipse cx="550" cy="140" rx="45" ry="18"/>
    <ellipse cx="580" cy="130" rx="30" ry="16"/>
    <animateTransform attributeName="transform" type="translate" from="80 0" to="-180 0" dur="18s" repeatCount="indefinite"/>
  </g>
</g>
<!-- distant hills -->
<path d="M0 380 Q 200 300 400 370 T 800 350 V 500 H 0 Z" fill="#A7F3D0" opacity="0.8"/>
<rect x="0" y="430" width="800" height="170" fill="url(#groundG)"/>
<rect x="0" y="490" width="800" height="110" fill="#57534E"/>
<rect x="0" y="490" width="800" height="12" fill="#A8A29E"/>

<!-- moving road dashes to show forward motion -->
<g fill="#FEF08A">
  <g>
    <rect x="0" y="535" width="80" height="12" rx="6"/>
    <rect x="200" y="535" width="80" height="12" rx="6"/>
    <rect x="400" y="535" width="80" height="12" rx="6"/>
    <rect x="600" y="535" width="80" height="12" rx="6"/>
    <rect x="800" y="535" width="80" height="12" rx="6"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="0.7s" repeatCount="indefinite"/>
  </g>
</g>
<!-- speed lines -->
<g stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6">
  <line x1="80" y1="320" x2="180" y2="320">
    <animate attributeName="x1" values="180;40" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="280;140" dur="0.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.6s" repeatCount="indefinite"/>
  </line>
  <line x1="60" y1="360" x2="160" y2="360">
    <animate attributeName="x1" values="160;20" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="260;120" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.6s" begin="0.2s" repeatCount="indefinite"/>
  </line>
  <line x1="90" y1="400" x2="170" y2="400">
    <animate attributeName="x1" values="170;30" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="250;110" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.6s" begin="0.4s" repeatCount="indefinite"/>
  </line>
</g>

<!-- shadow -->
<ellipse cx="400" cy="548" rx="110" ry="14" fill="black" opacity="0.25">
  <animate attributeName="rx" values="110;100;110" dur="0.6s" repeatCount="indefinite"/>
</ellipse>

<!-- WHOLE RIDER GROUP with bob -->
<g class="rider-bob">
<g class="rider-tilt">
<!-- UNICYCLE -->
<!-- wheel tire -->
<circle cx="400" cy="460" r="68" fill="none" stroke="#1F2937" stroke-width="16"/>
<circle cx="400" cy="460" r="56" fill="none" stroke="#D1D5DB" stroke-width="6"/>
<!-- spinning spokes -->
<g>
  <g stroke="#9CA3AF" stroke-width="4" stroke-linecap="round">
    <line x1="400" y1="460" x2="400" y2="408"/>
    <line x1="400" y1="460" x2="452" y2="460"/>
    <line x1="400" y1="460" x2="400" y2="512"/>
    <line x1="400" y1="460" x2="348" y2="460"/>
    <line x1="400" y1="460" x2="437" y2="423"/>
    <line x1="400" y1="460" x2="437" y2="497"/>
    <line x1="400" y1="460" x2="363" y2="497"/>
    <line x1="400" y1="460" x2="363" y2="423"/>
  </g>
  <circle cx="400" cy="460" r="12" fill="#EF4444" stroke="#7F1D1D" stroke-width="3"/>
  <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="0.8s" repeatCount="indefinite"/>
</g>
<!-- crank + pedals (faster pedaling) -->
<g>
  <line x1="385" y1="445" x2="415" y2="475" stroke="#111827" stroke-width="8" stroke-linecap="round"/>
  <rect x="370" y="435" width="30" height="10" rx="3" fill="black"/>
  <rect x="400" y="475" width="30" height="10" rx="3" fill="black"/>
  <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="1.2s" repeatCount="indefinite"/>
</g>
<!-- fork + seat post -->
<line x1="400" y1="460" x2="400" y2="330" stroke="#2563EB" stroke-width="10" stroke-linecap="round"/>
<line x1="400" y1="460" x2="385" y2="330" stroke="#1D4ED8" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
<ellipse cx="400" cy="315" rx="55" ry="14" fill="#111827"/>
<rect x="385" y="315" width="30" height="15" fill="#374151"/>

<!-- ANTEATER TAIL (wagging) -->
<g>
  <path d="M 315 250 C 240 240 200 190 150 150 C 170 230 230 290 315 285 Z" fill="#5C4A3A" stroke="#3F2E22" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 290 260 C 245 250 215 220 185 190" fill="none" stroke="#7C6654" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <animateTransform attributeName="transform" type="rotate" values="-6 315 265; 8 315 265; -6 315 265" dur="1s" repeatCount="indefinite"/>
</g>

<!-- ANTEATER BACK LEG (far side, darker) -->
<path d="M 380 300 L 392 452" fill="none" stroke="#6B5D4F" stroke-width="22" stroke-linecap="round">
  <animate attributeName="d" values="M 380 300 L 392 452; M 380 300 L 414 472; M 380 300 L 392 452" dur="1.2s" repeatCount="indefinite"/>
</path>
<!-- ANTEATER BODY -->
<g>
  <ellipse cx="405" cy="250" rx="115" ry="72" fill="#8B7D6B" stroke="#4A3F35" stroke-width="4" transform="rotate(-8 405 250)"/>
  <!-- classic anteater stripe -->
  <path d="M 340 215 L 400 260 L 340 310 L 320 295 L 360 255 L 320 230 Z" fill="#F8FAFC" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 350 225 L 395 260 L 350 300" fill="none" stroke="black" stroke-width="3" opacity="0.8"/>
  <!-- fur tufts -->
  <path d="M 300 270 q 10 -8 20 0 q 10 -8 20 0" fill="none" stroke="#4A3F35" stroke-width="3" stroke-linecap="round"/>
</g>

<!-- ANTEATER FRONT LEG (near side) -->
<path d="M 435 305 L 414 472" fill="none" stroke="#4A3F35" stroke-width="24" stroke-linecap="round">
  <animate attributeName="d" values="M 435 305 L 414 472; M 435 305 L 390 448; M 435 305 L 414 472" dur="1.2s" repeatCount="indefinite"/>
</path>
<path d="M 435 305 L 414 472" fill="none" stroke="#8B7D6B" stroke-width="18" stroke-linecap="round">
  <animate attributeName="d" values="M 435 305 L 414 472; M 435 305 L 390 448; M 435 305 L 414 472" dur="1.2s" repeatCount="indefinite"/>
</path>
<!-- feet -->
<ellipse cx="412" cy="472" rx="18" ry="9" fill="#4A3F35">
  <animate attributeName="cy" values="472;448;472" dur="1.2s" repeatCount="indefinite"/>
  <animate attributeName="cx" values="414;390;414" dur="1.2s" repeatCount="indefinite"/>
</ellipse>

<!-- ANTEATER HEAD + LONG SNOUT -->
<g>
  <!-- head base -->
  <ellipse cx="495" cy="210" rx="45" ry="38" fill="#8B7D6B" stroke="#4A3F35" stroke-width="4"/>
  <!-- snout long tube -->
  <path d="M 520 195 L 625 175 L 628 195 L 522 225 Z" fill="#8B7D6B" stroke="#4A3F35" stroke-width="4" stroke-linejoin="round"/>
  <ellipse cx="627" cy="185" rx="10" ry="12" fill="#1F2937"/>
  <circle cx="630" cy="183" r="3" fill="#9CA3AF"/>
  <!-- eye -->
  <circle cx="505" cy="200" r="9" fill="white" stroke="#4A3F35" stroke-width="3"/>
  <circle cx="507" cy="201" r="4.5" fill="black">
    <animate attributeName="r" values="4.5;1;4.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <!-- ear -->
  <ellipse cx="480" cy="175" rx="12" ry="14" fill="#6B5D4F" stroke="#4A3F35" stroke-width="3"/>
  <!-- smile + tongue flick -->
  <path d="M 610 200 Q 600 215 585 210" fill="none" stroke="#4A3F35" stroke-width="3" stroke-linecap="round"/>
  <path d="M 622 195 Q 640 205 650 195" fill="none" stroke="#EF4444" stroke-width="4" stroke-linecap="round">
    <animate attributeName="d" values="M 622 195 Q 640 205 650 195; M 622 195 Q 645 200 665 190; M 622 195 Q 640 205 650 195" dur="0.8s" repeatCount="indefinite"/>
  </path>
</g>

<!-- ARMS juggling (two arms waving) -->
<g>
  <path d="M 470 240 C 480 200 500 180 520 160" fill="none" stroke="#6B5D4F" stroke-width="20" stroke-linecap="round">
    <animate attributeName="d" values="M 470 240 C 480 200 500 180 520 160; M 470 240 C 485 210 505 190 495 165; M 470 240 C 480 200 500 180 520 160" dur="0.9s" repeatCount="indefinite"/>
  </path>
  <path d="M 445 245 C 435 205 415 185 395 170" fill="none" stroke="#8B7D6B" stroke-width="20" stroke-linecap="round">
    <animate attributeName="d" values="M 445 245 C 435 205 415 185 395 170; M 445 245 C 440 210 425 190 445 165; M 445 245 C 435 205 415 185 395 170" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
  </path>
  <!-- paws -->
  <circle cx="520" cy="160" r="12" fill="#4A3F35">
    <animate attributeName="cx" values="520;495;520" dur="0.9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="160;165;160" dur="0.9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="395" cy="170" r="12" fill="#4A3F35">
    <animate attributeName="cx" values="395;445;395" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="170;165;170" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
  </circle>
</g>

</g>
</g>

<!-- JUGGLING BOTTLES - 3 bottles on looped toss paths -->
<g>
  <!-- Bottle 1 -->
  <g>
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 395 170 Q 410 40 500 160 Q 410 40 320 160 Z"/>
    <g>
      <use href="#bottle-green"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Bottle 2 offset -->
  <g>
    <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M 395 170 Q 410 40 500 160 Q 410 40 320 160 Z"/>
    <g>
      <use href="#bottle-amber"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
  <!-- Bottle 3 offset -->
  <g>
    <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M 395 170 Q 410 40 500 160 Q 410 40 320 160 Z"/>
    <g>
      <use href="#bottle-blue"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.8s" repeatCount="indefinite"/>
    </g>
  </g>
</g>

<!-- motion arcs hint -->
<path d="M 320 180 Q 410 30 520 170" fill="none" stroke="white" stroke-width="3" stroke-dasharray="10 10" opacity="0.6"/>

<!-- Title -->
<g>
  <rect x="170" y="12" width="460" height="44" rx="22" fill="black" opacity="0.7"/>
  <text x="400" y="41" text-anchor="middle" font-size="24" font-weight="800" fill="#FEF08A">ANTEATER • UNICYCLE • JUGGLER</text>
</g>

</svg>