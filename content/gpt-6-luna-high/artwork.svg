<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Anteaterini</title>
  <desc id="desc">A cheerful anteater pedals a unicycle and juggles three colorful bottles beneath a spotlight.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#172039"/><stop offset="1" stop-color="#302448"/></linearGradient>
    <linearGradient id="fur" x2=".8" y2="1"><stop stop-color="#d29a62"/><stop offset="1" stop-color="#98603f"/></linearGradient>
    <linearGradient id="bib" x2="0" y2="1"><stop stop-color="#f4e7c7"/><stop offset="1" stop-color="#d8c39a"/></linearGradient>
    <radialGradient id="spot"><stop stop-color="#fff6cf" stop-opacity=".22"/><stop offset="1" stop-color="#fff6cf" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.5" y="-.5" width="2" height="2"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <style>
    .sway { transform-box:fill-box; transform-origin:center; animation:sway 2.4s ease-in-out infinite; }
    .wheel { transform-box:fill-box; transform-origin:center; animation:spin 2s linear infinite; }
    .leg-a { transform-box:fill-box; transform-origin:top; animation:pedalA 1s ease-in-out infinite alternate; }
    .leg-b { transform-box:fill-box; transform-origin:top; animation:pedalB 1s ease-in-out infinite alternate; }
    .arm-l { transform-box:fill-box; transform-origin:top right; animation:armL 1.2s ease-in-out infinite; }
    .arm-r { transform-box:fill-box; transform-origin:top left; animation:armR 1.2s ease-in-out infinite; }
    .bottle-one { animation:toss1 2.4s ease-in-out infinite; }
    .bottle-two { animation:toss2 2.4s ease-in-out infinite; }
    .bottle-three { animation:toss3 2.4s ease-in-out infinite; }
    .spark { animation:twinkle 1.5s ease-in-out infinite alternate; }
    @keyframes sway { 0%,100%{transform:rotate(-2deg) translateY(0)} 50%{transform:rotate(2deg) translateY(-5px)} }
    @keyframes spin { to{transform:rotate(360deg)} }
    @keyframes pedalA { from{transform:rotate(-24deg)} to{transform:rotate(22deg)} }
    @keyframes pedalB { from{transform:rotate(22deg)} to{transform:rotate(-24deg)} }
    @keyframes armL { 0%,100%{transform:rotate(8deg)} 50%{transform:rotate(-9deg)} }
    @keyframes armR { 0%,100%{transform:rotate(-8deg)} 50%{transform:rotate(9deg)} }
    @keyframes toss1 { 0%,100%{transform:translate(0,0) rotate(-18deg)} 50%{transform:translate(12px,-92px) rotate(18deg)} }
    @keyframes toss2 { 0%,100%{transform:translate(0,0) rotate(16deg)} 50%{transform:translate(-6px,-118px) rotate(-16deg)} }
    @keyframes toss3 { 0%,100%{transform:translate(0,0) rotate(-16deg)} 50%{transform:translate(-14px,-78px) rotate(20deg)} }
    @keyframes twinkle { from{opacity:.35;transform:scale(.8)} to{opacity:1;transform:scale(1.2)} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation-duration:8s!important;animation-iteration-count:1!important} }
  </style>
  <!-- Midnight circus backdrop -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <ellipse cx="402" cy="265" rx="340" ry="330" fill="url(#spot)"/>
  <path d="M0 480 Q190 445 400 478T800 466V600H0Z" fill="#20233b"/>
  <path d="M0 513 Q190 488 400 511T800 497" fill="none" stroke="#54445a" stroke-width="3" opacity=".65"/>
  <g fill="#ffe9a8" class="spark">
    <path d="M119 152l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/><circle cx="652" cy="176" r="3"/>
    <path d="M686 304l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/><circle cx="183" cy="275" r="2.5"/>
  </g>
  <ellipse cx="408" cy="492" rx="120" ry="13" fill="#080c18" opacity=".55" filter="url(#shadow)"/>

  <!-- Juggling bottles follow three looping arcs -->
  <g class="bottle-one" transform="translate(242 300) rotate(-18)">
    <path d="M-8 18h16v8q0 4 7 11v29q0 8-8 8H-7q-8 0-8-8V37q7-7 7-11z" fill="#ef6b54" stroke="#ffe2b4" stroke-width="2"/>
    <path d="M-7 18h14v-9H-7z" fill="#f5c76a" stroke="#ffe2b4" stroke-width="2"/><path d="M-11 46h22v11h-22z" fill="#fff0cc" opacity=".85"/><path d="M-3 48h6v7h-6z" fill="#ef6b54"/>
  </g>
  <g class="bottle-two" transform="translate(400 237) rotate(16)">
    <path d="M-8 18h16v8q0 4 7 11v29q0 8-8 8H-7q-8 0-8-8V37q7-7 7-11z" fill="#49b9a7" stroke="#e6ffdf" stroke-width="2"/>
    <path d="M-7 18h14v-9H-7z" fill="#f5c76a" stroke="#e6ffdf" stroke-width="2"/><path d="M-11 46h22v11h-22z" fill="#edffd9" opacity=".9"/><circle cy="51" r="3" fill="#49b9a7"/>
  </g>
  <g class="bottle-three" transform="translate(557 300) rotate(-16)">
    <path d="M-8 18h16v8q0 4 7 11v29q0 8-8 8H-7q-8 0-8-8V37q7-7 7-11z" fill="#7865c9" stroke="#f0ddff" stroke-width="2"/>
    <path d="M-7 18h14v-9H-7z" fill="#f5c76a" stroke="#f0ddff" stroke-width="2"/><path d="M-11 46h22v11h-22z" fill="#fff0d2" opacity=".9"/><path d="M-2 48h4v7h-4z" fill="#7865c9"/>
  </g>

  <!-- Unicycle -->
  <g class="wheel">
    <circle cx="400" cy="435" r="56" fill="#141a2a" stroke="#f5d995" stroke-width="7"/>
    <circle cx="400" cy="435" r="45" fill="none" stroke="#a8b2bc" stroke-width="2" stroke-dasharray="3 5"/>
    <g stroke="#a8b2bc" stroke-width="2">
      <path d="M400 379v112M344 435h112M360 395l80 80M440 395l-80 80"/>
    </g>
    <circle cx="400" cy="435" r="8" fill="#f5d995"/>
  </g>
  <path d="M400 435l-9-72" stroke="#e7bd69" stroke-width="9" stroke-linecap="round"/>
  <path d="M374 360h35" stroke="#302b3b" stroke-width="11" stroke-linecap="round"/>
  <path d="M384 436h32" stroke="#f5d995" stroke-width="5" stroke-linecap="round"/>

  <!-- Rider -->
  <g class="sway">
    <!-- tail -->
    <path d="M449 318q91-7 82 71-5 43-42 47 35-25 8-48-18-15-66-1" fill="none" stroke="#8b553d" stroke-width="24" stroke-linecap="round"/>
    <path d="M449 318q91-7 82 71-5 43-42 47 35-25 8-48-18-15-66-1" fill="none" stroke="#bd8254" stroke-width="13" stroke-linecap="round"/>
    <!-- body -->
    <path d="M364 263q-29 8-35 48l-8 54q-1 15 14 17l56 4q18 0 22-17l10-60q5-31-18-43-18-9-41-3z" fill="url(#fur)" stroke="#754a39" stroke-width="3"/>
    <path d="M365 291q-18 5-19 27l-4 41q22 13 54 7l9-47q3-21-12-27z" fill="url(#bib)"/>
    <!-- neck and head -->
    <path d="M365 270q-3-24 13-38l30 8q8 16-3 35" fill="#b97c50" stroke="#754a39" stroke-width="3"/>
    <path d="M354 219q3-32 40-39 37-7 53 14 12 17-8 34-12 12-35 14l-42-4q-13-4-8-19z" fill="url(#fur)" stroke="#754a39" stroke-width="3"/>
    <!-- long anteater snout -->
    <path d="M424 208q43-24 99-17 13 2 13 11-1 8-14 10l-70 15q-18 4-27-5z" fill="#d49a67" stroke="#754a39" stroke-width="3"/>
    <path d="M529 201q8-2 12 1l-1 6-11 3" fill="#28253a"/>
    <ellipse cx="406" cy="196" rx="4.5" ry="5.5" fill="#211d2a"/><circle cx="407" cy="194" r="1.5" fill="#fff3d2"/>
    <path d="M392 185q-9-13-20-4l7 15" fill="#98603f" stroke="#754a39" stroke-width="2"/>
    <path d="M368 254q24 6 43-2" fill="none" stroke="#71483b" stroke-width="2" opacity=".6"/>
    <!-- cheerful cheek -->
    <path d="M391 211q8 7 16 1" fill="none" stroke="#754a39" stroke-width="2" stroke-linecap="round"/>
    <!-- arms reaching out -->
    <g class="arm-l">
      <path d="M345 282q-23-11-37-31l-18-18" fill="none" stroke="#a97049" stroke-width="17" stroke-linecap="round"/>
      <path d="M296 235q-8-8-14-2-5 5 1 11l9 8 10-9z" fill="#d49a67" stroke="#754a39" stroke-width="2"/>
    </g>
    <g class="arm-r">
      <path d="M414 283q25-11 39-31l18-18" fill="none" stroke="#a97049" stroke-width="17" stroke-linecap="round"/>
      <path d="M467 235q8-8 14-2 5 5-1 11l-9 8-10-9z" fill="#d49a67" stroke="#754a39" stroke-width="2"/>
    </g>
    <!-- cycling legs -->
    <g class="leg-a">
      <path d="M351 367q-10 22 2 43l23 17" fill="none" stroke="#8f5b40" stroke-width="18" stroke-linecap="round"/>
      <path d="M370 424q12 9 23 5l6-4-2-7-24-3z" fill="#e3b579" stroke="#754a39" stroke-width="2"/>
    </g>
    <g class="leg-b">
      <path d="M395 367q18 15 12 36l-17 21" fill="none" stroke="#a97049" stroke-width="18" stroke-linecap="round"/>
      <path d="M390 421q-12 7-22 4l-7-4 2-7 23-3z" fill="#e3b579" stroke="#754a39" stroke-width="2"/>
    </g>
    <!-- jaunty little waistcoat -->
    <path d="M348 287q10-12 20-13l11 13-8 27-20-7zM380 286l9-14q13 5 19 15l-10 22-16-8z" fill="#e7664f" stroke="#7c403b" stroke-width="2"/>
    <circle cx="373" cy="301" r="2" fill="#ffe3a3"/><circle cx="389" cy="301" r="2" fill="#ffe3a3"/>
  </g>
  <!-- pedals stay visible over the wheel -->
  <g stroke="#f5d995" stroke-width="4" stroke-linecap="round"><path d="M384 436l-21 1M416 436l21-1"/></g>

  <text x="400" y="91" text-anchor="middle" fill="#ffe9b7" font-family="Georgia,serif" font-size="28" letter-spacing="4">THE GREAT ANTEATERINI</text>
  <text x="400" y="119" text-anchor="middle" fill="#d4c4d1" font-family="sans-serif" font-size="12" letter-spacing="5">ONE WHEEL • THREE BOTTLES • ZERO WORRIES</text>
  <path d="M251 135h298" stroke="#d4a85f" stroke-width="1" opacity=".65"/>
</svg>
