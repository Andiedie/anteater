<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="400" height="520" font-family="sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <radialGradient id="body" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#b07a52"/>
      <stop offset="1" stop-color="#8a5a36"/>
    </radialGradient>
    <radialGradient id="belly" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e8c79c"/>
      <stop offset="1" stop-color="#cda372"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="400" height="520" fill="url(#sky)"/>
  <ellipse cx="200" cy="470" rx="150" ry="18" fill="#000" opacity="0.08"/>

  <!-- whole rig bobs as it rolls -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0 0; 0 -4; 0 0" dur="1s" repeatCount="indefinite"/>

    <!-- shadow on ground -->
    <ellipse cx="200" cy="468" rx="70" ry="10" fill="#000" opacity="0.12"/>

    <!-- ===== UNICYCLE ===== -->
    <!-- wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 400" to="360 200 400" dur="2s" repeatCount="indefinite"/>
      <circle cx="200" cy="400" r="58" fill="none" stroke="#333" stroke-width="8"/>
      <circle cx="200" cy="400" r="50" fill="none" stroke="#777" stroke-width="2"/>
      <g stroke="#999" stroke-width="3">
        <line x1="200" y1="342" x2="200" y2="458"/>
        <line x1="142" y1="400" x2="258" y2="400"/>
        <line x1="159" y1="359" x2="241" y2="441"/>
        <line x1="241" y1="359" x2="159" y2="441"/>
      </g>
      <circle cx="200" cy="400" r="9" fill="#444"/>
    </g>

    <!-- crank + pedals -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
        from="0 200 400" to="360 200 400" dur="2s" repeatCount="indefinite"/>
      <line x1="200" y1="345" x2="200" y2="455" stroke="#555" stroke-width="5"/>
      <rect x="188" y="340" width="24" height="9" rx="3" fill="#333"/>
      <rect x="188" y="451" width="24" height="9" rx="3" fill="#333"/>
    </g>

    <!-- frame + seat -->
    <rect x="196" y="300" width="8" height="102" fill="#444"/>
    <rect x="178" y="292" width="44" height="12" rx="6" fill="#2b2b2b"/>

    <!-- ===== ANTEATER ===== -->
    <g>
      <!-- tail -->
      <path d="M168,300 C130,312 110,345 118,375 C124,398 156,396 152,372
               C149,352 132,346 146,328 C156,316 168,308 180,304 Z"
            fill="url(#body)"/>
      <path d="M126,372 q12,-6 18,-2" stroke="#6f4626" stroke-width="3" fill="none"/>

      <!-- legs to pedals -->
      <path d="M186,300 C182,325 192,340 200,350" stroke="url(#body)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M214,300 C220,322 210,338 200,350" stroke="url(#body)" stroke-width="14" fill="none" stroke-linecap="round"/>
      <ellipse cx="200" cy="352" rx="10" ry="6" fill="#5e3a20"/>

      <!-- body -->
      <ellipse cx="200" cy="255" rx="42" ry="50" fill="url(#body)"/>
      <ellipse cx="200" cy="262" rx="26" ry="36" fill="url(#belly)"/>

      <!-- left arm reaching up -->
      <path d="M176,228 C162,205 158,185 160,170" stroke="url(#body)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="160" cy="168" r="8" fill="#5e3a20"/>
      <!-- right arm reaching up -->
      <path d="M224,228 C238,205 242,185 240,170" stroke="url(#body)" stroke-width="13" fill="none" stroke-linecap="round"/>
      <circle cx="240" cy="168" r="8" fill="#5e3a20"/>

      <!-- head -->
      <ellipse cx="200" cy="178" rx="34" ry="29" fill="url(#body)"/>
      <!-- ear -->
      <ellipse cx="176" cy="158" rx="9" ry="8" fill="#7a4e2c"/>
      <!-- long snout pointing up-right -->
      <path d="M218,170 Q252,146 276,128 Q262,156 220,188 Z" fill="#a06b43"/>
      <circle cx="274" cy="129" r="3" fill="#3a2414"/>
      <!-- eye -->
      <circle cx="208" cy="166" r="5" fill="#fff"/>
      <circle cx="210" cy="167" r="2.6" fill="#222"/>
      <!-- smile -->
      <path d="M188,192 q12,8 24,2" stroke="#5e3a20" stroke-width="2.5" fill="none"/>
    </g>

    <!-- ===== JUGGLING BOTTLES ===== -->
    <!-- bottle 1 (green) -->
    <g>
      <animateMotion dur="3s" repeatCount="indefinite" begin="0s"
        path="M160,168 Q200,68 240,168 Q200,68 160,168 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-6" y="-8" width="12" height="20" rx="5" fill="#3fae5a"/>
        <rect x="-3" y="-18" width="6" height="11" fill="#3fae5a"/>
        <rect x="-4" y="-22" width="8" height="5" rx="2" fill="#6b3f22"/>
        <rect x="-5" y="0" width="3" height="12" rx="1.5" fill="#fff" opacity="0.35"/>
      </g>
    </g>
    <!-- bottle 2 (blue) -->
    <g>
      <animateMotion dur="3s" repeatCount="indefinite" begin="1s"
        path="M160,168 Q200,68 240,168 Q200,68 160,168 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="-360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-6" y="-8" width="12" height="20" rx="5" fill="#3a8fd6"/>
        <rect x="-3" y="-18" width="6" height="11" fill="#3a8fd6"/>
        <rect x="-4" y="-22" width="8" height="5" rx="2" fill="#6b3f22"/>
        <rect x="-5" y="0" width="3" height="12" rx="1.5" fill="#fff" opacity="0.35"/>
      </g>
    </g>
    <!-- bottle 3 (orange) -->
    <g>
      <animateMotion dur="3s" repeatCount="indefinite" begin="2s"
        path="M160,168 Q200,68 240,168 Q200,68 160,168 Z"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <rect x="-6" y="-8" width="12" height="20" rx="5" fill="#ef8a2b"/>
        <rect x="-3" y="-18" width="6" height="11" fill="#ef8a2b"/>
        <rect x="-4" y="-22" width="8" height="5" rx="2" fill="#6b3f22"/>
        <rect x="-5" y="0" width="3" height="12" rx="1.5" fill="#fff" opacity="0.35"/>
      </g>
    </g>
  </g>
</svg>
