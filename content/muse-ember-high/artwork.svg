<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
<title id="title">Anteater riding a unicycle while juggling bottles</title>
<desc id="desc">A giant anteater with a long snout and bushy tail rides a unicycle across a sunny meadow, pedaling with its legs and juggling three colorful bottles.</desc>

<style>
  .bob { animation: bob .5s ease-in-out infinite alternate; transform-origin: 400px 340px; }
  @keyframes bob { from{transform:translateY(0)} to{transform:translateY(-7px)} }

  .wheel { animation: spin 1.1s linear infinite; transform-origin: 400px 460px; }
  .crank { animation: spin 1.1s linear infinite; transform-origin: 400px 460px; }
  @keyframes spin { to { transform: rotate(360deg);} }

  .tail { animation: sway 1.6s ease-in-out infinite alternate; transform-origin: 310px 320px; }
  @keyframes sway { from{transform:rotate(-3deg)} to{transform:rotate(5deg)} }

  .head { animation: dip 1s ease-in-out infinite alternate; transform-origin: 470px 260px; }
  @keyframes dip { from{transform:rotate(-2deg)} to{transform:rotate(3deg)} }

  .ear { animation: wiggle 1.2s ease-in-out infinite alternate; transform-origin: 445px 205px; }
  @keyframes wiggle { from{transform:rotate(-4deg)} to{transform:rotate(6deg)} }

  .armL { animation: juggleArm .55s ease-in-out infinite alternate; transform-origin: 460px 300px; }
  .armR { animation: juggleArm .55s ease-in-out infinite alternate-reverse; transform-origin: 490px 300px; }
  @keyframes juggleArm { from{transform:rotate(-7deg)} to{transform:rotate(9deg)} }

  .shadow { animation: shadow 0.5s ease-in-out infinite alternate; transform-origin: 400px 545px; }
  @keyframes shadow { from{transform:scaleX(1); opacity:.28} to{transform:scaleX(.88); opacity:.19} }

  .cloud1 { animation: drift 24s linear infinite; }
  .cloud2 { animation: drift 34s linear infinite; animation-delay:-16s; }
  .cloud3 { animation: drift 20s linear infinite; animation-delay:-7s; }
  @keyframes drift { from{transform:translateX(-220px)} to{transform:translateX(850px)} }

  .scroll { animation: scroll 1.1s linear infinite; }
  @keyframes scroll { to { transform: translateX(-80px);} }

  .sparkle { animation: twinkle 1s ease-in-out infinite alternate; }
  .s2 { animation-delay:.33s } .s3 { animation-delay:.66s }
  @keyframes twinkle { from{opacity:.2; transform:scale(.7)} to{opacity:1; transform:scale(1.15)} }

  .tongue { animation: lick 1.4s ease-in-out infinite; transform-origin: 565px 305px; }
  @keyframes lick { 0%,70%,100%{transform:scaleX(.2)} 85%{transform:scaleX(1)} }

  .bottleSpin { animation: tumble 1.8s linear infinite; }
  .bottleSpin2 { animation: tumble 1.8s linear infinite; animation-delay:.1s }
  .bottleSpin3 { animation: tumble 1.8s linear infinite; animation-delay:.2s }
  @keyframes tumble { to { transform: rotate(360deg);} }

  .scarf { animation: flutter .4s ease-in-out infinite alternate; transform-origin: 430px 245px; }
  @keyframes flutter { from{transform:rotate(-3deg)} to{transform:rotate(6deg)} }
</style>

<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ED6FF"/><stop offset="55%" stop-color="#BDEFFF"/><stop offset="100%" stop-color="#FFF3B0"/>
  </linearGradient>
  <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#C9A87A"/><stop offset="100%" stop-color="#8C7355"/>
  </linearGradient>
  <linearGradient id="tailGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A68A64"/><stop offset="100%" stop-color="#6B5638"/>
  </linearGradient>
  <radialGradient id="sunGrad"><stop offset="0%" stop-color="#FFF7AE"/><stop offset="100%" stop-color="#FFD93D"/></radialGradient>

  <!-- Bottle template -->
  <g id="bottle">
    <path d="M-6 -18 L6 -18 L6 -9 Q14 -3 14 8 L10 20 Q0 24 -10 20 L-14 8 Q-14 -3 -6 -9 Z" fill="inherit"/>
    <rect x="-6" y="-24" width="12" height="7" rx="2" fill="#D2691E"/>
    <rect x="-5" y="4" width="4" height="12" rx="2" fill="white" opacity=".45"/>
    <rect x="-10" y="9" width="20" height="7" rx="2" fill="white" opacity=".9"/>
    <circle cx="0" cy="12.5" r="2.2" fill="#333"/>
  </g>

  <!-- Juggling path: a looping arc above the paws -->
  <path id="jugglePath" d="M 470 235 C 430 150, 380 145, 375 205 C 370 150, 430 140, 470 180 C 515 130, 570 150, 555 205 C 540 150, 500 180, 470 235 Z" fill="none"/>
  <!-- Simpler predictable loop path used by animateMotion -->
  <path id="loopPath" d="M 470,230 C 420,120 350,130 375,200 C 400,260 470,260 470,230 C 470,260 545,260 565,200 C 585,130 520,120 470,230 Z" fill="none"/>
</defs>

<!-- SKY -->
<rect width="800" height="600" fill="url(#sky)"/>
<circle cx="680" cy="90" r="52" fill="url(#sunGrad)"/>
<circle cx="680" cy="90" r="70" fill="#FFD93D" opacity=".25"/>

<!-- Clouds -->
<g class="cloud1" opacity=".95">
  <ellipse cx="100" cy="80" rx="55" ry="22" fill="white"/><ellipse cx="135" cy="70" rx="40" ry="20" fill="white"/><ellipse cx="70" cy="70" rx="35" ry="16" fill="white"/>
</g>
<g class="cloud2" opacity=".85">
  <ellipse cx="80" cy="140" rx="45" ry="18" fill="white"/><ellipse cx="110" cy="130" rx="32" ry="15" fill="white"/>
</g>
<g class="cloud3" opacity=".7">
  <ellipse cx="100" cy="45" rx="38" ry="15" fill="white"/><ellipse cx="125" cy="38" rx="26" ry="12" fill="white"/>
</g>

<!-- Hills -->
<ellipse cx="180" cy="470" rx="260" ry="90" fill="#8ED081"/>
<ellipse cx="640" cy="480" rx="300" ry="110" fill="#7AC74F"/>
<ellipse cx="400" cy="500" rx="420" ry="80" fill="#5DBB4A"/>

<!-- Ground -->
<rect y="490" width="800" height="110" fill="#6CC551"/>
<rect y="490" width="800" height="10" fill="#8ED081"/>

<!-- Scrolling ground details (moves left, anteater stays center) -->
<g class="scroll" stroke="#4A9E3A" stroke-width="4" stroke-linecap="round">
  <path d="M40 530 h28 M160 555 h28 M280 525 h28 M400 560 h28 M520 528 h28 M640 555 h28 M760 530 h28 M880 555 h28"/>
  <path d="M90 575 h22 M220 580 h22 M340 570 h22 M460 580 h22 M580 572 h22 M700 580 h22 M820 572 h22" stroke="#7ED957"/>
</g>
<g class="scroll" fill="#3E8E32">
  <path d="M60 510 l5-14 5 14z"/><path d="M180 515 l5-14 5 14z"/><path d="M300 508 l5-14 5 14z"/>
  <path d="M420 515 l5-14 5 14z"/><path d="M540 510 l5-14 5 14z"/><path d="M660 515 l5-14 5 14z"/><path d="M780 510 l5-14 5 14z"/>
</g>

<!-- Flowers -->
<g font-size="16" text-anchor="middle">
  <text x="120" y="545">🌼</text><text x="260" y="565">🌸</text><text x="620" y="550">🌼</text><text x="720" y="570">🌸</text>
</g>

<!-- Shadow -->
<ellipse class="shadow" cx="400" cy="545" rx="150" ry="18" fill="black"/>

<!-- ============ UNICYCLE ============ -->
<g>
  <!-- Wheel -->
  <g class="wheel">
    <circle cx="400" cy="460" r="78" fill="none" stroke="#222" stroke-width="12"/>
    <circle cx="400" cy="460" r="78" fill="none" stroke="#E63946" stroke-width="4" stroke-dasharray="18 14"/>
    <circle cx="400" cy="460" r="62" fill="white" opacity=".12"/>
    <g stroke="#DDD" stroke-width="4">
      <line x1="400" y1="460" x2="400" y2="386"/><line x1="400" y1="460" x2="400" y2="534"/>
      <line x1="400" y1="460" x2="326" y2="460"/><line x1="400" y1="460" x2="474" y2="460"/>
      <line x1="400" y1="460" x2="348" y2="408"/><line x1="400" y1="460" x2="452" y2="512"/>
      <line x1="400" y1="460" x2="452" y2="408"/><line x1="400" y1="460" x2="348" y2="512"/>
    </g>
    <circle cx="400" cy="460" r="12" fill="#888" stroke="#555" stroke-width="3"/>
  </g>
  <!-- Fork + seat post -->
  <path d="M400 460 L378 360 M400 460 L422 360" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="460" x2="400" y2="350" stroke="#555" stroke-width="9"/>
  <!-- Seat -->
  <path d="M368 352 Q400 338 432 352 Q432 364 400 364 Q368 364 368 352Z" fill="#7A4A21"/>
  <!-- Crank / pedals -->
  <g class="crank">
    <line x1="400" y1="460" x2="400" y2="418" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <line x1="400" y1="460" x2="400" y2="502" stroke="#333" stroke-width="7" stroke-linecap="round"/>
    <rect x="382" y="408" width="36" height="10" rx="4" fill="#222"/>
    <rect x="382" y="502" width="36" height="10" rx="4" fill="#222"/>
  </g>
</g>

<!-- ============ ANTEATER ============ -->
<g class="bob">
  <!-- Bushy tail -->
  <g class="tail">
    <path d="M315 315 Q210 280 185 340 Q170 395 230 415 Q300 430 330 380 Q345 350 315 315Z" fill="url(#tailGrad)"/>
    <path d="M230 320 Q200 350 215 390 M265 315 Q245 360 260 400" stroke="#5A4630" stroke-width="6" fill="none" opacity=".6" stroke-linecap="round"/>
  </g>

  <!-- Back leg (far side, darker, pedaling) -->
  <g class="crank" opacity=".85">
    <path d="M370 360 Q360 420 400 502" stroke="#6B5638" stroke-width="18" fill="none" stroke-linecap="round"/>
    <ellipse cx="400" cy="508" rx="18" ry="9" fill="#5A4630"/>
  </g>

  <!-- Body -->
  <ellipse cx="410" cy="320" rx="115" ry="58" fill="url(#bodyGrad)"/>
  <!-- Anteater black band with white edges -->
  <path d="M335 275 Q380 260 420 285 L425 355 Q380 385 340 365 Q320 320 335 275Z" fill="#2B2B2B"/>
  <path d="M330 272 Q375 255 420 280" stroke="white" stroke-width="5" fill="none"/>
  <path d="M335 368 Q380 390 425 360" stroke="white" stroke-width="5" fill="none"/>
  <ellipse cx="465" cy="345" rx="45" ry="28" fill="#E8D9B5" opacity=".8"/>

  <!-- Scarf (for motion) -->
  <g class="scarf">
    <path d="M425 250 Q390 260 370 285 L385 300 Q410 275 435 268Z" fill="#E63946"/>
    <path d="M370 285 L345 270 L340 290 L360 305Z" fill="#C1121F"/>
  </g>

  <!-- Head + long snout -->
  <g class="head">
    <!-- Ear -->
    <g class="ear">
      <circle cx="445" cy="205" r="16" fill="#8C7355"/><circle cx="445" cy="205" r="8" fill="#E8D9B5"/>
    </g>
    <!-- Eye -->
    <circle cx="462" cy="232" r="10" fill="white"/><circle cx="465" cy="233" r="5.5" fill="black"/><circle cx="467" cy="230" r="2" fill="white"/>
    <!-- Head -->
    <path d="M425 215 Q475 200 505 240 Q520 265 505 285 Q470 295 445 270 Q420 245 425 215Z" fill="#C9A87A"/>
    <!-- Long tubular snout pointing forward-down -->
    <path d="M495 245 Q560 255 585 285 Q595 300 580 308 Q540 312 505 295 Q490 275 495 245Z" fill="#B9976B"/>
    <ellipse cx="580" cy="298" rx="10" ry="7" fill="#333"/>
    <!-- Tongue flicking out -->
    <g class="tongue"><path d="M585 303 Q620 308 632 300 Q620 315 585 312Z" fill="#FF6B9D"/></g>
    <!-- Smile / mouth line -->
    <path d="M505 285 Q545 295 575 300" stroke="#6B5638" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Front leg (near side, pedaling) -->
  <g class="crank">
    <path d="M430 365 Q445 420 400 418" stroke="#8C7355" stroke-width="20" fill="none" stroke-linecap="round"/>
    <ellipse cx="400" cy="414" rx="19" ry="9" fill="#6B5638"/>
  </g>

  <!-- Juggling arms -->
  <g class="armL">
    <path d="M460 300 Q440 255 455 225" stroke="#8C7355" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="456" cy="222" r="11" fill="#6B5638"/>
  </g>
  <g class="armR">
    <path d="M490 300 Q515 255 545 232" stroke="#8C7355" stroke-width="16" fill="none" stroke-linecap="round"/>
    <circle cx="548" cy="230" r="11" fill="#6B5638"/>
  </g>

  <!-- Hat for fun -->
  <g transform="rotate(-8 445 195)">
    <rect x="418" y="185" width="54" height="10" rx="5" fill="#222"/>
    <rect x="428" y="158" width="34" height="30" rx="4" fill="#222"/>
    <rect x="428" y="178" width="34" height="8" fill="#E63946"/>
  </g>
</g>

<!-- ============ JUGGLING BOTTLES ============ -->
<!-- Bottle 1: green -->
<g>
  <g color="#2EC4B6">
    <use href="#bottle" fill="#2EC4B6"/>
    <animateMotion dur="1.8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </g>
</g>
<!-- Bottle 2: orange -->
<g>
  <g color="#FF9F1C">
    <use href="#bottle" fill="#FF9F1C"/>
    <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </g>
</g>
<!-- Bottle 3: purple/blue -->
<g>
  <g color="#9B5DE5">
    <use href="#bottle" fill="#9B5DE5"/>
    <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" rotate="auto">
      <mpath href="#loopPath"/>
    </animateMotion>
  </g>
</g>

<!-- Sparkles around juggling -->
<g fill="#FFD93D">
  <path class="sparkle" d="M340 150 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  <path class="sparkle s2" d="M600 140 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
  <path class="sparkle s3" d="M470 95 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
</g>

<!-- Motion lines behind wheel -->
<g stroke="white" stroke-width="4" stroke-linecap="round" opacity=".7">
  <line x1="280" y1="440" x2="310" y2="440"/><line x1="265" y1="470" x2="305" y2="470"/><line x1="285" y1="500" x2="315" y2="500"/>
</g>

<!-- Caption banner -->
<g>
  <rect x="220" y="14" width="360" height="36" rx="18" fill="white" opacity=".85"/>
  <text x="400" y="38" text-anchor="middle" font-family="Comic Sans MS, Arial, sans-serif" font-size="17" font-weight="bold" fill="#333">Anteater Unicycle Juggler! 🚲🍾</text>
</g>
</svg>
