<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#fff4d6"/>
    </linearGradient>
    <g id="bottle">
      <rect x="-7" y="-4" width="14" height="24" rx="4" fill="#2e9e5b" stroke="#1b6b3a" stroke-width="1.5"/>
      <rect x="-3" y="-18" width="6" height="15" rx="2" fill="#2e9e5b" stroke="#1b6b3a" stroke-width="1.5"/>
      <rect x="-3.5" y="-21" width="7" height="4" rx="1" fill="#c33"/>
      <rect x="-7" y="5" width="14" height="7" fill="#fff" opacity="0.8"/>
    </g>
  </defs>

  <rect width="600" height="500" fill="url(#sky)"/>
  <rect y="436" width="600" height="64" fill="#8fc46a"/>
  <ellipse cx="300" cy="438" rx="90" ry="7" fill="#000" opacity="0.15"/>

  <!-- whole rider wobbles around the wheel hub -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2 300 376;2 300 376;-2 300 376" dur="2s" repeatCount="indefinite"/>

    <!-- wheel -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 376" to="360 300 376" dur="2s" repeatCount="indefinite"/>
      <circle cx="300" cy="376" r="60" fill="none" stroke="#333" stroke-width="8"/>
      <circle cx="300" cy="376" r="52" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#666" stroke-width="2">
        <line x1="300" y1="324" x2="300" y2="428"/>
        <line x1="248" y1="376" x2="352" y2="376"/>
        <line x1="263" y1="339" x2="337" y2="413"/>
        <line x1="337" y1="339" x2="263" y2="413"/>
      </g>
      <circle cx="300" cy="376" r="7" fill="#c33"/>
    </g>

    <!-- fork and seat post -->
    <line x1="300" y1="376" x2="300" y2="318" stroke="#444" stroke-width="6" stroke-linecap="round"/>
    <rect x="278" y="308" width="44" height="12" rx="6" fill="#c33"/>

    <!-- tail -->
    <path d="M268 285 C230 300 205 270 215 235 C235 255 250 255 270 262 Z" fill="#6b4a2f" stroke="#3e2a18" stroke-width="2"/>
    <path d="M222 250 C235 262 248 262 262 266" fill="none" stroke="#3e2a18" stroke-width="2"/>

    <!-- back leg (opposite pedal) -->
    <line x1="292" y1="305" x2="282" y2="388" stroke="#4d3520" stroke-width="12" stroke-linecap="round">
      <animate attributeName="x2" values="275;282.3;300;317.7;325;317.7;300;282.3;275" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="376;393.7;401;393.7;376;358.3;351;358.3;376" dur="2s" repeatCount="indefinite"/>
    </line>
    <!-- front leg -->
    <line x1="308" y1="305" x2="325" y2="376" stroke="#6b4a2f" stroke-width="12" stroke-linecap="round">
      <animate attributeName="x2" values="325;317.7;300;282.3;275;282.3;300;317.7;325" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="376;393.7;401;393.7;376;358.3;351;358.3;376" dur="2s" repeatCount="indefinite"/>
    </line>

    <!-- body -->
    <ellipse cx="300" cy="265" rx="38" ry="50" fill="#8a6a4a" stroke="#3e2a18" stroke-width="2"/>
    <path d="M300 218 C335 240 335 295 300 313 C318 290 318 245 300 218 Z" fill="#2b2b2b" opacity="0.8"/>

    <!-- head and long snout -->
    <ellipse cx="330" cy="212" rx="24" ry="20" fill="#8a6a4a" stroke="#3e2a18" stroke-width="2"/>
    <path d="M345 202 C385 200 430 218 455 236 C430 240 385 232 345 228 Z" fill="#a4825f" stroke="#3e2a18" stroke-width="2"/>
    <circle cx="455" cy="236" r="4" fill="#222"/>
    <circle cx="332" cy="205" r="5" fill="#fff"/>
    <circle cx="334" cy="205" r="2.5" fill="#111"/>
    <path d="M318 194 L312 178 L328 190 Z" fill="#6b4a2f" stroke="#3e2a18" stroke-width="1.5"/>
    <!-- tongue -->
    <path d="M455 236 q15 -2 25 6" fill="none" stroke="#e66" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M455 236 q15 -2 25 6;M455 236 q12 6 20 -2;M455 236 q15 -2 25 6" dur="0.8s" repeatCount="indefinite"/>
    </path>

    <!-- arms (juggling) -->
    <line x1="285" y1="245" x2="255" y2="238" stroke="#6b4a2f" stroke-width="9" stroke-linecap="round">
      <animate attributeName="y2" values="238;228;238" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="318" y1="248" x2="348" y2="240" stroke="#6b4a2f" stroke-width="9" stroke-linecap="round">
      <animate attributeName="y2" values="240;230;240" dur="0.8s" begin="-0.4s" repeatCount="indefinite"/>
    </line>

    <!-- juggled bottles -->
    <g>
      <animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" path="M255 225 C255 20 350 20 350 225 C350 262 255 262 255 225 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-0.8s" repeatCount="indefinite" path="M255 225 C255 20 350 20 350 225 C350 262 255 262 255 225 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
    <g>
      <animateMotion dur="2.4s" begin="-1.6s" repeatCount="indefinite" path="M255 225 C255 20 350 20 350 225 C350 262 255 262 255 225 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
  </g>
</svg>
