<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="title desc">
  <title id="title">The Amazing Anteater</title>
  <desc id="desc">A cheerful anteater pedals a unicycle and juggles three colorful bottles beneath circus lights.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#172b4d"/>
      <stop offset="1" stop-color="#38556d"/>
    </linearGradient>
    <radialGradient id="spotlight">
      <stop offset="0" stop-color="#fff6ce" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff6ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b98557"/>
      <stop offset="1" stop-color="#765039"/>
    </linearGradient>
    <linearGradient id="tailFur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#47352f"/>
      <stop offset=".55" stop-color="#805c43"/>
      <stop offset="1" stop-color="#a87952"/>
    </linearGradient>
    <linearGradient id="bottleGlass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset=".35" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset=".7" stop-color="#ffffff" stop-opacity=".45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".12"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="6" flood-color="#091322" flood-opacity=".35"/>
    </filter>
    <g id="spark" fill="#ffe7a3">
      <path d="M0-8 2-2 8 0 2 2 0 8-2 2-8 0-2-2Z"/>
    </g>
    <g id="bottle">
      <path d="M-9-36h18v15c0 5 12 9 12 20v31c0 8-5 12-12 12h-18c-7 0-12-4-12-12V-1c0-11 12-15 12-20Z" fill="currentColor" stroke="#e9ffff" stroke-opacity=".75" stroke-width="2"/>
      <path d="M-9-36h18v15c0 5 12 9 12 20v31c0 8-5 12-12 12h-18c-7 0-12-4-12-12V-1c0-11 12-15 12-20Z" fill="url(#bottleGlass)"/>
      <rect x="-11" y="-42" width="22" height="8" rx="3" fill="#f7d477" stroke="#fff0b8" stroke-width="2"/>
      <path d="M-18 7h36v22h-36Z" fill="#fff5dc" opacity=".9"/>
      <path d="M-10 13h20M-10 19h14" stroke="#6d5860" stroke-width="3" stroke-linecap="round" opacity=".65"/>
      <path d="M-12-17v-6M-15 34v-27" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
    </g>
  </defs>

  <style>
    .wheel { animation: spin 1.25s linear infinite; transform-origin: 620px 619px; }
    .crank { animation: spin 1.25s linear infinite; transform-origin: 620px 619px; }
    .rider { animation: bob 1.25s ease-in-out infinite; }
    .tail { animation: sway 2.5s ease-in-out infinite; transform-origin: 520px 405px; }
    .ear { animation: twitch 3.75s ease-in-out infinite; transform-origin: 672px 243px; }
    .leg-a { animation: pedalA 1.25s ease-in-out infinite; transform-origin: 594px 455px; }
    .leg-b { animation: pedalB 1.25s ease-in-out infinite; transform-origin: 646px 455px; }
    .arm-a { animation: waveA 1.5s ease-in-out infinite; transform-origin: 582px 360px; }
    .arm-b { animation: waveB 1.5s ease-in-out infinite; transform-origin: 689px 348px; }
    .star { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .star:nth-child(2n) { animation-delay: -.7s; }
    .star:nth-child(3n) { animation-delay: -1.3s; }
    .shadow { animation: shadow 1.25s ease-in-out infinite; transform-origin: 620px 735px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-9px); } }
    @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(6deg); } }
    @keyframes twitch { 0%,88%,100% { transform: rotate(0); } 92% { transform: rotate(-12deg); } 96% { transform: rotate(5deg); } }
    @keyframes pedalA { 0%,100% { transform: rotate(-13deg); } 50% { transform: rotate(15deg); } }
    @keyframes pedalB { 0%,100% { transform: rotate(15deg); } 50% { transform: rotate(-13deg); } }
    @keyframes waveA { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(8deg); } }
    @keyframes waveB { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-7deg); } }
    @keyframes twinkle { 0%,100% { opacity: .3; transform: scale(.65); } 50% { opacity: 1; transform: scale(1.15); } }
    @keyframes shadow { 0%,100% { transform: scaleX(1); opacity: .45; } 50% { transform: scaleX(.94); opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { * { animation-play-state: paused !important; } }
  </style>

  <!-- Night-time circus backdrop -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <ellipse cx="620" cy="380" rx="500" ry="430" fill="url(#spotlight)"/>
  <path d="M0 0h1200v55C1040 105 1000 30 850 72 710 110 665 35 520 70 350 110 310 28 160 70 95 89 45 82 0 64Z" fill="#be4d56"/>
  <path d="M0 0h1200v24H0Z" fill="#f3bd65"/>
  <path d="M0 57Q160 132 320 57T640 57T960 57T1280 57" fill="none" stroke="#f7d99a" stroke-width="5" opacity=".65"/>
  <g fill="#f9d98b">
    <circle cx="105" cy="88" r="7"/><circle cx="260" cy="92" r="7"/><circle cx="420" cy="84" r="7"/>
    <circle cx="585" cy="87" r="7"/><circle cx="750" cy="84" r="7"/><circle cx="915" cy="91" r="7"/><circle cx="1080" cy="83" r="7"/>
  </g>
  <g opacity=".85">
    <use xlink:href="#spark" x="180" y="210" class="star"/>
    <use xlink:href="#spark" x="325" y="140" class="star"/>
    <use xlink:href="#spark" x="970" y="190" class="star"/>
    <use xlink:href="#spark" x="1050" y="335" class="star"/>
    <use xlink:href="#spark" x="160" y="410" class="star"/>
    <use xlink:href="#spark" x="880" y="105" class="star"/>
    <circle class="star" cx="260" cy="315" r="4" fill="#fff3c4"/>
    <circle class="star" cx="1000" cy="440" r="5" fill="#fff3c4"/>
    <circle class="star" cx="405" cy="225" r="4" fill="#fff3c4"/>
  </g>
  <path d="M0 704Q260 674 470 705T890 700T1200 694V800H0Z" fill="#14283b"/>
  <path d="M0 735Q300 713 600 738T1200 729" fill="none" stroke="#638078" stroke-width="3" opacity=".45"/>
  <ellipse class="shadow" cx="620" cy="738" rx="175" ry="23" fill="#07131e" filter="url(#blur)"/>

  <!-- Juggling bottles, equally phased around one continuous route -->
  <g filter="url(#softShadow)">
    <g color="#58c9c3">
      <use xlink:href="#bottle"/>
      <animateMotion dur="3s" repeatCount="indefinite" rotate="auto" path="M545 275 C540 115 700 60 760 245 C805 365 575 390 545 275 Z"/>
    </g>
    <g color="#ed7180">
      <use xlink:href="#bottle"/>
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" rotate="auto" path="M545 275 C540 115 700 60 760 245 C805 365 575 390 545 275 Z"/>
    </g>
    <g color="#8b79d0">
      <use xlink:href="#bottle"/>
      <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" rotate="auto" path="M545 275 C540 115 700 60 760 245 C805 365 575 390 545 275 Z"/>
    </g>
  </g>

  <!-- Unicycle -->
  <g filter="url(#softShadow)">
    <g class="wheel" fill="none">
      <circle cx="620" cy="619" r="111" stroke="#111923" stroke-width="18"/>
      <circle cx="620" cy="619" r="101" stroke="#d5d9d5" stroke-width="5"/>
      <g stroke="#9daeb0" stroke-width="3">
        <path d="M620 518v202M519 619h202M549 548l142 142M549 690l142-142"/>
        <path d="M582 527l76 184M528 581l184 76M528 657l184-76M582 711l76-184"/>
      </g>
      <circle cx="620" cy="619" r="15" fill="#f0b957" stroke="#172331" stroke-width="6"/>
      <path d="M620 508v20" stroke="#f4d98b" stroke-width="7" stroke-linecap="round"/>
    </g>
    <path d="M620 614 594 479M620 614l28-135" fill="none" stroke="#d9e2dc" stroke-width="13" stroke-linecap="round"/>
    <path d="M620 614 594 479" fill="none" stroke="#87989c" stroke-width="4"/>
    <path d="M570 477q49-18 99 0l-7 20h-85Z" fill="#432f35" stroke="#171d28" stroke-width="5"/>
    <g class="crank" stroke="#f0b957" stroke-width="8" stroke-linecap="round">
      <path d="M578 619h84"/>
      <path d="M570 619h22M648 619h22" stroke="#202c38" stroke-width="11"/>
    </g>
  </g>

  <!-- Rider -->
  <g class="rider" filter="url(#softShadow)">
    <!-- Huge characteristic tail -->
    <g class="tail">
      <path d="M542 393C473 350 401 361 340 401c-45 30-82 73-111 126 66-17 108-11 152 8 62 27 134-19 176-86Z" fill="url(#tailFur)" stroke="#3c302c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M504 400c-75-6-149 43-218 99M515 420c-66 12-113 48-153 91M477 386c-64 5-130 40-184 83" fill="none" stroke="#c0986d" stroke-opacity=".38" stroke-width="5" stroke-linecap="round"/>
      <path d="m294 445-36 66m76-89-44 93m84-109-51 115m87-124-48 112m80-114-39 88" stroke="#342c2a" stroke-opacity=".35" stroke-width="4"/>
    </g>

    <!-- Far leg -->
    <g class="leg-b">
      <path d="M648 443q23 55 5 93l-18 70" fill="none" stroke="#634634" stroke-width="31" stroke-linecap="round"/>
      <path d="m635 601-28 17q-9 8 4 14h47q13-3 7-17l-8-16Z" fill="#332c2b"/>
    </g>

    <!-- Body -->
    <path d="M536 356c22-53 99-74 153-29 46 38 46 119 3 153-43 34-131 24-163-29-18-30-10-63 7-95Z" fill="url(#fur)" stroke="#4b392f" stroke-width="5"/>
    <path d="M583 352c32-16 72 0 87 34 18 40 0 85-37 99-44-4-75-29-77-66-2-28 8-52 27-67Z" fill="#d6b181" opacity=".75"/>
    <path d="M541 350q50 12 91 79t92 28q-17 40-69 39-75-2-107-70-19-41-7-76Z" fill="#403633" opacity=".9"/>
    <path d="M547 354q48 17 85 79" fill="none" stroke="#eee0bd" stroke-width="13" stroke-linecap="round"/>

    <!-- Near leg -->
    <g class="leg-a">
      <path d="M592 443q-20 56 5 91l25 66" fill="none" stroke="#8b6144" stroke-width="34" stroke-linecap="round"/>
      <path d="m622 594 7 20q7 17-8 19h-48q-13-5-3-14l31-20Z" fill="#403431" stroke="#2d2928" stroke-width="3"/>
      <path d="M579 625h39" stroke="#b89670" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Neck and head -->
    <path d="M628 344q5-73 48-93l61 75q-42 60-109 18Z" fill="url(#fur)"/>
    <path d="M633 260c22-33 68-37 94-10 15 15 16 30 26 38 22 4 63 2 91 13 18 7 19 24 2 31-35 14-92 12-127 3-25 29-72 28-94-2-20-27-13-51 8-73Z" fill="url(#fur)" stroke="#4b392f" stroke-width="5" stroke-linejoin="round"/>
    <path d="M715 292q62-5 125 12c13 4 15 14 6 22-35 14-92 12-127 3Z" fill="#3d3432"/>
    <path d="M823 301q24 2 29 10 5 11-10 17l-20-2q13-11 1-25Z" fill="#202729"/>
    <path d="M637 292q19 49 73 45-29 25-62 8-29-15-28-47Z" fill="#d5af7d"/>
    <g class="ear">
      <path d="M653 259q-22-46 12-53 33 8 25 52Z" fill="#946846" stroke="#4b392f" stroke-width="5"/>
      <path d="M660 246q-10-24 5-28 16 6 14 29Z" fill="#d69a83"/>
    </g>
    <ellipse cx="701" cy="272" rx="10" ry="12" fill="#f8e9c9"/>
    <circle cx="704" cy="273" r="6" fill="#18252a"/>
    <circle cx="706" cy="270" r="2" fill="#fff"/>
    <path d="M687 253q17-9 30 2" fill="none" stroke="#4b392f" stroke-width="5" stroke-linecap="round"/>
    <path d="M718 316q13 9 26 2" fill="none" stroke="#e6c49a" stroke-width="3" stroke-linecap="round"/>

    <!-- Left juggling arm -->
    <g class="arm-a">
      <path d="M574 359q-44-17-54-60l-8-45" fill="none" stroke="#9c704e" stroke-width="29" stroke-linecap="round"/>
      <path d="M512 263q-20-8-21-24m21 24q2-23 15-29m-15 29q18-13 29-7" fill="none" stroke="#403633" stroke-width="9" stroke-linecap="round"/>
      <path d="M568 350q-28-14-39-38" fill="none" stroke="#d5ad7c" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- Right juggling arm -->
    <g class="arm-b">
      <path d="M686 353q42-14 56-48l24-47" fill="none" stroke="#a87952" stroke-width="31" stroke-linecap="round"/>
      <path d="M767 260q-3-23 8-32m-8 32q15-19 29-15m-29 15q22-5 29 6" fill="none" stroke="#403633" stroke-width="9" stroke-linecap="round"/>
      <path d="M696 347q26-12 38-33" fill="none" stroke="#d5ad7c" stroke-width="6" stroke-linecap="round" opacity=".55"/>
    </g>

    <!-- Bow tie -->
    <path d="M645 337q-28-18-30 9 3 25 32 4Zm18 3q27-20 33 6 0 25-31 7Z" fill="#e56b69" stroke="#753e45" stroke-width="3"/>
    <circle cx="655" cy="345" r="10" fill="#f2bd65"/>
  </g>

  <!-- Foreground flourishes -->
  <g fill="none" stroke="#f5cf7d" stroke-linecap="round" opacity=".7">
    <path d="M408 653q-45-19-78 4" stroke-width="4"/>
    <path d="M827 653q45-19 78 4" stroke-width="4"/>
    <path d="M381 675h-42M901 675h-42" stroke-width="3"/>
  </g>
</svg>
