<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="760" viewBox="0 0 820 760" role="img" aria-labelledby="title description">
  <title id="title">The juggling anteater</title>
  <desc id="description">A giant anteater in a red scarf pedals a teal unicycle and juggles three bottles beneath a golden circus spotlight.</desc>

  <defs>
    <linearGradient id="paper" x2="0" y2="1">
      <stop stop-color="#fffaec"/>
      <stop offset="1" stop-color="#fae9cb"/>
    </linearGradient>
    <linearGradient id="spotlight" x2="0" y2="1">
      <stop stop-color="#ffedb9"/>
      <stop offset="1" stop-color="#f5bd75"/>
    </linearGradient>
    <linearGradient id="tail-coat" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#62716b"/>
      <stop offset=".62" stop-color="#3d5353"/>
      <stop offset="1" stop-color="#273e42"/>
    </linearGradient>
    <pattern id="stipple" width="9" height="9" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r=".8" fill="#a75c42"/>
      <circle cx="6" cy="6" r=".55" fill="#a75c42"/>
    </pattern>
    <path id="glint" d="M0-12Q1.8-1.8 10 0 1.8 1.8 0 12-1.8 1.8-10 0-1.8-1.8 0-12Z"/>
    <path id="corner" d="M28 86V48Q28 28 48 28H86 M39 66V50Q39 39 50 39H66"/>
    <path id="spoke" d="M419 581 426 515"/>
    <path id="cascade" d="M339 267 Q435-24 547 270 Q538 290 529 266 Q419-68 309 270 Q321 291 339 267Z"/>

    <g id="bottle" stroke="#243638" stroke-linejoin="round" stroke-width="2.8">
      <path fill="currentColor" d="M-6-31H6v14c0 4 2 7 5 10 4 3 5 7 5 12v23q0 7-7 7H-9q-7 0-7-7V5c0-5 1-9 5-12 3-3 5-6 5-10Z"/>
      <path d="M9-8c5 5 7 8 7 13v23q0 7-7 7H-8q-6 0-7-5C4 32 10 21 9-8Z" fill="#243638" opacity=".18" stroke="none"/>
      <path d="M-15 7Q0 3 15 7v14Q0 25-15 21Z" fill="#fff0ca" stroke-width="1.8"/>
      <path d="m0 9 4 5-4 5-4-5Z" fill="currentColor" stroke="none"/>
      <path d="M-8-35h16v7H-8z" fill="#f3ce79"/>
      <path d="M-3-34v4m6-4v4" stroke-width="1.1"/>
      <path d="M-6-9q-5 4-6 11m0 23v3" fill="none" stroke="#fff4d6" stroke-width="2" opacity=".84"/>
    </g>

    <g id="pedal">
      <rect x="-17" y="-2" width="34" height="8" rx="3" fill="#263b40" stroke="#213539" stroke-width="2"/>
      <path d="M-13 0h26" stroke="#91bbb0" stroke-width="2"/>
      <path d="M-10 3h6m8 0h6" stroke="#e9b972" stroke-width="1.5"/>
    </g>
    <path id="back-shoe" d="M-16-15c5-5 15-4 20 2 4 1 11 2 12 7 1 4-4 5-9 5h-19q-9 0-7-7Z" fill="#4b5551" stroke="#243638" stroke-width="3"/>
    <g id="front-shoe">
      <path d="M-17-17c8-5 17-2 21 4C12-12 18-9 17-4q-1 4-8 4h-22q-8 0-8-6c0-5 2-9 4-11Z" fill="#d5c3a3" stroke="#243638" stroke-width="3"/>
      <path d="m4-9 2 5m3-6 3 5" fill="none" stroke="#6a7165" stroke-width="1.7"/>
    </g>
  </defs>

  <style>
    svg { stroke-linecap: round; stroke-linejoin: round; }
    .outline { stroke: #243638; stroke-width: 4; }
    .still { display: none; }
    .wheel { transform-origin: 419px 592px; animation: wheel-turn 1.8s linear infinite; }
    .rider { transform-origin: 407px 472px; animation: balance 1.8s ease-in-out infinite; }
    .tail { transform-origin: 357px 454px; animation: tail-swish 1.8s ease-in-out infinite; }
    .scarf { transform-origin: 401px 368px; animation: scarf-flutter .9s ease-in-out infinite; }
    .star-a { animation: twinkle 2.4s ease-in-out infinite; }
    .star-b { animation: twinkle 2.4s .8s ease-in-out infinite; }
    .star-c { animation: twinkle 2.4s 1.6s ease-in-out infinite; }
    @keyframes wheel-turn { to { transform: rotate(1turn); } }
    @keyframes balance { 0%, 100% { transform: rotate(-1.3deg); } 50% { transform: rotate(1.3deg) translateY(-3px); } }
    @keyframes tail-swish { 0%, 100% { transform: rotate(-1.5deg); } 50% { transform: rotate(2deg); } }
    @keyframes scarf-flutter { 0%, 100% { transform: rotate(-2deg); } 50% { transform: rotate(4deg); } }
    @keyframes twinkle { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) {
      .wheel, .rider, .tail, .scarf, .star-a, .star-b, .star-c { animation: none; }
      .moving { display: none; }
      .still { display: inline; }
    }
  </style>

