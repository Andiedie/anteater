<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<title>Anteater Riding Unicycle While Juggling Bottles</title>
<style>
  @keyframes roadMove { to { stroke-dashoffset: -100; } }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.8);} 50% { opacity: 1; transform: scale(1.2);} }
  @keyframes cloudDrift1 { from { transform: translateX(850px);} to { transform: translateX(-250px);} }
  @keyframes cloudDrift2 { from { transform: translateX(900px);} to { transform: translateX(-250px);} }
  @keyframes bounceText { 0%,100% { transform: translateY(0);} 50% { transform: translateY(-8px);} }
  .road-line { animation: roadMove .6s linear infinite; }
  .cloud1 { animation: cloudDrift1 22s linear infinite; }
  .cloud2 { animation: cloudDrift2 32s linear infinite; }
  .cloud3 { animation: cloudDrift1 28s linear infinite; animation-delay: -12s; }
  .sparkle { animation: twinkle 1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .title-bounce { animation: bounceText 1.6s ease-in-out infinite; }
</style>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7DD3FC"/>
    <stop offset="60%" stop-color="#E0F2FE"/>
    <stop offset="100%" stop-color="#FEF9C3"/>
  </linearGradient>
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#86EFAC"/>
    <stop offset="100%" stop-color="#4ADE80"/>
  </linearGradient>
  <radialGradient id="sunG" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#FEF08A"/>
    <stop offset="60%" stop-color="#FACC15"/>
    <stop offset="100%" stop-color="#FB923C"/>
  </radialGradient>
  <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#D9B48F"/>
    <stop offset="100%" stop-color="#A67C52"/>
  </linearGradient>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="600" fill="url(#sky)"/>
<circle cx="650" cy="95" r="55" fill="url(#sunG)" opacity="0.95">
  <animate attributeName="r" values="55;58;55" dur="3s" repeatCount="indefinite"/>
</circle>
<g stroke="#FDE047" stroke-width="6" stroke-linecap="round" opacity="0.8">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 650 95" to="360 650 95" dur="18s" repeatCount="indefinite"/>
    <line x1="650" y1="15" x2="650" y2="30"/>
    <line x1="650" y1="160" x2="650" y2="175"/>
    <line x1="570" y1="95" x2="585" y2="95"/>
    <line x1="715" y1="95" x2="730" y2="95"/>
    <line x1="594" y1="39" x2="604" y2="49"/>
    <line x1="696" y1="141" x2="706" y2="151"/>
    <line x1="706" y1="39" x2="696" y2="49"/>
    <line x1="604" y1="141" x2="594" y2="151"/>
  </g>
</g>

<!-- clouds -->
<g class="cloud1" opacity="0.95">
  <ellipse cx="0" cy="110" rx="55" ry="22" fill="white"/>
  <ellipse cx="35" cy="100" rx="40" ry="20" fill="white"/>
  <ellipse cx="-30" cy="102" rx="30" ry="16" fill="white"/>
</g>
<g class="cloud2" opacity="0.9">
  <ellipse cx="0" cy="170" rx="45" ry="18" fill="white"/>
  <ellipse cx="30" cy="162" rx="32" ry="15" fill="white"/>
</g>
<g class="cloud3" opacity="0.85">
  <ellipse cx="0" cy="70" rx="35" ry="14" fill="white"/>
  <ellipse cx="25" cy="65" rx="25" ry="12" fill="white"/>
</g>

<!-- distant hills -->
<path d="M0,480 L120,380 L240,480 Z" fill="#BBF7D0" opacity="0.8"/>
<path d="M180,480 L340,350 L500,480 Z" fill="#A7F3D0" opacity="0.9"/>
<path d="M460,480 L600,390 L740,480 Z" fill="#BBF7D0" opacity="0.8"/>

<!-- ground + road -->
<rect x="0" y="480" width="800" height="120" fill="url(#groundG)"/>
<rect x="0" y="505" width="800" height="70" fill="#57534E"/>
<rect x="0" y="505" width="800" height="10" fill="#78716C"/>
<line x1="0" y1="542" x2="800" y2="542" stroke="white" stroke-width="6" stroke-dasharray="34 26" class="road-line"/>
<ellipse cx="400" cy="495" rx="120" ry="12" fill="black" opacity="0.15">
  <animate attributeName="rx" values="120;110;120" dur="0.6s" repeatCount="indefinite"/>
</ellipse>

<!-- faint juggling guide -->
<ellipse cx="400" cy="155" rx="55" ry="85" fill="none" stroke="#0284C7" stroke-width="2" stroke-dasharray="8 8" opacity="0.25"/>

<!-- RIDER GROUP (bobs) -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="0.6s" repeatCount="indefinite"/>

  <!-- TAIL behind -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 320 240; 8 320 240; -6 320 240" dur="1.2s" repeatCount="indefinite"/>
    <path d="M330,210 C 240,160 170,170 155,235 C 150,270 180,310 230,315 C 270,318 310,285 335,260 Z" fill="#7A4E2D" stroke="#4A2E18" stroke-width="4" stroke-linejoin="round"/>
    <path d="M300,220 C 250,195 200,200 185,235" fill="none" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M305,245 C 260,225 210,230 200,260" fill="none" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
    <path d="M310,268 C 275,255 230,257 220,280" fill="none" stroke="#5C3A21" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- UNICYCLE -->
  <!-- frame -->
  <line x1="400" y1="430" x2="385" y2="325" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="430" x2="415" y2="325" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  <line x1="400" y1="325" x2="400" y2="305" stroke="#1F2937" stroke-width="8" stroke-linecap="round"/>
  <!-- seat -->
  <ellipse cx="400" cy="298" rx="38" ry="12" fill="#111827" stroke="black" stroke-width="2"/>
  <rect x="365" y="288" width="70" height="12" rx="6" fill="#1F2937"/>

  <!-- wheel -->
  <circle cx="400" cy="430" r="58" fill="#F8FAFC" stroke="#1F2937" stroke-width="14"/>
  <circle cx="400" cy="430" r="48" fill="none" stroke="#9CA3AF" stroke-width="3"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 430" to="360 400 430" dur="1s" repeatCount="indefinite"/>
    <g stroke="#374151" stroke-width="4" stroke-linecap="round">
      <line x1="400" y1="430" x2="400" y2="382"/>
      <line x1="400" y1="430" x2="434" y2="396"/>
      <line x1="400" y1="430" x2="448" y2="430"/>
      <line x1="400" y1="430" x2="434" y2="464"/>
      <line x1="400" y1="430" x2="400" y2="478"/>
      <line x1="400" y1="430" x2="366" y2="464"/>
      <line x1="400" y1="430" x2="352" y2="430"/>
      <line x1="400" y1="430" x2="366" y2="396"/>
    </g>
    <circle cx="400" cy="382" r="5" fill="#EF4444"/>
    <circle cx="448" cy="430" r="5" fill="#F59E0B"/>
  </g>
  <circle cx="400" cy="430" r="12" fill="#1F2937" stroke="white" stroke-width="3"/>

  <!-- cranks + pedals (rotating) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 430" to="360 400 430" dur="1s" repeatCount="indefinite"/>
    <line x1="400" y1="430" x2="425" y2="415" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <line x1="400" y1="430" x2="375" y2="445" stroke="#111827" stroke-width="7" stroke-linecap="round"/>
    <rect x="417" y="408" width="26" height="10" rx="3" fill="black"/>
    <rect x="357" y="442" width="26" height="10" rx="3" fill="black"/>
  </g>

  <!-- LEGS (pedaling bob) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -10; 0 0" dur="1s" repeatCount="indefinite"/>
    <!-- far leg -->
    <path d="M380,280 L365,350 L372,445" fill="none" stroke="#8B5A2B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="372" cy="448" rx="14" ry="7" fill="#4A2E18"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -10; 0 0; 0 -10" dur="1s" repeatCount="indefinite"/>
    <!-- near leg -->
    <path d="M410,285 L430,355 L427,418" fill="none" stroke="#A67C52" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
    <ellipse cx="430" cy="418" rx="15" ry="7" fill="#2D1F12"/>
  </g>

  <!-- BODY -->
  <g transform="rotate(-8 395 225)">
    <ellipse cx="395" cy="225" rx="88" ry="56" fill="url(#fur)" stroke="#4A2E18" stroke-width="4"/>
    <!-- anteater stripe -->
    <path d="M335,195 L405,235 L335,275 L325,260 L380,235 L325,210 Z" fill="#1F2937" stroke="white" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="370" cy="205" rx="12" ry="8" fill="#FDE68A" opacity="0.4"/>
  </g>

  <!-- ARMS raised juggling -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-4 430 230; 6 430 230; -4 430 230" dur="0.9s" repeatCount="indefinite"/>
    <!-- left arm to left hand -->
    <path d="M425,230 C 400,210 380,190 362,172" fill="none" stroke="#A67C52" stroke-width="15" stroke-linecap="round"/>
    <circle cx="360" cy="168" r="11" fill="#C9A87A" stroke="#4A2E18" stroke-width="3"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="6 440 230; -4 440 230; 6 440 230" dur="0.9s" repeatCount="indefinite"/>
    <!-- right arm -->
    <path d="M440,230 C 450,210 452,190 448,168" fill="none" stroke="#8B5A2B" stroke-width="15" stroke-linecap="round"/>
    <circle cx="448" cy="163" r="11" fill="#C9A87A" stroke="#4A2E18" stroke-width="3"/>
  </g>

  <!-- HEAD + LONG SNOUT -->
  <g>
    <ellipse cx="465" cy="195" rx="12" ry="16" fill="#C9A87A" stroke="#4A2E18" stroke-width="3"/> <!-- ear -->
    <ellipse cx="465" cy="195" rx="5" ry="8" fill="#F5D0A9"/>
    <circle cx="470" cy="210" r="30" fill="url(#fur)" stroke="#4A2E18" stroke-width="4"/>
    <!-- snout -->
    <path d="M488,195 C 540,200 580,225 604,242 C 610,247 608,257 600,258 C 570,260 530,242 486,230 Z" fill="url(#fur)" stroke="#4A2E18" stroke-width="4" stroke-linejoin="round"/>
    <ellipse cx="601" cy="250" rx="9" ry="7" fill="#1F2937"/>
    <circle cx="603" cy="248" r="2.5" fill="#6B7280"/>
    <!-- happy eye -->
    <circle cx="472" cy="205" r="5" fill="black"/>
    <circle cx="474" cy="203" r="1.8" fill="white"/>
    <path d="M462,222 Q472,228 483,222" fill="none" stroke="#4A2E18" stroke-width="2.5" stroke-linecap="round"/>
    <!-- blush -->
    <ellipse cx="485" cy="218" rx="6" ry="4" fill="#F9A8D4" opacity="0.7"/>
  </g>

  <!-- scarf flying -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 360 230; 10 360 230; -8 360 230" dur="0.8s" repeatCount="indefinite"/>
    <rect x="345" y="205" width="40" height="18" rx="9" fill="#EF4444"/>
    <path d="M345,208 C 315,195 295,200 280,215 C 295,218 310,220 325,225 L345,223 Z" fill="#DC2626"/>
    <path d="M345,220 C 320,220 300,230 290,245 C 305,245 325,238 345,232 Z" fill="#F87171"/>
  </g>
</g>

<!-- JUGGLING BOTTLES -->
<g>
  <!-- bottle 1 green -->
  <g>
    <animateMotion dur="1.8s" repeatCount="indefinite" path="M 360,165 C 360,40 440,40 448,160 C 455,210 353,215 360,165 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      <g transform="translate(0,0)">
        <rect x="-15" y="-18" width="30" height="46" rx="8" fill="#22C55E" stroke="#14532D" stroke-width="3"/>
        <rect x="-7" y="-32" width="14" height="16" fill="#86EFAC" stroke="#14532D" stroke-width="3"/>
        <rect x="-9" y="-40" width="18" height="10" rx="3" fill="#14532D"/>
        <rect x="-15" y="-2" width="30" height="16" fill="white" opacity="0.95" stroke="#14532D" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-size="9" font-family="sans-serif" font-weight="bold" fill="#14532D">POP</text>
        <rect x="-11" y="-14" width="5" height="38" rx="2" fill="white" opacity="0.5"/>
      </g>
    </g>
  </g>
  <!-- bottle 2 orange -->
  <g>
    <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M 360,165 C 360,40 440,40 448,160 C 455,210 353,215 360,165 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      <g transform="translate(0,0)">
        <rect x="-15" y="-18" width="30" height="46" rx="8" fill="#FB923C" stroke="#7C2D12" stroke-width="3"/>
        <rect x="-7" y="-32" width="14" height="16" fill="#FED7AA" stroke="#7C2D12" stroke-width="3"/>
        <rect x="-9" y="-40" width="18" height="10" rx="3" fill="#7C2D12"/>
        <rect x="-15" y="-2" width="30" height="16" fill="white" opacity="0.95" stroke="#7C2D12" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-size="8" font-family="sans-serif" font-weight="bold" fill="#7C2D12">FIZZ</text>
        <rect x="-11" y="-14" width="5" height="38" rx="2" fill="white" opacity="0.5"/>
      </g>
    </g>
  </g>
  <!-- bottle 3 purple -->
  <g>
    <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M 360,165 C 360,40 440,40 448,160 C 455,210 353,215 360,165 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="1.8s" repeatCount="indefinite"/>
      <g transform="translate(0,0)">
        <rect x="-15" y="-18" width="30" height="46" rx="8" fill="#A78BFA" stroke="#4C1D95" stroke-width="3"/>
        <rect x="-7" y="-32" width="14" height="16" fill="#DDD6FE" stroke="#4C1D95" stroke-width="3"/>
        <rect x="-9" y="-40" width="18" height="10" rx="3" fill="#4C1D95"/>
        <rect x="-15" y="-2" width="30" height="16" fill="white" opacity="0.95" stroke="#4C1D95" stroke-width="2"/>
        <text x="0" y="10" text-anchor="middle" font-size="8" font-family="sans-serif" font-weight="bold" fill="#4C1D95">COLA</text>
        <rect x="-11" y="-14" width="5" height="38" rx="2" fill="white" opacity="0.5"/>
      </g>
    </g>
  </g>
</g>

<!-- sparkles around juggling -->
<g fill="#FACC15" stroke="#92400E" stroke-width="1">
  <g class="sparkle" style="animation-delay:0s">
    <path d="M310,90 l4,10 10,4 -10,4 -4,10 -4,-10 -10,-4 10,-4 Z"/>
  </g>
  <g class="sparkle" style="animation-delay:-0.3s">
    <path d="M490,70 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3 Z"/>
  </g>
  <g class="sparkle" style="animation-delay:-0.6s">
    <path d="M510,200 l4,9 9,4 -9,4 -4,9 -4,-9 -9,-4 9,-4 Z"/>
  </g>
  <g class="sparkle" style="animation-delay:-0.2s">
    <path d="M290,200 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z"/>
  </g>
</g>

<!-- motion speed lines -->
<g stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.7">
  <line x1="180" y1="380" x2="260" y2="380">
    <animate attributeName="x1" values="220;140" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="300;220" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="160" y1="410" x2="240" y2="410">
    <animate attributeName="x1" values="200;120" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="280;200" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
  </line>
  <line x1="180" y1="440" x2="260" y2="440">
    <animate attributeName="x1" values="220;140" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="300;220" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>
</g>

<!-- title -->
<g class="title-bounce">
  <rect x="150" y="15" width="500" height="48" rx="24" fill="white" opacity="0.85" stroke="#4A2E18" stroke-width="3"/>
  <text x="400" y="46" text-anchor="middle" font-family="Verdana, sans-serif" font-size="24" font-weight="900" fill="#4A2E18">THE AMAZING JUGGLING ANTEATER!</text>
</g>

</svg>