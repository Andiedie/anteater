<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="t d">
  <title id="t">Anteater riding a unicycle while juggling bottles</title>
  <desc id="d">A cartoon giant anteater pedals a unicycle across rolling hills while juggling three bottles in a cascade. Its tongue flicks, its tail sways, dust puffs off the wheel, and ants scurry along the path.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc6f2"/>
      <stop offset="1" stop-color="#e9f6ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fff3a8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffe066" stop-opacity="0"/>
    </radialGradient>

    <!-- anteater torso + head outline (reused for fill and clipping) -->
    <path id="bodyPath" d="M385,322 C355,300 352,250 378,222 C390,206 396,192 406,185 C430,168 455,146 476,124 C481,120 487,126 483,131 C468,156 455,186 442,212 C450,238 450,278 440,306 C436,318 412,324 385,322 Z"/>
    <clipPath id="bodyClip"><use href="#bodyPath"/></clipPath>

    <!-- bottle, origin at its centre of mass; glass colour comes from `color` on the <use> -->
    <g id="bottle">
      <path d="M-8,-8 L-8,15 Q-8,19 -4,19 L4,19 Q8,19 8,15 L8,-8 Q8,-13 3.5,-15 L3.5,-27 L-3.5,-27 L-3.5,-15 Q-8,-13 -8,-8 Z" fill="currentColor"/>
      <rect x="-8" y="-1" width="16" height="9" fill="#f6efdc"/>
      <rect x="-6" y="2" width="12" height="2.2" fill="currentColor" opacity="0.6"/>
      <path d="M-5,-6 L-5,14" stroke="#fff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
      <rect x="-4.5" y="-30.5" width="9" height="4.5" rx="1" fill="#d9a441"/>
    </g>

    <!-- clawed forepaw -->
    <g id="hand">
      <circle r="8.5" fill="#2b2523"/>
      <path d="M-4,6 q-2,5 -6,8 M1,8 q0,5 -2,9 M6,6 q3,4 3,9" fill="none" stroke="#e6ddd0" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <g id="cloud" fill="#fff" opacity="0.92">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="-22" cy="6" rx="22" ry="12"/>
      <ellipse cx="24" cy="6" rx="26" ry="13"/>
      <ellipse cx="4" cy="-10" rx="22" ry="14"/>
    </g>

    <g id="tree">
      <rect x="-3" y="-22" width="6" height="24" fill="#7a5230"/>
      <circle cx="0" cy="-34" r="16" fill="#4e8a3c"/>
      <circle cx="-11" cy="-26" r="11" fill="#5a9a46"/>
      <circle cx="11" cy="-27" r="12" fill="#5a9a46"/>
    </g>

    <path id="tuft" d="M0,0 q-3,-7 -8,-12 M0,0 q1,-9 2,-16 M0,0 q4,-6 9,-10" stroke="#4f8a3a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <g id="ant">
      <circle cx="0" cy="0" r="1.8"/>
      <circle cx="3.6" cy="-0.3" r="1.5"/>
      <circle cx="6.8" cy="-0.6" r="2"/>
      <path d="M1,1 l-2,3 M3,1 l0,3 M5,1 l2,3" stroke="#222" stroke-width="0.8" fill="none"/>
    </g>

    <!-- one 400px period of ground details, tiled and scrolled -->
    <g id="bgPeriod">
      <use href="#tuft" x="20" y="497"/>
      <use href="#tuft" x="95" y="498"/>
      <use href="#tuft" x="170" y="497"/>
      <use href="#tuft" x="250" y="498"/>
      <use href="#tuft" x="330" y="497"/>
    </g>
    <g id="fgPeriod">
      <use href="#tuft" transform="translate(40,558) scale(1.3)"/>
      <use href="#tuft" transform="translate(130,562) scale(1.2)"/>
      <use href="#tuft" transform="translate(215,556) scale(1.4)"/>
      <use href="#tuft" transform="translate(300,561) scale(1.2)"/>
      <use href="#tuft" transform="translate(370,557) scale(1.3)"/>
      <use href="#ant" x="60" y="534" fill="#222"/>
      <use href="#ant" x="74" y="535" fill="#222"/>
      <use href="#ant" x="88" y="534" fill="#222"/>
      <use href="#ant" x="290" y="536" fill="#222"/>
      <use href="#ant" x="305" y="535" fill="#222"/>
    </g>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="600" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="110" cy="95" r="70" fill="url(#glow)"/>
  <circle cx="110" cy="95" r="34" fill="#ffd84d"/>
  <circle cx="110" cy="95" r="46" fill="none" stroke="#ffd84d" stroke-width="6" stroke-dasharray="6 14" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" from="0 110 95" to="360 110 95" dur="30s" repeatCount="indefinite"/>
  </circle>

  <!-- clouds -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-900 0" dur="60s" repeatCount="indefinite"/>
    <use href="#cloud" x="120" y="110"/>
    <use href="#cloud" x="430" y="70"/>
    <use href="#cloud" x="660" y="140"/>
    <use href="#cloud" x="1020" y="110"/>
    <use href="#cloud" x="1330" y="70"/>
    <use href="#cloud" x="1560" y="140"/>
  </g>

  <!-- far hills -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="40s" repeatCount="indefinite"/>
    <path d="M0,445 Q100,385 200,445 Q300,405 400,445 Q500,375 600,445 Q700,410 800,445 Q900,385 1000,445 Q1100,405 1200,445 Q1300,375 1400,445 Q1500,410 1600,445 L1600,600 L0,600 Z" fill="#b7d4a4"/>
  </g>

  <!-- near hills with trees -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-800 0" dur="16s" repeatCount="indefinite"/>
    <path d="M0,478 Q70,448 140,478 Q200,455 260,478 Q330,440 400,478 Q460,458 520,478 Q590,445 660,478 Q730,460 800,478 Q870,448 940,478 Q1000,455 1060,478 Q1130,440 1200,478 Q1260,458 1320,478 Q1390,445 1460,478 Q1530,460 1600,478 L1600,600 L0,600 Z" fill="#8cbb6e"/>
    <use href="#tree" x="100" y="472"/>
    <use href="#tree" x="340" y="468"/>
    <use href="#tree" x="600" y="470"/>
    <use href="#tree" x="900" y="472"/>
    <use href="#tree" x="1140" y="468"/>
    <use href="#tree" x="1400" y="470"/>
  </g>

  <!-- ground: grass with a dirt path -->
  <rect x="0" y="498" width="800" height="102" fill="#79a857"/>
  <rect x="0" y="498" width="800" height="44" fill="#d8b78a"/>
  <line x1="0" y1="498" x2="800" y2="498" stroke="#c4a074" stroke-width="2"/>
  <line x1="0" y1="524" x2="800" y2="524" stroke="#c7a373" stroke-width="3" stroke-dasharray="26 64">
    <animate attributeName="stroke-dashoffset" from="0" to="360" dur="2.4s" repeatCount="indefinite"/>
  </line>

  <!-- background grass tufts scrolling at ground speed -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="2.667s" repeatCount="indefinite"/>
    <use href="#bgPeriod"/>
    <use href="#bgPeriod" x="400"/>
    <use href="#bgPeriod" x="800"/>
  </g>

  <!-- dust kicked up behind the wheel -->
  <g fill="#e0cfae">
    <circle cx="390" cy="494" r="4" opacity="0">
      <animate attributeName="cx" values="390;340" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="494;474" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;12" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="494" r="4" opacity="0">
      <animate attributeName="cx" values="390;340" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="494;474" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;12" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.9s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="494" r="4" opacity="0">
      <animate attributeName="cx" values="390;340" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="494;474" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3;12" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.9s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <ellipse cx="400" cy="500" rx="64" ry="6" fill="#000" opacity="0.18"/>

  <!-- ================= RIDER + UNICYCLE (wobbles about the contact point) ================= -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1.5 400 498;3.5 400 498;-1.5 400 498" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="2.6s" repeatCount="indefinite"/>

    <!-- far hind leg (hip -> knee -> pedal), knee solved for 8 crank angles -->
    <path fill="none" stroke="#3b312d" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M395,312 L429.4,384.2 L372,440">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M395,312 L429.4,384.2 L372,440;M395,312 L445.5,374 L380.2,420.2;M395,312 L459.8,358.9 L400,412;M395,312 L463.6,353.2 L419.8,420.2;M395,312 L455.1,364.8 L428,440;M395,312 L435,381.3 L419.8,459.8;M395,312 L415.1,389.4 L400,468;M395,312 L417.2,388.9 L380.2,459.8;M395,312 L429.4,384.2 L372,440"/>
    </path>
    <!-- far foot + pedal, riding the crank circle -->
    <g>
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M372,440 a28,28 0 1,1 56,0 a28,28 0 1,1 -56,0"/>
      <rect x="-10" y="-1" width="20" height="5" rx="1" fill="#222"/>
      <ellipse cx="0" cy="-6" rx="12" ry="6" fill="#2e2724"/>
    </g>

    <!-- bushy tail (bristle trick: wide dashed stroke under the main stroke) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 386 316;4 386 316;-4 386 316" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="1.7s" repeatCount="indefinite"/>
      <path d="M386,316 C330,300 282,330 274,385 C268,425 285,458 318,468" fill="none" stroke="#4a3f3a" stroke-width="60" stroke-dasharray="3 11"/>
      <path d="M386,316 C330,300 282,330 274,385 C268,425 285,458 318,468" fill="none" stroke="#4a3f3a" stroke-width="44" stroke-linecap="round"/>
      <path d="M386,316 C330,300 282,330 274,385 C268,425 285,458 318,468" fill="none" stroke="#6b5d55" stroke-width="22" stroke-linecap="round" opacity="0.8"/>
    </g>

    <!-- far fork leg + far crank -->
    <line x1="400" y1="368" x2="400" y2="440" stroke="#9e2b2b" stroke-width="6" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 440" to="360 400 440" dur="2.4s" repeatCount="indefinite"/>
      <line x1="400" y1="440" x2="372" y2="440" stroke="#3a3a3a" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- wheel -->
    <circle cx="400" cy="440" r="58" fill="none" stroke="#262626" stroke-width="12"/>
    <circle cx="400" cy="440" r="50" fill="none" stroke="#c9c9c9" stroke-width="4"/>
    <g stroke="#d9d9d9" stroke-width="2.5">
      <animateTransform attributeName="transform" type="rotate" from="0 400 440" to="360 400 440" dur="2.4s" repeatCount="indefinite"/>
      <circle cx="400" cy="440" r="58" fill="none" stroke="#3d3d3d" stroke-width="3" stroke-dasharray="4 6"/>
      <line x1="400" y1="390" x2="400" y2="490"/>
      <line x1="400" y1="390" x2="400" y2="490" transform="rotate(30 400 440)"/>
      <line x1="400" y1="390" x2="400" y2="490" transform="rotate(60 400 440)"/>
      <line x1="400" y1="390" x2="400" y2="490" transform="rotate(90 400 440)"/>
      <line x1="400" y1="390" x2="400" y2="490" transform="rotate(120 400 440)"/>
      <line x1="400" y1="390" x2="400" y2="490" transform="rotate(150 400 440)"/>
      <circle cx="400" cy="392" r="3.5" fill="#ff8c1a" stroke="none"/>
    </g>

    <!-- near fork, crown, seat post -->
    <line x1="400" y1="368" x2="400" y2="440" stroke="#d63a3a" stroke-width="6" stroke-linecap="round"/>
    <path d="M388,368 h24" stroke="#d63a3a" stroke-width="8" stroke-linecap="round"/>
    <line x1="400" y1="326" x2="400" y2="370" stroke="#d63a3a" stroke-width="8" stroke-linecap="round"/>

    <!-- near crank + hub -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 400 440" to="360 400 440" dur="2.4s" repeatCount="indefinite"/>
      <line x1="400" y1="440" x2="428" y2="440" stroke="#555" stroke-width="5" stroke-linecap="round"/>
    </g>
    <circle cx="400" cy="440" r="7" fill="#9a9a9a" stroke="#4a4a4a" stroke-width="2"/>

    <!-- far ear -->
    <ellipse cx="396" cy="190" rx="5" ry="8.5" transform="rotate(-30 396 190)" fill="#5f534b"/>

    <!-- torso + head -->
    <use href="#bodyPath" fill="#7a6c62"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="430" cy="285" rx="24" ry="42" fill="#8f8177"/>
      <path d="M412,190 C434,174 456,152 478,130" fill="none" stroke="#9c9086" stroke-width="8" stroke-linecap="round" opacity="0.55"/>
      <path d="M458,286 C428,262 396,246 356,222" fill="none" stroke="#efe7dc" stroke-width="32" stroke-linecap="round"/>
      <path d="M458,286 C428,262 396,246 356,222" fill="none" stroke="#2b2523" stroke-width="20" stroke-linecap="round"/>
    </g>

    <!-- near ear -->
    <ellipse cx="404" cy="181" rx="5.5" ry="9" transform="rotate(-25 404 181)" fill="#7a6c62" stroke="#5a4e46" stroke-width="1.2"/>
    <ellipse cx="404" cy="182" rx="2.8" ry="5.5" transform="rotate(-25 404 182)" fill="#c99a8f"/>

    <!-- eye with blink -->
    <ellipse cx="426" cy="184" rx="3.6" ry="3.6" fill="#1a1512">
      <animate attributeName="ry" values="3.6;3.6;0.4;3.6;3.6" keyTimes="0;0.9;0.93;0.96;1" dur="4.3s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="427.3" cy="182.7" r="1.1" fill="#fff">
      <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;0.9;0.93;0.96;1" dur="4.3s" repeatCount="indefinite"/>
    </circle>

    <!-- tongue flick (revealed via dash offset), then nose on top -->
    <path d="M481,128 C493,117 500,118 507,108 S512,96 517,94" fill="none" stroke="#e8788a" stroke-width="3.2" stroke-linecap="round" pathLength="1" stroke-dasharray="1 1.1" stroke-dashoffset="1">
      <animate attributeName="stroke-dashoffset" values="1;1;0;1;0;1;1" keyTimes="0;0.55;0.6;0.66;0.72;0.78;1" dur="5s" repeatCount="indefinite"/>
    </path>
    <circle cx="480.5" cy="127" r="4.2" fill="#2b2523"/>

    <!-- saddle -->
    <path d="M368,320 C368,312 380,311 392,313 L410,313 C424,312 434,314 434,320 C434,326 424,328 410,326 L392,326 C380,328 368,328 368,320 Z" fill="#1e1e1e"/>

    <!-- near hind leg -->
    <path fill="none" stroke="#4a3f3a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" d="M395,312 L455.1,364.8 L428,440">
      <animate attributeName="d" dur="2.4s" repeatCount="indefinite" keyTimes="0;0.125;0.25;0.375;0.5;0.625;0.75;0.875;1" values="M395,312 L455.1,364.8 L428,440;M395,312 L435,381.3 L419.8,459.8;M395,312 L415.1,389.4 L400,468;M395,312 L417.2,388.9 L380.2,459.8;M395,312 L429.4,384.2 L372,440;M395,312 L445.5,374 L380.2,420.2;M395,312 L459.8,358.9 L400,412;M395,312 L463.6,353.2 L419.8,420.2;M395,312 L455.1,364.8 L428,440"/>
    </path>
    <!-- near foot + pedal -->
    <g>
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M428,440 a28,28 0 1,1 -56,0 a28,28 0 1,1 56,0"/>
      <rect x="-10" y="-1" width="20" height="5" rx="1" fill="#333"/>
      <ellipse cx="0" cy="-6" rx="12" ry="6" fill="#3a3230"/>
      <path d="M9,-8 l5,1 M9,-5 l5,2" stroke="#e6ddd0" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- forelegs: fixed upper arm, forearm tracks the scooping hand -->
    <g stroke="#ddd4c8" stroke-width="13" stroke-linecap="round" fill="none">
      <line x1="388" y1="238" x2="364" y2="252"/>
      <line x1="364" y1="252" x2="376" y2="264">
        <animate attributeName="x2" values="376;368;362;367;376" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="264;269;275;280;264" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" repeatCount="indefinite"/>
      </line>
      <line x1="424" y1="238" x2="452" y2="248"/>
      <line x1="452" y1="248" x2="448" y2="264">
        <animate attributeName="x2" values="448;456;462;457;448" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="264;269;275;280;264" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- three bottles in a cascade: throw L->R (clockwise flip), carry, throw R->L (counter-clockwise flip), carry -->
    <g>
      <g>
        <animateMotion dur="3s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.175;0.2625;0.35;0.5;0.5875;0.675;0.7625;0.85;1" keyPoints="0;0.1629;0.2249;0.2935;0.4652;0.5;0.6629;0.7249;0.7935;0.9652;1" path="M376,264 Q418.5,-50 461,277 Q459.5,289.5 448,264 Q405.5,-50 363,277 Q364.5,289.5 376,264"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;360;360;0;0" keyTimes="0;0.35;0.5;0.85;1" dur="3s" repeatCount="indefinite"/>
          <use href="#bottle" color="#2e7d4f"/>
        </g>
      </g>
      <g>
        <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.175;0.2625;0.35;0.5;0.5875;0.675;0.7625;0.85;1" keyPoints="0;0.1629;0.2249;0.2935;0.4652;0.5;0.6629;0.7249;0.7935;0.9652;1" path="M376,264 Q418.5,-50 461,277 Q459.5,289.5 448,264 Q405.5,-50 363,277 Q364.5,289.5 376,264"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;360;360;0;0" keyTimes="0;0.35;0.5;0.85;1" dur="3s" begin="-1s" repeatCount="indefinite"/>
          <use href="#bottle" color="#b5651d"/>
        </g>
      </g>
      <g>
        <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" calcMode="linear" keyTimes="0;0.0875;0.175;0.2625;0.35;0.5;0.5875;0.675;0.7625;0.85;1" keyPoints="0;0.1629;0.2249;0.2935;0.4652;0.5;0.6629;0.7249;0.7935;0.9652;1" path="M376,264 Q418.5,-50 461,277 Q459.5,289.5 448,264 Q405.5,-50 363,277 Q364.5,289.5 376,264"/>
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;360;360;0;0" keyTimes="0;0.35;0.5;0.85;1" dur="3s" begin="-2s" repeatCount="indefinite"/>
          <use href="#bottle" color="#2f6fa8"/>
        </g>
      </g>
    </g>

    <!-- paws drawn last so they grip the bottles -->
    <g transform="translate(376,264)">
      <animateTransform attributeName="transform" type="translate" values="376 264;368 269;362 275;367 280;376 264" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" repeatCount="indefinite"/>
      <use href="#hand"/>
    </g>
    <g transform="translate(448,264)">
      <animateTransform attributeName="transform" type="translate" values="448 264;456 269;462 275;457 280;448 264" keyTimes="0;0.25;0.5;0.75;1" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1" dur="1s" begin="-0.5s" repeatCount="indefinite"/>
      <use href="#hand"/>
    </g>
  </g>

  <!-- foreground grass and fleeing ants (slightly faster for parallax) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;-400 0" dur="2.1s" repeatCount="indefinite"/>
    <use href="#fgPeriod"/>
    <use href="#fgPeriod" x="400"/>
    <use href="#fgPeriod" x="800"/>
  </g>
</svg>
