      <animateTransform attributeName="transform" type="rotate" from="0 416 548" to="360 416 548" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M389 421 400 471q0 35 16 77" fill="none" stroke="#2e2436" stroke-width="17"/>
    <path d="M389 421 400 471q0 35 16 77" fill="none" stroke="#edb458" stroke-width="10"/>
    <path d="M389 426 396 471q1 35 15 72" fill="none" stroke="#fce1a0" stroke-width="2.5"/>
    <path d="M364 447q10-8 29-4 16 5 36 0 6 4 2 11-16 11-39 4-14-3-28-2Z" fill="#af4b54" stroke="#302639" stroke-width="4"/>
    <path d="M369 448q12-4 23 0 19 5 34-1" fill="none" stroke="#f39872" stroke-width="2"/>
  </g>

  <!-- Far leg -->
  <path d="M390 420Q434 442 426 477Q423 501 392 543" fill="none" stroke="#332b3c" stroke-width="24" stroke-linecap="round">
    <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
      values="M390 420Q434 442 426 477Q423 501 392 543; M390 420Q431 436 424 471Q418 491 400 522; M390 420Q435 437 430 472Q428 488 421 514; M390 420Q444 444 440 481Q440 502 442 522; M390 420Q448 447 448 487Q447 511 450 543; M390 420Q442 449 439 489Q437 514 442 564; M390 420Q436 452 431 494Q426 523 421 572; M390 420Q431 449 427 490Q420 518 400 564; M390 420Q434 442 426 477Q423 501 392 543"/>
  </path>
  <g transform="translate(387 548)">
