<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 720" width="800" height="720" role="img" aria-labelledby="title description">
  <title id="title">An anteater’s balancing act</title>
  <desc id="description">A shaggy giant anteater in a red neckerchief pedals a gold unicycle and juggles three colorful glass bottles under a circus spotlight.</desc>

  <defs>
    <linearGradient id="backdrop" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#35243f"/>
      <stop offset="1" stop-color="#201a2c"/>
    </linearGradient>
    <radialGradient id="spotlight" cx=".51" cy=".36" r=".69">
      <stop stop-color="#fff2c7"/>
      <stop offset=".68" stop-color="#f4ca89"/>
      <stop offset="1" stop-color="#dc9669"/>
    </radialGradient>
    <linearGradient id="floor" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#654153"/>
      <stop offset="1" stop-color="#2a2033"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2=".55" y2="1">
      <stop stop-color="#a9aaa0"/>
      <stop offset="1" stop-color="#656779"/>
    </linearGradient>
    <linearGradient id="tail-fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#989894"/>
      <stop offset=".57" stop-color="#646476"/>
      <stop offset="1" stop-color="#434355"/>
    </linearGradient>
    <pattern id="paper-dots" width="13" height="11" patternUnits="userSpaceOnUse">
      <path d="M1 2h1m7 4h.8M4 9h.6" stroke="#321f35" stroke-opacity=".22" stroke-linecap="round"/>
      <path d="M5 4h.6m6 5h1" stroke="#fff0cc" stroke-opacity=".32" stroke-linecap="round"/>
    </pattern>
    <path id="stage-arch" d="M160 598V273C160 144 267 48 400 48S640 144 640 273v325Z"/>
    <clipPath id="arch-clip"><use href="#stage-arch" xlink:href="#stage-arch"/></clipPath>
    <path id="spark" d="M0-12Q1-1 12 0 1 1 0 12-1 1-12 0-1-1 0-12Z"/>
    <g id="spoke">
      <path d="M416 535l-14-74m21 76 21-72" fill="none" stroke="#f6ce79" stroke-width="2.3"/>
      <circle cx="402" cy="461" r="2" fill="#fff1bb"/>
      <circle cx="444" cy="465" r="2" fill="#fff1bb"/>
    </g>
    <g id="bottle" stroke="#30263a" stroke-width="2.7" stroke-linejoin="round">
      <path d="M-5-30H5v14c0 3 2 5 5 8 2 2 3 5 3 9v24q0 5-5 5H-8q-5 0-5-5V1c0-4 1-7 3-9 3-3 5-5 5-8Z" fill="currentColor"/>
      <path d="M6-14c1 4 7 6 7 15v24q0 5-5 5H-8q-4 0-5-4H3q5 0 5-4V0c0-4-1-7-2-14Z" fill="#30263a" fill-opacity=".25" stroke="none"/>
      <path d="M-12 2Q0 5 12 2v17q-12 3-24 0Z" fill="#ffe5a5" stroke-width="1.6"/>
      <path d="m0 7 4 4-4 4-4-4Z" fill="currentColor" stroke="none"/>
      <path d="M-6-5q-3 3-3 7m0 20v3" fill="none" stroke="#fff8d9" stroke-opacity=".8" stroke-width="1.8" stroke-linecap="round"/>
      <rect x="-6.5" y="-33" width="13" height="6" rx="1.8" fill="#f2c875"/>
    </g>
    <path id="cascade" d="M253 339 C282 233 351 77 413 76 C488 75 547 232 588 336 C600 358 589 369 576 350 C534 234 486 131 420 132 C354 133 309 225 264 348 C253 368 241 358 253 339 Z"/>
  </defs>

  <!-- The stage and printed border -->
