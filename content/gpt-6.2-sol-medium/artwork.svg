  <rect x="19" y="19" width="762" height="682" rx="19" fill="none" stroke="#cc956e" stroke-opacity=".63"/>
  <rect x="27" y="27" width="746" height="666" rx="14" fill="none" stroke="#cc956e" stroke-opacity=".28"/>
  <use href="#stage-arch" xlink:href="#stage-arch" fill="url(#spotlight)" stroke="#f7ca87" stroke-width="3"/>
  <g clip-path="url(#arch-clip)">
    <path d="M400 18 188 607h114Zm0 0 11 589h64Zm0 0 155 589h100Z" fill="#fff4cd" opacity=".24"/>
    <path d="M400 18 144 388v144Zm0 0 247 369v117Z" fill="#c27164" opacity=".12"/>
    <path d="M179 600V274c0-118 97-207 221-207s221 89 221 207v326" fill="none" stroke="#fff0bd" stroke-opacity=".62" stroke-width="1.5"/>
    <rect x="151" y="42" width="500" height="562" fill="url(#paper-dots)" opacity=".48"/>
  </g>
  <path d="M28 597Q400 576 772 597v83q0 12-13 12H41q-13 0-13-12Z" fill="url(#floor)"/>
  <path d="M29 597Q400 576 771 597M88 630q312-19 624 0M150 670q250-18 500 0" fill="none" stroke="#f4b17c" stroke-opacity=".22"/>
  <ellipse cx="414" cy="651" rx="246" ry="25" fill="#eaa470" opacity=".18"/>
  <ellipse cx="418" cy="649" rx="157" ry="12" fill="#251c2d" opacity=".64"/>

  <!-- Stars, foil accents, and juggling trails -->
  <g fill="#f4bd7f">
    <use href="#spark" xlink:href="#spark" transform="translate(81 108) scale(1.45)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(718 108) scale(1.45)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(104 208) scale(.65)" opacity=".7"/>
    <use href="#spark" xlink:href="#spark" transform="translate(695 208) scale(.65)" opacity=".7"/>
    <use href="#spark" xlink:href="#spark" transform="translate(63 553) scale(.66)" opacity=".65"/>
    <use href="#spark" xlink:href="#spark" transform="translate(737 553) scale(.66)" opacity=".65"/>
    <path d="M81 131v43m0 22v7m637-72v43m0 22v7M48 48h37m-37 0v37m667-37h37m0 0v37M48 673h37m-37 0v-27m667 27h37m0 0v-27" fill="none" stroke="#f4bd7f" stroke-opacity=".55"/>
  </g>
  <g fill="#fff6d1">
    <use href="#spark" xlink:href="#spark" transform="translate(282 157) scale(1.15)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(552 152) scale(.88)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(589 245) scale(1.1)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(216 261) scale(.85)"/>
    <use href="#spark" xlink:href="#spark" transform="translate(598 468) scale(.82)"/>
  </g>
  <path d="m312 103 3 7m202-9-2 7m-281 97 6 4m334-20 5-4m-353 245-7 3m368-33 6 3m-37 107 5 4" fill="none" stroke="#ae624e" stroke-width="3" stroke-linecap="round" opacity=".62"/>
  <path d="M277 265Q326 124 391 89m69 3q54 31 96 151M294 268q39-94 80-121m77-3q47 20 82 96" fill="none" stroke="#a65e57" stroke-opacity=".38" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 8"/>

  <!-- Unicycle, spokes, and far pedal -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <circle cx="416" cy="548" r="98" fill="#302637" stroke="#2b2234" stroke-width="5"/>
    <circle cx="416" cy="548" r="92" fill="none" stroke="#af5559" stroke-width="5"/>
    <circle cx="416" cy="548" r="82" fill="#694758" stroke="#ecb66e" stroke-width="5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 416 548" to="360 416 548" dur="1.8s" repeatCount="indefinite"/>
      <circle cx="416" cy="548" r="94" fill="none" stroke="#e59571" stroke-opacity=".7" stroke-width="2" stroke-dasharray="9 9"/>
      <use href="#spoke" xlink:href="#spoke"/>
      <use href="#spoke" xlink:href="#spoke" transform="rotate(60 416 548)"/>
      <use href="#spoke" xlink:href="#spoke" transform="rotate(120 416 548)"/>
      <use href="#spoke" xlink:href="#spoke" transform="rotate(180 416 548)"/>
      <use href="#spoke" xlink:href="#spoke" transform="rotate(240 416 548)"/>
      <use href="#spoke" xlink:href="#spoke" transform="rotate(300 416 548)"/>
    </g>
