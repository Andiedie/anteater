    <path d="M-6-6q9-9 16 0l5 5H-8Z" fill="#575265" stroke="#302639" stroke-width="2.5" stroke-linejoin="round"/>
  </g>

  <!-- The rider sways above the saddle -->
  <g stroke="#30283a" stroke-linejoin="round" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-1.4 389 432;1.4 389 432;-1.4 389 432" dur="1.8s" repeatCount="indefinite"/>
      <!-- A giant anteater’s shaggy tail and broad shoulder stripe -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-2 337 407;3 337 407;-2 337 407" dur="3.6s" repeatCount="indefinite"/>
        <path d="M368 392C326 356 281 365 239 384c-49 22-99 55-147 45l13 12-24-4 19 18-17-3c18 30 61 53 112 46l-12 10c38-2 80-16 105-35l-6 12c32-12 57-32 81-53Z" fill="url(#tail-fur)" stroke-width="4.5"/>
        <path d="M347 395c-55-24-102 9-153 30-35 14-67 21-91 13m243-29c-56-15-99 31-164 43-27 5-56 8-80 1m231-29c-42 4-79 45-134 55-27 5-48 5-66-1m165-21q-43 33-97 41" fill="none" stroke="#c1b9ae" stroke-opacity=".54" stroke-width="2.2"/>
        <path d="M320 388q-29-4-60 11m-34 38q-35 17-62 20m-10 12q-16 1-28-2m155-15q-26 16-54 24" fill="none" stroke="#e6ccae" stroke-opacity=".47" stroke-width="1.6"/>
      </g>

      <!-- The far arm and upturned catching paw -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 425 352;0 425 352;5 425 352;0 425 352;0 425 352" keyTimes="0;.48;.59;.72;1" dur="1.2s" repeatCount="indefinite"/>
        <path d="M423 335c38-2 54 33 82 42 26 8 50-8 65-26l-5-10q-3-7 2-9 4-1 9 8l9-9q5-5 9-2 3 3-2 9l-5 6 9-4q6-3 8 1 1 4-6 8l-9 5 9-1q5 0 5 4 0 4-10 7l-13 3c-20 27-52 44-86 37-39-7-57-37-80-40Z" fill="#656476" stroke-width="4"/>
        <path d="M481 382q31 26 66 9m26-37 7-9m7 7 9-5" fill="none" stroke="#b9a7a1" stroke-width="2"/>
      </g>

      <path d="M401 294c-35 2-76 20-94 55-21 40-3 77 26 96 25 17 63 15 88-6 24-20 25-49 21-77-4-27-7-52-16-67Z" fill="url(#fur)" stroke-width="5"/>
      <path d="M411 307c-25 1-46 13-61 31-19 23-31 52-40 77l11 12 12 5c7-25 25-54 45-71 17-16 39-22 58-25l-5-25Z" fill="#ecdcc0" stroke="none"/>
      <path d="M415 314c-24 3-42 11-59 31-15 17-27 40-37 68l9-4-3 13 9-7-2 12c10-23 27-48 44-63 16-14 36-21 58-24l-4-17Z" fill="#393344" stroke="none"/>
      <path d="M344 423q19 19 49 14m-47-30 5 5m-1-15 6 4m53-7q-3 10-12 18m-46 28 7 4" fill="none" stroke="#daceba" stroke-opacity=".57" stroke-width="2"/>

      <!-- Head, long tapered snout, and neckerchief -->
      <path d="M382 264c-15-13-15-31-6-38 11-10 27 0 33 15" fill="#858288" stroke-width="4"/>
      <path d="M385 247q-8-11-1-15 6-3 13 6" fill="#c3807c" stroke-width="2"/>
      <path d="M380 273c0-22 14-40 37-43 32-4 45 18 68 39 14 13 35 24 56 36 9 5 9 13 2 18-6 5-17 5-25 3-32-9-61-16-84-17-22 0-43-4-51-19-3-5-4-10-3-17Z" fill="url(#fur)" stroke-width="4.5"/>
      <path d="M413 290c22-10 47-9 71-3 18 6 35 16 54 24l2 9c-7 6-16 5-25 2-33-9-59-16-83-16-8 0-17-4-19-16Z" fill="#dbcdb0" stroke="none"/>
      <path d="M493 309q22 8 44 9" fill="none" stroke="#594855" stroke-width="2.2"/>
      <path d="M527 300c7 2 13 5 17 9 6 6 2 13-6 15-5 1-11-1-14-4 7-4 9-10 3-20Z" fill="#352b3e" stroke-width="2.7"/>
      <path d="m538 308 4 3M400 254q9-12 22-12" fill="none" stroke="#f2dfbf" stroke-opacity=".77" stroke-width="2.4"/>
      <path d="M429 259q7-7 16 0" fill="none" stroke-width="2.7"/>
      <ellipse cx="439" cy="269" rx="4.6" ry="5.7" fill="#30283a" stroke="none">
        <animate attributeName="ry" values="5.7;5.7;.55;5.7;5.7" keyTimes="0;.71;.735;.76;1" dur="5.4s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="440.3" cy="267.2" r="1.2" fill="#fff5d7" stroke="none">
        <animate attributeName="opacity" values="1;1;0;1;1" keyTimes="0;.71;.735;.76;1" dur="5.4s" repeatCount="indefinite"/>
      </circle>
      <path d="m450 284 6 1m2 2 5 1" fill="none" stroke="#a46567" stroke-width="2"/>
      <path d="M380 293q21 19 57 14l-2 13q-31 13-61-12Z" fill="#cc5756" stroke-width="3.6"/>
      <path d="M379 305q-10 17-34 14l8 7-10 9q31 0 44-22Z" fill="#cb5354" stroke-width="3"/>
      <path d="M382 305q-1 17-23 29l12 1-2 10q22-13 21-34Z" fill="#e77462" stroke-width="3"/>
      <path d="M383 299q18 15 49 12m-48 2q-5 12-13 17" fill="none" stroke="#ffc48d" stroke-width="2"/>

      <!-- The near paw dips and scoops -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 373 352;0 373 352;-5 373 352;0 373 352" keyTimes="0;.8;.93;1" dur="1.2s" repeatCount="indefinite"/>
        <path d="M379 339c-24-7-43 17-67 32-16 10-35 7-47-8l-3-11 6-10q3-6-1-9-5-2-10 8l-6-10q-4-7-8-5-4 3 1 12l2 5-8-5q-6-4-9 0-2 4 5 9l9 6-8-2q-5-1-6 3-1 5 9 8l8 3c13 31 42 43 67 35 27-8 50-33 73-37" fill="#96949a" stroke-width="4.3"/>
        <path d="M257 366q18 29 43 24 20-4 40-21m-89-17-5-9m1 15-10-4m20-1 5-9" fill="none" stroke="#e0cdb9" stroke-width="2.3"/>
        <path d="m244 332 4 6m-14 3 6 4m22-5 3-5" fill="none" stroke="#f5dec0" stroke-width="2"/>
      </g>
    </g>

    <!-- Near pedal and leg share the same eight positions -->
    <path d="M416 548H445" fill="none" stroke="#30263a" stroke-width="10">
      <animateTransform attributeName="transform" type="rotate" from="0 416 548" to="360 416 548" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M416 548H445" fill="none" stroke="#f5c875" stroke-width="5">
      <animateTransform attributeName="transform" type="rotate" from="0 416 548" to="360 416 548" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <circle cx="416" cy="548" r="10" fill="#efbb68" stroke-width="3"/>
    <circle cx="416" cy="548" r="3.4" fill="#fff1bc" stroke="none"/>
    <path d="M382 428Q370 458 389 481Q404 513 439 541" fill="none" stroke-width="27">
      <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
        values="M382 428Q370 458 389 481Q404 513 439 541; M382 428Q366 463 382 490Q396 522 431 562; M382 428Q360 466 376 497Q384 532 410 570; M382 428Q355 465 370 493Q373 522 389 562; M382 428Q355 461 369 488Q371 511 381 541; M382 428Q358 455 372 478Q378 500 389 520; M382 428Q364 451 379 473Q389 496 410 512; M382 428Q369 452 386 475Q399 500 431 520; M382 428Q370 458 389 481Q404 513 439 541"/>
    </path>
    <path d="M382 428Q370 458 389 481Q404 513 439 541" fill="none" stroke="#848292" stroke-width="19">
      <animate attributeName="d" dur="1.8s" repeatCount="indefinite"
        values="M382 428Q370 458 389 481Q404 513 439 541; M382 428Q366 463 382 490Q396 522 431 562; M382 428Q360 466 376 497Q384 532 410 570; M382 428Q355 465 370 493Q373 522 389 562; M382 428Q355 461 369 488Q371 511 381 541; M382 428Q358 455 372 478Q378 500 389 520; M382 428Q364 451 379 473Q389 496 410 512; M382 428Q369 452 386 475Q399 500 431 520; M382 428Q370 458 389 481Q404 513 439 541"/>
    </path>
