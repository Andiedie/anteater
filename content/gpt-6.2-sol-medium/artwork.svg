    <g transform="translate(445 548)">
      <animateTransform attributeName="transform" type="translate" dur="1.8s" repeatCount="indefinite"
        values="445 548;437 569;416 577;395 569;387 548;395 527;416 519;437 527;445 548"/>
      <path d="M-14 4h29" stroke="#30263a" stroke-width="9"/>
      <path d="M-12 3h25" stroke="#f0ba69" stroke-width="3.5"/>
      <path d="M-13-9q8-6 15-3l10 5q5 2 5 6H-9q-6-1-4-8Z" fill="#514859" stroke-width="3"/>
      <path d="m8-5 1 3m4-2 1 2" stroke="#e7c9a3" stroke-width="1.7"/>
    </g>
  </g>

  <!-- Three offset flips along the same closed cascade. Base transforms place the bottles in static previews. -->
  <g transform="translate(253 312)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" begin="0s" calcMode="paced">
      <mpath href="#cascade" xlink:href="#cascade"/>
    </animateMotion>
    <g><animateTransform attributeName="transform" type="rotate" from="-20" to="700" dur="3.6s" repeatCount="indefinite"/>
      <use href="#bottle" xlink:href="#bottle" color="#cc6260"/>
    </g>
  </g>
  <g transform="translate(505 164) rotate(33)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" begin="-1.2s" calcMode="paced">
      <mpath href="#cascade" xlink:href="#cascade"/>
    </animateMotion>
    <g><animateTransform attributeName="transform" type="rotate" from="-20" to="700" dur="3.6s" begin="-1.2s" repeatCount="indefinite"/>
      <use href="#bottle" xlink:href="#bottle" color="#509d92"/>
    </g>
  </g>
  <g transform="translate(450 117) rotate(-29)">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="0 0" dur="3.6s" repeatCount="indefinite"/>
    <animateMotion dur="3.6s" repeatCount="indefinite" begin="-2.4s" calcMode="paced">
      <mpath href="#cascade" xlink:href="#cascade"/>
    </animateMotion>
    <g><animateTransform attributeName="transform" type="rotate" from="-20" to="700" dur="3.6s" begin="-2.4s" repeatCount="indefinite"/>
      <use href="#bottle" xlink:href="#bottle" color="#9b79a9"/>
    </g>
  </g>
</svg>
