<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480"
     role="img" aria-label="An animated anteater riding a unicycle while juggling three bottles">
  <title>Anteater on a unicycle juggling bottles</title>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#241a4d"/>
      <stop offset="0.55" stop-color="#4b3172"/>
      <stop offset="1"   stop-color="#8d5070"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#ffd9a0" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#ffb46a" stop-opacity="0.18"/>
      <stop offset="1"   stop-color="#ffb46a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="furG" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0"   stop-color="#bb9a80"/>
      <stop offset="1"   stop-color="#8a6d55"/>
    </linearGradient>

    <linearGradient id="bellyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0c9ad"/>
      <stop offset="1" stop-color="#c3a586"/>
    </linearGradient>

    <linearGradient id="brew" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffd98a"/>
      <stop offset="0.5" stop-color="#f2a33f"/>
      <stop offset="1"   stop-color="#c96f24"/>
    </linearGradient>

    <!-- one bottle, drawn with its neck pointing along +x so rotate="auto" works -->
    <g id="bottle">
      <path d="M -20 0 C -20 -8 -17 -10.5 -12 -10.5 L 4 -10.5 C 8 -10.5 9.5 -8 9.5 -5
               L 9.5 -3 L 17.5 -3 C 19.5 -3 20.5 -1.5 20.5 0 C 20.5 1.5 19.5 3 17.5 3
               L 9.5 3 L 9.5 5 C 9.5 8 8 10.5 4 10.5 L -12 10.5 C -17 10.5 -20 8 -20 0 Z"
            fill="url(#brew)" stroke="#2f8f5b" stroke-width="2.2" stroke-linejoin="round"/>
      <rect x="-8.5" y="-6.5" width="15" height="13" rx="2.5" fill="#fdf1d0" opacity="0.95"/>
      <path d="M -5 -2.5 L 3.5 -2.5 M -5 1.5 L 1.5 1.5" stroke="#c1453b" stroke-width="1.7" stroke-linecap="round"/>
      <rect x="18.5" y="-4.5" width="6" height="9" rx="2" fill="#8b5a2b"/>
      <path d="M -15.5 -6.5 L 2.5 -6.5" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.6" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ============ background ============ -->
  <rect width="480" height="480" fill="url(#sky)"/>
  <circle cx="240" cy="250" r="230" fill="url(#glow)">
    <animate attributeName="r" values="230;244;230" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- twinkles -->
  <g fill="#fff8dc">
    <circle cx="58" cy="62" r="2.2">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="418" cy="96" r="1.8">
      <animate attributeName="opacity" values="1;0.15;1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="150" r="1.5">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="392" cy="42" r="2">
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- speed lines (riding right-to-left motion cue) -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
                      values="80 0;-150 0" dur="1.5s" repeatCount="indefinite"/>
    <path d="M 20 168 L 86 168"/>
    <path d="M 6 286 L 60 286"/>
    <path d="M 34 356 L 92 356"/>
  </g>

  <!-- ground -->
  <rect x="0" y="430" width="480" height="50" fill="#2c1a3f"/>
  <path d="M 0 430 L 480 430" stroke="#5d3a72" stroke-width="3"/>
  <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="4" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;-48 0" dur="0.75s" repeatCount="indefinite"/>
    <path d="M -60 446 L 560 446" stroke-dasharray="26 22"/>
  </g>

  <!-- contact shadow -->
  <ellipse cx="240" cy="434" rx="62" ry="8" fill="#160b22" opacity="0.35">
    <animate attributeName="rx" values="62;70;62" dur="0.55s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ============ the rig ============ -->
  <g>
    <!-- bob -->
    <animateTransform attributeName="transform" type="translate"
                      values="0 0;0 -3.5;0 0" dur="0.55s" repeatCount="indefinite"/>
    <!-- gentle lean wobble -->
    <animateTransform attributeName="transform" type="rotate" additive="sum"
                      values="-1.4 240 372;1.4 240 372;-1.4 240 372" dur="2.2s" repeatCount="indefinite"/>

    <!-- ::: wheel ::: -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        from="0 240 372" to="360 240 372" dur="1.1s" repeatCount="indefinite"/>
      <circle cx="240" cy="372" r="56" fill="none" stroke="#24202e" stroke-width="12"/>
      <circle cx="240" cy="372" r="56" fill="none" stroke="#4a4356" stroke-width="3"/>
      <circle cx="240" cy="372" r="46" fill="none" stroke="#dfe4ef" stroke-width="5"/>
      <g stroke="#cfd6e6" stroke-width="2.5" stroke-linecap="round">
        <path d="M 194 372 L 286 372"/>
        <path d="M 200.2 349 L 279.8 395"/>
        <path d="M 217 332.2 L 263 411.8"/>
        <path d="M 240 326 L 240 418"/>
        <path d="M 263 332.2 L 217 411.8"/>
        <path d="M 279.8 349 L 200.2 395"/>
      </g>
      <circle cx="240" cy="372" r="7.5" fill="#5a5368" stroke="#2b2733" stroke-width="2"/>

      <!-- cranks + pedals (pedals counter-rotate to stay level) -->
      <path d="M 240 372 L 264 372" stroke="#3b3547" stroke-width="7" stroke-linecap="round"/>
      <path d="M 240 372 L 216 372" stroke="#3b3547" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(264,372)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="-360" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#3b3547"/>
          <rect x="-14" y="-4" width="28" height="3" rx="1.5" fill="#6d6480"/>
        </g>
      </g>
      <g transform="translate(216,372)">
        <g>
          <animateTransform attributeName="transform" type="rotate"
                            from="0" to="-360" dur="1.1s" repeatCount="indefinite"/>
          <rect x="-14" y="-4" width="28" height="8" rx="3" fill="#3b3547"/>
          <rect x="-14" y="-4" width="28" height="3" rx="1.5" fill="#6d6480"/>
        </g>
      </g>
    </g>

    <!-- ::: fork, seat post, saddle ::: -->
    <path d="M 233 300 L 228 372 M 247 300 L 252 372" stroke="#d94f4f" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="236" y="268" width="8" height="36" rx="3" fill="#b93f3f"/>
    <path d="M 208 268 C 214 254 246 250 262 257 C 273 262 272 271 261 273
             C 238 278 214 278 208 268 Z" fill="#7a3b2e"/>
    <path d="M 216 265 C 226 257 250 254 262 259" stroke="#a86b52" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- ::: bushy tail ::: -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-7 212 234;5 212 234;-7 212 234" dur="1.7s" repeatCount="indefinite"/>
      <path d="M 214 236 C 186 244 148 250 124 230" stroke="#8a6d55" stroke-width="27" stroke-linecap="round" fill="none"/>
      <g transform="rotate(-20 122 220)">
        <ellipse cx="122" cy="220" rx="38" ry="30" fill="#a98a6d"/>
        <ellipse cx="126" cy="218" rx="26" ry="21" fill="#bda089"/>
        <path d="M 100 200 L 92 186 M 116 194 L 114 178 M 134 196 L 140 182 M 150 208 L 162 198"
              stroke="#8a6d55" stroke-width="3.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- ::: far leg ::: -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="10 226 258;0 226 258;-10 226 258;0 226 258;10 226 258"
                        dur="1.1s" repeatCount="indefinite"/>
      <path d="M 226 258 C 232 296 222 332 216 360" stroke="#6f5643" stroke-width="15" stroke-linecap="round" fill="none"/>
      <ellipse cx="216" cy="362" rx="13" ry="7.5" fill="#5c4535"/>
    </g>

    <!-- ::: far (raised, back) arm ::: -->
    <path d="M 248 212 C 240 190 236 170 238 152" stroke="#7d6350" stroke-width="15" stroke-linecap="round" fill="none"/>
    <circle cx="238" cy="150" r="9.5" fill="#6f5643"/>

    <!-- ::: body ::: -->
    <g>
      <ellipse cx="245" cy="228" rx="47" ry="44" fill="url(#furG)" transform="rotate(-8 245 228)"/>
      <ellipse cx="252" cy="240" rx="34" ry="31" fill="url(#bellyG)" transform="rotate(-8 252 240)"/>
      <!-- shoulder stripe -->
      <path d="M 212 192 C 228 208 230 240 221 264 L 203 259 C 210 236 208 212 203 199 Z" fill="#4a3628"/>
      <path d="M 236 186 C 252 196 258 214 258 236" stroke="#d8c1a4" stroke-width="3" fill="none" opacity="0.7"/>
    </g>

    <!-- ::: head ::: -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-2 274 208;2 274 208;-2 274 208" dur="2.2s" repeatCount="indefinite"/>
      <!-- neck -->
      <path d="M 268 206 L 300 180" stroke="url(#furG)" stroke-width="34" stroke-linecap="round"/>
      <!-- ear -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="-6 292 158;7 292 158;-6 292 158" dur="1.3s" repeatCount="indefinite"/>
        <ellipse cx="292" cy="157" rx="9" ry="12" fill="#8a6d55" transform="rotate(-22 292 157)"/>
        <ellipse cx="291" cy="158" rx="4.5" ry="7" fill="#c98f92" transform="rotate(-22 291 158)"/>
      </g>
      <!-- skull -->
      <ellipse cx="302" cy="176" rx="27" ry="23" fill="url(#furG)"/>
      <!-- long snout -->
      <path d="M 318 166 C 346 158 372 170 393 181 C 398 183.5 398 188 393 190
               C 372 199 344 198 320 191 Z" fill="#a9886f"/>
      <path d="M 320 190 C 346 197 374 197 393 189" stroke="#6f5643" stroke-width="3.5" fill="none" stroke-linecap="round"/>
      <circle cx="391" cy="185" r="2.6" fill="#4a3628"/>
      <!-- flicking tongue -->
      <path d="M 388 186 Q 402 189 414 199" stroke="#ef7d92" stroke-width="4.5" fill="none"
            stroke-linecap="round" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1">
        <animate attributeName="stroke-dashoffset"
                 values="1;0;0;1;1" keyTimes="0;0.22;0.5;0.72;1" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <!-- eye -->
      <ellipse cx="308" cy="170" rx="5" ry="5" fill="#2a2029">
        <animate attributeName="ry" values="5;5;0.8;5;5" keyTimes="0;0.86;0.9;0.94;1" dur="3.2s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="309.8" cy="168" r="1.6" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- ::: near leg ::: -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-10 246 258;0 246 258;10 246 258;0 246 258;-10 246 258"
                        dur="1.1s" repeatCount="indefinite"/>
      <path d="M 246 258 C 256 296 262 332 264 362" stroke="#9c7f66" stroke-width="17" stroke-linecap="round" fill="none"/>
      <ellipse cx="264" cy="364" rx="14" ry="8" fill="#6f5643"/>
    </g>

    <!-- ::: near (front) arm ::: -->
    <path d="M 274 208 C 288 194 298 170 302 152" stroke="#a9886f" stroke-width="16" stroke-linecap="round" fill="none"/>
    <circle cx="302" cy="149" r="10" fill="#8a6d55"/>

    <!-- ::: juggling bottles ::: -->
    <g>
      <animateMotion dur="2.7s" repeatCount="indefinite" rotate="auto" calcMode="linear"
                     keyPoints="0;1" keyTimes="0;1"
                     path="M 238 150 C 224 74 258 46 302 148 C 332 202 290 218 256 200 C 232 188 224 174 238 150 Z">
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="1080" dur="2.7s" repeatCount="indefinite"/>
        <use href="#bottle"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.7s" repeatCount="indefinite" rotate="auto" calcMode="linear"
                     keyPoints="0.333;1;0;0.333" keyTimes="0;0.667;0.667;1"
                     path="M 238 150 C 224 74 258 46 302 148 C 332 202 290 218 256 200 C 232 188 224 174 238 150 Z">
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="1080" dur="2.7s" repeatCount="indefinite"/>
        <use href="#bottle"/>
      </g>
    </g>
    <g>
      <animateMotion dur="2.7s" repeatCount="indefinite" rotate="auto" calcMode="linear"
                     keyPoints="0.667;1;0;0.667" keyTimes="0;0.333;0.333;1"
                     path="M 238 150 C 224 74 258 46 302 148 C 332 202 290 218 256 200 C 232 188 224 174 238 150 Z">
      </animateMotion>
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="1080" dur="2.7s" repeatCount="indefinite"/>
        <use href="#bottle"/>
      </g>
    </g>
  </g>
</svg>
