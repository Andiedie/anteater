<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A warmly illustrated giant anteater balances on a unicycle beneath carnival lights. Three colorful bottles continuously tumble in a high juggling arc.</desc>

  <style>
    .ink { stroke: #30201d; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
    .fine-ink { stroke: #30201d; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .fur-line { fill: none; stroke: #8d5538; stroke-width: 5; stroke-linecap: round; opacity: .72; }
    .metal { stroke: #d9e5e4; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
    .spoke { stroke: #9db7bd; stroke-width: 3; stroke-linecap: round; }
  </style>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10284a"/>
      <stop offset=".62" stop-color="#245379"/>
      <stop offset="1" stop-color="#ee9668"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#50384b"/>
      <stop offset="1" stop-color="#241e31"/>
    </linearGradient>
    <linearGradient id="tailFur" x1="0" y1=".2" x2="1" y2=".65">
      <stop offset="0" stop-color="#4c302e"/>
      <stop offset=".52" stop-color="#9e6342"/>
      <stop offset="1" stop-color="#d08a55"/>
    </linearGradient>
    <linearGradient id="coat" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#d99a60"/>
      <stop offset=".55" stop-color="#b86f47"/>
      <stop offset="1" stop-color="#804733"/>
    </linearGradient>
    <linearGradient id="muzzle" x1="0" y1="0" x2="1" y2=".6">
      <stop offset="0" stop-color="#e8b477"/>
      <stop offset="1" stop-color="#b96943"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff9f4"/>
      <stop offset=".45" stop-color="#6b9ba4"/>
      <stop offset="1" stop-color="#d9eeee"/>
    </linearGradient>
    <radialGradient id="moon" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff5bd"/>
      <stop offset="1" stop-color="#f5c777"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#111226" flood-opacity=".32"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- The bottle is centered on its middle so it can tumble naturally. -->
    <g id="bottle">
      <path class="fine-ink" fill="currentColor" d="M-10-48h20v16c0 4 7 8 9 15l6 27c2 11-5 20-16 20H-9c-11 0-18-9-16-20l6-27c2-7 9-11 9-15z"/>
      <path fill="#f8e9a8" d="M-16-14h32l4 18c1 6-3 10-9 10H-11c-6 0-10-4-9-10z"/>
      <path fill="#d15249" d="M-8-46H8v11H-8z"/>
      <path fill="#fff7d3" opacity=".72" d="M-14-8c-3 12-2 23 4 29h-6c-4-5-5-10-4-17z"/>
      <path class="fine-ink" fill="none" stroke="#7d463c" stroke-width="2.5" d="M-10-48h20"/>
      <circle cx="0" cy="0" r="4" fill="#d15249"/>
    </g>

    <!-- A closed arc lets each bottle return to a hand before its next toss. -->
    <path id="juggleArc" d="M552 387 Q626 43 712 387 Q632 434 552 387Z"/>
  </defs>

  <!-- dusk circus backdrop -->
  <rect width="1000" height="760" fill="url(#sky)"/>
  <circle cx="141" cy="126" r="58" fill="url(#moon)" opacity=".96"/>
  <circle cx="122" cy="108" r="10" fill="#ffe8a0" opacity=".55"/>
  <circle cx="165" cy="151" r="7" fill="#eab66d" opacity=".52"/>

  <g fill="#fff5c9" filter="url(#glow)">
    <circle cx="294" cy="92" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="418" cy="160" r="2.5"><animate attributeName="opacity" values="1;.2;1" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="572" cy="84" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="2.3s" repeatCount="indefinite"/></circle>
    <circle cx="757" cy="153" r="2"><animate attributeName="opacity" values="1;.15;1" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="897" cy="92" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="837" cy="238" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></circle>
  </g>

  <path d="M0 454C120 403 214 426 304 462c103 42 191-41 304-18 112 23 147 69 265 7 51-27 89-25 127-15v157H0z" fill="#27415a" opacity=".78"/>
  <path d="M0 494l99-118 99 118 98-164 107 164 86-96 84 96 124-142 113 142 80-96 110 96v118H0z" fill="#1c314d" opacity=".88"/>

  <!-- string of softly blinking carnival bulbs -->
  <path d="M0 232C144 282 249 182 395 225s245 101 396 44c91-35 134-48 209-5" fill="none" stroke="#17223a" stroke-width="7"/>
  <g filter="url(#glow)">
    <g fill="#ffdb75">
      <circle cx="70" cy="247" r="7"><animate attributeName="fill" values="#ffdb75;#fff9c9;#ffdb75" dur="1.4s" repeatCount="indefinite"/></circle>
      <circle cx="184" cy="235" r="7"><animate attributeName="fill" values="#fff9c9;#ffdb75;#fff9c9" dur="1.8s" repeatCount="indefinite"/></circle>
      <circle cx="303" cy="211" r="7"><animate attributeName="fill" values="#ffdb75;#fff9c9;#ffdb75" dur="1.2s" repeatCount="indefinite"/></circle>
      <circle cx="431" cy="239" r="7"><animate attributeName="fill" values="#fff9c9;#ffdb75;#fff9c9" dur="1.7s" repeatCount="indefinite"/></circle>
      <circle cx="557" cy="267" r="7"><animate attributeName="fill" values="#ffdb75;#fff9c9;#ffdb75" dur="1.5s" repeatCount="indefinite"/></circle>
      <circle cx="682" cy="264" r="7"><animate attributeName="fill" values="#fff9c9;#ffdb75;#fff9c9" dur="2s" repeatCount="indefinite"/></circle>
      <circle cx="809" cy="222" r="7"><animate attributeName="fill" values="#ffdb75;#fff9c9;#ffdb75" dur="1.3s" repeatCount="indefinite"/></circle>
      <circle cx="929" cy="218" r="7"><animate attributeName="fill" values="#fff9c9;#ffdb75;#fff9c9" dur="1.9s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- ring floor -->
  <path d="M0 633C159 596 274 619 424 639c191 26 342-48 576-7v128H0z" fill="url(#ground)"/>
  <path d="M0 682c171-34 293 31 478 2 183-29 344-54 522 0" fill="none" stroke="#765065" stroke-width="8" opacity=".55"/>
  <ellipse cx="499" cy="715" rx="208" ry="21" fill="#171627" opacity=".34"/>

  <!-- unicycle wheel -->
  <g filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 618" to="360 500 618" dur="2.2s" repeatCount="indefinite"/>
      <circle class="ink" cx="500" cy="618" r="96" fill="#26303a" stroke-width="13"/>
      <circle cx="500" cy="618" r="82" fill="none" stroke="#e2e8dc" stroke-width="7"/>
      <circle cx="500" cy="618" r="12" fill="#efc65a" class="fine-ink"/>
      <g class="spoke">
        <line x1="500" y1="618" x2="500" y2="536"/><line x1="500" y1="618" x2="558" y2="560"/>
        <line x1="500" y1="618" x2="582" y2="618"/><line x1="500" y1="618" x2="558" y2="676"/>
        <line x1="500" y1="618" x2="500" y2="700"/><line x1="500" y1="618" x2="442" y2="676"/>
        <line x1="500" y1="618" x2="418" y2="618"/><line x1="500" y1="618" x2="442" y2="560"/>
      </g>
      <g fill="#f2d976">
        <path d="M485 529h30l-5 12h-20z"/><path d="M585 603v30l-12-5v-20z"/>
        <path d="M485 707h30l-5-12h-20z"/><path d="M415 603v30l12-5v-20z"/>
      </g>
    </g>
  </g>

  <!-- frame and crank are held still while the wheel spins behind them -->
  <g filter="url(#shadow)">
    <path class="metal" fill="none" d="M481 470L492 618M519 470L508 618"/>
    <path class="fine-ink" fill="#eac95e" d="M477 460q23-12 46 0l-5 17h-36z"/>
    <path class="ink" fill="#50333e" d="M449 448q51-18 101 0l-11 25h-80z"/>
    <circle cx="500" cy="618" r="12" fill="#edca5c" class="fine-ink"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 500 618" to="360 500 618" dur="2.2s" repeatCount="indefinite"/>
      <path class="fine-ink" fill="none" stroke="#d7eaec" stroke-width="6" d="M500 618h53M500 618h-53"/>
      <rect x="546" y="609" width="27" height="17" rx="5" fill="#e8bd55" class="fine-ink"/>
      <rect x="427" y="609" width="27" height="17" rx="5" fill="#e8bd55" class="fine-ink"/>
    </g>
  </g>

  <!-- anteater, gently bobbing to keep balance -->
  <g filter="url(#shadow)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 2;0 -6;0 2" dur="1.1s" repeatCount="indefinite"/>

      <!-- enormous fluffy tail behind the rider -->
      <g>
        <animateTransform attributeName="transform" type="rotate" values="0 393 407;-3 393 407;1 393 407;0 393 407" dur="2.8s" repeatCount="indefinite"/>
        <path class="ink" fill="url(#tailFur)" d="M408 407C347 362 299 318 209 318 124 318 61 360 63 412c2 52 75 63 142 59 83-4 137-15 202-36 33-11 35-17 1-28z"/>
        <path class="fur-line" d="M93 397c64-39 154-41 244 22M99 421c83-18 183-15 265 6M154 351c45 10 99 42 147 76M191 457c43-7 91-19 138-39"/>
        <path fill="none" stroke="#e7a269" stroke-width="5" stroke-linecap="round" opacity=".8" d="M76 413c37 18 81 16 125 7M128 368c41-9 91 0 134 21M233 338c37 12 71 32 101 59"/>
      </g>

      <!-- far pedaling leg -->
      <g transform="translate(419 424)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="7 0 0;-13 0 0;7 0 0" dur="2.2s" repeatCount="indefinite"/>
          <path class="ink" fill="#9c5b40" d="M0 8c25 21 50 55 56 99l3 65-28 2c-9-56-22-92-51-129z"/>
          <path class="fine-ink" fill="#d99a60" d="M23 165q22-6 39 3l-2 19q-29 5-44-4z"/>
        </g>
      </g>

      <!-- rounded body -->
      <path class="ink" fill="url(#coat)" d="M341 367c18-71 92-105 163-86 70 18 118 79 111 139-6 57-53 91-119 91-74 1-144-28-159-82-7-23-4-43 4-62z"/>
      <path fill="#e7b273" opacity=".55" d="M372 378c22-43 66-68 114-67 20 0 37 4 51 12-74-7-115 31-132 89-13 42 5 62 32 82-43-15-74-45-65-116z"/>

      <!-- signature black-and-cream giant-anteater shoulder sash -->
      <path d="M431 296c36 6 73 34 94 75 20 39 26 79 20 128-24 12-53 16-79 10 10-49 6-88-14-119-19-29-45-47-67-58 12-18 28-30 46-36z" fill="#28222a"/>
      <path d="M420 300c36 8 70 34 91 72 18 33 25 75 20 119" fill="none" stroke="#f4dca0" stroke-width="10" stroke-linecap="round"/>
      <path d="M449 329c21 19 39 48 44 84" fill="none" stroke="#785146" stroke-width="6" stroke-linecap="round" opacity=".75"/>

      <!-- head, ears, and long tapered muzzle -->
      <path class="ink" fill="url(#coat)" d="M501 325c19-49 62-72 105-56 44 16 60 56 57 92-3 41-38 66-88 59-44-6-87-34-74-95z"/>
      <path class="ink" fill="#c2784e" d="M549 300c-9-34 11-63 39-59 23 4 35 32 26 60-11 21-42 23-65-1z"/>
      <path fill="#e8ae71" d="M563 290c-2-19 9-33 20-31 12 3 17 17 13 31-10 9-24 8-33 0z"/>
      <path class="ink" fill="url(#muzzle)" d="M590 321c44-32 91-25 135-6 43 19 96 13 153 26 21 5 24 24 4 32-66 19-118 18-173 34-48 14-101 9-130-18 1-33 3-51 11-68z"/>
      <path d="M665 339c60 16 129 5 191 20" fill="none" stroke="#f5cb91" stroke-width="6" stroke-linecap="round" opacity=".8"/>
      <path class="fine-ink" fill="#28242b" d="M855 339q25 3 29 14-8 13-30 12-10-12 1-26z"/>
      <path d="M692 380c45-9 95-11 142-18" fill="none" stroke="#5c332f" stroke-width="4" stroke-linecap="round"/>

      <!-- pleased eye and a tiny blink -->
      <ellipse cx="621" cy="324" rx="8" ry="9" fill="#251d24"/>
      <ellipse cx="624" cy="321" rx="2.5" ry="3" fill="#fff5d0"/>
      <rect x="610" y="313" width="22" height="18" rx="9" fill="transparent">
        <animate attributeName="opacity" values="0;0;0;1;1;0;0" keyTimes="0;.72;.76;.78;.82;.84;1" dur="4.6s" repeatCount="indefinite"/>
      </rect>
      <path d="M610 314q12-9 23 0" fill="none" stroke="#30201d" stroke-width="4" stroke-linecap="round"/>

      <!-- near pedaling leg -->
      <g transform="translate(471 441)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-11 0 0;13 0 0;-11 0 0" dur="2.2s" repeatCount="indefinite"/>
          <path class="ink" fill="#bd764b" d="M0 0c25 14 50 39 61 80l24 82-30 8c-14-45-32-79-67-105z"/>
          <path class="fine-ink" fill="#e0a164" d="M70 153q21-12 39-3l5 18q-24 17-48 8z"/>
          <path d="M80 165l17-4M87 172l16-3" class="fine-ink" fill="none" stroke="#704033" stroke-width="3"/>
        </g>
      </g>

      <!-- long forearms held up to catch bottles -->
      <path class="ink" fill="none" stroke="#bf794f" stroke-width="27" d="M522 392c10 15 19 22 34 7"/>
      <path class="ink" fill="#d99a60" d="M545 386q7-18 22-13 11 5 2 18l-10 13q-15-1-14-18z"/>
      <path class="ink" fill="none" stroke="#c77e51" stroke-width="28" d="M542 405c38 8 87 3 143-20"/>
      <path class="ink" fill="#d99a60" d="M677 375q17-13 28-1 4 13-11 20l-15 5q-13-10-2-24z"/>
      <path d="M550 386l8 5M684 385l8 4" class="fine-ink" fill="none" stroke="#704033" stroke-width="3"/>
    </g>
  </g>

  <!-- Three bottles on staggered, continuously tumbling juggling paths. -->
  <g aria-label="juggled bottles" filter="url(#shadow)">
    <g style="color:#e85b4c">
      <animateMotion dur="4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#juggleArc"/></animateMotion>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="720 0 0" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
    <g style="color:#42a9a5">
      <animateMotion begin="-1.6s" dur="4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#juggleArc"/></animateMotion>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="720 0 0" begin="-1.6s" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
    <g style="color:#7066c5">
      <animateMotion begin="-3.2s" dur="4.8s" repeatCount="indefinite" rotate="auto"><mpath href="#juggleArc"/></animateMotion>
      <g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="720 0 0" begin="-3.2s" dur="1.2s" repeatCount="indefinite"/><use href="#bottle"/></g>
    </g>
  </g>

  <!-- little dust motes at the rolling tire -->
  <g fill="#f6ce83" opacity=".7">
    <circle cx="374" cy="712" r="3"><animate attributeName="cx" values="374;360;374" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="615" cy="714" r="2.5"><animate attributeName="cx" values="615;630;615" dur="1.1s" repeatCount="indefinite"/></circle>
  </g>
</svg>
