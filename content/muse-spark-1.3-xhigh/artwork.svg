<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
<title>Anteater riding a unicycle while juggling bottles</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#6ec6ff"/>
    <stop offset="70%" stop-color="#c6efff"/>
    <stop offset="100%" stop-color="#e8f9ff"/>
  </linearGradient>
  <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#ffeb3b"/>
    <stop offset="70%" stop-color="#ffca28"/>
    <stop offset="100%" stop-color="#ffca28" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#616161"/>
    <stop offset="100%" stop-color="#424242"/>
  </linearGradient>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="420" fill="url(#sky)"/>
<circle cx="110" cy="90" r="70" fill="url(#sunGlow)" opacity="0.9"/>
<g>
  <circle cx="110" cy="90" r="38" fill="#FFEB3B" stroke="#FFA000" stroke-width="4"/>
  <g stroke="#FFA000" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 110 90" to="360 110 90" dur="12s" repeatCount="indefinite"/>
    <line x1="110" y1="32" x2="110" y2="18"/>
    <line x1="110" y1="148" x2="110" y2="162"/>
    <line x1="52" y1="90" x2="38" y2="90"/>
    <line x1="168" y1="90" x2="182" y2="90"/>
    <line x1="69" y1="49" x2="59" y2="39"/>
    <line x1="151" y1="131" x2="161" y2="141"/>
    <line x1="151" y1="49" x2="161" y2="39"/>
    <line x1="69" y1="131" x2="59" y2="141"/>
  </g>
</g>

<!-- clouds drifting -->
<g opacity="0.95">
  <g>
    <animateTransform attributeName="transform" type="translate" from="850 80" to="-250 80" dur="28s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="45" ry="20" fill="white"/>
    <ellipse cx="30" cy="-10" rx="35" ry="18" fill="white"/>
    <ellipse cx="-30" cy="-8" rx="30" ry="16" fill="white"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 160" to="-250 160" dur="38s" begin="-12s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="38" ry="16" fill="white" opacity="0.9"/>
    <ellipse cx="25" cy="-8" rx="28" ry="14" fill="white" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="850 45" to="-250 45" dur="45s" begin="-25s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="30" ry="13" fill="white" opacity="0.8"/>
  </g>
</g>

<!-- distant hills -->
<ellipse cx="200" cy="420" rx="220" ry="70" fill="#a5d6a7"/>
<ellipse cx="620" cy="425" rx="260" ry="80" fill="#81c784"/>

<!-- grass + road -->
<rect x="0" y="390" width="800" height="110" fill="#7ed957"/>
<rect x="0" y="415" width="800" height="85" fill="url(#roadGrad)"/>
<g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.5s" repeatCount="indefinite"/>
  <g fill="#FFEB3B">
    <rect x="0" y="453" width="55" height="9" rx="4"/>
    <rect x="100" y="453" width="55" height="9" rx="4"/>
    <rect x="200" y="453" width="55" height="9" rx="4"/>
    <rect x="300" y="453" width="55" height="9" rx="4"/>
    <rect x="400" y="453" width="55" height="9" rx="4"/>
    <rect x="500" y="453" width="55" height="9" rx="4"/>
    <rect x="600" y="453" width="55" height="9" rx="4"/>
    <rect x="700" y="453" width="55" height="9" rx="4"/>
    <rect x="800" y="453" width="55" height="9" rx="4"/>
    <rect x="900" y="453" width="55" height="9" rx="4"/>
  </g>
</g>
<!-- speed lines -->
<g stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.6">
  <line x1="80" y1="350" x2="140" y2="350">
    <animate attributeName="x1" values="180;60" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="240;120" dur="0.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="90" y1="300" x2="170" y2="300">
    <animate attributeName="x1" values="190;40" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="270;120" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="0.5s" begin="0.15s" repeatCount="indefinite"/>
  </line>
  <line x1="650" y1="320" x2="710" y2="320">
    <animate attributeName="x1" values="750;630" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="810;690" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="0.5s" begin="0.3s" repeatCount="indefinite"/>
  </line>
</g>

<!-- shadow -->
<ellipse cx="400" cy="435" rx="90" ry="12" fill="black" opacity="0.25">
  <animate attributeName="rx" values="90;82;90" dur="0.8s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="0.25;0.18;0.25" dur="0.8s" repeatCount="indefinite"/>
</ellipse>

<!-- TITLE -->
<g font-family="Comic Sans MS, Chalkboard SE, sans-serif" text-anchor="middle">
  <text x="400" y="48" font-size="32" font-weight="bold" fill="#4E342E">Anteater Acrobat!
    <animate attributeName="y" values="48;42;48" dur="1.2s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="74" font-size="16" fill="#5D4037">juggling bottles on a unicycle!</text>
</g>

<!-- WHOLE RIDER BOBBING -->
<g>
  <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="0.8s" repeatCount="indefinite"/>

  <!-- TAIL (big bushy anteater tail) with wag -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-6 330 210; 8 330 210; -6 330 210" dur="1.4s" repeatCount="indefinite"/>
    <path d="M 335 195 C 260 215 185 165 150 55 C 145 45 132 52 136 65 C 150 145 210 250 335 235 Z" fill="#6D5B4D" stroke="#3E3229" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 315 205 C 260 210 200 175 175 95 C 195 140 245 190 315 192 Z" fill="#8D7B6A" opacity="0.9"/>
    <path d="M 250 190 Q 235 150 240 110 Q 250 150 265 185" fill="none" stroke="#3E3229" stroke-width="2" opacity="0.5"/>
    <path d="M 280 195 Q 270 155 278 115 Q 286 155 295 192" fill="none" stroke="#3E3229" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- UNICYCLE WHEEL -->
  <circle cx="400" cy="360" r="60" fill="none" stroke="#212121" stroke-width="12"/>
  <circle cx="400" cy="360" r="46" fill="none" stroke="#9E9E9E" stroke-width="4"/>
  <circle cx="400" cy="360" r="38" fill="#E1F5FE" opacity="0.7"/>
  <!-- spinning spokes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="1s" repeatCount="indefinite"/>
    <g stroke="#616161" stroke-width="4" stroke-linecap="round">
      <line x1="400" y1="360" x2="400" y2="310"/>
      <line x1="400" y1="360" x2="443" y2="385"/>
      <line x1="400" y1="360" x2="357" y2="385"/>
      <line x1="400" y1="360" x2="400" y2="410"/>
      <line x1="400" y1="360" x2="357" y2="335"/>
      <line x1="400" y1="360" x2="443" y2="335"/>
    </g>
    <circle cx="400" cy="360" r="5" fill="#212121"/>
  </g>
  <!-- tire highlight spinning -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="-360 400 360" dur="1s" repeatCount="indefinite"/>
    <circle cx="400" cy="308" r="6" fill="#FFEB3B"/>
  </g>

  <!-- frame + seat -->
  <line x1="400" y1="360" x2="400" y2="235" stroke="#D32F2F" stroke-width="9" stroke-linecap="round"/>
  <line x1="400" y1="360" x2="385" y2="360" stroke="#757575" stroke-width="6"/>
  <rect x="357" y="214" width="86" height="20" rx="10" fill="#212121"/>
  <rect x="367" y="208" width="66" height="12" rx="6" fill="#FF5722"/>
  <circle cx="400" cy="360" r="10" fill="#D32F2F" stroke="#212121" stroke-width="3"/>

  <!-- pedals / cranks rotating -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 360" to="360 400 360" dur="1s" repeatCount="indefinite"/>
    <line x1="400" y1="360" x2="428" y2="378" stroke="#212121" stroke-width="7" stroke-linecap="round"/>
    <line x1="400" y1="360" x2="372" y2="342" stroke="#212121" stroke-width="7" stroke-linecap="round"/>
    <rect x="418" y="372" width="24" height="10" rx="3" fill="black"/>
    <rect x="358" y="338" width="24" height="10" rx="3" fill="black"/>
  </g>

  <!-- ANTEATER LEGS (pedaling bob) -->
  <g stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -12; 0 0" dur="1s" repeatCount="indefinite"/>
      <path d="M 368 225 L 358 285 L 376 345" stroke="#7A6A58" stroke-width="18"/>
      <path d="M 376 345 L 390 352 L 382 338" fill="#F5F5F5" stroke="#3E3229" stroke-width="2"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 -12; 0 0; 0 -12" dur="1s" repeatCount="indefinite"/>
      <path d="M 415 225 L 425 285 L 418 378" stroke="#8D7B6A" stroke-width="18"/>
      <g fill="#F5F5F5" stroke="#3E3229" stroke-width="2">
        <ellipse cx="424" cy="382" rx="10" ry="6"/>
        <path d="M 428 378 L 440 373 L 432 385 Z"/>
        <path d="M 430 383 L 442 380 L 434 390 Z"/>
      </g>
    </g>
  </g>

  <!-- ANTEATER BODY -->
  <ellipse cx="390" cy="180" rx="78" ry="56" fill="#B8A894" stroke="#4E342E" stroke-width="4"/>
  <!-- classic anteater stripe -->
  <path d="M 345 132 L 400 180 L 345 228 L 364 232 L 419 180 L 364 128 Z" fill="#212121" stroke="white" stroke-width="3" stroke-linejoin="round"/>
  <ellipse cx="370" cy="165" rx="8" ry="5" fill="#8D7B6A" opacity="0.6" transform="rotate(-20 370 165)"/>

  <!-- ARMS juggling -->
  <g fill="none" stroke-linecap="round">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-8 405 175; 10 405 175; -8 405 175" dur="0.9s" repeatCount="indefinite"/>
      <path d="M 405 175 Q 365 160 328 120" stroke="#8D7B6A" stroke-width="14"/>
      <circle cx="325" cy="115" r="10" fill="#B8A894" stroke="#4E342E" stroke-width="3"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="10 430 175; -8 430 175; 10 430 175" dur="0.9s" repeatCount="indefinite"/>
      <path d="M 430 175 Q 475 165 515 125" stroke="#7A6A58" stroke-width="14"/>
      <circle cx="520" cy="120" r="10" fill="#B8A894" stroke="#4E342E" stroke-width="3"/>
    </g>
  </g>

  <!-- HEAD + LONG SNOUT -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 445 145; 3 445 145; -3 445 145" dur="0.9s" repeatCount="indefinite"/>
    <ellipse cx="445" cy="145" rx="30" ry="27" fill="#B8A894" stroke="#4E342E" stroke-width="4"/>
    <!-- ear -->
    <path d="M 428 122 L 435 100 L 448 118 Z" fill="#8D7B6A" stroke="#4E342E" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="436" cy="112" r="4" fill="#FFCDD2"/>
    <!-- long tubular snout -->
    <path d="M 462 132 L 575 112 L 575 142 L 462 158 Z" fill="#B8A894" stroke="#4E342E" stroke-width="4" stroke-linejoin="round"/>
    <path d="M 465 145 L 570 129" stroke="#8D7B6A" stroke-width="2" opacity="0.6"/>
    <!-- nose -->
    <ellipse cx="575" cy="127" rx="11" ry="14" fill="#3E2723"/>
    <ellipse cx="578" cy="123" rx="3" ry="4" fill="#8D6E63"/>
    <circle cx="568" cy="132" r="2" fill="#4E342E"/>
    <!-- eye happy -->
    <circle cx="450" cy="138" r="7" fill="white" stroke="#4E342E" stroke-width="2"/>
    <circle cx="452" cy="139" r="3.5" fill="black">
      <animate attributeName="r" values="3.5;0.5;3.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="453.5" cy="137.5" r="1.2" fill="white"/>
    <!-- smile -->
    <path d="M 445 155 Q 455 162 468 158" fill="none" stroke="#4E342E" stroke-width="2.5" stroke-linecap="round"/>
    <!-- tongue flick (anteater!) -->
    <path d="M 582 135 Q 595 137 598 130" fill="none" stroke="#E91E63" stroke-width="3" stroke-linecap="round">
      <animate attributeName="d" values="M 582 135 Q 595 137 598 130; M 582 135 Q 600 138 610 135; M 582 135 Q 595 137 598 130" dur="1.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- scarf flying for fun -->
  <path d="M 350 170 Q 310 175 285 155 Q 305 185 345 185 Z" fill="#D32F2F"/>
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 350 178; -12 350 178; 0 350 178" dur="0.6s" repeatCount="indefinite"/>
    <path d="M 350 170 Q 300 170 270 190 Q 300 195 350 185 Z" fill="#FF5722" stroke="#BF360C" stroke-width="2"/>
  </g>
</g>

<!-- JUGGLING BOTTLES (on top, not bobbing as much) -->
<g>
  <!-- Bottle 1 - green -->
  <g>
    <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite" path="M 325 115 Q 430 -20 520 120 Q 430 85 325 115"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <rect x="-13" y="-18" width="26" height="38" rx="7" fill="#4CAF50" stroke="#1B5E20" stroke-width="3"/>
      <rect x="-6" y="-32" width="12" height="16" fill="#C8E6C9" stroke="#1B5E20" stroke-width="2.5"/>
      <rect x="-8" y="-38" width="16" height="7" rx="2" fill="#795548" stroke="#3E2723" stroke-width="2"/>
      <rect x="-9" y="-8" width="18" height="14" rx="2" fill="white" opacity="0.9"/>
      <text x="0" y="2" font-size="8" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#1B5E20">LIME</text>
      <rect x="-10" y="-16" width="4" height="32" rx="2" fill="white" opacity="0.5"/>
    </g>
  </g>
  <!-- Bottle 2 - orange -->
  <g>
    <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M 325 115 Q 430 -20 520 120 Q 430 85 325 115"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <rect x="-13" y="-18" width="26" height="38" rx="7" fill="#FF9800" stroke="#E65100" stroke-width="3"/>
      <rect x="-6" y="-32" width="12" height="16" fill="#FFE0B2" stroke="#E65100" stroke-width="2.5"/>
      <rect x="-8" y="-38" width="16" height="7" rx="2" fill="#4E342E" stroke="#212121" stroke-width="2"/>
      <rect x="-9" y="-8" width="18" height="14" rx="2" fill="white" opacity="0.9"/>
      <text x="0" y="2" font-size="7" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#E65100">ORANGE</text>
      <rect x="-10" y="-16" width="4" height="32" rx="2" fill="white" opacity="0.5"/>
    </g>
  </g>
  <!-- Bottle 3 - blue / ketchup? -->
  <g>
    <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M 325 115 Q 430 -20 520 120 Q 430 85 325 115"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="0.9s" repeatCount="indefinite"/>
      <rect x="-13" y="-18" width="26" height="38" rx="7" fill="#03A9F4" stroke="#01579B" stroke-width="3"/>
      <rect x="-6" y="-32" width="12" height="16" fill="#B3E5FC" stroke="#01579B" stroke-width="2.5"/>
      <rect x="-8" y="-38" width="16" height="7" rx="2" fill="#212121" stroke="black" stroke-width="2"/>
      <rect x="-9" y="-8" width="18" height="14" rx="2" fill="white" opacity="0.9"/>
      <text x="0" y="2" font-size="8" text-anchor="middle" font-family="sans-serif" font-weight="bold" fill="#01579B">FIZZ</text>
      <rect x="-10" y="-16" width="4" height="32" rx="2" fill="white" opacity="0.5"/>
    </g>
  </g>
</g>

<!-- foreground grass tufts bouncing past -->
<g fill="#33691E">
  <g>
    <animateTransform attributeName="transform" type="translate" from="850 0" to="-150 0" dur="4s" repeatCount="indefinite"/>
    <path d="M 0 405 Q 5 390 10 405 Q 15 390 20 405 Z"/>
    <path d="M 200 408 Q 205 393 210 408 Q 215 393 220 408 Z"/>
    <path d="M 450 405 Q 455 390 460 405 Q 465 390 470 405 Z"/>
    <path d="M 700 408 Q 705 393 710 408 Q 715 393 720 408 Z"/>
  </g>
</g>

</svg>