<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
<title>Anteater Riding a Unicycle While Juggling Bottles</title>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ec8f7"/>
    <stop offset="70%" stop-color="#c9ecff"/>
    <stop offset="100%" stop-color="#e8f7ff"/>
  </linearGradient>
  <linearGradient id="groundG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#7ed67e"/>
    <stop offset="30%" stop-color="#5cbf5c"/>
    <stop offset="100%" stop-color="#3a8a3a"/>
  </linearGradient>
  <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0%" stop-color="#fff6b0"/>
    <stop offset="60%" stop-color="#ffdf4d"/>
    <stop offset="100%" stop-color="#ffae00"/>
  </radialGradient>
</defs>

<!-- BACKGROUND -->
<rect x="0" y="0" width="800" height="520" fill="url(#sky)"/>
<!-- sun -->
<g transform="translate(680,90)">
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
    <g fill="#ffcc33" opacity="0.9">
      <ellipse cx="0" cy="-55" rx="8" ry="18"/>
      <ellipse cx="0" cy="55" rx="8" ry="18"/>
      <ellipse cx="-55" cy="0" rx="18" ry="8"/>
      <ellipse cx="55" cy="0" rx="18" ry="8"/>
      <ellipse cx="-39" cy="-39" rx="8" ry="18" transform="rotate(-45 -39 -39)"/>
      <ellipse cx="39" cy="-39" rx="8" ry="18" transform="rotate(45 39 -39)"/>
      <ellipse cx="-39" cy="39" rx="8" ry="18" transform="rotate(45 -39 39)"/>
      <ellipse cx="39" cy="39" rx="8" ry="18" transform="rotate(-45 39 39)"/>
    </g>
  </g>
  <circle r="38" fill="url(#sunG)" stroke="#e69500" stroke-width="3"/>
</g>

<!-- clouds drifting -->
<g opacity="0.95">
  <g transform="translate(0,70)">
    <animateTransform attributeName="transform" type="translate" from="850 70" to="-250 70" dur="22s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="55" ry="22" fill="white"/>
    <ellipse cx="35" cy="-10" rx="40" ry="20" fill="white"/>
    <ellipse cx="-35" cy="-8" rx="35" ry="18" fill="white"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="900 150" to="-300 150" dur="30s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="70" ry="24" fill="white" opacity="0.9"/>
    <ellipse cx="45" cy="-12" rx="45" ry="20" fill="white" opacity="0.9"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="translate" from="750 40" to="-350 40" dur="38s" repeatCount="indefinite"/>
    <ellipse cx="0" cy="0" rx="38" ry="16" fill="white" opacity="0.85"/>
    <ellipse cx="25" cy="-8" rx="28" ry="14" fill="white" opacity="0.85"/>
  </g>
</g>

<!-- distant hills -->
<path d="M0,430 Q150,340 300,420 Q450,500 600,410 Q700,360 800,430 L800,520 L0,520 Z" fill="#9ad69a" opacity="0.8"/>
<path d="M0,460 Q200,400 400,455 Q600,510 800,445 L800,520 L0,520 Z" fill="#6fbf6f" opacity="0.9"/>

<!-- ground -->
<rect x="0" y="500" width="800" height="100" fill="url(#groundG)"/>
<rect x="0" y="500" width="800" height="12" fill="#2f7a2f" opacity="0.5"/>
<!-- road -->
<rect x="0" y="520" width="800" height="56" fill="#55555e"/>
<rect x="0" y="520" width="800" height="8" fill="#6e6e78"/>
<line x1="0" y1="549" x2="800" y2="549" stroke="white" stroke-width="7" stroke-dasharray="44 34" stroke-linecap="round">
  <animate attributeName="stroke-dashoffset" from="0" to="-156" dur="0.5s" repeatCount="indefinite"/>
</line>

<!-- scrolling trees / bushes to show forward motion -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-200 0" dur="1.4s" repeatCount="indefinite"/>
  <g id="trees">
    <g transform="translate(50,485)">
      <rect x="-8" y="-30" width="16" height="35" fill="#6b4423"/>
      <circle cx="0" cy="-45" r="28" fill="#2e8b2e"/><circle cx="-18" cy="-35" r="20" fill="#36a336"/>
    </g>
    <g transform="translate(250,490)">
      <rect x="-6" y="-20" width="12" height="25" fill="#6b4423"/>
      <ellipse cx="0" cy="-28" rx="30" ry="18" fill="#3aa33a"/>
    </g>
    <g transform="translate(450,485)">
      <rect x="-8" y="-30" width="16" height="35" fill="#6b4423"/>
      <circle cx="0" cy="-48" r="26" fill="#2e8b2e"/><circle cx="18" cy="-36" r="18" fill="#43b343"/>
    </g>
    <g transform="translate(650,490)">
      <rect x="-6" y="-20" width="12" height="25" fill="#6b4423"/>
      <ellipse cx="0" cy="-28" rx="32" ry="16" fill="#2f9d2f"/>
    </g>
    <g transform="translate(850,485)">
      <rect x="-8" y="-30" width="16" height="35" fill="#6b4423"/>
      <circle cx="0" cy="-45" r="28" fill="#2e8b2e"/><circle cx="-18" cy="-35" r="20" fill="#36a336"/>
    </g>
    <g transform="translate(1050,490)">
      <rect x="-6" y="-20" width="12" height="25" fill="#6b4423"/>
      <ellipse cx="0" cy="-28" rx="30" ry="18" fill="#3aa33a"/>
    </g>
  </g>
</g>

<!-- title -->
<g transform="translate(400,48)">
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="1.2s" repeatCount="indefinite"/>
    <text text-anchor="middle" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#4a2c1a" stroke="white" stroke-width="6" paint-order="stroke">The Amazing Juggling Anteater!</text>
    <text text-anchor="middle" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#4a2c1a">The Amazing Juggling Anteater!</text>
  </g>
</g>

<!-- ================= RIDER ================= -->
<g transform="translate(400,380)">
  <!-- whole rider wobble -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-2;2;-2" dur="1.2s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -9; 0 0" dur="0.6s" repeatCount="indefinite"/>
      <!-- shadow -->
      <ellipse cx="0" cy="152" rx="92" ry="11" fill="black" opacity="0.18"/>

      <!-- UNICYCLE WHEEL -->
      <circle cx="0" cy="80" r="62" fill="#22222a"/>
      <circle cx="0" cy="80" r="54" fill="#d5d5dd"/>
      <circle cx="0" cy="80" r="46" fill="#f7f7fa"/>
      <!-- spinning spokes -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 80" to="360 0 80" dur="0.8s" repeatCount="indefinite"/>
        <g stroke="#888896" stroke-width="5" stroke-linecap="round">
          <line x1="0" y1="80" x2="0" y2="36"/>
          <line x1="0" y1="80" x2="38" y2="58"/>
          <line x1="0" y1="80" x2="38" y2="102"/>
          <line x1="0" y1="80" x2="0" y2="124"/>
          <line x1="0" y1="80" x2="-38" y2="102"/>
          <line x1="0" y1="80" x2="-38" y2="58"/>
        </g>
        <circle cx="0" cy="36" r="7" fill="#ff5252"/><circle cx="38" cy="58" r="7" fill="#ff5252"/><circle cx="38" cy="102" r="7" fill="#ff5252"/>
        <circle cx="0" cy="124" r="7" fill="#ff5252"/><circle cx="-38" cy="102" r="7" fill="#ff5252"/><circle cx="-38" cy="58" r="7" fill="#ff5252"/>
      </g>
      <circle cx="0" cy="80" r="12" fill="#ff5252" stroke="#7a1010" stroke-width="3"/>
      <circle cx="0" cy="80" r="4" fill="white"/>

      <!-- frame -->
      <path d="M0,80 L-6,-20 L6,-20 L0,80" fill="none" stroke="#8b9bb4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="-12" y="-30" width="24" height="12" rx="4" fill="#5a6a85"/>

      <!-- pedals / cranks spinning -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 80" to="360 0 80" dur="0.8s" repeatCount="indefinite"/>
        <line x1="-28" y1="80" x2="28" y2="80" stroke="#333" stroke-width="7" stroke-linecap="round"/>
        <rect x="-38" y="74" width="20" height="10" rx="3" fill="black"/>
        <rect x="18" y="76" width="20" height="10" rx="3" fill="black"/>
      </g>

      <!-- seat -->
      <g transform="translate(0,-38)">
        <ellipse cx="0" cy="0" rx="34" ry="12" fill="#3a2a1e" stroke="#1e1410" stroke-width="2"/>
        <ellipse cx="0" cy="-4" rx="30" ry="8" fill="#5a4433"/>
      </g>

      <!-- TAIL (behind body) -->
      <g transform="translate(-58,-68)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;10;-6;0" dur="1.6s" repeatCount="indefinite"/>
          <path d="M0,0 C-40,-40 -110,-55 -135,-15 C-150,12 -125,42 -95,38 C-70,35 -20,20 5,10 Z" fill="#8d6a45" stroke="#5a3f27" stroke-width="3" stroke-linejoin="round"/>
          <path d="M-10,-5 C-40,-25 -90,-35 -115,-12" fill="none" stroke="#5a3f27" stroke-width="2" opacity="0.5"/>
          <path d="M-12,5 C-40,-5 -80,-10 -105,8" fill="none" stroke="#c9a87a" stroke-width="3" opacity="0.7" stroke-linecap="round"/>
          <path d="M-20,-12 C-50,-28 -95,-42 -120,-22" fill="none" stroke="#c9a87a" stroke-width="2" opacity="0.6" stroke-linecap="round"/>
        </g>
      </g>

      <!-- FAR LEG -->
      <g transform="translate(-14,-42)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="22;-22;22" dur="0.8s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="95" stroke="#7a5a3a" stroke-width="16" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="95" stroke="#a67c52" stroke-width="11" stroke-linecap="round"/>
          <ellipse cx="4" cy="100" rx="16" ry="9" fill="#4a2c1a"/>
        </g>
      </g>

      <!-- BODY -->
      <ellipse cx="-2" cy="-68" rx="76" ry="39" fill="#b78d5e" stroke="#6b4a2f" stroke-width="3"/>
      <ellipse cx="5" cy="-52" rx="55" ry="22" fill="#d0aa7d" opacity="0.9"/>
      <!-- anteater stripe -->
      <path d="M-2,-104 L48,-68 L-2,-32 L10,-32 L60,-68 L10,-104 Z" fill="white" stroke="#222" stroke-width="3" stroke-linejoin="round"/>
      <path d="M2,-96 L44,-68 L2,-40" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- NEAR LEG -->
      <g transform="translate(14,-42)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-22;22;-22" dur="0.8s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="0" y2="95" stroke="#7a5a3a" stroke-width="17" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="0" y2="95" stroke="#bd9260" stroke-width="12" stroke-linecap="round"/>
          <ellipse cx="4" cy="100" rx="17" ry="9" fill="#3a2315"/>
        </g>
      </g>

      <!-- FAR ARM -->
      <g transform="translate(18,-78)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-12;18;-12" dur="0.9s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="12" y2="-52" stroke="#7a5a3a" stroke-width="14" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="12" y2="-52" stroke="#a67c52" stroke-width="9" stroke-linecap="round"/>
          <circle cx="13" cy="-56" r="10" fill="#7a5a3a"/>
        </g>
      </g>

      <!-- HEAD GROUP -->
      <g transform="translate(62,-92)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="0;4;-3;0" dur="1.5s" repeatCount="indefinite"/>
          <!-- helmet -->
          <path d="M-22,-16 A26 26 0 0 1 22,-16 L22,-10 L-22,-10 Z" fill="#e94f37" stroke="#7a1f14" stroke-width="2.5"/>
          <circle cx="0" cy="-38" r="7" fill="#ffd93d" stroke="#7a1f14" stroke-width="2">
            <animate attributeName="cy" values="-38;-40;-38" dur="0.6s" repeatCount="indefinite"/>
          </circle>
          <!-- ear -->
          <ellipse cx="-12" cy="-14" rx="9" ry="11" fill="#a67c52" stroke="#6b4a2f" stroke-width="2.5"/>
          <ellipse cx="-12" cy="-14" rx="4" ry="6" fill="#e8c9a0"/>
          <!-- head -->
          <circle cx="0" cy="0" r="27" fill="#b78d5e" stroke="#6b4a2f" stroke-width="3"/>
          <!-- long snout -->
          <path d="M12,-8 C45,-8 78,-1 96,10 L90,24 C70,16 40,12 8,14 Z" fill="#b78d5e" stroke="#6b4a2f" stroke-width="3" stroke-linejoin="round"/>
          <ellipse cx="94" cy="17" rx="9" ry="7" fill="#3a2315"/>
          <circle cx="96" cy="16" r="2.2" fill="#ff8a8a"/>
          <!-- happy closed eye -->
          <path d="M-2,-6 Q6,-12 14,-6" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/>
          <!-- blush -->
          <ellipse cx="10" cy="3" rx="7" ry="4" fill="#ff9e9e" opacity="0.7"/>
          <!-- smiling mouth under snout -->
          <path d="M48,14 Q55,18 62,14" fill="none" stroke="#4a2c1a" stroke-width="2" stroke-linecap="round"/>
          <!-- wiggly tongue -->
          <path d="M70,20 Q80,26 75,34 Q70,40 78,44" fill="none" stroke="#ff6b8a" stroke-width="4" stroke-linecap="round">
            <animate attributeName="d" values="M70,20 Q80,26 75,34 Q70,40 78,44;M70,20 Q82,24 78,32 Q74,38 80,42;M70,20 Q80,26 75,34 Q70,40 78,44" dur="0.7s" repeatCount="indefinite"/>
          </path>
        </g>
      </g>

      <!-- NEAR ARM (front, waving high) -->
      <g transform="translate(32,-78)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="18;-12;18" dur="0.9s" repeatCount="indefinite"/>
          <line x1="0" y1="0" x2="30" y2="-54" stroke="#7a5a3a" stroke-width="15" stroke-linecap="round"/>
          <line x1="0" y1="0" x2="30" y2="-54" stroke="#bd9260" stroke-width="10" stroke-linecap="round"/>
          <circle cx="33" cy="-57" r="11" fill="#bd9260" stroke="#6b4a2f" stroke-width="2.5"/>
          <circle cx="36" cy="-59" r="3" fill="#4a2c1a"/><circle cx="30" cy="-60" r="3" fill="#4a2c1a"/>
        </g>
      </g>

      <!-- ===== JUGGLING BOTTLES ===== -->
      <g transform="translate(55,-135)">
        <!-- motion guide (invisible) -->
        <!-- Bottle 1 - red -->
        <g>
          <animateMotion dur="1.8s" repeatCount="indefinite" path="M -22,0 C -18,-125 18,-125 22,0 C 12,22 -12,22 -22,0 Z"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
            <g>
              <rect x="-14" y="-18" width="28" height="42" rx="8" fill="#e94f37" stroke="#6b1508" stroke-width="2.5"/>
              <rect x="-7" y="-32" width="14" height="16" rx="3" fill="#ffd0c2" stroke="#6b1508" stroke-width="2.5"/>
              <rect x="-9.5" y="-40" width="19" height="9" rx="3.5" fill="#3a2315"/>
              <rect x="-10" y="-6" width="20" height="14" rx="3" fill="white"/>
              <text x="0" y="5" text-anchor="middle" font-size="9" font-family="Verdana" font-weight="bold" fill="#e94f37">HOT</text>
              <rect x="-10" y="-14" width="5" height="32" rx="2.5" fill="white" opacity="0.45"/>
            </g>
          </g>
        </g>
        <!-- Bottle 2 - green, offset -->
        <g>
          <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite" path="M -22,0 C -18,-125 18,-125 22,0 C 12,22 -12,22 -22,0 Z"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1s" repeatCount="indefinite"/>
            <g>
              <rect x="-14" y="-18" width="28" height="42" rx="8" fill="#2fbf71" stroke="#0f5a32" stroke-width="2.5"/>
              <rect x="-7" y="-32" width="14" height="16" rx="3" fill="#c8f5dd" stroke="#0f5a32" stroke-width="2.5"/>
              <rect x="-9.5" y="-40" width="19" height="9" rx="3.5" fill="#1a3a28"/>
              <rect x="-10" y="-6" width="20" height="14" rx="3" fill="white"/>
              <text x="0" y="5" text-anchor="middle" font-size="8" font-family="Verdana" font-weight="bold" fill="#0f5a32">LIME</text>
              <rect x="-10" y="-14" width="5" height="32" rx="2.5" fill="white" opacity="0.45"/>
            </g>
          </g>
        </g>
        <!-- Bottle 3 - blue/yellow, offset -->
        <g>
          <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite" path="M -22,0 C -18,-125 18,-125 22,0 C 12,22 -12,22 -22,0 Z"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.85s" repeatCount="indefinite"/>
            <g>
              <rect x="-14" y="-18" width="28" height="42" rx="8" fill="#3a86ff" stroke="#0f2a6b" stroke-width="2.5"/>
              <rect x="-7" y="-32" width="14" height="16" rx="3" fill="#cfe1ff" stroke="#0f2a6b" stroke-width="2.5"/>
              <rect x="-9.5" y="-40" width="19" height="9" rx="3.5" fill="#1f1f3a"/>
              <rect x="-10" y="-6" width="20" height="14" rx="3" fill="white"/>
              <text x="0" y="5" text-anchor="middle" font-size="8" font-family="Verdana" font-weight="bold" fill="#0f2a6b">POP</text>
              <rect x="-10" y="-14" width="5" height="32" rx="2.5" fill="white" opacity="0.45"/>
            </g>
          </g>
        </g>
        <!-- sparkles at hands -->
        <g fill="#fff7ad" stroke="#e6a700" stroke-width="1">
          <path id="spark1" d="M-22,0 l3,7 7,3 -7,3 -3,7 -3,-7 -7,-3 7,-3 Z">
            <animate attributeName="opacity" values="1;0.2;1" dur="0.6s" repeatCount="indefinite"/>
            <animateTransform attributeName="transform" type="scale" values="1;0.6;1" additive="sum" dur="0.6s" repeatCount="indefinite"/>
          </path>
          <path id="spark2" d="M22,0 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5 Z">
            <animate attributeName="opacity" values="0.2;1;0.2" dur="0.6s" repeatCount="indefinite"/>
          </path>
        </g>
        <!-- hands markers -->
        <ellipse cx="-22" cy="2" rx="10" ry="6" fill="#6b4a2f" opacity="0.25"/>
        <ellipse cx="22" cy="2" rx="10" ry="6" fill="#6b4a2f" opacity="0.25"/>
      </g>

      <!-- speed lines behind -->
      <g stroke="white" stroke-linecap="round" opacity="0.7">
        <line x1="-130" y1="-90" x2="-190" y2="-90" stroke-width="5">
          <animate attributeName="x1" values="-110;-170;-110" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="-150;-230;-150" dur="0.5s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0;0.7" dur="0.5s" repeatCount="indefinite"/>
        </line>
        <line x1="-120" y1="-50" x2="-180" y2="-50" stroke-width="4">
          <animate attributeName="x1" values="-100;-170;-100" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="-160;-240;-160" dur="0.4s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0;0.6" dur="0.4s" repeatCount="indefinite"/>
        </line>
        <line x1="-135" y1="-10" x2="-185" y2="-10" stroke-width="6">
          <animate attributeName="x1" values="-115;-175;-115" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="x2" values="-155;-225;-155" dur="0.6s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.7;0;0.7" dur="0.6s" repeatCount="indefinite"/>
        </line>
      </g>

    </g>
  </g>
</g>

<!-- foreground grass tufts scrolling fast -->
<g>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="0.7s" repeatCount="indefinite"/>
  <g fill="#2f7a2f">
    <path d="M60,515 l8,-14 8,14 Z M72,515 l8,-12 8,12 Z"/>
    <path d="M220,515 l8,-14 8,14 Z M232,515 l8,-12 8,12 Z"/>
    <path d="M380,515 l8,-14 8,14 Z M392,515 l8,-12 8,12 Z"/>
    <path d="M540,515 l8,-14 8,14 Z M552,515 l8,-12 8,12 Z"/>
    <path d="M700,515 l8,-14 8,14 Z M712,515 l8,-12 8,12 Z"/>
    <path d="M860,515 l8,-14 8,14 Z M872,515 l8,-12 8,12 Z"/>
  </g>
</g>

</svg>