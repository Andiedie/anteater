<svg xmlns="http://www.w3.org/2000/svg" width="900" height="650" viewBox="0 0 900 650" role="img" aria-labelledby="title desc">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A giant anteater with a long snout and bushy tail pedals a unicycle, bobbing up and down while three coloured bottles spin in an arc above its paws. The wheel, pedals, clouds, road markings and circus bunting are animated.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ed6ff"/>
      <stop offset="58%" stop-color="#c9f2ff"/>
      <stop offset="100%" stop-color="#fff3c9"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c7a17a"/>
      <stop offset="55%" stop-color="#a67c5b"/>
      <stop offset="100%" stop-color="#86603f"/>
    </linearGradient>
    <linearGradient id="tailFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b4a2f"/>
      <stop offset="100%" stop-color="#3b281c"/>
    </linearGradient>
    <linearGradient id="headFur" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bd9268"/>
      <stop offset="100%" stop-color="#96704a"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ae"/>
      <stop offset="100%" stop-color="#ffb52e"/>
    </radialGradient>
    <clipPath id="bodyClip">
      <ellipse cx="435" cy="295" rx="112" ry="59" transform="rotate(-4 435 295)"/>
    </clipPath>

    <!-- One bottle, centred on (0,0) so it can spin while travelling. -->
    <g id="bottle">
      <rect x="-6" y="-33" width="12" height="8" rx="3" fill="#ffcf3f" stroke="#b7791f" stroke-width="1.5"/>
      <path d="M-6 -26 L-6 -15 C-6 -9 -14 -6 -14 3 L-14 22 C-14 29 -10 32 0 32 C10 32 14 29 14 22 L14 3 C14 -6 6 -9 6 -15 L6 -26 Z"
            fill="currentColor" stroke="rgba(0,0,0,.28)" stroke-width="2"/>
      <rect x="-9" y="7" width="18" height="16" rx="3" fill="#fff8dc" opacity=".96"/>
      <path d="M-5 11 l2.2 4.4 4.8.7 -3.5 3.4.8 4.8 -4.3-2.3 -4.3 2.3.8-4.8 -3.5-3.4 4.8-.7 Z" fill="#e94f37"/>
      <rect x="-9" y="-3" width="5" height="27" rx="2.5" fill="#fff" opacity=".42"/>
    </g>
  </defs>

  <!-- ===== Background ===== -->
  <rect width="900" height="650" fill="url(#sky)"/>

  <!-- Sun with slowly rotating rays -->
  <g transform="translate(92 92)">
    <g fill="#ffb52e" opacity=".75">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      <path d="M0-68 L9-38 L-9-38 Z"/><path d="M0 68 L9 38 L-9 38 Z"/>
      <path d="M-68 0 L-38 9 L-38-9 Z"/><path d="M68 0 L38 9 L38-9 Z"/>
      <path d="M-48-48 L-24-32 L-38-20 Z"/><path d="M48 48 L24 32 L38 20 Z"/>
      <path d="M48-48 L38-20 L24-32 Z"/><path d="M-48 48 L-38 20 L-24 32 Z"/>
    </g>
    <circle r="38" fill="url(#sunCore)" stroke="#f59e0b" stroke-width="3"/>
    <circle cx="-12" cy="-5" r="4" fill="#7c4a03"/><circle cx="13" cy="-5" r="4" fill="#7c4a03"/>
    <path d="M-13 10 Q0 20 13 10" fill="none" stroke="#7c4a03" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Drifting clouds -->
  <g fill="#fff" opacity=".92">
    <g>
      <animateTransform attributeName="transform" type="translate" values="-180 0; 980 0" dur="46s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="105" rx="48" ry="22"/><ellipse cx="38" cy="94" rx="38" ry="27"/><ellipse cx="76" cy="107" rx="44" ry="19"/>
    </g>
    <g opacity=".75">
      <animateTransform attributeName="transform" type="translate" values="980 0; -220 0" dur="62s" repeatCount="indefinite"/>
      <ellipse cx="0" cy="168" rx="38" ry="17"/><ellipse cx="31" cy="158" rx="31" ry="22"/><ellipse cx="61" cy="170" rx="35" ry="15"/>
    </g>
  </g>

  <!-- Circus bunting -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-1 450 0; 1 450 0; -1 450 0" dur="4s" repeatCount="indefinite"/>
    <path d="M0 8 Q225 72 450 18 Q675 -28 900 22" fill="none" stroke="#5b4a3f" stroke-width="3"/>
    <g stroke="rgba(0,0,0,.15)">
      <path d="M80 28 l24 40 8-45Z" fill="#ef476f"/><path d="M170 38 l24 40 8-45Z" fill="#ffd166"/>
      <path d="M265 36 l24 40 8-45Z" fill="#06d6a0"/><path d="M360 27 l24 40 8-45Z" fill="#118ab2"/>
      <path d="M455 18 l24 40 8-45Z" fill="#ef476f"/><path d="M550 10 l24 40 8-45Z" fill="#ffd166"/>
      <path d="M650 8 l24 40 8-45Z" fill="#06d6a0"/><path d="M750 13 l24 40 8-45Z" fill="#118ab2"/>
    </g>
  </g>

  <!-- Hills and road -->
  <path d="M0 505 Q160 440 330 500 T900 485 V650 H0 Z" fill="#8bd17c"/>
  <path d="M0 530 Q240 485 470 525 T900 515 V650 H0 Z" fill="#67b95e"/>
  <rect x="0" y="566" width="900" height="84" fill="#59636e"/>
  <rect x="0" y="566" width="900" height="10" fill="#f7d154"/>
  <g stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".85">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur=".65s" repeatCount="indefinite"/>
    <path d="M-80 618 H20 M40 618 H140 M160 618 H260 M280 618 H380 M400 618 H500 M520 618 H620 M640 618 H740 M760 618 H860 M880 618 H980"/>
  </g>

  <!-- Ground shadow -->
  <ellipse cx="452" cy="576" rx="132" ry="15" fill="#243b2a" opacity=".22">
    <animate attributeName="rx" values="132;124;132" dur="1.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".22;.16;.22" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ===== Unicycle wheel (stays grounded) ===== -->
  <g>
    <circle cx="450" cy="470" r="91" fill="#eaf6ff" fill-opacity=".35" stroke="#263238" stroke-width="17"/>
    <circle cx="450" cy="470" r="78" fill="none" stroke="#b8c4cc" stroke-width="5"/>
    <g stroke="#78909c" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="rotate" from="0 450 470" to="360 450 470" dur="1.6s" repeatCount="indefinite"/>
      <path d="M450 470 V395 M450 470 V545 M450 470 H375 M450 470 H525"/>
      <path d="M450 470 L503 417 M450 470 L397 523 M450 470 L397 417 M450 470 L503 523"/>
      <path d="M450 470 L515 495 M450 470 L385 445 M450 470 L475 405 M450 470 L425 535"/>
    </g>
    <!-- Crank + pedals, turning with the pedalling feet -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 450 470" to="360 450 470" dur="1.6s" repeatCount="indefinite"/>
      <line x1="414" y1="470" x2="486" y2="470" stroke="#37474f" stroke-width="7" stroke-linecap="round"/>
      <rect x="471" y="464" width="30" height="11" rx="5" fill="#263238"/>
      <rect x="399" y="464" width="30" height="11" rx="5" fill="#546e7a"/>
    </g>
    <circle cx="450" cy="470" r="14" fill="#ffcf3f" stroke="#37474f" stroke-width="4"/>
    <!-- Fork -->
    <path d="M450 470 L432 365 M450 470 L466 365" fill="none" stroke="#d8434f" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- ===== Rider: anteater + seat, bobbing gently ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="1.2s" repeatCount="indefinite"/>

    <!-- Seat -->
    <line x1="450" y1="468" x2="440" y2="356" stroke="#37474f" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="433" cy="352" rx="42" ry="12" fill="#263238"/>
    <ellipse cx="421" cy="348" rx="18" ry="6" fill="#546e7a"/>

    <!-- Bushy tail, wagging -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 335 285; 6 335 285; -4 335 285" dur="2s" repeatCount="indefinite"/>
      <path d="M340 282 C292 190 238 148 166 158 C128 164 124 198 158 232 C205 280 272 316 334 318 Z" fill="url(#tailFur)"/>
      <path d="M310 272 C270 220 232 194 190 188 M322 292 C276 268 232 258 190 260 M296 248 C262 214 228 196 198 190"
            fill="none" stroke="#8a6a48" stroke-width="5" stroke-linecap="round" opacity=".65"/>
    </g>

    <!-- Far leg (darker), pedalling out of phase -->
    <path fill="none" stroke="#75543a" stroke-width="19" stroke-linecap="round"
      d="M405 335 Q430 402 414 470">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M405 335 Q430 402 414 470;
                M405 335 Q435 385 425 445;
                M405 335 Q449 379 450 434;
                M405 335 Q462 390 475 445;
                M405 335 Q465 402 486 470;
                M405 335 Q460 420 475 495;
                M405 335 Q447 425 450 506;
                M405 335 Q435 415 425 495;
                M405 335 Q430 402 414 470"/>
    </path>
    <circle r="13" fill="#4e3826">
      <animate attributeName="cx" values="414;425;450;475;486;475;450;425;414" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="470;445;434;445;470;495;506;495;470" dur="1.6s" repeatCount="indefinite"/>
    </circle>

    <!-- Body -->
    <ellipse cx="435" cy="295" rx="112" ry="59" transform="rotate(-4 435 295)" fill="url(#fur)" stroke="#6f4f32" stroke-width="3"/>
    <g clip-path="url(#bodyClip)">
      <!-- Giant anteater's black shoulder band, edged in cream -->
      <path d="M382 232 L452 232 L408 360 L338 360 Z" fill="#2b2320"/>
      <path d="M452 232 L476 232 L432 360 L408 360 Z" fill="#f6ead2"/>
      <ellipse cx="370" cy="330" rx="72" ry="24" fill="#fff" opacity=".12"/>
    </g>

    <!-- Near leg, pedalling -->
    <path fill="none" stroke="#9a7350" stroke-width="21" stroke-linecap="round"
      d="M475 335 Q510 402 486 470">
      <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
        values="M475 335 Q510 402 486 470;
                M475 335 Q505 420 475 495;
                M475 335 Q492 425 450 506;
                M475 335 Q478 415 425 495;
                M475 335 Q469 402 414 470;
                M475 335 Q478 385 425 445;
                M475 335 Q492 379 450 434;
                M475 335 Q505 390 475 445;
                M475 335 Q510 402 486 470"/>
    </path>
    <circle r="14" fill="#5d422c">
      <animate attributeName="cx" values="486;475;450;425;414;425;450;475;486" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="470;495;506;495;470;445;434;445;470" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Claws on the near paw -->
    <path d="M492 462 l12-4 M494 472 l13 1 M492 481 l11 6" stroke="#f3e9d2" stroke-width="4" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate"
        values="0 0; -11 25; -36 36; -61 25; -72 0; -61 -25; -36 -36; -11 -25; 0 0" dur="1.6s" repeatCount="indefinite"/>
    </path>

    <!-- Far arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="4 410 288; -6 410 288; 4 410 288" dur=".9s" repeatCount="indefinite"/>
      <path d="M410 288 Q380 250 375 208" fill="none" stroke="#75543a" stroke-width="17" stroke-linecap="round"/>
      <circle cx="375" cy="205" r="13" fill="#5d422c"/>
    </g>

    <!-- Head, long snout and party hat -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-2 500 285; 2 500 285; -2 500 285" dur="2.4s" repeatCount="indefinite"/>
      <path d="M492 258 C542 250 590 261 628 279 C640 284 638 296 626 299 C584 309 538 313 502 306 C482 296 480 268 492 258 Z"
            fill="url(#headFur)" stroke="#6f4f32" stroke-width="3"/>
      <circle cx="503" cy="252" r="15" fill="#96704a" stroke="#6f4f32" stroke-width="3"/>
      <circle cx="503" cy="252" r="7" fill="#5d422c"/>
      <circle cx="524" cy="278" r="6" fill="#211712"/>
      <circle cx="526" cy="276" r="2" fill="#fff"/>
      <ellipse cx="624" cy="289" rx="8" ry="6" fill="#33231a"/>
      <!-- Flicking tongue -->
      <path d="M630 291 Q652 298 668 284" fill="none" stroke="#ff7b9c" stroke-width="5" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.55;.65;.82;.9;1" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="d" values="M630 291 Q640 294 646 290; M630 291 Q640 294 646 290; M630 291 Q652 298 668 284; M630 291 Q652 290 664 276; M630 291 Q640 294 646 290; M630 291 Q640 294 646 290"
                 keyTimes="0;.55;.65;.82;.9;1" dur="3.2s" repeatCount="indefinite"/>
      </path>
      <!-- Party hat -->
      <g transform="rotate(-8 500 218)">
        <path d="M484 254 L518 254 L501 202 Z" fill="#ef476f" stroke="#b51f45" stroke-width="3" stroke-linejoin="round"/>
        <path d="M491 232 L511 232 L506 216 L496 216 Z" fill="#ffd166"/>
        <circle cx="501" cy="200" r="9" fill="#ffd166" stroke="#e3a008" stroke-width="2"/>
      </g>
    </g>

    <!-- Near arm, tossing -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 498 288; 5 498 288; -6 498 288" dur=".9s" repeatCount="indefinite"/>
      <path d="M498 288 Q522 250 525 210" fill="none" stroke="#9a7350" stroke-width="18" stroke-linecap="round"/>
      <circle cx="525" cy="205" r="14" fill="#5d422c"/>
      <path d="M515 196 l-8-7 M525 192 v-11 M535 196 l8-7" stroke="#5d422c" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ===== Juggled bottles ===== -->
  <!-- dotted juggling arc -->
  <path d="M375 205 Q450 45 525 205 Q450 145 375 205" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 12" stroke-linecap="round" opacity=".55"/>

  <g color="#22a06b">
    <animateMotion dur="2.7s" repeatCount="indefinite" path="M375 205 Q450 45 525 205 Q450 145 375 205"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".9s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>
  <g color="#e98a1d">
    <animateMotion dur="2.7s" begin="-0.9s" repeatCount="indefinite" path="M375 205 Q450 45 525 205 Q450 145 375 205"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur=".9s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>
  <g color="#2f80ed">
    <animateMotion dur="2.7s" begin="-1.8s" repeatCount="indefinite" path="M375 205 Q450 45 525 205 Q450 145 375 205"/>
    <g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur=".9s" repeatCount="indefinite"/><use href="#bottle"/></g>
  </g>

  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".8">
    <animate attributeName="opacity" values=".8;.25;.8" dur=".8s" repeatCount="indefinite"/>
    <path d="M92 330 H188 M58 366 H164 M104 402 H180"/>
  </g>

  <!-- Caption -->
  <g font-family="Verdana, Geneva, sans-serif" text-anchor="middle">
    <rect x="252" y="592" width="396" height="42" rx="21" fill="#263238" opacity=".88"/>
    <text x="450" y="620" font-size="22" font-weight="bold" letter-spacing="2" fill="#ffd166">★ THE AMAZING ANTEATER ★</text>
  </g>
</svg>
