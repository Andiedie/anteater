<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Anteater riding a unicycle while juggling bottles</title>

  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#fff6e0"/>
      <stop offset="100%" stop-color="#f2d7a8"/>
    </radialGradient>

    <linearGradient id="bottleGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8fe3c8"/>
      <stop offset="45%" stop-color="#2fa88a"/>
      <stop offset="100%" stop-color="#126b58"/>
    </linearGradient>

    <linearGradient id="bottleGlass2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd08a"/>
      <stop offset="45%" stop-color="#e08a2b"/>
      <stop offset="100%" stop-color="#9c5210"/>
    </linearGradient>

    <linearGradient id="bottleGlass3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a8c8ff"/>
      <stop offset="45%" stop-color="#4a6fd4"/>
      <stop offset="100%" stop-color="#22377a"/>
    </linearGradient>

    <linearGradient id="furGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d6a4a"/>
      <stop offset="100%" stop-color="#5c4230"/>
    </linearGradient>

    <linearGradient id="snoutGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b8956e"/>
      <stop offset="100%" stop-color="#8a6a4c"/>
    </linearGradient>

    <linearGradient id="tireGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4a4a4a"/>
      <stop offset="100%" stop-color="#191919"/>
    </linearGradient>

    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e9eef5"/>
      <stop offset="40%" stop-color="#9aa7b8"/>
      <stop offset="60%" stop-color="#d9e1ea"/>
      <stop offset="100%" stop-color="#6d7a8b"/>
    </linearGradient>

    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6f61"/>
      <stop offset="100%" stop-color="#c0392b"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#8a6a3a" flood-opacity="0.35"/>
    </filter>

    <filter id="blurShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <!-- A single bottle, centred at origin, pointing up (~46px tall) -->
    <g id="bottle">
      <rect x="-3.5" y="-22" width="7" height="10" rx="1.4" fill="url(#bottleGlass)"/>
      <rect x="-3.5" y="-22" width="3" height="10" rx="1.2" fill="#ffffff" opacity="0.35"/>
      <rect x="-13" y="-12" width="26" height="34" rx="5" fill="url(#bottleGlass)"/>
      <rect x="-13" y="-12" width="8" height="34" rx="4" fill="#ffffff" opacity="0.28"/>
      <rect x="-13" y="-1" width="26" height="12" fill="#ffffff" opacity="0.22"/>
      <rect x="-13" y="-1" width="26" height="1.6" fill="#ffffff" opacity="0.5"/>
      <rect x="-13" y="9" width="26" height="1.6" fill="#ffffff" opacity="0.35"/>
      <rect x="-4.6" y="-31" width="9.2" height="7" rx="2.6" fill="#d8a12a"/>
      <rect x="-4.6" y="-31" width="4" height="7" rx="2" fill="#f6d071"/>
    </g>

    <g id="bottleWarm">
      <rect x="-3.5" y="-22" width="7" height="10" rx="1.4" fill="url(#bottleGlass2)"/>
      <rect x="-3.5" y="-22" width="3" height="10" rx="1.2" fill="#ffffff" opacity="0.35"/>
      <rect x="-13" y="-12" width="26" height="34" rx="5" fill="url(#bottleGlass2)"/>
      <rect x="-13" y="-12" width="8" height="34" rx="4" fill="#ffffff" opacity="0.28"/>
      <rect x="-13" y="-1" width="26" height="12" fill="#ffffff" opacity="0.22"/>
      <rect x="-4.6" y="-31" width="9.2" height="7" rx="2.6" fill="#5a3a12"/>
      <rect x="-4.6" y="-31" width="4" height="7" rx="2" fill="#8d5f22"/>
    </g>

    <g id="bottleBlue">
      <rect x="-3.5" y="-22" width="7" height="10" rx="1.4" fill="url(#bottleGlass3)"/>
      <rect x="-3.5" y="-22" width="3" height="10" rx="1.2" fill="#ffffff" opacity="0.35"/>
      <rect x="-13" y="-12" width="26" height="34" rx="5" fill="url(#bottleGlass3)"/>
      <rect x="-13" y="-12" width="8" height="34" rx="4" fill="#ffffff" opacity="0.28"/>
      <rect x="-13" y="-1" width="26" height="12" fill="#ffffff" opacity="0.22"/>
      <rect x="-4.6" y="-31" width="9.2" height="7" rx="2.6" fill="#2a2a2a"/>
      <rect x="-4.6" y="-31" width="4" height="7" rx="2" fill="#5a5a5a"/>
    </g>
  </defs>

  <!-- Ground -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <g opacity="0.5">
    <circle cx="110" cy="90" r="4" fill="#e0b878"/>
    <circle cx="690" cy="70" r="5" fill="#e0b878"/>
    <circle cx="740" cy="170" r="3" fill="#e0b878"/>
    <circle cx="60" cy="200" r="3.5" fill="#e0b878"/>
  </g>

  <!-- Ground line + shadow -->
  <rect x="0" y="520" width="800" height="8" fill="#c9a86a" opacity="0.55"/>
  <ellipse cx="400" cy="529" rx="190" ry="16" fill="#8a6a3a" opacity="0.3" filter="url(#blurShadow)">
    <animate attributeName="rx" values="190;160;190" dur="1.1s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.2;0.3" dur="1.1s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ==================== Bouncing rig: unicycle + anteater ==================== -->
  <g>
    <animateTransform attributeName="transform" type="translate"
      values="0,0; 0,-12; 0,0" dur="0.55s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 1 1; 0 0 0.6 1"/>

    <!-- Wheel -->
    <g>
      <circle cx="400" cy="478" r="46" fill="url(#tireGrad)"/>
      <circle cx="400" cy="478" r="38" fill="none" stroke="#c8d2de" stroke-width="3"/>
      <circle cx="400" cy="478" r="34" fill="#20303c" opacity="0.25"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 400 478" to="360 400 478" dur="0.9s" repeatCount="indefinite"/>
        <line x1="400" y1="440" x2="400" y2="516" stroke="#9fb0c2" stroke-width="2.5"/>
        <line x1="362" y1="478" x2="438" y2="478" stroke="#9fb0c2" stroke-width="2.5"/>
        <line x1="373" y1="451" x2="427" y2="505" stroke="#9fb0c2" stroke-width="2"/>
        <line x1="427" y1="451" x2="373" y2="505" stroke="#9fb0c2" stroke-width="2"/>
        <!-- tyre tread -->
        <circle cx="400" cy="432" r="3" fill="#5b6470"/>
        <circle cx="400" cy="524" r="3" fill="#5b6470"/>
        <circle cx="354" cy="478" r="3" fill="#5b6470"/>
        <circle cx="446" cy="478" r="3" fill="#5b6470"/>
      </g>
      <circle cx="400" cy="478" r="8" fill="url(#metal)"/>
      <circle cx="400" cy="478" r="3" fill="#5a6675"/>
    </g>

    <!-- Frame / seatpost -->
    <path d="M400 478 L400 372" stroke="url(#metal)" stroke-width="9" stroke-linecap="round"/>
    <path d="M400 400 L418 372" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
    <!-- Fork on both sides -->
    <path d="M382 470 C378 430 390 400 400 392" stroke="#8f9daf" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M418 470 C422 430 410 400 400 392" stroke="#8f9daf" stroke-width="5" fill="none" stroke-linecap="round"/>

    <!-- Seat -->
    <g>
      <path d="M366 366 Q402 350 436 366 Q432 382 402 382 Q372 382 366 366 Z" fill="#2f4a63"/>
      <path d="M370 366 Q402 354 432 366" fill="none" stroke="#5d7d9c" stroke-width="2.5"/>
    </g>

    <!-- ==================== ANT EATER ==================== -->
    <!-- The anteater faces left. Wheel centre x=400. -->

    <g filter="url(#softShadow)">

      <!-- Tail (behind body) -->
      <path d="M470 330 C520 300 566 250 560 202 C557 178 536 176 528 196 C520 218 512 250 486 282 C478 292 470 300 462 306 Z"
            fill="#6f5038" stroke="#4a3524" stroke-width="2">
        <animate attributeName="d"
          values="M470 330 C520 300 566 250 560 202 C557 178 536 176 528 196 C520 218 512 250 486 282 C478 292 470 300 462 306 Z;
                  M470 330 C524 292 572 240 566 192 C564 168 542 166 534 186 C526 208 514 244 486 280 C478 290 470 300 462 306 Z;
                  M470 330 C520 300 566 250 560 202 C557 178 536 176 528 196 C520 218 512 250 486 282 C478 292 470 300 462 306 Z"
          dur="1.6s" repeatCount="indefinite"/>
      </path>
      <path d="M474 322 C518 294 558 250 552 208" fill="none" stroke="#8a6647" stroke-width="4" stroke-linecap="round" opacity="0.6">
        <animate attributeName="d"
          values="M474 322 C518 294 558 250 552 208;M474 322 C522 288 564 238 558 198;M474 322 C518 294 558 250 552 208"
          dur="1.6s" repeatCount="indefinite"/>
      </path>

      <!-- Legs (thighs + feet on pedals) -->
      <!-- Far leg -->
      <path d="M424 316 C438 340 440 366 428 390 L414 404" stroke="#4a3524" stroke-width="17" fill="none" stroke-linecap="round"/>
      <ellipse cx="408" cy="410" rx="14" ry="8" fill="#3b2a1c"/>

      <!-- Near leg (pedaling) -->
      <g>
        <animate attributeName="transform" type="rotate"
          values="0 428 320; -22 428 320; 0 428 320; 22 428 320; 0 428 320"
          dur="0.9s" repeatCount="indefinite"/>
        <path d="M428 316 C448 340 452 368 442 392 L430 404" stroke="#6b4c34" stroke-width="18" fill="none" stroke-linecap="round"/>
        <ellipse cx="424" cy="410" rx="15" ry="8.5" fill="#4a3524"/>
        <ellipse cx="424" cy="407" rx="15" ry="8.5" fill="#6b4c34"/>
        <!-- toes -->
        <circle cx="414" cy="412" r="3" fill="#3b2a1c"/>
        <circle cx="421" cy="414" r="3" fill="#3b2a1c"/>
        <circle cx="428" cy="413" r="2.8" fill="#3b2a1c"/>
      </g>

      <!-- Pedals -->
      <rect x="404" y="404" width="30" height="7" rx="3" fill="#3a3a3a"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          from="0 400 478" to="360 400 478" dur="0.9s" repeatCount="indefinite"/>
        <rect x="386" y="493" width="30" height="7" rx="3" fill="#3a3a3a"/>
      </g>

      <!-- Body / torso -->
      <ellipse cx="430" cy="300" rx="66" ry="52" fill="url(#furGrad)" transform="rotate(-12 430 300)"/>

      <!-- Red shirt -->
      <path d="M378 286 Q432 262 486 288 Q494 312 480 330 Q440 350 396 336 Q372 316 378 286 Z" fill="url(#shirt)"/>
      <path d="M382 300 Q432 280 482 300" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>

      <!-- Belly patch -->
      <ellipse cx="424" cy="308" rx="34" ry="22" fill="#a9805a" opacity="0.85"/>

      <!-- Neck -->
      <path d="M388 268 C376 250 366 236 360 222" stroke="url(#furGrad)" stroke-width="34" fill="none" stroke-linecap="round"/>

      <!-- Head -->
      <ellipse cx="352" cy="210" rx="34" ry="28" fill="url(#furGrad)" transform="rotate(-14 352 210)"/>

      <!-- Ears -->
      <ellipse cx="372" cy="186" rx="10" ry="13" fill="#6b4c34" transform="rotate(18 372 186)"/>
      <ellipse cx="372" cy="186" rx="5" ry="7" fill="#c19a7a" transform="rotate(18 372 186)"/>
      <ellipse cx="346" cy="180" rx="9" ry="12" fill="#5c4230" transform="rotate(-8 346 180)"/>

      <!-- Long snout -->
      <g>
        <animate attributeName="transform" type="rotate"
          values="-3 352 214; 2 352 214; -3 352 214" dur="2.2s" repeatCount="indefinite"/>
        <path d="M340 214 C310 224 282 236 262 246 C252 251 252 259 262 261 C284 264 314 254 342 240 Z"
              fill="url(#snoutGrad)"/>
        <path d="M262 250 C254 251 250 256 252 259" fill="none" stroke="#3a2a1e" stroke-width="2" stroke-linecap="round"/>
        <!-- nose/nostril -->
        <ellipse cx="263" cy="252" rx="3" ry="2.2" fill="#3a2a1e"/>
        <!-- mouth line -->
        <path d="M270 262 C288 262 310 256 330 246" fill="none" stroke="#5c4230" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Eye -->
      <ellipse cx="344" cy="200" rx="6.5" ry="7" fill="#fdfbf4"/>
      <circle cx="342" cy="201" r="3.6" fill="#241a12">
        <animate attributeName="cy" values="201;200;201" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="340.5" cy="199.5" r="1.2" fill="#ffffff"/>
      <path d="M336 191 Q344 187 352 191" fill="none" stroke="#3b2a1c" stroke-width="2" stroke-linecap="round"/>

      <!-- Blush -->
      <ellipse cx="360" cy="222" rx="8" ry="5" fill="#e08f6a" opacity="0.4"/>

      <!-- Arms juggling (two, animated) -->
      <!-- Back arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-14 386 278; 12 386 278; -14 386 278" dur="0.66s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <path d="M386 278 C368 296 358 316 356 336" stroke="#6b4c34" stroke-width="14" fill="none" stroke-linecap="round"/>
        <circle cx="356" cy="338" r="9" fill="#7d5b3f"/>
      </g>
      <!-- Front arm -->
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="12 396 284; -14 396 284; 12 396 284" dur="0.66s" repeatCount="indefinite" calcMode="spline"
          keySplines="0.4 0 0.6 1; 0.4 0 0.6 1"/>
        <path d="M396 284 C410 304 416 326 412 348" stroke="#8d6a4a" stroke-width="15" fill="none" stroke-linecap="round"/>
        <circle cx="412" cy="350" r="9.5" fill="#9c7856"/>
        <circle cx="412" cy="350" r="5" fill="#b89372"/>
      </g>

    </g>

    <!-- ==================== JUGGLING BOTTLES ==================== -->

    <!-- Bottle A: high arc, left -> right -->
    <g>
      <animateMotion dur="1.32s" repeatCount="indefinite"
        path="M356 330 C300 190 300 90 400 96 C500 102 500 190 444 330"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-20;380;-20" dur="1.32s" repeatCount="indefinite"/>
        <use href="#bottle"/>
      </g>
    </g>

    <!-- Bottle B: high arc reversed -->
    <g>
      <animateMotion dur="1.32s" begin="-0.44s" repeatCount="indefinite"
        path="M444 330 C500 190 500 90 400 96 C300 102 300 190 356 330"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="30;-330;30" dur="1.32s" begin="-0.44s" repeatCount="indefinite"/>
        <use href="#bottleWarm"/>
      </g>
    </g>

    <!-- Bottle C: tighter arc, mid height -->
    <g>
      <animateMotion dur="1.32s" begin="-0.88s" repeatCount="indefinite"
        path="M360 342 C330 250 340 160 404 152 C470 144 474 250 442 342"/>
      <g>
        <animateTransform attributeName="transform" type="rotate"
          values="-45;280;-45" dur="1.32s" begin="-0.88s" repeatCount="indefinite"/>
        <use href="#bottleBlue"/>
      </g>
    </g>

  </g>

  <!-- Sparkles -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="255" cy="120" r="3">
      <animate attributeName="opacity" values="0;1;0" dur="1.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="540" cy="115" r="2.5">
      <animate attributeName="opacity" values="1;0;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="60" r="2">
      <animate attributeName="opacity" values="0;1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
