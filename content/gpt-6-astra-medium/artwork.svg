<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">The extraordinary balancing anteater</title>
  <desc id="desc">An animated circus anteater pedals a unicycle while juggling three colorful bottles.</desc>
  <defs>
    <radialGradient id="bg"><stop stop-color="#fff6dc"/><stop offset="1" stop-color="#edddba"/></radialGradient>
    <linearGradient id="fur" x2="1" y2="1"><stop stop-color="#a57a58"/><stop offset="1" stop-color="#684733"/></linearGradient>
    <linearGradient id="tail" x2="0" y2="1"><stop stop-color="#79523e"/><stop offset="1" stop-color="#352b2b"/></linearGradient>
    <g id="bottle" stroke="#253a3a" stroke-width="3" stroke-linejoin="round">
      <path d="M-6-31H6V-12Q6-7 12-3Q15 0 15 7V34Q15 38 11 38H-11Q-15 38-15 34V7Q-15 0-12-3Q-6-7-6-12Z"/>
      <rect x="-7" y="-35" width="14" height="7" rx="2" fill="#ead297"/>
      <rect x="-14" y="8" width="28" height="17" rx="2" fill="#fff0cf" stroke="none"/>
      <path d="M-8-1V4M-8 29V32" stroke="white" opacity=".65" stroke-linecap="round"/>
      <path d="m0 11 2 4 4 1-3 3 1 4-4-2-4 2 1-4-3-3 4-1Z" fill="#c19147" stroke="none"/>
    </g>
    <path id="flight" d="M290 334C303 66 540 66 553 334Q422 396 290 334Z"/>
  </defs>
  <style>
    .ink{stroke:#352b2b;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
    .fine{fill:none;stroke:#352b2b;stroke-width:3;stroke-linecap:round}
    text{font-family:Georgia,'Times New Roman',serif;text-anchor:middle;fill:#453a32}
    @media(prefers-reduced-motion:reduce){.motion{display:none}.still{display:inline!important}}
  </style>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect x="24" y="24" width="752" height="752" rx="180" fill="none" stroke="#b9a078" stroke-width="1"/>
  <path d="M72 278Q400-16 728 278" fill="none" stroke="#d0b989" stroke-width="2" stroke-dasharray="3 10"/>
  <text x="400" y="78" font-size="13" letter-spacing="5">THE WOODLAND CIRCUS</text>
  <text x="400" y="119" font-size="33" font-style="italic">A delicate balancing act</text>
  <g fill="#bc8b46">
    <path d="m121 360 4 11 11 4-11 4-4 11-4-11-11-4 11-4ZM671 409l4 11 11 4-11 4-4 11-4-11-11-4 11-4Z"/>
    <circle cx="645" cy="294" r="4"/><circle cx="174" cy="465" r="3"/>
  </g>
  <ellipse cx="414" cy="673" rx="143" ry="15" fill="#8e7654" opacity=".17">
    <animate attributeName="rx" values="143;132;143" dur="1.2s" repeatCount="indefinite"/>
  </ellipse>
  <path d="M173 678H638" stroke="#bca37c" stroke-width="2" stroke-linecap="round"/>
  <!-- The wheel and crank turn together beneath a gently bobbing rider. -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-6 0;6 0;-6 0" dur="3s" repeatCount="indefinite"/>
    <g transform="translate(412 588)">
      <circle r="78" fill="#fcf2d8" stroke="#352b2b" stroke-width="13"/>
      <circle r="68" fill="none" stroke="#bd9053" stroke-width="3"/>
      <g stroke="#958b79" stroke-width="2">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <path d="M-67 0H67M0-67V67M-47-47 47 47M-47 47 47-47M-62-26 62 26M-26-62 26 62M-62 26 62-26M-26 62 26-62"/>
        <circle r="73" fill="none" stroke="#f4dfac" stroke-width="3" stroke-dasharray="8 107"/>
      </g>
      <circle r="10" fill="#c49a61" stroke="#352b2b" stroke-width="4"/>
    </g>
    <path d="M403 500 412 588" fill="none" stroke="#352b2b" stroke-width="13"/>
    <path d="M402 503 410 564" fill="none" stroke="#d7b46f" stroke-width="5"/>
    <path d="M376 495Q401 489 433 495" fill="none" stroke="#352b2b" stroke-width="17" stroke-linecap="round"/>
    <!-- Far leg -->
    <path d="M421 457Q460 477 453 512L429 567" fill="none" stroke="#352b2b" stroke-width="25" stroke-linecap="round"/>
    <path d="M421 457Q460 477 453 512L429 567" fill="none" stroke="#836046" stroke-width="17" stroke-linecap="round"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" dur="1.2s" repeatCount="indefinite"/>
      <!-- A giant anteater's long shaggy tail -->
      <path class="ink" fill="url(#tail)" d="M366 409Q302 389 263 430Q221 461 180 566L212 552 201 577 239 559 231 578Q322 564 363 511Q390 475 393 449Z"/>
      <path d="M342 441Q287 464 243 532M328 475Q294 518 264 537M304 443Q272 465 248 499" fill="none" stroke="#b58b60" stroke-width="3" opacity=".5" stroke-linecap="round"/>
      <!-- Round body and characteristic black shoulder stripe -->
      <path class="ink" fill="url(#fur)" d="M372 334Q407 311 436 352Q464 390 441 450Q426 482 383 471Q345 463 344 422Q344 370 372 334Z"/>
      <path d="M387 345Q410 340 426 362L407 434 374 465 361 451 384 405Z" fill="#e8d4af"/>
      <path d="M395 346 423 360 401 430 375 452 369 439 389 400Z" fill="#352b2b"/>
      <!-- Raised juggling arms -->
      <path d="M374 374Q329 398 295 348" fill="none" stroke="#352b2b" stroke-width="24" stroke-linecap="round"/>
      <path d="M374 374Q329 398 295 348" fill="none" stroke="#9e7655" stroke-width="16" stroke-linecap="round"/>
      <path d="M430 374Q488 403 545 346" fill="none" stroke="#352b2b" stroke-width="24" stroke-linecap="round"/>
      <path d="M430 374Q488 403 545 346" fill="none" stroke="#a47b58" stroke-width="16" stroke-linecap="round"/>
      <path class="ink" fill="#b48b65" d="M287 345q-10-8-9-17 6-5 13 8 0-15 7-14 6 2 3 15 13-7 16-1 2 8-18 16Z"/>
      <path class="ink" fill="#b48b65" d="M536 340q-5-15 2-17 7-1 9 13 9-17 15-12 4 5-5 16 13-5 15 2-4 10-23 12Z"/>
      <!-- Long tapering snout, ear, eye and tiny tongue -->
      <path class="ink" fill="#b58b63" d="M372 333Q346 307 367 281Q387 256 416 280Q444 303 508 316Q524 320 518 332Q510 342 484 337L423 327Q404 359 372 333Z"/>
      <path class="ink" fill="#957052" d="M374 287Q357 260 368 252Q382 246 391 278Z"/>
      <path d="m373 262 8 17" stroke="#d3ad87" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="514" cy="324" rx="9" ry="7" fill="#352b2b"/>
      <circle cx="405" cy="296" r="5" fill="#352b2b"/>
      <circle cx="406" cy="294" r="1.5" fill="#fff7df"/>
      <path class="fine" d="M422 316q10 8 20 5"/>
      <path d="M519 332q20 8 29-1" fill="none" stroke="#c76f66" stroke-width="4" stroke-linecap="round"/>
      <!-- Circus cap and scarf -->
      <path class="ink" fill="#bd5748" d="m375 265 9-49 35 54Z"/>
      <path d="m381 239 17 4-7-11Z" fill="#efd394"/>
      <path class="ink" d="m368 265 55 9" fill="none"/>
      <circle cx="384" cy="216" r="7" fill="#d9aa51" stroke="#352b2b" stroke-width="3"/>
      <path class="ink" fill="#c65e4e" d="m374 337 17 13 30-11-6 17-25 7-21-15Z"/>
      <path class="ink" fill="#c65e4e" d="M377 351q-28 6-47-7l7 16-11 5q27 11 55-5Z"/>
    </g>
    <!-- Near leg pumps subtly with the pedals. -->
    <path d="M390 457Q369 489 386 518L398 554" fill="none" stroke="#352b2b" stroke-width="27" stroke-linecap="round">
      <animate attributeName="d" values="M390 457Q369 489 386 518L398 554;M390 457Q350 493 371 531L395 573;M390 457Q369 489 386 518L398 554" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <path d="M390 457Q369 489 386 518L398 554" fill="none" stroke="#ab805a" stroke-width="18" stroke-linecap="round">
      <animate attributeName="d" values="M390 457Q369 489 386 518L398 554;M390 457Q350 493 371 531L395 573;M390 457Q369 489 386 518L398 554" dur="1.2s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(412 588)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
        <path d="M-20-19 0 0 20 19" fill="none" stroke="#352b2b" stroke-width="6"/>
        <g transform="translate(-20 -19)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/><rect x="-15" y="-4" width="30" height="8" rx="3" fill="#352b2b"/></g></g>
        <g transform="translate(20 19)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.2s" repeatCount="indefinite"/><rect x="-15" y="-4" width="30" height="8" rx="3" fill="#352b2b"/></g></g>
      </g>
    </g>
  </g>
  <!-- Phase-shifted flights: a high throw and a quick hand-to-hand return. -->
  <g class="motion">
    <g><animateMotion dur="2.7s" repeatCount="indefinite" calcMode="paced"><mpath href="#flight"/></animateMotion><g fill="#47998b"><animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="2.7s" repeatCount="indefinite"/><use href="#bottle"/></g></g>
    <g><animateMotion dur="2.7s" begin="-.9s" repeatCount="indefinite" calcMode="paced"><mpath href="#flight"/></animateMotion><g fill="#cf7952"><animateTransform attributeName="transform" type="rotate" from="-25" to="695" begin="-.9s" dur="2.7s" repeatCount="indefinite"/><use href="#bottle"/></g></g>
    <g><animateMotion dur="2.7s" begin="-1.8s" repeatCount="indefinite" calcMode="paced"><mpath href="#flight"/></animateMotion><g fill="#6493ac"><animateTransform attributeName="transform" type="rotate" from="-25" to="695" begin="-1.8s" dur="2.7s" repeatCount="indefinite"/><use href="#bottle"/></g></g>
  </g>
  <g class="still" display="none">
    <use href="#bottle" fill="#47998b" transform="translate(299 280) rotate(-25)"/>
    <use href="#bottle" fill="#cf7952" transform="translate(429 144) rotate(35)"/>
    <use href="#bottle" fill="#6493ac" transform="translate(543 268) rotate(20)"/>
  </g>
  <text x="400" y="721" font-size="15" letter-spacing="4">ONE WHEEL. THREE BOTTLES.</text>
  <text x="400" y="748" font-size="16" font-style="italic" fill="#91734e">Absolutely no ants were spilled.</text>
</svg>
