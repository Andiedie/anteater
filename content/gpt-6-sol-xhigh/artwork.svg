<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">An anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A cheerful animated anteater balances on a spinning unicycle and tosses three colorful bottles through the air.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bd9ef"/>
      <stop offset="1" stop-color="#d9f5e9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8bcf78"/>
      <stop offset="1" stop-color="#4a9b62"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d99b5c"/>
      <stop offset="1" stop-color="#9c6338"/>
    </linearGradient>
    <linearGradient id="creamFur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8d8a0"/>
      <stop offset="1" stop-color="#d49b5d"/>
    </linearGradient>
    <linearGradient id="bottleRed" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a72"/>
      <stop offset="1" stop-color="#cc3f58"/>
    </linearGradient>
    <linearGradient id="bottleBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#79e0e8"/>
      <stop offset="1" stop-color="#2784c5"/>
    </linearGradient>
    <linearGradient id="bottleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe47c"/>
      <stop offset="1" stop-color="#ed9b35"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bottleShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#173c4a" flood-opacity=".28"/>
    </filter>

    <!-- The bottle artwork is centered at (0, 0) so it can travel on motion paths. -->
    <g id="bottleArt" stroke="#713b3c" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-11,-22 L-11,-30 Q-11,-34 -7,-36 L-7,-44 L7,-44 L7,-36 Q11,-34 11,-30 L11,-22 Q18,-16 18,-4 L18,19 Q18,27 10,30 L-10,30 Q-18,27 -18,19 L-18,-4 Q-18,-16 -11,-22Z" fill="var(--bottle-color, #ff8a72)"/>
      <path d="M-7,-37 L7,-37 L7,-44 L-7,-44Z" fill="#f6e3b6"/>
      <path d="M-14,-5 Q0,1 14,-5 L14,18 Q14,24 8,26 L-8,26 Q-14,24 -14,18Z" fill="var(--bottle-color, #ff8a72)" opacity=".9"/>
      <path d="M-9,-19 Q0,-13 9,-19" fill="none" stroke="#fff" opacity=".72"/>
      <path d="M-9,8 L9,8" stroke="#fff" opacity=".38"/>
    </g>

    <!-- Three looping throws: each bottle crosses the top of the act at a different height. -->
    <path id="throwHigh" d="M298,215 C330,75 438,75 482,215 C438,75 330,75 298,215" fill="none"/>
    <path id="throwMiddle" d="M482,215 C445,112 337,112 298,215 C337,112 445,112 482,215" fill="none"/>
    <path id="throwLow" d="M298,215 C325,135 450,135 482,215 C450,135 325,135 298,215" fill="none"/>
  </defs>

  <!-- sunny storybook backdrop -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="112" cy="103" r="47" fill="#ffe89b" opacity=".9"/>
  <g fill="#fff" opacity=".7">
    <path d="M80 145 Q95 123 115 143 Q139 113 170 147 Q191 147 194 166 L76 166 Q70 153 80 145Z"/>
    <path d="M601 92 Q620 65 642 91 Q671 58 705 96 Q731 96 735 116 L596 116 Q589 102 601 92Z"/>
  </g>
  <path d="M0 376 Q120 285 255 365 T520 350 T800 330 L800 600 L0 600Z" fill="#79bd83" opacity=".55"/>
  <path d="M0 422 Q145 352 300 420 T575 404 T800 392 L800 600 L0 600Z" fill="url(#ground)"/>
  <ellipse cx="404" cy="535" rx="210" ry="26" fill="#214f59" opacity=".22" filter="url(#softShadow)"/>
  <g fill="#317b5a" opacity=".8">
    <path d="M65 489 q8-35 16 0 q13-28 18 0 q12-17 17 0Z"/>
    <path d="M680 476 q9-40 17 0 q13-26 18 0 q13-22 18 0Z"/>
    <path d="M735 516 q7-26 14 0 q10-18 15 0Z"/>
  </g>

  <!-- unicycle -->
  <g id="unicycle">
    <g id="spinningWheel">
      <circle cx="400" cy="465" r="76" fill="#283d49" stroke="#182a36" stroke-width="7"/>
      <circle cx="400" cy="465" r="65" fill="none" stroke="#78d2d0" stroke-width="5"/>
      <g stroke="#b2ece2" stroke-width="3" opacity=".85">
        <path d="M400 465 L400 390"/><path d="M400 465 L453 412"/>
        <path d="M400 465 L475 465"/><path d="M400 465 L453 518"/>
        <path d="M400 465 L400 540"/><path d="M400 465 L347 518"/>
        <path d="M400 465 L325 465"/><path d="M400 465 L347 412"/>
      </g>
      <circle cx="400" cy="465" r="11" fill="#f4c45e" stroke="#523e42" stroke-width="4"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 465" to="360 400 465" dur="2.2s" repeatCount="indefinite"/>
    </g>
    <path d="M400 465 L400 327" stroke="#405564" stroke-width="12" stroke-linecap="round"/>
    <path d="M400 465 L374 448 M400 465 L426 482" stroke="#f3c65c" stroke-width="7" stroke-linecap="round"/>
    <g>
      <circle cx="400" cy="465" r="19" fill="none" stroke="#f3c65c" stroke-width="5"/>
      <path d="M400 465 L373 448 M400 465 L428 482" stroke="#344956" stroke-width="5" stroke-linecap="round"/>
      <path d="M367 445 l-17 0 M431 485 l17 0" stroke="#344956" stroke-width="7" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 465" to="360 400 465" dur="1.1s" repeatCount="indefinite"/>
    </g>
    <path d="M374 327 Q400 316 426 327" fill="none" stroke="#273c48" stroke-width="13" stroke-linecap="round"/>
    <path d="M369 319 Q400 306 431 319 Q431 332 400 334 Q369 332 369 319Z" fill="#d65f4f" stroke="#713e42" stroke-width="3"/>
  </g>

  <!-- anteater: the whole rider gently bobs with the wheel -->
  <g id="anteater">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0; 0 -4; 0 0" keyTimes="0; .25; .5; .75; 1" dur="1.1s" repeatCount="indefinite"/>

    <!-- giant fluffy tail -->
    <g id="tail">
      <path d="M423 294 C493 270 565 286 594 337 C620 382 597 428 563 424 C539 422 526 398 539 373 C551 350 536 337 499 336 C473 336 451 348 426 358Z" fill="url(#fur)" stroke="#684632" stroke-width="4"/>
      <path d="M474 305 Q545 303 584 350 M493 322 Q559 328 585 379 M506 346 Q554 360 570 407" fill="none" stroke="#e6b477" stroke-width="7" opacity=".7"/>
      <animateTransform attributeName="transform" type="rotate" values="0 430 320; -3 430 320; 0 430 320; 3 430 320; 0 430 320" dur="1.8s" repeatCount="indefinite"/>
    </g>

    <!-- legs and feet -->
    <path d="M371 322 C371 356 367 382 377 414 L382 449" fill="none" stroke="#a86b3f" stroke-width="20" stroke-linecap="round"/>
    <path d="M423 323 C420 355 433 383 427 418 L427 478" fill="none" stroke="#a86b3f" stroke-width="20" stroke-linecap="round"/>
    <path d="M373 447 q-14 1-22 7 M377 449 q-12 8-17 15 M382 450 q-7 12-7 18" fill="none" stroke="#352f32" stroke-width="4" stroke-linecap="round"/>
    <path d="M426 477 q-12 5-19 12 M428 478 q-4 11-2 17 M430 478 q5 9 12 13" fill="none" stroke="#352f32" stroke-width="4" stroke-linecap="round"/>

    <!-- body -->
    <path d="M344 199 C376 177 426 188 451 219 C473 246 477 297 457 330 C440 358 402 369 370 351 C337 332 320 294 322 253 C323 228 330 209 344 199Z" fill="url(#fur)" stroke="#684632" stroke-width="4"/>
    <!-- classic anteater shoulder stripe -->
    <path d="M331 210 C357 202 382 205 407 216 C424 224 443 238 457 254 L449 282 C421 263 393 247 364 243 C348 241 334 243 324 248Z" fill="#3c3d42" opacity=".95"/>
    <path d="M330 211 C356 205 379 209 397 217" fill="none" stroke="#fbdda0" stroke-width="7" opacity=".85"/>
    <path d="M355 286 Q393 309 441 291" fill="none" stroke="#e7b675" stroke-width="5" opacity=".65"/>

    <!-- arms reaching toward the toss -->
    <path d="M345 228 C325 222 310 211 294 199" fill="none" stroke="#b87845" stroke-width="18" stroke-linecap="round"/>
    <path d="M441 231 C458 225 473 216 489 218" fill="none" stroke="#b87845" stroke-width="18" stroke-linecap="round"/>
    <path d="M296 198 l-13-7 M298 202 l-15 1 M300 206 l-12 8" stroke="#352f32" stroke-width="4" stroke-linecap="round"/>
    <path d="M487 217 l13-7 M488 220 l15 1 M487 224 l12 8" stroke="#352f32" stroke-width="4" stroke-linecap="round"/>

    <!-- neck and head -->
    <path d="M335 215 C317 204 307 185 314 166 C321 148 344 143 361 156 L374 190Z" fill="url(#fur)" stroke="#684632" stroke-width="4"/>
    <path d="M323 163 Q308 143 321 130 Q338 137 346 154Z" fill="#a86b3f" stroke="#684632" stroke-width="4"/>
    <path d="M337 160 Q319 143 331 128 Q348 138 356 157Z" fill="#d18c50" stroke="#684632" stroke-width="3"/>
    <!-- long tapering snout -->
    <path d="M323 166 C286 163 244 175 204 190 L153 208 Q145 212 154 217 C202 226 252 221 303 207 L335 194Z" fill="url(#creamFur)" stroke="#684632" stroke-width="4"/>
    <path d="M154 207 Q144 210 151 218 Q161 223 171 217 L176 207Z" fill="#302d32"/>
    <path d="M184 204 Q245 188 301 184" fill="none" stroke="#fff0c6" stroke-width="5" opacity=".65"/>
    <path d="M283 172 Q315 155 338 174 Q350 191 333 208 Q309 222 286 207 Q271 190 283 172Z" fill="url(#fur)" stroke="#684632" stroke-width="4"/>
    <ellipse cx="312" cy="181" rx="5" ry="7" fill="#202b32"/>
    <circle cx="314" cy="178" r="2" fill="#fff"/>
    <path d="M279 203 Q296 211 315 204" fill="none" stroke="#684632" stroke-width="3" stroke-linecap="round"/>
    <path d="M339 214 Q354 220 365 214" fill="none" stroke="#684632" stroke-width="3" opacity=".7"/>
  </g>

  <!-- bottles in flight -->
  <g id="jugglingBottles" filter="url(#bottleShadow)">
    <g>
      <use xlink:href="#bottleArt" style="--bottle-color: #ef5d63"/>
      <animateMotion dur="2.55s" repeatCount="indefinite" rotate="auto" begin="-.05s"><mpath xlink:href="#throwHigh"/></animateMotion>
      <animateTransform attributeName="transform" type="rotate" values="-18; 22; -18" dur="2.55s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g>
      <use xlink:href="#bottleArt" style="--bottle-color: #39a9d2"/>
      <animateMotion dur="2.55s" repeatCount="indefinite" rotate="auto" begin="-.86s"><mpath xlink:href="#throwMiddle"/></animateMotion>
      <animateTransform attributeName="transform" type="rotate" values="20; -22; 20" dur="2.55s" repeatCount="indefinite" additive="sum"/>
    </g>
    <g>
      <use xlink:href="#bottleArt" style="--bottle-color: #f1b943"/>
      <animateMotion dur="2.55s" repeatCount="indefinite" rotate="auto" begin="-1.68s"><mpath xlink:href="#throwLow"/></animateMotion>
      <animateTransform attributeName="transform" type="rotate" values="-25; 18; -25" dur="2.55s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <g fill="#fff" opacity=".85" font-family="system-ui, sans-serif" text-anchor="middle">
    <text x="400" y="574" font-size="15" letter-spacing="3">THE GREAT BOTTLE BALANCE</text>
  </g>
</svg>
