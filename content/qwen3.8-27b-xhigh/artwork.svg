<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 600" width="800" height="600">
  <title>Anteater riding a unicycle and juggling bottles</title>
  <desc>An animated cartoon anteater rides a unicycle across a dirt path, pedaling with one foot per crank while juggling three green bottles overhead. The wheel and cranks spin, the ground scrolls, clouds drift, and the tail sways.</desc>

  <defs>
    <!-- Bottle, drawn around its own center (0,0) -->
    <g id="bottle">
      <rect x="-4" y="-36" width="8" height="10" fill="#4d9e6a"/>
      <path d="M-9,-13 L-4,-27 L4,-27 L9,-13 Z" fill="#4d9e6a"/>
      <rect x="-9" y="-16" width="18" height="34" rx="5" fill="#4d9e6a"/>
      <rect x="-5.5" y="-41" width="11" height="6" rx="2" fill="#d9534f"/>
      <rect x="-9" y="-4" width="18" height="11" fill="#f6efe0"/>
      <rect x="-6" y="0.5" width="12" height="2.5" fill="#d9534f" opacity="0.75"/>
      <rect x="-5.5" y="-12" width="3.5" height="24" rx="1.75" fill="#ffffff" opacity="0.3"/>
    </g>
  </defs>

  <!-- Sky -->
  <rect width="800" height="600" fill="#d8effb"/>

  <!-- Sun -->
  <circle cx="690" cy="84" r="56" fill="#ffd76e" opacity="0.25">
    <animate attributeName="opacity" values="0.18;0.32;0.18" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="690" cy="84" r="40" fill="#ffd76e"/>

  <!-- Clouds -->
  <g opacity="0.92">
    <animateTransform attributeName="transform" type="translate" values="860 110; -160 110" dur="26s" repeatCount="indefinite"/>
    <g fill="#ffffff">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="30" cy="-8" rx="24" ry="13"/>
      <ellipse cx="-30" cy="-6" rx="22" ry="12"/>
    </g>
  </g>
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="880 190; -200 190" dur="32s" repeatCount="indefinite"/>
    <g fill="#ffffff" transform="scale(0.75)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="30" cy="-8" rx="24" ry="13"/>
      <ellipse cx="-30" cy="-6" rx="22" ry="12"/>
    </g>
  </g>
  <g opacity="0.85">
    <animateTransform attributeName="transform" type="translate" values="900 62; -180 62" dur="24s" repeatCount="indefinite"/>
    <g fill="#ffffff" transform="scale(0.55)">
      <ellipse cx="0" cy="0" rx="36" ry="16"/>
      <ellipse cx="30" cy="-8" rx="24" ry="13"/>
      <ellipse cx="-30" cy="-6" rx="22" ry="12"/>
    </g>
  </g>

  <!-- Ground -->
  <rect y="480" width="800" height="120" fill="#d9c18f"/>
  <rect y="480" width="800" height="6" fill="#c2a874"/>

  <!-- Scrolling ground ticks (speed = wheel circumference / 1.4s) -->
  <g stroke="#b49a6c" stroke-width="5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="translate" from="0 0" to="-90 0" dur="0.4s" repeatCount="indefinite"/>
    <line x1="-80" y1="505" x2="-94" y2="517"/><line x1="10" y1="505" x2="-4" y2="517"/>
    <line x1="100" y1="505" x2="86" y2="517"/><line x1="190" y1="505" x2="176" y2="517"/>
    <line x1="280" y1="505" x2="266" y2="517"/><line x1="370" y1="505" x2="356" y2="517"/>
    <line x1="460" y1="505" x2="446" y2="517"/><line x1="550" y1="505" x2="536" y2="517"/>
    <line x1="640" y1="505" x2="626" y2="517"/><line x1="730" y1="505" x2="716" y2="517"/>
    <line x1="820" y1="505" x2="806" y2="517"/><line x1="910" y1="505" x2="896" y2="517"/>
    <line x1="-35" y1="552" x2="-49" y2="564"/><line x1="55" y1="552" x2="41" y2="564"/>
    <line x1="145" y1="552" x2="131" y2="564"/><line x1="235" y1="552" x2="221" y2="564"/>
    <line x1="325" y1="552" x2="311" y2="564"/><line x1="415" y1="552" x2="401" y2="564"/>
    <line x1="505" y1="552" x2="491" y2="564"/><line x1="595" y1="552" x2="581" y2="564"/>
    <line x1="685" y1="552" x2="671" y2="564"/><line x1="775" y1="552" x2="761" y2="564"/>
    <line x1="865" y1="552" x2="851" y2="564"/><line x1="955" y1="552" x2="941" y2="564"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#a9c6da" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="-30" y1="330" x2="40" y2="330">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-110 0" dur="0.49s" repeatCount="indefinite"/>
    </line>
    <line x1="-60" y1="385" x2="20" y2="385">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-100 0" dur="0.45s" begin="-0.22s" repeatCount="indefinite"/>
    </line>
    <line x1="-20" y1="440" x2="50" y2="440">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-120 0" dur="0.54s" begin="-0.35s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Wheel shadow -->
  <ellipse cx="330" cy="481" rx="70" ry="7" fill="#000000" opacity="0.12"/>

  <!-- Far arm (behind body) -->
  <path d="M398,214 C386,178 390,128 398,90" fill="none" stroke="#7c5233" stroke-width="13" stroke-linecap="round"/>
  <circle cx="400" cy="85" r="8" fill="#7c5233"/>

  <!-- Far crank + pedal (rotates, behind wheel) -->
  <g transform="translate(330,424)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    <line x1="-20" y1="0" x2="0" y2="0" stroke="#3a4046" stroke-width="6" stroke-linecap="round"/>
    <g transform="translate(-20,0)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.4s" repeatCount="indefinite" additive="sum"/>
      <rect x="-10" y="-4.5" width="20" height="9" rx="3" fill="#1f2427"/>
    </g>
  </g>

  <!-- Far leg (bent knee, foot follows far pedal; phase = +180 deg) -->
  <path fill="none" stroke="#7c5233" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        d="M352,308 L365.9,378.6 L310,424">
    <animate attributeName="d" dur="1.4s" begin="-0.7s" repeatCount="indefinite"
      values="M352,308 L393.6,366.7 L350,424;
              M352,308 L378.6,374.9 L344.1,438.1;
              M352,308 L361.7,379.4 L330,444;
              M352,308 L358,379.8 L315.9,438.1;
              M352,308 L365.9,378.6 L310,424;
              M352,308 L378.8,374.9 L315.9,409.9;
              M352,308 L392.2,367.7 L330,404;
              M352,308 L398.6,362.8 L344.1,409.9;
              M352,308 L393.6,366.7 L350,424"/>
  </path>

  <!-- Wheel -->
  <circle cx="330" cy="424" r="50" fill="none" stroke="#2f3437" stroke-width="12"/>
  <circle cx="330" cy="424" r="44" fill="none" stroke="#6b7280" stroke-width="3"/>
  <g stroke="#98a1ab" stroke-width="2.5">
    <animateTransform attributeName="transform" type="rotate" from="0 330 424" to="360 330 424" dur="1.4s" repeatCount="indefinite"/>
    <line x1="287" y1="424" x2="373" y2="424"/>
    <line x1="292.8" y1="445.5" x2="367.2" y2="402.5"/>
    <line x1="308.5" y1="461.2" x2="351.5" y2="386.8"/>
    <line x1="330" y1="467" x2="330" y2="381"/>
    <line x1="308.5" y1="386.8" x2="351.5" y2="461.2"/>
    <line x1="292.8" y1="402.5" x2="367.2" y2="445.5"/>
  </g>
  <circle cx="330" cy="424" r="6" fill="#4b5563"/>

  <!-- Fork + saddle -->
  <line x1="330" y1="424" x2="351" y2="298" stroke="#59616b" stroke-width="9" stroke-linecap="round"/>
  <ellipse cx="353" cy="293" rx="20" ry="6.5" fill="#3a3f45"/>

  <!-- Near crank + pedal (rotates, in front of wheel) -->
  <g transform="translate(330,424)">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    <line x1="0" y1="0" x2="20" y2="0" stroke="#4b5563" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(20,0)">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="1.4s" repeatCount="indefinite" additive="sum"/>
      <rect x="-10" y="-4.5" width="20" height="9" rx="3" fill="#262b2f"/>
    </g>
  </g>

  <!-- Near leg (bent knee, foot follows near pedal) -->
  <path fill="none" stroke="#a9714b" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"
        d="M352,308 L393.6,366.7 L350,424">
    <animate attributeName="d" dur="1.4s" begin="0s" repeatCount="indefinite"
      values="M352,308 L393.6,366.7 L350,424;
              M352,308 L378.6,374.9 L344.1,438.1;
              M352,308 L361.7,379.4 L330,444;
              M352,308 L358,379.8 L315.9,438.1;
              M352,308 L365.9,378.6 L310,424;
              M352,308 L378.8,374.9 L315.9,409.9;
              M352,308 L392.2,367.7 L330,404;
              M352,308 L398.6,362.8 L344.1,409.9;
              M352,308 L393.6,366.7 L350,424"/>
  </path>

  <!-- Tail (swaying) -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-6 340 290; 7 340 290; -6 340 290" keyTimes="0;0.5;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="1.6s" repeatCount="indefinite"/>
    <path d="M340,282 C304,288 268,314 252,360 C247,373 251,383 260,381 C267,379 275,365 285,345 C299,320 319,304 344,298 Z" fill="#9c6742"/>
  </g>

  <!-- Body -->
  <path d="M330,296 C324,268 338,236 360,216 C374,204 392,200 404,206 C414,214 416,226 410,238 C404,262 396,284 386,300 C372,312 348,310 338,304 C333,301 330,299 330,296 Z" fill="#a9714b"/>
  <ellipse cx="398" cy="254" rx="11" ry="20" fill="#c99a6f" opacity="0.9" transform="rotate(14 398 254)"/>

  <!-- Head with raised snout -->
  <path d="M396,214 C392,198 398,184 414,180 C424,177 432,180 438,186 L497,146 Q505,143 502,151 L444,196 C428,204 410,210 402,216 C398,217 395,216 396,214 Z" fill="#a9714b"/>
  <circle cx="414" cy="178" r="4.5" fill="#7c5233"/>
  <path d="M498,149 C470,165 445,180 408,200" fill="none" stroke="#6b4630" stroke-width="4.5" stroke-linecap="round" opacity="0.85"/>
  <circle cx="430" cy="188" r="3.4" fill="#2b2622"/>
  <circle cx="501" cy="147" r="3.4" fill="#2b2622"/>

  <!-- Near arm (in front of face) -->
  <path d="M410,232 C458,208 492,155 505,92" fill="none" stroke="#8f5f3e" stroke-width="13" stroke-linecap="round"/>
  <circle cx="510" cy="85" r="8" fill="#8f5f3e"/>

  <!-- Juggling bottles (orbit the hands, 1/3 phase apart) -->
  <use xlink:href="#bottle" href="#bottle">
    <animateMotion dur="1.5s" begin="0s" repeatCount="indefinite"
      path="M400,85 A55,42 0 0 1 510,85 A55,42 0 0 1 400,85"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;10;0;-10;0" keyTimes="0;0.25;0.5;0.75;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      dur="1.5s" begin="0s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#bottle" href="#bottle">
    <animateMotion dur="1.5s" begin="-0.5s" repeatCount="indefinite"
      path="M400,85 A55,42 0 0 1 510,85 A55,42 0 0 1 400,85"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;10;0;-10;0" keyTimes="0;0.25;0.5;0.75;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      dur="1.5s" begin="-0.5s" repeatCount="indefinite"/>
  </use>
  <use xlink:href="#bottle" href="#bottle">
    <animateMotion dur="1.5s" begin="-1s" repeatCount="indefinite"
      path="M400,85 A55,42 0 0 1 510,85 A55,42 0 0 1 400,85"/>
    <animateTransform attributeName="transform" type="rotate"
      values="0;10;0;-10;0" keyTimes="0;0.25;0.5;0.75;1"
      calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1"
      dur="1.5s" begin="-1s" repeatCount="indefinite"/>
  </use>
</svg>
