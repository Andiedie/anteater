<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">The Great Anteater Unicyclist</title>
  <desc id="desc">A cheerful anteater pedals a unicycle and juggles three colorful bottles beneath a starry circus tent.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1"><stop stop-color="#17234e"/><stop offset="1" stop-color="#59376c"/></linearGradient>
    <linearGradient id="fur" x2=".9" y2="1"><stop stop-color="#e7a85f"/><stop offset="1" stop-color="#b96743"/></linearGradient>
    <linearGradient id="bottle" x2="0" y2="1"><stop stop-color="#fff3a3"/><stop offset="1" stop-color="#ff9b51"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .twinkle{animation:twinkle 2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .wheel{transform-origin:400px 430px;animation:spin 3s linear infinite}
      .ride{animation:bob .65s ease-in-out infinite alternate;transform-origin:400px 350px}
      .armL{transform-origin:350px 288px;animation:armL 1.2s ease-in-out infinite alternate}
      .armR{transform-origin:449px 285px;animation:armR 1.2s ease-in-out infinite alternate}
      .b1{animation:throw1 2.4s ease-in-out infinite;transform-origin:300px 240px}
      .b2{animation:throw2 2.4s ease-in-out infinite;transform-origin:400px 205px}
      .b3{animation:throw3 2.4s ease-in-out infinite;transform-origin:500px 240px}
      @keyframes spin{to{transform:rotate(360deg)}} @keyframes bob{to{transform:translateY(-7px)}}
      @keyframes armL{to{transform:rotate(-12deg)}} @keyframes armR{to{transform:rotate(12deg)}}
      @keyframes throw1{0%,100%{transform:translate(0,0) rotate(-25deg)}50%{transform:translate(32px,-48px) rotate(25deg)}}
      @keyframes throw2{0%,100%{transform:translate(0,-5px) rotate(18deg)}50%{transform:translate(0,35px) rotate(-18deg)}}
      @keyframes throw3{0%,100%{transform:translate(0,0) rotate(25deg)}50%{transform:translate(-32px,-48px) rotate(-25deg)}}
      @keyframes twinkle{to{opacity:.3;transform:scale(.7)}}
      @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:8s!important}}
    </style>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <path d="M0 0h800v86L400 12 0 86z" fill="#d84f68" opacity=".85"/>
  <path d="M70 0h82l91 600h-65zM316 0h82l10 600h-78zM554 0h82L553 600h-76z" fill="#f8bd5a" opacity=".16"/>
  <g fill="#ffe9a0" filter="url(#glow)"><circle class="twinkle" cx="111" cy="142" r="3"/><circle class="twinkle" cx="673" cy="135" r="4"/><circle class="twinkle" cx="580" cy="225" r="2.5"/><circle class="twinkle" cx="208" cy="211" r="2"/><circle class="twinkle" cx="724" cy="300" r="2.5"/></g>
  <path d="M0 498q120-33 250 0t260 0 290 0v102H0z" fill="#263251"/>
  <ellipse cx="400" cy="502" rx="178" ry="16" fill="#111a35" opacity=".45"/>
  <!-- unicycle -->
  <g class="wheel"><circle cx="400" cy="430" r="68" fill="none" stroke="#f4d98a" stroke-width="8"/><circle cx="400" cy="430" r="8" fill="#fff0b8"/><path d="M400 362v136m-68-68h136m-116-48 96 96m0-96-96 96" stroke="#f4d98a" stroke-width="3" opacity=".7"/><path d="M400 362v-11h-30" fill="none" stroke="#e7a85f" stroke-width="8" stroke-linecap="round"/></g>
  <path d="M400 350v-15m-18 0h36" stroke="#d7e2ee" stroke-width="7" stroke-linecap="round"/>
  <!-- rider -->
  <g class="ride" stroke-linecap="round" stroke-linejoin="round">
    <!-- tail -->
    <path d="M345 348q-69 2-80 48-8 31 19 37 26 5 39-24" fill="none" stroke="#aa6044" stroke-width="25"/>
    <path d="M287 419q-7 19 4 23" fill="none" stroke="#e6a568" stroke-width="9"/>
    <!-- body -->
    <path d="M352 290q-25 31-17 77 8 34 44 37l39-14q16-31-1-78-17-37-65-22z" fill="url(#fur)" stroke="#723f3e" stroke-width="4"/>
    <path d="M354 331q25 22 61 1l11 43q-34 26-70 0z" fill="#f4d5a0" opacity=".9"/>
    <!-- legs pedaling -->
    <path d="M369 386l-20 37 34 8" fill="none" stroke="#c77b4c" stroke-width="15"/>
    <path d="M408 382l17 29-26 18" fill="none" stroke="#a95d43" stroke-width="15"/>
    <path d="M378 431h18m22-3h18" stroke="#f4d98a" stroke-width="7"/>
    <!-- neck/head -->
    <path d="M362 300q-10-35 8-58l34 3q15 19 2 49l-5 22-36-2z" fill="url(#fur)" stroke="#723f3e" stroke-width="4"/>
    <path d="M390 267q39-20 80-3 12 5 8 14-4 8-21 9l-49 13-17 12-16-14z" fill="#d98b54" stroke="#723f3e" stroke-width="4"/>
    <path d="M474 266q15-4 19 3l-4 9q-10 5-20 2z" fill="#30283c"/>
    <circle cx="397" cy="253" r="4" fill="#281e37"/><circle cx="398" cy="252" r="1.4" fill="#fff"/>
    <path d="M369 246q-20-28-9-39 11-7 22 20" fill="#bb6c49" stroke="#723f3e" stroke-width="4"/>
    <path d="M367 239l-1-19" stroke="#f2bf83" stroke-width="4"/>
    <!-- arms -->
    <g class="armL"><path d="M352 300l-25-31-15-14" fill="none" stroke="#c77b4c" stroke-width="12"/><circle cx="310" cy="254" r="8" fill="#edb16c"/></g>
    <g class="armR"><path d="M414 296l25-31 16-13" fill="none" stroke="#b86a47" stroke-width="12"/><circle cx="455" cy="252" r="8" fill="#edb16c"/></g>
    <path d="M344 294q30-19 71-2" fill="none" stroke="#f5d58b" stroke-width="5"/>
  </g>
  <!-- juggling bottles -->
  <g stroke="#fff1c8" stroke-width="2">
    <g class="b1"><path d="M290 221h19v9l-3 7v25q0 7-7 7h-1q-7 0-7-7v-25l-3-7z" fill="url(#bottle)"/><path d="M293 241h13v14h-13z" fill="#f36f65"/><path d="M294 218h11v4h-11z" fill="#74d5c0"/></g>
    <g class="b2"><path d="M390 185h19v9l-3 7v25q0 7-7 7h-1q-7 0-7-7v-25l-3-7z" fill="#7ed9cf"/><path d="M393 205h13v14h-13z" fill="#f5c85d"/><path d="M394 182h11v4h-11z" fill="#fff1c8"/></g>
    <g class="b3"><path d="M490 221h19v9l-3 7v25q0 7-7 7h-1q-7 0-7-7v-25l-3-7z" fill="#f28fa0"/><path d="M493 241h13v14h-13z" fill="#8069bd"/><path d="M494 218h11v4h-11z" fill="#fff1c8"/></g>
  </g>
  <text x="400" y="555" text-anchor="middle" fill="#ffe9a0" font-family="Georgia,serif" font-size="22" letter-spacing="4">THE AMAZING ANT-EATER</text>
</svg>
