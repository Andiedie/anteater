<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 620" width="800" height="620"
     role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Anteater on a Unicycle Juggling Bottles</title>
  <desc id="dsc">A cartoon anteater pedals a unicycle while juggling three green bottles.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#a3daf0"/>
      <stop offset="55%"  stop-color="#d6eff8"/>
      <stop offset="100%" stop-color="#f0fafd"/>
    </linearGradient>

    <radialGradient id="groundShadow">
      <stop offset="0%"   stop-color="#26331a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#26331a" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="furBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#836d5a"/>
      <stop offset="100%" stop-color="#544639"/>
    </linearGradient>

    <linearGradient id="furHead" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#8e7963"/>
      <stop offset="100%" stop-color="#5b4c40"/>
    </linearGradient>

    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#1c6642"/>
      <stop offset="45%"  stop-color="#55bf80"/>
      <stop offset="100%" stop-color="#145034"/>
    </linearGradient>

    <clipPath id="torsoClip">
      <ellipse cx="392" cy="302" rx="82" ry="44" transform="rotate(-16 392 302)"/>
    </clipPath>

    <!-- one bottle, centred on the origin so it can spin about its own middle -->
    <g id="bottle">
      <rect x="-10"  y="-8"  width="20" height="35" rx="6" fill="url(#glass)"/>
      <rect x="-4.5" y="-22" width="9"  height="15"     fill="url(#glass)"/>
      <path d="M -10,-8 C -10,-15 -4.5,-15 -4.5,-22 L 4.5,-22 C 4.5,-15 10,-15 10,-8 Z" fill="url(#glass)"/>
      <rect x="-6" y="-28" width="12" height="7" rx="2"   fill="#b8342a"/>
      <rect x="-6" y="-28" width="12" height="3" rx="1.5" fill="#e2634f"/>
      <rect x="-9" y="4"   width="18" height="13" rx="2"  fill="#f4ead6" opacity="0.92"/>
      <rect x="-6.5" y="-4" width="4" height="14" rx="2"   fill="#ffffff" opacity="0.42"/>
    </g>
  </defs>

  <!-- ================= background ================= -->
  <rect width="800" height="620" fill="url(#sky)"/>

  <!-- drifting clouds -->
  <g opacity="0.9">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1000,0"
                      dur="42s" repeatCount="indefinite"/>
    <g fill="#ffffff" transform="translate(860,104)">
      <ellipse cx="0"   cy="0"   rx="64" ry="31"/>
      <ellipse cx="-52" cy="11"  rx="43" ry="24"/>
      <ellipse cx="50"  cy="13"  rx="39" ry="22"/>
      <ellipse cx="6"   cy="-17" rx="39" ry="23"/>
    </g>
  </g>
  <g opacity="0.7">
    <animateTransform attributeName="transform" type="translate" values="0,0;-1000,0"
                      dur="67s" repeatCount="indefinite"/>
    <g fill="#ffffff" transform="translate(620,186)">
      <ellipse cx="0"   cy="0"   rx="48" ry="23"/>
      <ellipse cx="-40" cy="8"   rx="32" ry="18"/>
      <ellipse cx="38"  cy="10"  rx="30" ry="17"/>
    </g>
  </g>

  <!-- wind streaks -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="60" y1="286" x2="196" y2="286" opacity="0.75">
      <animateTransform attributeName="transform" type="translate" values="40,0;-260,0"
                        dur="1.05s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="1.05s" repeatCount="indefinite"/>
    </line>
    <line x1="30" y1="372" x2="150" y2="372" opacity="0.6">
      <animateTransform attributeName="transform" type="translate" values="60,0;-240,0"
                        dur="0.85s" begin="-0.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0" dur="0.85s" begin="-0.4s" repeatCount="indefinite"/>
    </line>
    <line x1="70" y1="452" x2="212" y2="452" opacity="0.5">
      <animateTransform attributeName="transform" type="translate" values="30,0;-250,0"
                        dur="1.25s" begin="-0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.55;0" dur="1.25s" begin="-0.7s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ================= ground ================= -->
  <rect x="0" y="564" width="800" height="56" fill="#8dc16a"/>
  <line x1="0" y1="564" x2="800" y2="564" stroke="#6ea34c" stroke-width="4"/>
  <line x1="-140" y1="590" x2="940" y2="590" stroke="#6ea34c" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="34 86" opacity="0.75">
    <!-- 120px of pattern per 0.5s = 240 px/s, matched to the wheel rim speed -->
    <animate attributeName="stroke-dashoffset" values="0;120" dur="0.5s" repeatCount="indefinite"/>
  </line>
  <line x1="-140" y1="610" x2="940" y2="610" stroke="#6ea34c" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="18 62" opacity="0.5">
    <animate attributeName="stroke-dashoffset" values="0;80" dur="0.33s" repeatCount="indefinite"/>
  </line>

  <!-- contact shadow -->
  <ellipse cx="400" cy="566" rx="118" ry="15" fill="url(#groundShadow)"/>

  <!-- ================= wheel ================= -->
  <circle cx="400" cy="500" r="64" fill="none" stroke="#2a2a2a" stroke-width="10"/>
  <circle cx="400" cy="500" r="58" fill="none" stroke="#cfd7dc" stroke-width="4"/>
  <g stroke="#b6c0c7" stroke-width="3" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" from="0 400 500" to="360 400 500"
                      dur="1.5s" repeatCount="indefinite"/>
    <line x1="400" y1="442" x2="400" y2="558"/>
    <line x1="441" y1="459" x2="359" y2="541"/>
    <line x1="458" y1="500" x2="342" y2="500"/>
    <line x1="441" y1="541" x2="359" y2="459"/>
    <circle cx="439" cy="459" r="5" fill="#e05a4a" stroke="none"/>
  </g>
  <circle cx="400" cy="500" r="10" fill="#98a3aa" stroke="#5d666c" stroke-width="2"/>

  <!-- ================= frame, post, saddle ================= -->
  <rect x="394" y="388" width="12" height="112" rx="4" fill="#b8342a"/>
  <rect x="394" y="388" width="5"  height="112" rx="2" fill="#d9554a" opacity="0.8"/>
  <ellipse cx="400" cy="386" rx="36" ry="10" fill="#3b3129"/>
  <ellipse cx="400" cy="383" rx="36" ry="10" fill="#5a4c40"/>

  <!-- ================= cranks + pedals (full rotation) ================= -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 400 500" to="360 400 500"
                      dur="1.5s" repeatCount="indefinite"/>
    <rect x="396" y="477" width="8" height="46" rx="3" fill="#4b4b4b"/>
    <rect x="388" y="471" width="24" height="11" rx="3" fill="#2b2b2b"/>
    <rect x="388" y="517" width="24" height="11" rx="3" fill="#2b2b2b"/>
  </g>

  <!-- ================= legs ================= -->
  <!-- thigh + shin redrawn each keyframe so the foot lands on the circling pedal -->
  <g fill="none" stroke-linecap="round">
    <path stroke="#3b3129" stroke-width="24">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M 372,350 Q 362,410 400,477;
                M 372,350 Q 370,426 423,500;
                M 372,350 Q 360,446 400,523;
                M 372,350 Q 368,426 377,500;
                M 372,350 Q 362,410 400,477"/>
    </path>
    <path stroke="#6d5b4b" stroke-width="18">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M 372,350 Q 362,410 400,477;
                M 372,350 Q 370,426 423,500;
                M 372,350 Q 360,446 400,523;
                M 372,350 Q 368,426 377,500;
                M 372,350 Q 362,410 400,477"/>
    </path>

    <path stroke="#3b3129" stroke-width="24">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M 424,350 Q 434,440 400,523;
                M 424,350 Q 406,428 377,500;
                M 424,350 Q 444,420 400,477;
                M 424,350 Q 430,428 423,500;
                M 424,350 Q 434,440 400,523"/>
    </path>
    <path stroke="#6d5b4b" stroke-width="18">
      <animate attributeName="d" dur="1.5s" repeatCount="indefinite" keyTimes="0;0.25;0.5;0.75;1"
        values="M 424,350 Q 434,440 400,523;
                M 424,350 Q 406,428 377,500;
                M 424,350 Q 444,420 400,477;
                M 424,350 Q 430,428 423,500;
                M 424,350 Q 434,440 400,523"/>
    </path>
  </g>

  <!-- feet ride the crank circle -->
  <ellipse cx="0" cy="0" rx="13" ry="7" fill="#4a3d33" stroke="#2b2520" stroke-width="2">
    <animateMotion dur="1.5s" repeatCount="indefinite"
                   path="M 400,477 A 23,23 0 0,1 400,523 A 23,23 0 0,1 400,477"/>
  </ellipse>
  <ellipse cx="0" cy="0" rx="13" ry="7" fill="#4a3d33" stroke="#2b2520" stroke-width="2">
    <animateMotion dur="1.5s" repeatCount="indefinite"
                   path="M 400,523 A 23,23 0 0,1 400,477 A 23,23 0 0,1 400,523"/>
  </ellipse>

  <!-- ================= rider (gentle bob) ================= -->
  <g>
    <animateTransform attributeName="transform" type="translate"
                      values="0,0; 0,-4; 0,0; 0,3; 0,0" keyTimes="0;0.3;0.5;0.8;1"
                      calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                      dur="1.5s" repeatCount="indefinite"/>

    <!-- . . . tail . . . -->
    <g>
      <animateTransform attributeName="transform" type="rotate"
                        values="-3 332 308; 3 332 308; -3 332 308" keyTimes="0;0.5;1"
                        calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"
                        dur="2s" repeatCount="indefinite"/>
      <path d="M 334,294
               C 300,276 250,286 226,324
               C 204,360 214,404 248,414
               C 282,424 306,398 302,368
               C 298,340 312,318 340,312 Z"
            fill="url(#furBody)" stroke="#453a31" stroke-width="3"/>
      <g stroke="#453a31" stroke-width="2.6" fill="none" opacity="0.55" stroke-linecap="round">
        <path d="M 252,316 Q 240,336 248,358"/>
        <path d="M 272,300 Q 260,320 266,342"/>
        <path d="M 230,352 Q 224,372 234,390"/>
        <path d="M 258,382 Q 254,398 264,408"/>
        <path d="M 288,320 Q 280,340 286,360"/>
      </g>
      <path d="M 300,296 C 282,296 268,308 264,326"
            fill="none" stroke="#9c8670" stroke-width="4" opacity="0.45" stroke-linecap="round"/>
    </g>

    <!-- . . . torso . . . -->
    <ellipse cx="392" cy="302" rx="82" ry="44" transform="rotate(-16 392 302)"
             fill="url(#furBody)" stroke="#453a31" stroke-width="3.5"/>
    <g clip-path="url(#torsoClip)">
      <rect x="270" y="256" width="250" height="17" transform="rotate(-28 392 302)" fill="#efe4d0"/>
      <rect x="270" y="273" width="250" height="42" transform="rotate(-28 392 302)" fill="#2f2723"/>
      <rect x="270" y="315" width="250" height="17" transform="rotate(-28 392 302)" fill="#efe4d0"/>
      <ellipse cx="356" cy="272" rx="46" ry="20" transform="rotate(-16 356 272)"
               fill="#ffffff" opacity="0.12"/>
    </g>

    <!-- . . . head + snout . . . -->
    <path d="M 466,248 C 506,252 540,264 566,282
             C 576,289 574,300 562,301
             C 526,303 490,294 462,284 Z"
          fill="url(#furHead)" stroke="#453a31" stroke-width="3"/>
    <ellipse cx="452" cy="272" rx="31" ry="27" transform="rotate(-12 452 272)"
             fill="url(#furHead)" stroke="#453a31" stroke-width="3"/>
    <ellipse cx="437" cy="249" rx="8" ry="12" transform="rotate(-26 437 249)"
             fill="#5b4c40" stroke="#453a31" stroke-width="2.5"/>
    <ellipse cx="568" cy="291" rx="7.5" ry="9.5" fill="#2f2723"/>
    <circle cx="466" cy="261" r="5.4" fill="#16110d"/>
    <circle cx="467.8" cy="259" r="1.9" fill="#ffffff"/>
    <path d="M 546,296 Q 552,300 558,298" fill="none" stroke="#2f2723"
          stroke-width="2.2" stroke-linecap="round" opacity="0.7"/>

    <!-- . . . arms + hands (in front of the head) . . . -->
    <g fill="none" stroke-linecap="round">
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 352 284; -5 352 284; 0 352 284; 4 352 284; 0 352 284"
                          keyTimes="0;0.25;0.5;0.75;1"
                          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                          dur="1.5s" repeatCount="indefinite"/>
        <path d="M 352,286 Q 328,258 340,232" stroke="#453a31" stroke-width="22"/>
        <path d="M 352,286 Q 328,258 340,232" stroke="#6d5b4b" stroke-width="16"/>
        <circle cx="340" cy="232" r="11" fill="#4a3d33" stroke="#2b2520" stroke-width="2.5"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="rotate"
                          values="0 430 288; 4 430 288; 0 430 288; -5 430 288; 0 430 288"
                          keyTimes="0;0.25;0.5;0.75;1"
                          calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"
                          dur="1.5s" repeatCount="indefinite"/>
        <path d="M 430,288 Q 452,262 462,236" stroke="#453a31" stroke-width="22"/>
        <path d="M 430,288 Q 452,262 462,236" stroke="#6d5b4b" stroke-width="16"/>
        <circle cx="462" cy="236" r="11" fill="#4a3d33" stroke="#2b2520" stroke-width="2.5"/>
      </g>
    </g>

    <!-- . . . juggling bottles . . . -->
    <g>
      <animateMotion dur="1.8s" begin="0s" repeatCount="indefinite"
                     path="M 340,232 C 362,104 440,104 462,236 C 440,178 362,178 340,232 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-360"
                           dur="1.15s" repeatCount="indefinite"/>
         <use href="#bottle"/></g>
    </g>
    <g>
      <animateMotion dur="1.8s" begin="-0.6s" repeatCount="indefinite"
                     path="M 340,232 C 362,104 440,104 462,236 C 440,178 362,178 340,232 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-360"
                           dur="1.35s" begin="-0.3s" repeatCount="indefinite"/>
         <use href="#bottle"/></g>
    </g>
    <g>
      <animateMotion dur="1.8s" begin="-1.2s" repeatCount="indefinite"
                     path="M 340,232 C 362,104 440,104 462,236 C 440,178 362,178 340,232 Z"/>
      <g><animateTransform attributeName="transform" type="rotate" values="0;-360"
                           dur="1.5s" begin="-0.8s" repeatCount="indefinite"/>
         <use href="#bottle"/></g>
    </g>
  </g>
</svg>
