<svg xmlns="http://www.w3.org/2000/svg" width="900" height="720" viewBox="0 0 900 720" role="img" aria-labelledby="title desc">
  <title id="title">The Amazing Anteater</title>
  <desc id="desc">An animated, long-snouted anteater in a coral waistcoat balances on a spinning unicycle while juggling three colorful bottles under a circus spotlight.</desc>
  <defs>
    <radialGradient id="paper" cx="50%" cy="40%" r="75%">
      <stop stop-color="#fffbee"/><stop offset="1" stop-color="#f3e5cd"/>
    </radialGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8e7768"/><stop offset="1" stop-color="#544944"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5ad8c"/><stop offset="1" stop-color="#a28b71"/>
    </linearGradient>
    <g id="bottle" stroke="#293e42" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-5-28H5V-14Q5-10 11-6Q13-4 13 1V24Q13 28 9 28H-9Q-13 28-13 24V1Q-13-4-11-6Q-5-10-5-14Z" fill="currentColor"/>
      <path d="M-6-28H6V-22H-6Z" fill="#f6d177"/>
      <path d="M-12 3H12V18H-12Z" fill="#fff3d8" stroke="none"/>
      <path d="M0 6 4 10 0 14-4 10Z" fill="currentColor" stroke="none"/>
      <path d="M-7-3V0M-7 20V23" stroke="#fff" opacity=".65" stroke-linecap="round"/>
    </g>
    <g id="spark" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <path d="M0-7V7M-7 0H7"/>
    </g>
  </defs>
  <style>
    .line { stroke:#293e42; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    .performer { animation:sway 2.7s ease-in-out infinite; transform-origin:457px 615px; }
    .rider { animation:bob 1.35s ease-in-out infinite; }
    .wheel { animation:spin 1.35s linear infinite; transform-origin:457px 529px; }
    .tail { animation:swish 2.7s ease-in-out infinite; transform-origin:405px 423px; }
    .shadow { animation:shadow 2.7s ease-in-out infinite; transform-origin:457px 619px; }
    .sparkle { animation:twinkle 1.8s ease-in-out infinite alternate; }
    @keyframes sway { 0%,100% {transform:rotate(-1deg)} 50% {transform:rotate(1deg)} }
    @keyframes bob { 0%,100% {transform:translateY(0)} 50% {transform:translateY(4px)} }
    @keyframes spin { to {transform:rotate(360deg)} }
    @keyframes swish { 0%,100% {transform:rotate(-3deg)} 50% {transform:rotate(4deg)} }
    @keyframes shadow { 0%,100% {transform:scaleX(.96);opacity:.15} 50% {transform:scaleX(1.05);opacity:.2} }
    @keyframes twinkle { from {opacity:.25} to {opacity:1} }
    @media (prefers-reduced-motion:reduce) { .performer,.rider,.wheel,.tail,.shadow,.sparkle {animation:none} }
  </style>

  <!-- A little letterpress circus poster. -->
  <path fill="url(#paper)" d="M0 0H900V720H0Z"/>
  <rect x="23" y="23" width="854" height="674" rx="22" fill="none" stroke="#cbb996" stroke-width="1.5"/>
  <rect x="31" y="31" width="838" height="658" rx="16" fill="none" stroke="#d9c9aa" stroke-width="1"/>
  <circle cx="458" cy="353" r="252" fill="#f7d783" opacity=".23"/>
  <path d="M225 570Q450 625 680 570" fill="none" stroke="#e6d4b2" stroke-width="2"/>
  <g fill="#293e42" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="450" y="71" font-family="Arial, sans-serif" font-size="11" letter-spacing="5">THE MARVELOUS MENAGERIE</text>
    <text x="450" y="674" font-size="27" font-weight="bold" letter-spacing="3">THE AMAZING ANTEATER</text>
  </g>
  <g stroke="#bc8b4e" fill="none" stroke-width="1.5">
    <path d="M132 665H208M692 665H768"/>
    <path d="m119 661 4 4-4 4-4-4Zm662 0 4 4-4 4-4-4Z" fill="#bc8b4e"/>
  </g>
  <g color="#d19d46" class="sparkle">
    <use href="#spark" x="245" y="240"/><use href="#spark" x="652" y="171"/>
    <use href="#spark" x="690" y="410"/><use href="#spark" x="288" y="119"/>
  </g>
  <g fill="#cb7758" opacity=".65">
    <circle cx="274" cy="286" r="3"/><circle cx="632" cy="228" r="3"/>
    <circle cx="695" cy="358" r="2"/><circle cx="235" cy="480" r="2"/>
  </g>
  <ellipse class="shadow" cx="457" cy="619" rx="120" ry="12" fill="#293e42" opacity=".16"/>
  <path d="M165 621H735" stroke="#c9b797" stroke-width="2" stroke-linecap="round"/>

  <g class="performer">
    <!-- Wheel, brass rim, and turning spokes. -->
    <circle class="line" cx="457" cy="529" r="86" fill="#faf3df" stroke-width="10"/>
    <circle cx="457" cy="529" r="76" fill="none" stroke="#d3a74f" stroke-width="4"/>
    <g class="wheel">
      <g stroke="#87918a" stroke-width="2">
        <path d="M457 453V605M381 529H533M403.3 475.3 510.7 582.7M403.3 582.7 510.7 475.3M428 459 486 599M387 500 527 558M387 558 527 500M428 599 486 459"/>
      </g>
      <path d="M451 452H463" stroke="#fff8e7" stroke-width="4" stroke-linecap="round"/>
    </g>
    <path d="M444 451 449 521Q449 535 457 535Q469 535 469 521L469 451" fill="none" stroke="#293e42" stroke-width="9" stroke-linejoin="round"/>
    <path d="M446 451 452 518" fill="none" stroke="#5dafa6" stroke-width="4"/>
    <path d="M457 445V470" stroke="#293e42" stroke-width="9"/>
    <path class="line" d="M429 444Q452 437 477 441Q487 446 477 452H433Q423 451 429 444Z" fill="#d66c55"/>

    <g class="rider">
      <!-- The giant anteater's sweeping, shaggy tail. -->
      <g class="tail">
        <path class="line" d="M419 405Q361 346 291 357Q236 360 190 323Q179 379 220 423L197 419Q234 463 282 455L267 469Q337 472 394 443L427 430Z" fill="url(#tail)"/>
        <g fill="none" stroke="#baa18a" stroke-width="3" stroke-linecap="round" opacity=".6">
          <path d="M212 355Q250 401 315 398M218 383Q253 419 305 417M239 438Q307 451 361 426"/>
        </g>
      </g>
      <!-- Far leg; its foot follows the opposite pedal. -->
      <path class="line" d="M474 428Q508 450 477 487" fill="none" stroke="#8d7964" stroke-width="22"/>
      <path d="M478 485 457 499" fill="none" stroke="#8d7964" stroke-width="18" stroke-linecap="round">
        <animate attributeName="d" values="M478 485 457 499;M478 485 487 529;M478 485 457 559;M478 485 427 529;M478 485 457 499" dur="1.35s" repeatCount="indefinite"/>
      </path>
      <!-- Rounded torso and the species' dark diagonal shoulder stripe. -->
      <path class="line" d="M424 326Q461 307 491 346Q507 375 493 423Q484 450 449 445Q401 444 397 410Q392 363 424 326Z" fill="url(#fur)"/>
      <path d="M422 330Q444 325 463 335L484 410 465 431 439 375 411 350Z" fill="#f5e6c9"/>
      <path d="m433 330 18 2 29 79-12 13-29-65-23-17Z" fill="#403e3a"/>
      <!-- Coral waistcoat. -->
      <path class="line" d="M406 365Q416 378 440 383L456 440Q427 448 410 430Q392 412 406 365Z" fill="#dd745b"/>
      <path d="m414 375 12 28 12-18M422 420l14-3" fill="none" stroke="#9d4f42" stroke-width="2.5"/>
      <circle cx="442" cy="415" r="3" fill="#f6d177"/>

      <!-- Uplifted arms, palms, and curved ivory claws. -->
      <path class="line" d="M415 352Q376 373 352 315L338 298" fill="none" stroke="#ad967b" stroke-width="19"/>
      <path class="line" d="M484 373Q545 402 591 320L604 301" fill="none" stroke="#bda487" stroke-width="19"/>
      <path class="line" d="M324 293Q337 312 355 295M590 298Q605 312 619 291" fill="none" stroke="#bda487" stroke-width="12"/>
      <g fill="#fff4d9" stroke="#293e42" stroke-width="2" stroke-linejoin="round">
        <path d="M327 295q-8-13-3-18 1 12 10 16ZM337 300q-5-14 0-19 0 12 6 18ZM605 300q2-15 8-18-4 13-2 17ZM614 296q4-15 10-17-5 11-4 15Z"/>
      </g>

      <!-- Small ears, long sloping face, and an unmistakably narrow snout. -->
      <path class="line" d="M466 321Q444 296 456 279Q468 270 480 305" fill="#a68d74"/>
      <path d="M462 291Q458 303 473 315" fill="none" stroke="#e1b7a0" stroke-width="7" stroke-linecap="round"/>
      <path class="line" d="M465 311Q486 292 508 314Q527 335 578 360Q585 365 579 373Q571 382 556 375L497 351Q478 356 465 343Q454 329 465 311Z" fill="url(#fur)"/>
      <path d="M565 358 580 361Q587 366 579 373L570 375Q565 369 565 358Z" fill="#293e42"/>
      <path d="M527 359Q547 372 558 367" fill="none" stroke="#66554a" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M488 318q7-5 12 1" fill="none" stroke="#786453" stroke-width="2" stroke-linecap="round"/>
      <circle cx="495" cy="327" r="4.5" fill="#293e42"/><circle cx="496.3" cy="325.7" r="1.4" fill="#fff9e8"/>
      <ellipse cx="505" cy="342" rx="7" ry="4" fill="#d78e74" opacity=".55"/>
      <!-- Jaunty miniature cap. -->
      <g transform="rotate(12 482 302)">
        <path class="line" d="M463 302 469 281Q480 274 491 281L498 302Z" fill="#4e9e95"/>
        <path d="M466 292H494V300H466Z" fill="#f6d177"/>
        <path class="line" d="M457 302Q482 306 503 301" fill="none"/>
      </g>
      <!-- Near thigh and flexing shin. -->
      <path class="line" d="M431 432Q401 456 425 492" fill="none" stroke="#bda487" stroke-width="24"/>
      <path d="M425 491 457 559" stroke="#293e42" stroke-width="22" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M425 491 457 559;M425 491 427 529;M425 491 457 499;M425 491 487 529;M425 491 457 559" dur="1.35s" repeatCount="indefinite"/>
      </path>
      <path d="M425 491 457 559" stroke="#bda487" stroke-width="16" stroke-linecap="round" fill="none">
        <animate attributeName="d" values="M425 491 457 559;M425 491 427 529;M425 491 457 499;M425 491 487 529;M425 491 457 559" dur="1.35s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- Cranks turn with the wheel; pedals remain level. -->
    <g class="wheel">
      <path d="M457 499V559" stroke="#293e42" stroke-width="6" stroke-linecap="round"/>
      <g transform="translate(457 559)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.35s" repeatCount="indefinite"/>
        <path class="line" d="M-14 0H14" stroke-width="7"/>
      </g></g>
      <g transform="translate(457 499)"><g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.35s" repeatCount="indefinite"/>
        <path class="line" d="M-14 0H14" stroke-width="7"/>
      </g></g>
    </g>
    <circle class="line" cx="457" cy="529" r="9" fill="#e5b759"/>
    <circle cx="457" cy="529" r="3" fill="#fff3d8"/>

    <!-- Three staggered, tumbling bottles follow a continuous juggling loop. -->
    <path d="M340 282Q472-73 604 282" fill="none" stroke="#bb985e" stroke-width="1.5" stroke-dasharray="3 9" opacity=".22"/>
    <g transform="translate(472 282)">
      <g color="#4eaaa0">
        <animateMotion path="M-132 0Q0-355 132 0Q0-120-132 0" dur="2.7s" begin="0s" repeatCount="indefinite" calcMode="paced"/>
        <g><animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="2.7s" begin="0s" repeatCount="indefinite"/><use href="#bottle"/></g>
      </g>
      <g color="#df795f">
        <animateMotion path="M-132 0Q0-355 132 0Q0-120-132 0" dur="2.7s" begin="-0.9s" repeatCount="indefinite" calcMode="paced"/>
        <g><animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="2.7s" begin="-0.9s" repeatCount="indefinite"/><use href="#bottle"/></g>
      </g>
      <g color="#e4b84f">
        <animateMotion path="M-132 0Q0-355 132 0Q0-120-132 0" dur="2.7s" begin="-1.8s" repeatCount="indefinite" calcMode="paced"/>
        <g><animateTransform attributeName="transform" type="rotate" from="-25" to="695" dur="2.7s" begin="-1.8s" repeatCount="indefinite"/><use href="#bottle"/></g>
      </g>
    </g>
  </g>
</svg>
