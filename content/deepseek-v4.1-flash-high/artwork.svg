<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Anteater riding a unicycle and juggling bottles</title>
  <desc id="desc">A cartoon anteater balances on a spinning unicycle while juggling three bottles in a looping cascade.</desc>

  <defs>
    <!-- background -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="60%" stop-color="#f7f2e8"/>
      <stop offset="100%" stop-color="#fdf7ec"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9c0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe9c0" stop-opacity="0"/>
    </radialGradient>

    <!-- body clip for the anteater's stripe -->
    <clipPath id="bodyClip">
      <ellipse cx="398" cy="310" rx="80" ry="47" transform="rotate(-6 398 310)"/>
    </clipPath>

    <!-- ===================== BOTTLES ===================== -->
    <!-- Bottle geometry is centered on (0,0) so rotation spins in place -->
    <g id="bottleA">
      <rect x="-7" y="-41" width="14" height="9" rx="2.5" fill="#a83226"/>
      <rect x="-5" y="-33" width="10" height="16" rx="1.5" fill="#e7453a"/>
      <path d="M -5 -18 C -5 -13 -13 -10 -13 -2 L -13 20 Q -13 28 -4 28 L 4 28 Q 13 28 13 20 L 13 -2 C 13 -10 5 -13 5 -18 Z" fill="#e7453a"/>
      <path d="M -8 0 L -8 21" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-5.5" cy="6" rx="2" ry="5" fill="#ffffff" fill-opacity="0.55"/>
    </g>
    <g id="bottleB">
      <rect x="-7" y="-41" width="14" height="9" rx="2.5" fill="#1c7a45"/>
      <rect x="-5" y="-33" width="10" height="16" rx="1.5" fill="#2fae63"/>
      <path d="M -5 -18 C -5 -13 -13 -10 -13 -2 L -13 20 Q -13 28 -4 28 L 4 28 Q 13 28 13 20 L 13 -2 C 13 -10 5 -13 5 -18 Z" fill="#2fae63"/>
      <path d="M -8 0 L -8 21" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-5.5" cy="6" rx="2" ry="5" fill="#ffffff" fill-opacity="0.55"/>
    </g>
    <g id="bottleC">
      <rect x="-7" y="-41" width="14" height="9" rx="2.5" fill="#c07a1a"/>
      <rect x="-5" y="-33" width="10" height="16" rx="1.5" fill="#f2a534"/>
      <path d="M -5 -18 C -5 -13 -13 -10 -13 -2 L -13 20 Q -13 28 -4 28 L 4 28 Q 13 28 13 20 L 13 -2 C 13 -10 5 -13 5 -18 Z" fill="#f2a534"/>
      <path d="M -8 0 L -8 21" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round"/>
      <ellipse cx="-5.5" cy="6" rx="2" ry="5" fill="#ffffff" fill-opacity="0.55"/>
    </g>
  </defs>

  <!-- ===================== SCENE ===================== -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="270" cy="180" r="170" fill="url(#glow)"/>

  <!-- ground -->
  <rect x="0" y="522" width="800" height="78" fill="#e3d4b6"/>
  <rect x="0" y="522" width="800" height="6" fill="#cbb28c"/>
  <ellipse cx="400" cy="524" rx="78" ry="11" fill="#000000" fill-opacity="0.14"/>

  <!-- speed lines -->
  <g stroke="#c9b28c" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="250" y1="440" x2="312" y2="440">
      <animate attributeName="x1" values="250;180;250" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="312;242;312" dur="0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="0.8s" repeatCount="indefinite"/>
    </line>
    <line x1="235" y1="470" x2="305" y2="470">
      <animate attributeName="x1" values="235;160;235" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="305;230;305" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="0.8s" begin="-0.25s" repeatCount="indefinite"/>
    </line>
    <line x1="252" y1="500" x2="315" y2="500">
      <animate attributeName="x1" values="252;185;252" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="315;248;315" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="0.8s" begin="-0.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- ===================== UNICYCLE ===================== -->
  <!-- frame -->
  <g fill="none" stroke="#4b5563" stroke-linecap="round">
    <line x1="400" y1="372" x2="400" y2="410" stroke-width="9"/>
    <path d="M 400 406 C 400 442 386 456 386 470" stroke-width="8"/>
    <path d="M 400 406 C 400 442 414 456 414 470" stroke-width="8"/>
  </g>

  <!-- seat -->
  <path d="M 368 373 Q 400 354 432 373 Q 400 384 368 373 Z" fill="#6b4226"/>
  <path d="M 368 373 Q 400 380 432 373" fill="none" stroke="#4d2f1a" stroke-width="3"/>

  <!-- wheel -->
  <circle cx="400" cy="470" r="52" fill="none" stroke="#2f3640" stroke-width="9"/>
  <circle cx="400" cy="470" r="46" fill="none" stroke="#cfd8e3" stroke-width="4"/>
  <g stroke="#9aa5b1" stroke-width="2.5" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate" values="0 400 470; 360 400 470" dur="0.8s" repeatCount="indefinite"/>
    <line x1="400" y1="470" x2="446" y2="470"/>
    <line x1="400" y1="470" x2="423" y2="510"/>
    <line x1="400" y1="470" x2="377" y2="510"/>
    <line x1="400" y1="470" x2="354" y2="470"/>
    <line x1="400" y1="470" x2="377" y2="430"/>
    <line x1="400" y1="470" x2="423" y2="430"/>
  </g>
  <circle cx="400" cy="470" r="7" fill="#6b7280"/>
  <circle cx="400" cy="470" r="3" fill="#374151"/>

  <!-- pedals -->
  <g stroke="#4b5563" stroke-width="6" stroke-linecap="round">
    <line x1="400" y1="470" x2="384" y2="470"/>
    <line x1="400" y1="470" x2="416" y2="470"/>
  </g>
  <rect x="372" y="467" width="20" height="7" rx="3" fill="#2f3640"/>
  <rect x="408" y="467" width="20" height="7" rx="3" fill="#2f3640"/>

  <!-- ===================== ANTEATER ===================== -->
  <!-- tail (behind body) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-3 325 320; 3 325 320; -3 325 320" dur="1.1s" repeatCount="indefinite"/>
    <path d="M 322 322 C 262 348 196 316 190 244 C 186 186 236 150 278 176 C 316 200 330 260 322 322 Z" fill="#c9985f"/>
    <path d="M 300 302 C 268 320 232 300 222 264" fill="none" stroke="#b07f47" stroke-width="4" stroke-linecap="round"/>
    <path d="M 284 250 C 262 262 238 250 230 224" fill="none" stroke="#b07f47" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- far arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="9 415 292; -9 415 292; 9 415 292" dur="0.55s" repeatCount="indefinite"/>
    <path d="M 415 292 C 395 270 372 250 356 240" fill="none" stroke="#4a362a" stroke-width="17" stroke-linecap="round"/>
    <circle cx="356" cy="240" r="10" fill="#3a2a20"/>
  </g>

  <!-- body -->
  <ellipse cx="398" cy="310" rx="80" ry="47" transform="rotate(-6 398 310)" fill="#d9a86c"/>
  <g clip-path="url(#bodyClip)">
    <rect x="432" y="240" width="30" height="150" fill="#5a4032" transform="rotate(14 447 320)"/>
  </g>

  <!-- neck + head + snout -->
  <path d="M 452 302 L 506 268" fill="none" stroke="#d9a86c" stroke-width="38" stroke-linecap="round"/>
  <ellipse cx="512" cy="262" rx="31" ry="28" fill="#d9a86c"/>
  <path d="M 528 246 C 566 246 602 264 621 279 C 626 283 626 293 619 297 C 601 303 562 293 528 285 Z" fill="#d9a86c"/>
  <ellipse cx="618" cy="288" rx="8.5" ry="8" fill="#2e2320"/>
  <circle cx="615" cy="286" r="1.6" fill="#5c4a3d"/>
  <ellipse cx="500" cy="236" rx="11" ry="9" fill="#d9a86c" transform="rotate(-20 500 236)"/>
  <ellipse cx="500" cy="236" rx="6" ry="4.5" fill="#b8834f" transform="rotate(-20 500 236)"/>
  <circle cx="520" cy="252" r="5.5" fill="#241c18"/>
  <circle cx="522" cy="250" r="2" fill="#ffffff"/>

  <!-- near arm -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="-8 442 296; 10 442 296; -8 442 296" dur="0.55s" repeatCount="indefinite"/>
    <path d="M 442 296 C 452 274 454 252 449 238" fill="none" stroke="#5a4032" stroke-width="18" stroke-linecap="round"/>
    <circle cx="449" cy="238" r="11" fill="#4a362a"/>
  </g>

  <!-- legs -->
  <path d="M 420 342 C 428 390 430 436 424 462" fill="none" stroke="#4a362a" stroke-width="18" stroke-linecap="round"/>
  <path d="M 398 344 C 390 390 384 436 390 462" fill="none" stroke="#5a4032" stroke-width="19" stroke-linecap="round"/>
  <ellipse cx="424" cy="464" rx="12" ry="7" fill="#2e2320"/>
  <ellipse cx="390" cy="464" rx="13" ry="7" fill="#2e2320"/>

  <!-- ===================== JUGGLED BOTTLES ===================== -->
  <!-- faint juggling trails -->
  <g fill="none" stroke="#b9c7d6" stroke-width="2" stroke-dasharray="6 10" opacity="0.7">
    <path d="M 450 236 C 452 122 424 78 412 78 C 400 78 352 122 352 236 C 352 122 384 78 396 78 C 408 78 448 122 450 236"/>
  </g>

  <!-- bottle 1 -->
  <g>
    <animateMotion dur="1.1s" repeatCount="indefinite" rotate="0" begin="0s"
      path="M 450 236 C 452 122 424 78 412 78 C 400 78 352 122 352 236 C 352 122 384 78 396 78 C 408 78 448 122 450 236 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="1.1s" repeatCount="indefinite" begin="0s"/>
      <use href="#bottleA"/>
    </g>
  </g>

  <!-- bottle 2 -->
  <g>
    <animateMotion dur="1.1s" repeatCount="indefinite" rotate="0" begin="-0.366s"
      path="M 450 236 C 452 122 424 78 412 78 C 400 78 352 122 352 236 C 352 122 384 78 396 78 C 408 78 448 122 450 236 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="1.1s" repeatCount="indefinite" begin="-0.366s"/>
      <use href="#bottleB"/>
    </g>
  </g>

  <!-- bottle 3 -->
  <g>
    <animateMotion dur="1.1s" repeatCount="indefinite" rotate="0" begin="-0.733s"
      path="M 450 236 C 452 122 424 78 412 78 C 400 78 352 122 352 236 C 352 122 384 78 396 78 C 408 78 448 122 450 236 Z"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 0 0; 360 0 0" dur="1.1s" repeatCount="indefinite" begin="-0.733s"/>
      <use href="#bottleC"/>
    </g>
  </g>

  <!-- sparkles at the apexes -->
  <g fill="#ffffff">
    <path d="M 412 62 L 415 74 L 427 77 L 415 80 L 412 92 L 409 80 L 397 77 L 409 74 Z">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 386 62 L 389 74 L 401 77 L 389 80 L 386 92 L 383 80 L 371 77 L 383 74 Z" fill-opacity="0.9">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="-0.55s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
