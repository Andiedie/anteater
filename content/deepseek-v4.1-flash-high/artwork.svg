<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="title desc">
  <title id="title">Anteater riding a unicycle while juggling bottles</title>
  <desc id="desc">A cartoon anteater balances on a rolling unicycle and juggles three bottles in a loop.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe9ff"/>
      <stop offset="1" stop-color="#eefbff"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#93d68d"/>
      <stop offset="1" stop-color="#4f9e4c"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#75604d"/>
      <stop offset="1" stop-color="#3c2f27"/>
    </linearGradient>
    <linearGradient id="tailGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7c6650"/>
      <stop offset="1" stop-color="#4a3a2e"/>
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8d3af"/>
      <stop offset="1" stop-color="#cdae86"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6c9" stop-opacity="0"/>
    </radialGradient>

    <!-- Reusable bottle, colored via currentColor -->
    <g id="bottle">
      <rect x="-5" y="-25" width="10" height="8" rx="2" fill="#c9922b"/>
      <rect x="-4" y="-18" width="8" height="9" fill="currentColor"/>
      <path d="M -9,-9 Q -9,-13 -4,-13 L 4,-13 Q 9,-13 9,-9 L 9,14 Q 9,24 0,24 Q -9,24 -9,14 Z" fill="currentColor"/>
      <rect x="-8" y="1" width="16" height="11" rx="2" fill="#ffffff" opacity="0.88"/>
      <rect x="-4.5" y="-7" width="3" height="24" rx="1.5" fill="#ffffff" opacity="0.5"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="640" cy="110" r="70" fill="#ffe89a" opacity="0.85"/>
  <circle cx="640" cy="110" r="110" fill="url(#glow)"/>
  <ellipse cx="180" cy="470" rx="220" ry="60" fill="#a7dca3" opacity="0.55"/>
  <ellipse cx="660" cy="485" rx="260" ry="70" fill="#a7dca3" opacity="0.5"/>

  <!-- Speed lines -->
  <g stroke="#9fc3d8" stroke-width="6" stroke-linecap="round" opacity="0.7">
    <line x1="150" y1="360" x2="220" y2="360">
      <animate attributeName="opacity" values="0;0.8;0" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="190;120" dur="0.9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="240;170" dur="0.9s" repeatCount="indefinite"/>
    </line>
    <line x1="120" y1="420" x2="200" y2="420">
      <animate attributeName="opacity" values="0;0.7;0" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="170;100" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="230;160" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
    </line>
    <line x1="170" y1="480" x2="235" y2="480">
      <animate attributeName="opacity" values="0;0.6;0" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x1" values="200;130" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="250;180" dur="0.9s" begin="0.6s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Ground -->
  <rect x="0" y="518" width="800" height="82" fill="url(#groundGrad)"/>
  <g fill="#3f8a3d">
    <path d="M 60,518 q 6,-22 12,0 q 6,-18 12,0 Z"/>
    <path d="M 120,518 q 5,-18 10,0 q 5,-14 10,0 Z"/>
    <path d="M 700,518 q 6,-22 12,0 q 6,-18 12,0 Z"/>
    <path d="M 745,518 q 5,-16 10,0 q 5,-12 10,0 Z"/>
  </g>

  <!-- Rider shadow on ground -->
  <ellipse cx="400" cy="520" rx="78" ry="12" fill="#1b3a1b" opacity="0.22">
    <animate attributeName="rx" values="64;80;64" dur="0.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0.26;0.18" dur="0.8s" repeatCount="indefinite"/>
  </ellipse>

  <!-- ================= UNICYCLE ================= -->
  <!-- Far (left) hind leg, drawn behind wheel -->
  <path d="M 384,330 C 356,372 356,420 364,452" stroke="#332822" stroke-width="15" stroke-linecap="round" fill="none"/>
  <ellipse cx="364" cy="456" rx="13" ry="7" fill="#241b16"/>

  <!-- Wheel -->
  <g>
    <circle cx="400" cy="460" r="58" fill="none" stroke="#263238" stroke-width="10"/>
    <circle cx="400" cy="460" r="49" fill="none" stroke="#b0bec5" stroke-width="3"/>
    <g stroke="#90a4ae" stroke-width="2.5" stroke-linecap="round">
      <line x1="352" y1="460" x2="448" y2="460"/>
      <line x1="400" y1="412" x2="400" y2="508"/>
      <line x1="366.1" y1="426.1" x2="433.9" y2="493.9"/>
      <line x1="366.1" y1="493.9" x2="433.9" y2="426.1"/>
      <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="1.5s" repeatCount="indefinite"/>
    </g>
    <circle cx="400" cy="460" r="8" fill="#37474f"/>
    <circle cx="398" cy="457" r="2.5" fill="#90a4ae"/>
  </g>

  <!-- Crank and pedals -->
  <g>
    <line x1="400" y1="460" x2="434" y2="460" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
    <line x1="400" y1="460" x2="366" y2="460" stroke="#263238" stroke-width="6" stroke-linecap="round"/>
    <rect x="426" y="452" width="20" height="9" rx="3" fill="#546e7a"/>
    <rect x="358" y="452" width="20" height="9" rx="3" fill="#37474f"/>
    <animateTransform attributeName="transform" type="rotate" from="0 400 460" to="360 400 460" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Seat post and saddle -->
  <rect x="394" y="344" width="12" height="72" rx="5" fill="#607d8b"/>
  <path d="M 368,344 Q 400,326 432,344 Q 400,352 368,344 Z" fill="#263238"/>
  <!-- Seat springs -->
  <path d="M 382,346 q 4,8 8,0 M 410,346 q 4,8 8,0" stroke="#90a4ae" stroke-width="2" fill="none"/>

  <!-- ================= ANTEATER ================= -->
  <g>
    <!-- Gentle riding bob -->
    <animateTransform attributeName="transform" type="translate" values="0,0; 0,-5; 0,0" dur="0.8s" repeatCount="indefinite"/>

    <!-- Bushy tail with sway -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 342 282; 7 342 282; -6 342 282" dur="1.6s" repeatCount="indefinite"/>
      <path d="M 344,266 C 308,232 258,212 224,238 C 196,258 202,298 240,312 C 276,325 314,312 344,298 Z"
            fill="url(#tailGrad)"/>
      <g stroke="#8d7358" stroke-width="3" stroke-linecap="round" opacity="0.7" fill="none">
        <path d="M 330,268 C 300,248 268,236 244,246"/>
        <path d="M 322,290 C 292,282 262,276 242,284"/>
        <path d="M 336,300 C 306,300 280,298 258,304"/>
      </g>
    </g>

    <!-- Body -->
    <path d="M 345,275 C 345,242 380,235 415,240 C 452,246 476,268 475,298 C 474,328 445,341 405,341 C 365,341 345,322 345,298 Z"
          fill="url(#bodyGrad)"/>
    <!-- Signature dark shoulder stripe -->
    <path d="M 424,242 C 410,278 388,306 358,326 L 372,336 C 404,312 424,280 438,248 Z" fill="#241a14" opacity="0.9"/>
    <!-- Belly highlight -->
    <path d="M 356,318 C 386,336 432,336 464,314 C 452,334 410,344 374,336 Z" fill="#d9b382" opacity="0.55"/>

    <!-- Neck / head -->
    <ellipse cx="498" cy="262" rx="30" ry="26" fill="url(#bodyGrad)"/>
    <ellipse cx="486" cy="238" rx="11" ry="9" fill="#5b4938"/>
    <ellipse cx="486" cy="238" rx="6" ry="5" fill="#b3946f"/>
    <!-- Snout -->
    <path d="M 512,244 C 542,246 562,256 586,266 L 628,283 C 635,285 635,294 628,296 L 586,297 C 556,299 530,296 510,286 Z"
          fill="url(#snoutGrad)"/>
    <path d="M 520,290 C 552,298 592,297 628,296" stroke="#b1916a" stroke-width="2" fill="none" opacity="0.7"/>
    <ellipse cx="621" cy="288" rx="3.5" ry="4.5" fill="#5b4632"/>
    <!-- Eye -->
    <circle cx="500" cy="252" r="5.5" fill="#1b1b1b"/>
    <circle cx="501.5" cy="250" r="1.8" fill="#ffffff"/>

    <!-- Juggling arms -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-7 452 272; 7 452 272; -7 452 272" dur="0.8s" repeatCount="indefinite"/>
      <path d="M 452,272 C 482,244 472,202 444,174" stroke="#4a3b31" stroke-width="14" stroke-linecap="round" fill="none"/>
      <circle cx="442" cy="171" r="10" fill="#5b4938"/>
      <path d="M 434,164 l -7,-7 M 442,160 l 0,-9 M 450,164 l 7,-7" stroke="#2b211b" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 434 282; -6 434 282; 6 434 282" dur="0.8s" repeatCount="indefinite"/>
      <path d="M 432,282 C 410,252 392,216 374,182" stroke="#3c2f27" stroke-width="14" stroke-linecap="round" fill="none"/>
      <circle cx="372" cy="179" r="10" fill="#4a3b31"/>
      <path d="M 364,172 l -7,-7 M 372,168 l 0,-9 M 380,172 l 7,-7" stroke="#241b16" stroke-width="3" stroke-linecap="round" fill="none"/>
    </g>
  </g>

  <!-- Near (right) hind leg over the wheel -->
  <path d="M 426,332 C 452,372 448,420 438,452" stroke="#4a3b31" stroke-width="15" stroke-linecap="round" fill="none"/>
  <ellipse cx="438" cy="456" rx="14" ry="7.5" fill="#2b211b"/>

  <!-- ================= JUGGLED BOTTLES ================= -->
  <g>
    <g>
      <animateMotion dur="4s" repeatCount="indefinite" begin="0s"
        path="M 480,120 a 80,45 0 1,1 -160,0 a 80,45 0 1,1 160,0"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" dur="4s" repeatCount="indefinite"/>
        <use href="#bottle" color="#2e8b57"/>
      </g>
    </g>
    <g>
      <animateMotion dur="4s" repeatCount="indefinite" begin="-1.33s"
        path="M 480,120 a 80,45 0 1,1 -160,0 a 80,45 0 1,1 160,0"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="12;-12;12" dur="4s" repeatCount="indefinite"/>
        <use href="#bottle" color="#d9822b"/>
      </g>
    </g>
    <g>
      <animateMotion dur="4s" repeatCount="indefinite" begin="-2.66s"
        path="M 480,120 a 80,45 0 1,1 -160,0 a 80,45 0 1,1 160,0"/>
      <g>
        <animateTransform attributeName="transform" type="rotate" values="-10;10;-10" dur="4s" repeatCount="indefinite"/>
        <use href="#bottle" color="#3b7bd9"/>
      </g>
    </g>
  </g>

  <!-- Juggling sparkles -->
  <g fill="#fff3a8">
    <path d="M 300,70 l 3,9 9,3 -9,3 -3,9 -3,-9 -9,-3 9,-3 Z">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="scale" values="0.5;1.2;0.5" dur="1.3s" repeatCount="indefinite" additive="sum"/>
    </path>
    <path d="M 520,60 l 3,9 9,3 -9,3 -3,9 -3,-9 -9,-3 9,-3 Z">
      <animate attributeName="opacity" values="0;1;0" dur="1.3s" begin="0.6s" repeatCount="indefinite"/>
    </path>
    <path d="M 400,40 l 2.5,7 7,2.5 -7,2.5 -2.5,7 -2.5,-7 -7,-2.5 7,-2.5 Z">
      <animate attributeName="opacity" values="0;1;0" dur="1.1s" begin="0.3s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
