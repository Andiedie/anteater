<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#fdf1d6"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9a8571"/>
      <stop offset="1" stop-color="#6f5c4b"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f7a3a"/>
      <stop offset="0.35" stop-color="#5fd17f"/>
      <stop offset="1" stop-color="#145a2a"/>
    </linearGradient>
    <linearGradient id="glassB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6b3a12"/>
      <stop offset="0.35" stop-color="#c9823f"/>
      <stop offset="1" stop-color="#4a270a"/>
    </linearGradient>
    <linearGradient id="glassU" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1c4f8f"/>
      <stop offset="0.35" stop-color="#6fb0ff"/>
      <stop offset="1" stop-color="#123a6b"/>
    </linearGradient>

    <!-- Bottle shapes centered on origin -->
    <g id="bottleShape">
      <rect x="-8" y="-6" width="16" height="30" rx="5"/>
      <path d="M-8,-2 Q-8,-10 -3,-14 L-3,-22 L3,-22 L3,-14 Q8,-10 8,-2 Z"/>
      <rect x="-3.5" y="-26" width="7" height="5" rx="1.5" fill="#e8c547"/>
      <rect x="-6" y="2" width="12" height="11" rx="1" fill="#fff8e6" opacity="0.85"/>
      <rect x="-5" y="-4" width="2.5" height="24" rx="1.2" fill="#fff" opacity="0.35"/>
    </g>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#sky)"/>
  <circle cx="90" cy="90" r="40" fill="#ffe17a">
    <animate attributeName="r" values="40;44;40" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="#fff" opacity="0.85">
    <g>
      <ellipse cx="0" cy="0" rx="45" ry="14"/>
      <ellipse cx="20" cy="-10" rx="25" ry="14"/>
      <animateTransform attributeName="transform" type="translate" values="-80,120;680,120" dur="28s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="0" cy="0" rx="35" ry="11"/>
      <ellipse cx="-12" cy="-8" rx="20" ry="11"/>
      <animateTransform attributeName="transform" type="translate" values="300,60;680,60;-80,60;300,60" keyTimes="0;0.4;0.4001;1" dur="40s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="525" width="600" height="75" fill="#c9a66b"/>
  <rect x="0" y="525" width="600" height="6" fill="#a8844c"/>
  <g stroke="#a8844c" stroke-width="3" stroke-linecap="round">
    <line x1="0" y1="560" x2="30" y2="560"/>
    <line x1="150" y1="575" x2="190" y2="575"/>
    <line x1="300" y1="560" x2="330" y2="560"/>
    <line x1="450" y1="580" x2="490" y2="580"/>
    <animateTransform attributeName="transform" type="translate" values="0,0;-150,0" dur="1.6s" repeatCount="indefinite"/>
  </g>

  <!-- Shadow -->
  <ellipse cx="300" cy="530" rx="60" ry="7" fill="#000" opacity="0.2">
    <animate attributeName="rx" values="60;52;60;66;60" dur="3s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Everything on the unicycle wobbles around the wheel contact point -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="0 300 525; 4 300 525; 0 300 525; -4 300 525; 0 300 525"
      dur="3s" repeatCount="indefinite" calcMode="spline"
      keySplines="0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1;0.4 0 0.6 1"/>

    <!-- Tail (behind everything) -->
    <g>
      <path d="M240,325 C190,320 150,290 160,230 C165,200 190,190 205,205
               C200,230 215,265 255,290 Z" fill="#5b4a3c"/>
      <path d="M170,235 l-12,-8 M178,215 l-10,-12 M195,200 l-4,-14 M165,260 l-14,-4"
            stroke="#5b4a3c" stroke-width="6" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate"
        values="0 245 315; -7 245 315; 0 245 315; 5 245 315; 0 245 315" dur="2s" repeatCount="indefinite"/>
    </g>

    <!-- Unicycle wheel -->
    <g>
      <circle cx="300" cy="470" r="55" fill="none" stroke="#222" stroke-width="10"/>
      <circle cx="300" cy="470" r="49" fill="none" stroke="#999" stroke-width="2"/>
      <g stroke="#bbb" stroke-width="2">
        <line x1="300" y1="421" x2="300" y2="519"/>
        <line x1="251" y1="470" x2="349" y2="470"/>
        <line x1="265.4" y1="435.4" x2="334.6" y2="504.6"/>
        <line x1="334.6" y1="435.4" x2="265.4" y2="504.6"/>
      </g>
      <!-- Crank arms -->
      <line x1="280" y1="470" x2="320" y2="470" stroke="#444" stroke-width="5" stroke-linecap="round"/>
      <animateTransform attributeName="transform" type="rotate"
        from="0 300 470" to="360 300 470" dur="1.6s" repeatCount="indefinite"/>
    </g>
    <circle cx="300" cy="470" r="6" fill="#555"/>

    <!-- Fork & seat -->
    <path d="M300,470 L300,368" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
    <path d="M272,362 Q300,350 330,360 Q332,370 300,372 Q272,372 272,362 Z" fill="#222"/>

    <!-- Back leg (darker) -->
    <g stroke="#4f4035" stroke-width="13" stroke-linecap="round" fill="none">
      <line x1="292" y1="350">
        <animate attributeName="x2" dur="1.6s" repeatCount="indefinite"
          values="280;285.9;300;314.1;320;314.1;300;285.9;280"/>
        <animate attributeName="y2" dur="1.6s" repeatCount="indefinite"
          values="470;455.9;450;455.9;470;484.1;490;484.1;470"/>
      </line>
    </g>

    <!-- Body -->
    <ellipse cx="295" cy="318" rx="72" ry="46" fill="url(#fur)"/>
    <!-- Giant anteater shoulder stripe -->
    <path d="M330,280 Q300,320 250,345 L262,352 Q312,328 345,290 Z" fill="#1e1a17"/>
    <path d="M345,290 Q312,328 262,352 L270,356 Q318,334 352,298 Z" fill="#f2ead8"/>

    <!-- Front leg (lighter) -->
    <g stroke="#7a6655" stroke-width="14" stroke-linecap="round" fill="none">
      <line x1="305" y1="350">
        <animate attributeName="x2" dur="1.6s" repeatCount="indefinite"
          values="320;314.1;300;285.9;280;285.9;300;314.1;320"/>
        <animate attributeName="y2" dur="1.6s" repeatCount="indefinite"
          values="470;484.1;490;484.1;470;455.9;450;455.9;470"/>
      </line>
    </g>
    <!-- Pedals -->
    <g fill="#333">
      <rect x="-9" y="-3" width="18" height="6" rx="2">
        <animateMotion dur="1.6s" repeatCount="indefinite"
          path="M320,470 A20,20 0 1,1 280,470 A20,20 0 1,1 320,470"/>
      </rect>
      <rect x="-9" y="-3" width="18" height="6" rx="2">
        <animateMotion dur="1.6s" repeatCount="indefinite"
          path="M280,470 A20,20 0 1,1 320,470 A20,20 0 1,1 280,470"/>
      </rect>
    </g>

    <!-- Head & snout -->
    <g>
      <path d="M320,300 Q330,255 362,250 Q385,248 400,256 L462,276
               Q468,280 462,284 L398,288 Q375,295 350,310 Z" fill="url(#fur)"/>
      <circle cx="464" cy="280" r="4" fill="#2a2420"/>
      <!-- Ear -->
      <ellipse cx="350" cy="252" rx="8" ry="11" fill="#6f5c4b" transform="rotate(-20 350 252)"/>
      <!-- Eye -->
      <circle cx="372" cy="262" r="4" fill="#111"/>
      <circle cx="373.5" cy="260.5" r="1.3" fill="#fff"/>
      <!-- Tongue flick -->
      <path d="M466,281 Q480,284 486,280" stroke="#e0607e" stroke-width="3" fill="none" stroke-linecap="round" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.8;0.82;0.9;0.92;1" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="d" dur="3s" repeatCount="indefinite"
          values="M466,281 Q470,282 472,281;M466,281 Q470,282 472,281;M466,281 Q485,290 500,278;M466,281 Q485,290 500,278;M466,281 Q470,282 472,281;M466,281 Q470,282 472,281"
          keyTimes="0;0.8;0.84;0.88;0.92;1"/>
      </path>
      <animateTransform attributeName="transform" type="rotate"
        values="0 335 300; 3 335 300; 0 335 300; -2 335 300; 0 335 300" dur="1.5s" repeatCount="indefinite"/>
    </g>

    <!-- Arms (hands bob as they toss) -->
    <g stroke="#7a6655" stroke-width="13" stroke-linecap="round" fill="none">
      <path d="M285,300 Q255,270 245,222">
        <animate attributeName="d" dur="1s" repeatCount="indefinite"
          values="M285,300 Q255,270 245,222;M285,300 Q252,278 245,232;M285,300 Q255,270 245,222"/>
      </path>
      <path d="M320,298 Q360,272 365,222">
        <animate attributeName="d" dur="1s" repeatCount="indefinite" begin="-0.5s"
          values="M320,298 Q360,272 365,222;M320,298 Q362,280 365,232;M320,298 Q360,272 365,222"/>
      </path>
    </g>
    <!-- Claws -->
    <g fill="#e8dcc4">
      <circle cx="245" cy="218" r="5">
        <animate attributeName="cy" values="218;228;218" dur="1s" repeatCount="indefinite"/>
      </circle>
      <circle cx="365" cy="218" r="5">
        <animate attributeName="cy" values="218;228;218" dur="1s" repeatCount="indefinite" begin="-0.5s"/>
      </circle>
    </g>

    <!-- Juggled bottles: high arc left→right, low pass right→left -->
    <g>
      <g fill="url(#glassG)">
        <use href="#bottleShape">
          <animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" repeatCount="indefinite"/>
        </use>
        <animateMotion dur="3s" repeatCount="indefinite" begin="0s"
          path="M245,210 Q305,20 365,210 Q305,250 245,210"/>
      </g>
      <g fill="url(#glassB)">
        <use href="#bottleShape">
          <animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" repeatCount="indefinite" begin="-1s"/>
        </use>
        <animateMotion dur="3s" repeatCount="indefinite" begin="-1s"
          path="M245,210 Q305,20 365,210 Q305,250 245,210"/>
      </g>
      <g fill="url(#glassU)">
        <use href="#bottleShape">
          <animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" repeatCount="indefinite" begin="-2s"/>
        </use>
        <animateMotion dur="3s" repeatCount="indefinite" begin="-2s"
          path="M245,210 Q305,20 365,210 Q305,250 245,210"/>
      </g>
    </g>
  </g>

  <text x="300" y="585" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#5a3f1c">
    The Amazing Anteater!
  </text>
</svg>
