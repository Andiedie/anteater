<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">The balancing act</title>
  <desc id="desc">A giant anteater in a red party hat balances on a unicycle, tossing three colorful bottles under the lights of a circus tent.</desc>
  <defs>
    <radialGradient id="light"><stop stop-color="#fff1c6"/><stop offset="1" stop-color="#f2cb91"/></radialGradient>
    <path id="star" d="M0 -10 Q1 -1 8 0 Q1 2 0 11 Q-2 2 -8 0 Q-2 -1 0 -10" fill="#be8552"/>
    <path id="bottle" d="M-5 -24 H5 V-19 H4 V-10 Q4 -7 9 -4 Q12 -2 12 3 V21 Q12 25 8 25 H-8 Q-12 25 -12 21 V3 Q-12 -2 -9 -4 Q-4 -7 -4 -10 V-19 H-5Z"/>
    <g id="glass" stroke="#302e36" stroke-width="2.5" stroke-linejoin="round"><use xlink:href="#bottle" fill="currentColor"/><path d="M-11 5 H11 V17 H-11Z" fill="#fff1cc" stroke="none"/><path d="M0 7 L4 11 L0 15 L-4 11Z" fill="currentColor" stroke="none"/><path d="M-7 1 L-5 -2" stroke="white" stroke-linecap="round"/></g>
    <path id="flight" d="M245 308 Q310 -65 402 299 Q331 57 245 308Z"/>
    <pattern id="bulbs" width="28" height="14" patternUnits="userSpaceOnUse"><circle cx="14" cy="7" r="3" fill="#ffe3a4"/></pattern>
  </defs>
  <rect width="640" height="640" fill="#193d43"/>
  <path d="M54 573 V288 A266 266 0 0 1 586 288 V573Z" fill="url(#light)" stroke="#cfaa70" stroke-width="5"/>
  <path d="M67 573 V288 A253 253 0 0 1 573 288 V573" fill="none" stroke="#fff0c5" stroke-width="3"/>
  <g opacity=".75"><use xlink:href="#star" transform="translate(155 222)"/><use xlink:href="#star" transform="translate(474 182) scale(.8)"/><use xlink:href="#star" transform="translate(503 370)"/><use xlink:href="#star" transform="translate(119 401) scale(.6)"/></g>
  <path d="M0 558 H640 V640 H0Z" fill="#b85742"/><path d="M0 573 H640 V608 H0Z" fill="#edd097"/><path d="M0 606 H640 V620 H0Z" fill="url(#bulbs)"/>
  <ellipse cx="314" cy="561" rx="96" ry="8" fill="#874b3c" opacity=".42"/>
  <g stroke="#302e36" stroke-linejoin="round" stroke-linecap="round">
    <circle cx="314" cy="505" r="54" fill="#f7dfae" stroke-width="9"/>
    <g stroke="#ac7860" stroke-width="3"><animateTransform attributeName="transform" type="rotate" from="0 314 505" to="360 314 505" dur="2s" repeatCount="indefinite"/><path d="M314 455 V555 M264 505 H364 M279 470 L349 540 M279 540 L349 470"/><circle cx="314" cy="505" r="46" fill="none" stroke="#ce7052" stroke-width="4"/></g>
    <path d="M314 505 L302 411" fill="none" stroke-width="11"/><path d="M314 505 L302 411" fill="none" stroke="#e28c58" stroke-width="5"/>
    <path d="M278 407 Q296 417 325 404" fill="none" stroke-width="13"/>
    <!-- The bushy tail counterbalances the long muzzle. -->
    <g><animateTransform attributeName="transform" type="rotate" values="-2 283 380;2 283 380;-2 283 380" dur="2s" repeatCount="indefinite"/>
      <path d="M287 368 C248 350 215 366 189 400 Q149 454 83 455 L99 464 L81 474 L104 478 L91 490 Q154 511 206 475 Q244 452 271 408 L292 392Z" fill="#766559" stroke-width="4"/>
      <path d="M101 479 Q158 481 202 436 M130 487 Q184 479 222 430 M152 460 Q183 447 202 419" fill="none" stroke="#a99579" stroke-width="3"/>
    </g>
    <path d="M295 390 Q346 386 356 422 L337 488 L320 491 L331 427 L294 426Z" fill="#75645a" stroke-width="4"/>
    <path d="M310 309 Q346 286 372 307 L397 293 Q404 286 409 292 Q416 302 405 310 L378 330 Q353 340 320 336Z" fill="#9d8772" stroke-width="4"/>
    <path d="M263 397 Q245 372 261 333 Q271 298 292 275 Q305 248 328 239 Q352 231 371 249 Q394 268 449 276 Q463 278 458 286 Q454 293 435 292 Q378 291 350 278 Q338 299 335 337 Q340 377 318 399 Q290 415 263 397Z" fill="#b5a089" stroke-width="4"/>
    <path d="M254 351 Q280 326 311 279 Q323 263 338 260 Q321 280 316 306 Q301 351 255 376Z" fill="#fff0d3" stroke="none"/><path d="M254 359 Q293 332 315 286 Q322 271 334 265 Q322 289 321 310 Q310 350 255 382Z" fill="#38383b" stroke="none"/>
    <path d="M322 257 Q307 239 315 234 Q327 226 332 248" fill="#aa8e78" stroke-width="3"/><circle cx="352" cy="254" r="4" fill="#302e36"/><circle cx="353" cy="253" r="1.2" fill="white" stroke="none"/><path d="M448 277 Q464 275 459 285 Q450 289 448 277Z" fill="#302e36"/><path d="M412 283 Q433 289 446 286" fill="none" stroke-width="2"/>
    <path d="M323 236 L327 199 L351 234 Q338 241 323 236Z" fill="#d85f49" stroke-width="3"/><path d="M325 220 L337 215 L341 221 L324 228Z" fill="#ffe1a2" stroke="none"/><circle cx="327" cy="198" r="5" fill="#fff0cb" stroke-width="2"/>
    <path d="M310 311 Q297 303 287 321 L274 335 L252 307 Q247 296 240 300 Q230 305 238 319 L258 350 Q270 366 284 356 Q308 339 314 325" fill="#b5a089" stroke-width="4"/><path d="M239 311 L235 304 M245 308 L242 301" stroke-width="2"/>
    <path d="M282 379 Q251 395 258 421 L283 483 Q291 503 310 501 L321 497 Q327 490 315 486 L301 481 L286 426 Q316 416 318 393" fill="#ab937c" stroke-width="4"/>
    <path d="M313 505 L302 495 H285 M328 491 H345" fill="none" stroke-width="6"/><circle cx="314" cy="505" r="6" fill="#eab46d" stroke-width="3"/>
  </g>
  <!-- Offset each throw by one third of the continuous loop. -->
  <g color="#338e85"><animateMotion dur="3s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" repeatCount="indefinite"/><use xlink:href="#glass"/></g></g>
  <g color="#e47850"><animateMotion begin="-1s" dur="3s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" begin="-1s" dur="3s" repeatCount="indefinite"/><use xlink:href="#glass"/></g></g>
  <g color="#6896ae"><animateMotion begin="-2s" dur="3s" repeatCount="indefinite"><mpath xlink:href="#flight"/></animateMotion><g><animateTransform attributeName="transform" type="rotate" from="0" to="720" begin="-2s" dur="3s" repeatCount="indefinite"/><use xlink:href="#glass"/></g></g>
</svg>
