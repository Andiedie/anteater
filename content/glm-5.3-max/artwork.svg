<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img">
  <title>Anteater riding a unicycle while juggling bottles</title>
  <desc>A cartoon anteater with a long snout, bushy tail, and a giant-anteater back stripe pedals a red unicycle down a road, juggling three amber bottles in arcs above its head.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/>
      <stop offset="1" stop-color="#eaf8ff"/>
    </linearGradient>

    <g id="bottle">
      <rect x="-7" y="-8" width="14" height="26" rx="4" fill="#e69b3c"/>
      <rect x="-3.5" y="-15" width="7" height="9" fill="#e69b3c"/>
      <rect x="-5" y="-19" width="10" height="5.5" rx="2" fill="#8a5a22"/>
      <rect x="-4.6" y="-4" width="4" height="16" rx="2" fill="#ffffff" opacity="0.35"/>
      <rect x="-5.5" y="3" width="11" height="9" rx="1.5" fill="#fdf4e3"/>
      <rect x="-2.5" y="5.5" width="5" height="1.6" rx="0.8" fill="#c0392b"/>
      <rect x="-2.5" y="8.2" width="7" height="1.4" rx="0.7" fill="#c0392b" opacity="0.7"/>
    </g>

    <path id="juggleArc" d="M250 178 C265 50 335 50 352 176 C335 50 265 50 250 178 Z" fill="none" stroke="none"/>

    <g id="cloudA" fill="#ffffff">
      <ellipse cx="120" cy="100" rx="40" ry="18"/>
      <ellipse cx="158" cy="92" rx="26" ry="14"/>
      <ellipse cx="85" cy="94" rx="24" ry="13"/>
    </g>
    <g id="cloudB" fill="#ffffff">
      <ellipse cx="400" cy="60" rx="26" ry="12"/>
      <ellipse cx="425" cy="54" rx="18" ry="9"/>
      <ellipse cx="378" cy="55" rx="16" ry="8"/>
    </g>

    <g id="tuft" stroke="#5e8f4a" stroke-width="3" fill="none" stroke-linecap="round">
      <path d="M0 0 q4 -16 8 0 q4 -12 8 0 q4 -15 8 0"/>
    </g>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="640" height="640" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="560" cy="84" r="44" fill="#ffd75e" opacity="0.3"/>
  <circle cx="560" cy="84" r="34" fill="#ffd75e"/>

  <!-- clouds -->
  <g opacity="0.7">
    <use href="#cloudB"/>
    <use href="#cloudB" x="700"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-700 0" dur="70s" repeatCount="indefinite"/>
  </g>
  <g opacity="0.95">
    <use href="#cloudA"/>
    <use href="#cloudA" x="700"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;-700 0" dur="48s" repeatCount="indefinite"/>
  </g>

  <!-- ground -->
  <rect x="0" y="590" width="640" height="50" fill="#7fb56b"/>
  <rect x="0" y="526" width="640" height="64" fill="#98a0a8"/>
  <rect x="0" y="526" width="640" height="3" fill="#c8ced4"/>
  <line x1="-40" y1="540" x2="680" y2="540" stroke="#f6f6f6" stroke-width="5" stroke-dasharray="34 46">
    <animate attributeName="stroke-dashoffset" values="0;80" dur="0.28s" repeatCount="indefinite"/>
  </line>
  <use href="#tuft" x="50" y="606"/>
  <use href="#tuft" x="200" y="614"/>
  <use href="#tuft" x="320" y="622"/>
  <use href="#tuft" x="520" y="604"/>
  <use href="#tuft" x="590" y="616"/>
  <use href="#tuft" x="120" y="628"/>

  <!-- shadow -->
  <ellipse cx="300" cy="528" rx="88" ry="8" fill="#000000" opacity="0.15"/>

  <!-- far leg (behind wheel) -->
  <path fill="none" stroke="#6e5238" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
        d="M285 310 L367 358 L300 425">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M285 310 L367 358 L300 425;
      M285 310 L370 352 L325 435;
      M285 310 L360 368 L335 460;
      M285 310 L336 390 L325 485;
      M285 310 L313 401 L300 495;
      M285 310 L317 399 L275 485;
      M285 310 L332 393 L265 460;
      M285 310 L351 378 L275 435;
      M285 310 L367 358 L300 425"/>
  </path>

  <!-- unicycle wheel -->
  <g>
    <circle cx="300" cy="460" r="60" fill="none" stroke="#262626" stroke-width="13"/>
    <circle cx="300" cy="460" r="51" fill="none" stroke="#c9c9c9" stroke-width="4"/>
    <g stroke="#d9d9d9" stroke-width="4">
      <line x1="249" y1="460" x2="351" y2="460"/>
      <line x1="274.5" y1="415.8" x2="325.5" y2="504.2"/>
      <line x1="274.5" y1="504.2" x2="325.5" y2="415.8"/>
      <animateTransform attributeName="transform" type="rotate" values="0 300 460;360 300 460" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <circle cx="300" cy="460" r="7" fill="#666666" stroke="#333333" stroke-width="2"/>
  </g>

  <!-- frame and seat -->
  <path d="M300 462 C294 424 306 384 300 342" fill="none" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="300" cy="336" rx="24" ry="7" fill="#3a2a20"/>

  <!-- crank and pedals -->
  <g>
    <animateTransform attributeName="transform" type="rotate" values="0 300 460;360 300 460" dur="1.2s" repeatCount="indefinite"/>
    <line x1="300" y1="425" x2="300" y2="495" stroke="#444444" stroke-width="7" stroke-linecap="round"/>
    <g>
      <rect x="286" y="491" width="28" height="8" rx="3" fill="#222222"/>
      <animateTransform attributeName="transform" type="rotate" values="0 300 495;-360 300 495" dur="1.2s" repeatCount="indefinite"/>
    </g>
    <g>
      <rect x="286" y="421" width="28" height="8" rx="3" fill="#222222"/>
      <animateTransform attributeName="transform" type="rotate" values="0 300 425;-360 300 425" dur="1.2s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- near leg (in front of frame) -->
  <path fill="none" stroke="#8a6a4a" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"
        d="M285 310 L313 401 L300 495">
    <animate attributeName="d" dur="1.2s" repeatCount="indefinite" values="
      M285 310 L313 401 L300 495;
      M285 310 L317 399 L275 485;
      M285 310 L332 393 L265 460;
      M285 310 L351 378 L275 435;
      M285 310 L367 358 L300 425;
      M285 310 L370 352 L325 435;
      M285 310 L360 368 L335 460;
      M285 310 L336 390 L325 485;
      M285 310 L313 401 L300 495"/>
  </path>

  <!-- dust puffs -->
  <g fill="#d8c9a3">
    <circle cx="236" cy="516" r="5" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="1s" begin="0s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-38 -20" dur="1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="236" cy="516" r="4" opacity="0">
      <animate attributeName="opacity" values="0;0.5;0" dur="1s" begin="0.33s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-30 -26" dur="1s" begin="0.33s" repeatCount="indefinite"/>
    </circle>
    <circle cx="236" cy="516" r="6" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0" dur="1s" begin="0.66s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-48 -12" dur="1s" begin="0.66s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- anteater (bobs with each pedal stroke) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="0.6s" repeatCount="indefinite"/>

    <!-- tail -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-4 262 292;4 262 292;-4 262 292" dur="2.4s" repeatCount="indefinite"/>
      <path d="M262 280 C200 274 162 330 178 398 C186 434 214 452 240 440 C219 434 203 417 201 395 C196 342 226 300 268 302 Z" fill="#5d4432"/>
      <path d="M235 300 C205 330 195 370 205 400" fill="none" stroke="#7a5c42" stroke-width="3" stroke-linecap="round"/>
      <path d="M245 295 C220 325 212 360 220 392" fill="none" stroke="#7a5c42" stroke-width="3" stroke-linecap="round"/>
      <path d="M255 292 C235 318 228 345 232 375" fill="none" stroke="#7a5c42" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- torso -->
    <ellipse cx="300" cy="285" rx="54" ry="63" fill="#8a6a4a" transform="rotate(14 300 285)"/>
    <ellipse cx="312" cy="300" rx="30" ry="40" fill="#a5876a" transform="rotate(14 312 300)"/>
    <path d="M305 224 C288 262 264 300 252 332" fill="none" stroke="#d9c4a4" stroke-width="21" stroke-linecap="round"/>
    <path d="M305 224 C288 262 264 300 252 332" fill="none" stroke="#43301f" stroke-width="14" stroke-linecap="round"/>

    <!-- far arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="6 318 252;-6 318 252;6 318 252" dur="1.1s" repeatCount="indefinite"/>
      <path d="M318 252 C295 222 272 198 252 180" fill="none" stroke="#77593d" stroke-width="11" stroke-linecap="round"/>
      <circle cx="250" cy="178" r="7" fill="#77593d"/>
    </g>

    <!-- head -->
    <g>
      <path d="M330 240 L350 216" stroke="#8a6a4a" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="334" cy="197" rx="7.5" ry="10.5" fill="#6e5238" transform="rotate(24 334 197)"/>
      <ellipse cx="334" cy="197" rx="4" ry="6" fill="#4a3626" transform="rotate(24 334 197)"/>
      <circle cx="348" cy="212" r="16" fill="#8a6a4a"/>
      <path d="M336 202 C372 194 418 208 446 224 C451 227 451 230 446 231 C418 240 372 236 336 226 Z" fill="#6b4f3a"/>
      <circle cx="444" cy="227" r="1.6" fill="#2f2318"/>
      <ellipse cx="352" cy="207" rx="3.4" ry="3.4" fill="#241a10">
        <animate attributeName="ry" values="3.4;3.4;0.4;3.4;3.4" keyTimes="0;0.9;0.94;0.98;1" dur="4.6s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="353.2" cy="205.6" r="1.1" fill="#ffffff"/>
      <line x1="446" y1="229" x2="446" y2="229" stroke="#ff8fb3" stroke-width="3.5" stroke-linecap="round">
        <animate attributeName="x2" values="446;468;468;446" keyTimes="0;0.15;0.45;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="229;233;233;229" keyTimes="0;0.15;0.45;1" dur="4s" begin="1.5s" repeatCount="indefinite"/>
      </line>
    </g>

    <!-- near arm -->
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-6 330 256;6 330 256;-6 330 256" dur="1.1s" repeatCount="indefinite"/>
      <path d="M330 256 C334 222 344 196 350 178" fill="none" stroke="#8a6a4a" stroke-width="11" stroke-linecap="round"/>
      <circle cx="352" cy="176" r="7" fill="#8a6a4a"/>
    </g>
  </g>

  <!-- juggled bottles -->
  <g>
    <animateMotion dur="2s" repeatCount="indefinite" begin="0s">
      <mpath href="#juggleArc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#bottle"/>
    </g>
  </g>
  <g>
    <animateMotion dur="2s" repeatCount="indefinite" begin="-0.667s">
      <mpath href="#juggleArc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#bottle"/>
    </g>
  </g>
  <g>
    <animateMotion dur="2s" repeatCount="indefinite" begin="-1.333s">
      <mpath href="#juggleArc"/>
    </animateMotion>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="0.9s" repeatCount="indefinite"/>
      <use href="#bottle"/>
    </g>
  </g>
</svg>
