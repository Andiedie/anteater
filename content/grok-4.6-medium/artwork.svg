<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 520" width="640" height="520" role="img" aria-label="An anteater riding a unicycle while juggling bottles">
  <title>Juggling Anteater on a Unicycle</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8ecae6"/>
      <stop offset="55%" stop-color="#caf0f8"/>
      <stop offset="100%" stop-color="#fefae0"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#90be6d"/>
      <stop offset="100%" stop-color="#588157"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a66b"/>
      <stop offset="45%" stop-color="#a67c52"/>
      <stop offset="100%" stop-color="#6f4e37"/>
    </linearGradient>
    <linearGradient id="snoutGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#8d6e4c"/>
    </linearGradient>
    <linearGradient id="wheelMetal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ced4da"/>
      <stop offset="50%" stop-color="#6c757d"/>
      <stop offset="100%" stop-color="#adb5bd"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fff3b0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff3b0" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#2d6a4f" flood-opacity="0.28"/>
    </filter>
    <filter id="tinyGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .scene { font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
    .wheel { transform-origin: 320px 390px; animation: spin 1.05s linear infinite; }
    .crank { transform-origin: 320px 390px; animation: spin 1.05s linear infinite; }
    .rider { transform-origin: 320px 250px; animation: bounce 0.52s ease-in-out infinite alternate; }
    .tail { transform-origin: 214px 268px; animation: wag 1.4s ease-in-out infinite; }
    .snout { transform-origin: 360px 214px; animation: sniff 1.8s ease-in-out infinite; }
    .ear { transform-origin: 338px 168px; animation: twitch 2.4s ease-in-out infinite; }
    .arm-left { transform-origin: 292px 230px; animation: tossL 0.9s ease-in-out infinite; }
    .arm-right { transform-origin: 348px 228px; animation: tossR 0.9s ease-in-out infinite; }
    .tongue { transform-origin: 438px 226px; animation: lick 2.2s ease-in-out infinite; }
    .cloud { animation: drift 18s linear infinite; }
    .cloud2 { animation: drift 26s linear infinite reverse; }
    .grass-blade { transform-box: fill-box; transform-origin: bottom center; animation: sway 2.6s ease-in-out infinite; }
    .b1 { animation: juggle1 1.8s cubic-bezier(.42,0,.58,1) infinite; }
    .b2 { animation: juggle2 1.8s cubic-bezier(.42,0,.58,1) infinite; }
    .b3 { animation: juggle3 1.8s cubic-bezier(.42,0,.58,1) infinite; }
    .label { animation: fadePulse 3s ease-in-out infinite; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes bounce {
      from { transform: translateY(0) rotate(-1.4deg); }
      to { transform: translateY(-7px) rotate(1.6deg); }
    }
    @keyframes wag {
      0%, 100% { transform: rotate(8deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes sniff {
      0%, 100% { transform: rotate(0deg); }
      40% { transform: rotate(-4deg); }
      70% { transform: rotate(3deg); }
    }
    @keyframes twitch {
      0%, 80%, 100% { transform: rotate(0deg); }
      85% { transform: rotate(-12deg); }
      90% { transform: rotate(8deg); }
    }
    @keyframes tossL {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(22deg); }
    }
    @keyframes tossR {
      0%, 100% { transform: rotate(16deg); }
      50% { transform: rotate(-24deg); }
    }
    @keyframes lick {
      0%, 70%, 100% { transform: scaleX(0.15) rotate(8deg); opacity: 0.2; }
      78% { transform: scaleX(1) rotate(-6deg); opacity: 1; }
      88% { transform: scaleX(0.85) rotate(4deg); opacity: 1; }
    }
    @keyframes drift {
      from { transform: translateX(-40px); }
      to { transform: translateX(40px); }
    }
    @keyframes sway {
      from { transform: rotate(-8deg); }
      to { transform: rotate(8deg); }
    }
    @keyframes fadePulse {
      0%, 100% { opacity: 0.75; }
      50% { opacity: 1; }
    }
    /* Three-ball cascade: bottles travel in mirrored arcs */
    @keyframes juggle1 {
      0%   { transform: translate(0px, 0px) rotate(-8deg); }
      25%  { transform: translate(78px, -118px) rotate(120deg); }
      50%  { transform: translate(156px, 8px) rotate(250deg); }
      75%  { transform: translate(78px, 22px) rotate(380deg); }
      100% { transform: translate(0px, 0px) rotate(532deg); }
    }
    @keyframes juggle2 {
      0%   { transform: translate(0px, 0px) rotate(12deg); }
      25%  { transform: translate(-78px, 22px) rotate(-110deg); }
      50%  { transform: translate(-156px, 8px) rotate(-240deg); }
      75%  { transform: translate(-78px, -118px) rotate(-370deg); }
      100% { transform: translate(0px, 0px) rotate(-528deg); }
    }
    @keyframes juggle3 {
      0%   { transform: translate(0px, -110px) rotate(40deg); }
      25%  { transform: translate(0px, 16px) rotate(170deg); }
      50%  { transform: translate(0px, -110px) rotate(310deg); }
      75%  { transform: translate(0px, 16px) rotate(440deg); }
      100% { transform: translate(0px, -110px) rotate(580deg); }
    }
  </style>

  <!-- backdrop -->
  <rect class="scene" width="640" height="520" fill="url(#sky)"/>
  <ellipse cx="480" cy="90" rx="90" ry="70" fill="url(#spot)"/>
  <circle cx="92" cy="72" r="34" fill="#ffe566" opacity="0.95"/>
  <circle cx="92" cy="72" r="42" fill="#fff3b0" opacity="0.35"/>

  <g class="cloud" fill="#ffffff" opacity="0.88">
    <ellipse cx="170" cy="78" rx="38" ry="18"/>
    <ellipse cx="198" cy="72" rx="26" ry="16"/>
    <ellipse cx="148" cy="74" rx="22" ry="14"/>
  </g>
  <g class="cloud2" fill="#ffffff" opacity="0.8">
    <ellipse cx="500" cy="118" rx="46" ry="18"/>
    <ellipse cx="532" cy="112" rx="28" ry="15"/>
    <ellipse cx="472" cy="114" rx="22" ry="13"/>
  </g>

  <!-- hills -->
  <path d="M0 330 C80 290 150 310 230 300 C320 288 380 250 470 270 C540 286 590 250 640 268 L640 520 L0 520 Z" fill="#b5e48c" opacity="0.55"/>
  <rect x="0" y="368" width="640" height="152" fill="url(#ground)"/>
  <ellipse cx="320" cy="430" rx="150" ry="22" fill="#40916c" opacity="0.35"/>

  <!-- grass tufts -->
  <g fill="#2d6a4f">
    <g class="grass-blade" style="animation-delay: 0s">
      <path d="M70 368 q8 -28 2 -46 q10 16 8 46 z"/>
    </g>
    <g class="grass-blade" style="animation-delay: -0.6s">
      <path d="M92 368 q-6 -24 4 -40 q6 14 2 40 z"/>
    </g>
    <g class="grass-blade" style="animation-delay: -1.1s">
      <path d="M540 368 q8 -30 0 -50 q12 18 10 50 z"/>
    </g>
    <g class="grass-blade" style="animation-delay: -0.3s">
      <path d="M562 368 q-8 -22 2 -38 q8 12 4 38 z"/>
    </g>
  </g>

  <!-- rolling ground stripes for motion feel -->
  <g opacity="0.18" stroke="#1b4332" stroke-width="3" fill="none">
    <path d="M40 410 q40 8 80 0"/>
    <path d="M480 418 q40 8 80 0"/>
    <path d="M160 448 q50 10 100 0"/>
    <path d="M400 452 q50 8 90 0"/>
  </g>

  <!-- UNICYCLE + ANTEATER -->
  <g filter="url(#softShadow)">
    <!-- wheel -->
    <g class="wheel">
      <circle cx="320" cy="390" r="62" fill="none" stroke="#1d3557" stroke-width="10"/>
      <circle cx="320" cy="390" r="62" fill="none" stroke="#457b9d" stroke-width="3"/>
      <circle cx="320" cy="390" r="8" fill="#212529"/>
      <g stroke="#495057" stroke-width="3">
        <line x1="320" y1="390" x2="320" y2="328"/>
        <line x1="320" y1="390" x2="320" y2="452"/>
        <line x1="320" y1="390" x2="258" y2="390"/>
        <line x1="320" y1="390" x2="382" y2="390"/>
        <line x1="320" y1="390" x2="276" y2="346"/>
        <line x1="320" y1="390" x2="364" y2="434"/>
        <line x1="320" y1="390" x2="364" y2="346"/>
        <line x1="320" y1="390" x2="276" y2="434"/>
      </g>
      <circle cx="320" cy="390" r="54" fill="none" stroke="#adb5bd" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- pedals / crank -->
    <g class="crank">
      <line x1="292" y1="362" x2="348" y2="418" stroke="#343a40" stroke-width="6" stroke-linecap="round"/>
      <rect x="278" y="352" width="26" height="10" rx="3" fill="#e9c46a" transform="rotate(-38 291 357)"/>
      <rect x="336" y="412" width="26" height="10" rx="3" fill="#e9c46a" transform="rotate(-38 349 417)"/>
    </g>

    <!-- fork / seat post -->
    <path d="M320 390 L320 262" stroke="#343a40" stroke-width="8" stroke-linecap="round"/>
    <path d="M308 390 Q320 350 320 310" fill="none" stroke="#6c757d" stroke-width="4"/>
    <path d="M332 390 Q320 350 320 310" fill="none" stroke="#6c757d" stroke-width="4"/>
    <ellipse cx="320" cy="252" rx="28" ry="10" fill="#212529"/>
    <ellipse cx="320" cy="248" rx="26" ry="8" fill="#3d405b"/>

    <!-- rider -->
    <g class="rider">
      <!-- tail -->
      <g class="tail">
        <path d="M230 268 C170 250 130 300 118 250 C108 212 158 200 188 228 C210 246 226 250 238 262"
              fill="#8d6a46"/>
        <path d="M188 228 C210 210 236 236 230 258" fill="#c4a574" opacity="0.55"/>
        <!-- tail stripes -->
        <path d="M150 248 q18 -8 28 6" fill="none" stroke="#5c4033" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
        <path d="M168 232 q16 -6 24 8" fill="none" stroke="#5c4033" stroke-width="3" stroke-linecap="round" opacity="0.35"/>
      </g>

      <!-- hind legs on pedals (suggestive, bouncing with rider) -->
      <path d="M286 268 C276 310 282 340 300 352" fill="none" stroke="#7a5230" stroke-width="16" stroke-linecap="round"/>
      <path d="M338 268 C352 308 348 338 340 356" fill="none" stroke="#6b4423" stroke-width="16" stroke-linecap="round"/>
      <ellipse cx="298" cy="356" rx="14" ry="8" fill="#4a3728" transform="rotate(-20 298 356)"/>
      <ellipse cx="342" cy="358" rx="14" ry="8" fill="#4a3728" transform="rotate(18 342 358)"/>
      <!-- claws -->
      <path d="M288 352 l-8 6 M296 354 l-4 8 M304 352 l2 8" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M334 354 l8 6 M342 356 l4 8 M350 354 l-2 8" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- body -->
      <ellipse cx="318" cy="236" rx="62" ry="42" fill="url(#fur)"/>
      <ellipse cx="328" cy="242" rx="40" ry="26" fill="#d7b98a" opacity="0.55"/>
      <!-- belly markings -->
      <ellipse cx="332" cy="250" rx="18" ry="10" fill="#efe0c6" opacity="0.5"/>

      <!-- left arm (back) -->
      <g class="arm-left">
        <path d="M292 230 C270 200 262 168 250 150" fill="none" stroke="#8d6a46" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="246" cy="146" rx="11" ry="8" fill="#6b4423" transform="rotate(-30 246 146)"/>
        <path d="M238 142 l-8 -4 M240 148 l-10 0 M244 152 l-8 5" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>

      <!-- head -->
      <g class="snout">
        <ellipse cx="358" cy="196" rx="36" ry="32" fill="#c4a574"/>
        <!-- long snout -->
        <path d="M372 200 C410 208 450 214 478 222 C486 224 486 232 476 234 C440 228 400 222 368 218 Z" fill="url(#snoutGrad)"/>
        <ellipse cx="472" cy="226" rx="12" ry="9" fill="#5c4033"/>
        <ellipse cx="476" cy="223" rx="3" ry="2" fill="#2b2118"/>
        <!-- tongue -->
        <path class="tongue" d="M478 228 q18 8 28 4 q-8 10 -26 8 q-4 -4 -2 -12z" fill="#e76f51"/>
        <!-- eye -->
        <ellipse cx="368" cy="186" rx="8" ry="9" fill="#fff"/>
        <circle cx="370" cy="187" r="4.2" fill="#1d3557"/>
        <circle cx="371.5" cy="185.5" r="1.5" fill="#fff"/>
        <path d="M356 176 q12 -8 24 0" fill="none" stroke="#5c4033" stroke-width="2.4" stroke-linecap="round"/>
        <!-- smile crease -->
        <path d="M392 210 q16 8 36 4" fill="none" stroke="#8d6a46" stroke-width="2" opacity="0.6"/>
      </g>

      <!-- ear -->
      <g class="ear">
        <ellipse cx="338" cy="164" rx="12" ry="16" fill="#8d6a46"/>
        <ellipse cx="338" cy="166" rx="6" ry="9" fill="#e7c8a0"/>
      </g>
      <ellipse cx="348" cy="172" rx="7" ry="6" fill="#c4a574"/>

      <!-- right arm (front) -->
      <g class="arm-right">
        <path d="M348 228 C372 198 392 176 410 158" fill="none" stroke="#a67c52" stroke-width="12" stroke-linecap="round"/>
        <ellipse cx="414" cy="154" rx="11" ry="8" fill="#6b4423" transform="rotate(28 414 154)"/>
        <path d="M422 150 l8 -4 M422 156 l10 -1 M418 160 l8 5" stroke="#2b2118" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </g>
  </g>

  <!-- JUGGLING BOTTLES (positions relative to throw hands) -->
  <!-- bottle 1 starts near left hand -->
  <g class="b1" transform="translate(248,148)">
    <g transform="translate(-10,-28)">
      <path d="M4 18 h12 v18 a6 6 0 0 1 -12 0 z" fill="#2a9d8f"/>
      <rect x="7" y="8" width="6" height="12" rx="1.5" fill="#2a9d8f"/>
      <rect x="8" y="2" width="4" height="8" rx="1" fill="#e9c46a"/>
      <path d="M6 22 h8" stroke="#ffffff" stroke-width="2" opacity="0.45"/>
      <ellipse cx="10" cy="26" rx="3" ry="5" fill="#ffffff" opacity="0.18"/>
    </g>
  </g>

  <!-- bottle 2 starts near right hand -->
  <g class="b2" transform="translate(414,154)">
    <g transform="translate(-10,-28)">
      <path d="M4 18 h12 v18 a6 6 0 0 1 -12 0 z" fill="#e76f51"/>
      <rect x="7" y="8" width="6" height="12" rx="1.5" fill="#e76f51"/>
      <rect x="8" y="2" width="4" height="8" rx="1" fill="#264653"/>
      <path d="M6 22 h8" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
      <ellipse cx="10" cy="26" rx="3" ry="5" fill="#ffffff" opacity="0.18"/>
    </g>
  </g>

  <!-- bottle 3 in the air -->
  <g class="b3" transform="translate(330,70)">
    <g transform="translate(-10,-28)">
      <path d="M4 18 h12 v18 a6 6 0 0 1 -12 0 z" fill="#457b9d"/>
      <rect x="7" y="8" width="6" height="12" rx="1.5" fill="#457b9d"/>
      <rect x="8" y="2" width="4" height="8" rx="1" fill="#f4a261"/>
      <path d="M6 22 h8" stroke="#ffffff" stroke-width="2" opacity="0.4"/>
      <ellipse cx="10" cy="26" rx="3" ry="5" fill="#ffffff" opacity="0.18"/>
    </g>
  </g>

  <!-- caption -->
  <g class="label">
    <rect x="170" y="478" width="300" height="28" rx="14" fill="#1d3557" opacity="0.82"/>
    <text x="320" y="497" text-anchor="middle" fill="#f1faee" font-size="14" font-weight="700" letter-spacing="0.6">ANTEATER • UNICYCLE • BOTTLES</text>
  </g>
</svg>
