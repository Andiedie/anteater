<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F6FF"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7CB342"/>
      <stop offset="100%" stop-color="#558B2F"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D7CCC8"/>
      <stop offset="100%" stop-color="#A1887F"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .scene { overflow: hidden; }
    .bob {
      animation: bob 0.45s ease-in-out infinite alternate;
      transform-origin: 400px 380px;
    }
    .lean {
      animation: lean 1.6s ease-in-out infinite alternate;
      transform-origin: 400px 420px;
    }
    .wheel {
      animation: spin 0.7s linear infinite;
      transform-origin: 400px 470px;
    }
    .spoke {
      animation: spin 0.7s linear infinite;
      transform-origin: 400px 470px;
    }
    .pedal-l {
      animation: pedalL 0.7s linear infinite;
      transform-origin: 400px 470px;
    }
    .pedal-r {
      animation: pedalR 0.7s linear infinite;
      transform-origin: 400px 470px;
    }
    .leg-l {
      animation: legL 0.7s ease-in-out infinite;
      transform-origin: 392px 355px;
    }
    .leg-r {
      animation: legR 0.7s ease-in-out infinite;
      transform-origin: 408px 355px;
    }
    .arm-l {
      animation: armL 0.55s ease-in-out infinite alternate;
      transform-origin: 355px 250px;
    }
    .arm-r {
      animation: armR 0.55s ease-in-out infinite alternate;
      transform-origin: 445px 250px;
    }
    .snout {
      animation: snoutWiggle 1.2s ease-in-out infinite;
      transform-origin: 300px 215px;
    }
    .tail {
      animation: tailWag 0.8s ease-in-out infinite alternate;
      transform-origin: 470px 280px;
    }
    .tongue {
      animation: tongueFlick 1.4s ease-in-out infinite;
      transform-origin: 175px 205px;
    }
    .bottle1 { animation: juggle1 1.2s ease-in-out infinite; }
    .bottle2 { animation: juggle2 1.2s ease-in-out infinite; }
    .bottle3 { animation: juggle3 1.2s ease-in-out infinite; }
    .cloud1 { animation: drift1 28s linear infinite; }
    .cloud2 { animation: drift2 36s linear infinite; }
    .cloud3 { animation: drift3 22s linear infinite; }
    .dust {
      animation: dustPuff 0.7s ease-out infinite;
    }

    @keyframes bob {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
    @keyframes lean {
      from { transform: rotate(-3deg); }
      to { transform: rotate(3deg); }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pedalL {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pedalR {
      from { transform: rotate(180deg); }
      to { transform: rotate(540deg); }
    }
    @keyframes legL {
      0% { transform: rotate(18deg); }
      50% { transform: rotate(-22deg); }
      100% { transform: rotate(18deg); }
    }
    @keyframes legR {
      0% { transform: rotate(-22deg); }
      50% { transform: rotate(18deg); }
      100% { transform: rotate(-22deg); }
    }
    @keyframes armL {
      from { transform: rotate(-25deg); }
      to { transform: rotate(20deg); }
    }
    @keyframes armR {
      from { transform: rotate(25deg); }
      to { transform: rotate(-20deg); }
    }
    @keyframes snoutWiggle {
      0%, 100% { transform: rotate(-4deg); }
      50% { transform: rotate(6deg); }
    }
    @keyframes tailWag {
      from { transform: rotate(-18deg); }
      to { transform: rotate(22deg); }
    }
    @keyframes tongueFlick {
      0%, 70%, 100% { transform: scaleX(0.2) translateX(0); opacity: 0.3; }
      80% { transform: scaleX(1) translateX(-8px); opacity: 1; }
    }
    @keyframes juggle1 {
      0%   { transform: translate(330px, 210px) rotate(-10deg); }
      25%  { transform: translate(400px, 70px) rotate(80deg); }
      50%  { transform: translate(470px, 210px) rotate(170deg); }
      75%  { transform: translate(400px, 130px) rotate(250deg); }
      100% { transform: translate(330px, 210px) rotate(350deg); }
    }
    @keyframes juggle2 {
      0%   { transform: translate(470px, 210px) rotate(40deg); }
      25%  { transform: translate(400px, 130px) rotate(120deg); }
      50%  { transform: translate(330px, 210px) rotate(200deg); }
      75%  { transform: translate(400px, 70px) rotate(280deg); }
      100% { transform: translate(470px, 210px) rotate(400deg); }
    }
    @keyframes juggle3 {
      0%   { transform: translate(400px, 70px) rotate(0deg); }
      25%  { transform: translate(470px, 210px) rotate(90deg); }
      50%  { transform: translate(400px, 130px) rotate(180deg); }
      75%  { transform: translate(330px, 210px) rotate(270deg); }
      100% { transform: translate(400px, 70px) rotate(360deg); }
    }
    @keyframes drift1 {
      from { transform: translateX(-180px); }
      to { transform: translateX(900px); }
    }
    @keyframes drift2 {
      from { transform: translateX(-250px); }
      to { transform: translateX(900px); }
    }
    @keyframes drift3 {
      from { transform: translateX(-120px); }
      to { transform: translateX(900px); }
    }
    @keyframes dustPuff {
      0% { opacity: 0.5; transform: translate(0,0) scale(0.6); }
      100% { opacity: 0; transform: translate(-40px, -8px) scale(1.4); }
    }
  </style>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse class="cloud1" cx="80" cy="80" rx="50" ry="22" fill="#fff" opacity="0.85"/>
  <ellipse class="cloud1" cx="120" cy="80" rx="35" ry="18" fill="#fff" opacity="0.85"/>
  <ellipse class="cloud2" cx="40" cy="140" rx="60" ry="24" fill="#fff" opacity="0.7"/>
  <ellipse class="cloud2" cx="90" cy="138" rx="40" ry="20" fill="#fff" opacity="0.7"/>
  <ellipse class="cloud3" cx="20" cy="50" rx="45" ry="16" fill="#fff" opacity="0.6"/>

  <rect y="500" width="800" height="100" fill="url(#ground)"/>
  <ellipse cx="400" cy="515" rx="90" ry="12" fill="#4E7A28" opacity="0.5"/>

  <!-- Dust -->
  <g transform="translate(330, 500)">
    <circle class="dust" cx="0" cy="0" r="8" fill="#c4a574" style="animation-delay: 0s"/>
    <circle class="dust" cx="10" cy="4" r="6" fill="#d2b48c" style="animation-delay: 0.2s"/>
    <circle class="dust" cx="18" cy="2" r="5" fill="#c4a574" style="animation-delay: 0.4s"/>
  </g>

  <!-- Whole rider group with lean -->
  <g class="lean">
    <g class="bob">
      <!-- Tail -->
      <path class="tail" d="M470 280 C 540 250, 590 320, 620 250 C 600 340, 520 360, 470 300 Z"
            fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
      <ellipse cx="605" cy="262" rx="14" ry="10" fill="#A1887F"/>

      <!-- Unicycle frame -->
      <line x1="400" y1="355" x2="400" y2="430" stroke="#37474F" stroke-width="8" stroke-linecap="round"/>
      <rect x="372" y="348" width="56" height="14" rx="6" fill="#5D4037" stroke="#3E2723" stroke-width="2"/>
      <!-- Seat -->
      <ellipse cx="400" cy="348" rx="32" ry="12" fill="#4E342E"/>

      <!-- Legs -->
      <g class="leg-l">
        <path d="M392 355 Q 360 400 370 445" fill="none" stroke="#8D6E63" stroke-width="16" stroke-linecap="round"/>
        <ellipse cx="368" cy="452" rx="16" ry="8" fill="#5D4037"/>
      </g>
      <g class="leg-r">
        <path d="M408 355 Q 440 400 430 445" fill="none" stroke="#A1887F" stroke-width="16" stroke-linecap="round"/>
        <ellipse cx="432" cy="452" rx="16" ry="8" fill="#5D4037"/>
      </g>

      <!-- Body -->
      <ellipse cx="400" cy="280" rx="72" ry="85" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
      <ellipse cx="400" cy="295" rx="48" ry="58" fill="#D7CCC8"/>
      <!-- Spots -->
      <ellipse cx="365" cy="250" rx="10" ry="7" fill="#6D4C41" opacity="0.45"/>
      <ellipse cx="430" cy="265" rx="8" ry="6" fill="#6D4C41" opacity="0.4"/>
      <ellipse cx="380" cy="320" rx="9" ry="6" fill="#6D4C41" opacity="0.35"/>

      <!-- Arms -->
      <g class="arm-l">
        <path d="M355 250 Q 310 230 300 190" fill="none" stroke="#8D6E63" stroke-width="14" stroke-linecap="round"/>
        <circle cx="298" cy="185" r="12" fill="#A1887F" stroke="#5D4037" stroke-width="2"/>
      </g>
      <g class="arm-r">
        <path d="M445 250 Q 490 230 500 190" fill="none" stroke="#A1887F" stroke-width="14" stroke-linecap="round"/>
        <circle cx="502" cy="185" r="12" fill="#A1887F" stroke="#5D4037" stroke-width="2"/>
      </g>

      <!-- Head -->
      <ellipse cx="355" cy="195" rx="55" ry="42" fill="#8D6E63" stroke="#5D4037" stroke-width="3"/>
      <!-- Ear -->
      <ellipse cx="375" cy="155" rx="16" ry="22" fill="#8D6E63" stroke="#5D4037" stroke-width="2"/>
      <ellipse cx="375" cy="158" rx="8" ry="12" fill="#E8D5C4"/>
      <!-- Snout -->
      <g class="snout">
        <ellipse cx="250" cy="205" rx="85" ry="22" fill="#A1887F" stroke="#5D4037" stroke-width="3"/>
        <ellipse cx="185" cy="200" rx="18" ry="14" fill="#6D4C41"/>
        <circle cx="178" cy="196" r="4" fill="#3E2723"/>
        <circle cx="188" cy="196" r="4" fill="#3E2723"/>
        <path class="tongue" d="M168 205 Q 145 218 155 228" fill="none" stroke="#E57373" stroke-width="6" stroke-linecap="round"/>
      </g>
      <!-- Eye -->
      <circle cx="340" cy="185" r="10" fill="#fff" stroke="#3E2723" stroke-width="1.5"/>
      <circle cx="343" cy="186" r="5" fill="#212121"/>
      <circle cx="345" cy="184" r="2" fill="#fff"/>
      <!-- Smile -->
      <path d="M320 215 Q 330 222 342 216" fill="none" stroke="#5D4037" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Wheel (doesn't bob as much - attached to frame conceptually) -->
    <g>
      <circle class="wheel" cx="400" cy="470" r="55" fill="none" stroke="#263238" stroke-width="10"/>
      <circle cx="400" cy="470" r="48" fill="none" stroke="#546E7A" stroke-width="3"/>
      <g class="spoke">
        <line x1="400" y1="422" x2="400" y2="518" stroke="#90A4AE" stroke-width="3"/>
        <line x1="352" y1="470" x2="448" y2="470" stroke="#90A4AE" stroke-width="3"/>
        <line x1="366" y1="436" x2="434" y2="504" stroke="#90A4AE" stroke-width="3"/>
        <line x1="434" y1="436" x2="366" y2="504" stroke="#90A4AE" stroke-width="3"/>
      </g>
      <circle cx="400" cy="470" r="10" fill="#37474F"/>
      <!-- Pedals -->
      <g class="pedal-l">
        <line x1="400" y1="470" x2="400" y2="445" stroke="#455A64" stroke-width="5"/>
        <rect x="388" y="438" width="24" height="8" rx="2" fill="#FF8A65"/>
      </g>
      <g class="pedal-r">
        <line x1="400" y1="470" x2="400" y2="445" stroke="#455A64" stroke-width="5"/>
        <rect x="388" y="438" width="24" height="8" rx="2" fill="#FF8A65"/>
      </g>
    </g>
  </g>

  <!-- Juggling bottles (positions animated via transform in keyframes) -->
  <g class="bottle1">
    <g transform="translate(-12,-28)">
      <rect x="6" y="0" width="12" height="10" rx="2" fill="#66BB6A" stroke="#2E7D32" stroke-width="1"/>
      <path d="M4 10 L2 18 L22 18 L20 10 Z" fill="#81C784"/>
      <rect x="2" y="18" width="20" height="28" rx="4" fill="#43A047" stroke="#2E7D32" stroke-width="1.5"/>
      <rect x="5" y="24" width="14" height="10" rx="2" fill="#A5D6A7" opacity="0.5"/>
      <ellipse cx="12" cy="48" rx="8" ry="3" fill="#2E7D32" opacity="0.4"/>
    </g>
  </g>
  <g class="bottle2">
    <g transform="translate(-12,-28)">
      <rect x="6" y="0" width="12" height="10" rx="2" fill="#42A5F5" stroke="#1565C0" stroke-width="1"/>
      <path d="M4 10 L2 18 L22 18 L20 10 Z" fill="#64B5F6"/>
      <rect x="2" y="18" width="20" height="28" rx="4" fill="#1E88E5" stroke="#1565C0" stroke-width="1.5"/>
      <rect x="5" y="24" width="14" height="10" rx="2" fill="#90CAF9" opacity="0.5"/>
    </g>
  </g>
  <g class="bottle3">
    <g transform="translate(-12,-28)">
      <rect x="6" y="0" width="12" height="10" rx="2" fill="#FF7043" stroke="#D84315" stroke-width="1"/>
      <path d="M4 10 L2 18 L22 18 L20 10 Z" fill="#FF8A65"/>
      <rect x="2" y="18" width="20" height="28" rx="4" fill="#F4511E" stroke="#D84315" stroke-width="1.5"/>
      <rect x="5" y="24" width="14" height="10" rx="2" fill="#FFAB91" opacity="0.5"/>
    </g>
  </g>

  <!-- Title -->
  <text x="400" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#33691E">
    Anteater Unicycle Circus
  </text>
</svg>
