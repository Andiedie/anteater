<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" width="480" height="560">
  <title>An anteater riding a unicycle while juggling bottles</title>

  <defs>
    <radialGradient id="skyGlow" cx="50%" cy="42%" r="70%">
      <stop offset="0%" stop-color="#fff7e6"/>
      <stop offset="60%" stop-color="#ffe9c2"/>
      <stop offset="100%" stop-color="#ffd9a0"/>
    </radialGradient>
    <linearGradient id="groundGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd48a"/>
      <stop offset="100%" stop-color="#5fb567"/>
    </linearGradient>

    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

    <!-- Reusable juggling bottle -->
    <g id="bottle">
      <rect x="-9" y="-34" width="18" height="34" rx="5" fill="#8a4f2a"/>
      <rect x="-9" y="-34" width="7" height="34" rx="3" fill="#b06a3c" opacity="0.7"/>
      <rect x="-5" y="-46" width="10" height="13" rx="3" fill="#8a4f2a"/>
      <rect x="-6" y="-51" width="12" height="7" rx="2" fill="#43a047"/>
      <rect x="-6" y="-49" width="12" height="2" fill="#e8f5e9" opacity="0.8"/>
      <rect x="-8" y="-24" width="16" height="9" rx="2" fill="#f5e6c8" opacity="0.9"/>
      <rect x="-6" y="-22" width="12" height="1.6" fill="#a05a2c"/>
      <rect x="-6" y="-18.5" width="12" height="1.6" fill="#a05a2c"/>
    </g>
  </defs>

  <style>
    .outline { stroke:#221a14; stroke-width:3; stroke-linejoin:round; stroke-linecap:round; }
    .dash { fill:none; stroke:#e07b39; stroke-width:4; stroke-dasharray:3 12; stroke-linecap:round; opacity:.85; }

    @keyframes spin    { to { transform: rotate(360deg); } }
    @keyframes strafe  { 0%,100% { transform: translateX(0); } 50% { transform: translateX(-60px); } }
    @keyframes strafe2 { 0%,100% { transform: translateX(0); } 50% { transform: translateX(60px); } }
    @keyframes bob     { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    @keyframes toss1   { 0%   { transform: translate(147px,274px) rotate(0deg); }
                         100% { transform: translate(147px,274px) rotate(720deg); } }
    @keyframes toss2   { 0%   { transform: translate(240px,264px) rotate(0deg); }
                         100% { transform: translate(240px,264px) rotate(720deg); } }
    @keyframes toss3   { 0%   { transform: translate(333px,274px) rotate(0deg); }
                         100% { transform: translate(333px,274px) rotate(720deg); } }

    .wheel   { transform-box: view-box; transform-origin: 240px 455px; animation: spin 0.9s linear infinite; }
    .pedalR  { transform-box: view-box; transform-origin: 240px 455px; animation: spin 0.9s linear infinite; }
    .pedalL  { transform-box: view-box; transform-origin: 240px 455px; animation: spin 0.9s linear infinite; animation-delay: -0.45s; }
    .buddy   { transform-box: view-box; transform-origin: 240px 470px; animation: bob 1.8s ease-in-out infinite; }
    .cloudL  { transform-box: view-box; animation: strafe 9s ease-in-out infinite; }
    .cloudR  { transform-box: view-box; animation: strafe2 11s ease-in-out infinite; }
    .twk     { animation: twinkle 1.2s ease-in-out infinite; }
    .twk2    { animation: twinkle 1.2s ease-in-out infinite; animation-delay: -0.6s; }
    .bottle1 { transform-box: fill-box; transform-origin: center; animation: toss1 1.8s cubic-bezier(.45,0,.55,1) infinite; }
    .bottle2 { transform-box: fill-box; transform-origin: center; animation: toss2 1.8s cubic-bezier(.45,0,.55,1) infinite; }
    .bottle3 { transform-box: fill-box; transform-origin: center; animation: toss3 1.8s cubic-bezier(.45,0,.55,1) infinite; }
  </style>

  <!-- Backdrop -->
  <rect width="480" height="560" fill="url(#skyGlow)"/>
  <circle cx="398" cy="92" r="46" fill="#ffd166" opacity="0.55" filter="url(#soft)"/>
  <circle cx="398" cy="92" r="30" fill="#ffd166"/>
  <g fill="#e07b39" opacity="0.55">
    <g class="cloudL">
      <ellipse cx="80"  cy="110" rx="46" ry="13"/>
      <ellipse cx="118" cy="102" rx="30" ry="10"/>
    </g>
    <g class="cloudR">
      <ellipse cx="360" cy="176" rx="52" ry="13"/>
      <ellipse cx="322" cy="170" rx="30" ry="10"/>
    </g>
  </g>

  <!-- Ground -->
  <rect x="0" y="492" width="480" height="68" fill="url(#groundGrad)"/>
  <ellipse cx="240" cy="506" rx="170" ry="17" fill="#1c4d26" opacity="0.45" filter="url(#soft)"/>

  <!-- Juggling arc (dashed) -->
  <path class="dash" d="M147 274 Q240 70 333 274"/>

  <!-- Unicycle -->
  <g>
    <circle cx="240" cy="455" r="50" fill="none" stroke="#3b2f26" stroke-width="10"/>
    <g class="wheel">
      <circle cx="240" cy="455" r="44" fill="none" stroke="#cfd8dc" stroke-width="5"/>
      <g stroke="#eceff1" stroke-width="3">
        <line x1="240" y1="455" x2="240" y2="413"/>
        <line x1="240" y1="455" x2="284" y2="455"/>
        <line x1="240" y1="455" x2="240" y2="497"/>
        <line x1="240" y1="455" x2="196" y2="455"/>
        <line x1="240" y1="455" x2="271" y2="424"/>
        <line x1="240" y1="455" x2="271" y2="486"/>
        <line x1="240" y1="455" x2="209" y2="486"/>
        <line x1="240" y1="455" x2="209" y2="424"/>
      </g>
    </g>
    <circle cx="240" cy="455" r="7" fill="#455a64" class="outline" stroke-width="2"/>
    <path d="M240 455 L234 372 L246 372 Z" fill="#c62828" class="outline"/>
    <rect x="206" y="358" width="68" height="15" rx="7" fill="#c62828" class="outline"/>
    <!-- crank + pedals -->
    <g class="pedalR">
      <line x1="240" y1="455" x2="274" y2="455" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
      <rect x="266" y="447" width="24" height="9" rx="3" fill="#263238"/>
    </g>
    <g class="pedalL">
      <line x1="240" y1="455" x2="206" y2="455" stroke="#37474f" stroke-width="5" stroke-linecap="round"/>
      <rect x="190" y="447" width="24" height="9" rx="3" fill="#263238"/>
    </g>
  </g>

  <!-- Anteater -->
  <g class="buddy">
    <!-- body -->
    <path d="M266 366 C300 356 310 324 292 306 C310 334 290 352 254 358 Z" fill="#8d7663" class="outline"/>
    <ellipse cx="238" cy="304" rx="46" ry="56" fill="#9b8470" class="outline"/>
    <!-- belly -->
    <ellipse cx="234" cy="318" rx="32" ry="42" fill="#e8d7bf" opacity="0.75"/>
    <!-- left arm reaching up-left -->
    <path d="M210 296 Q178 282 158 268" fill="none" stroke="#9b8470" stroke-width="16" stroke-linecap="round"/>
    <circle cx="155" cy="266" r="9" fill="#8d7663" class="outline" stroke-width="2.5"/>
    <!-- right arm reaching up-right -->
    <path d="M268 296 Q300 282 322 268" fill="none" stroke="#9b8470" stroke-width="16" stroke-linecap="round"/>
    <circle cx="325" cy="266" r="9" fill="#8d7663" class="outline" stroke-width="2.5"/>

    <!-- legs (drawn over the body, feet planted on the pedals) -->
    <path d="M216 356 L206 440" fill="none" stroke="#7b6350" stroke-width="20" stroke-linecap="round"/>
    <path d="M206 440 q-14 0 -16 8 q16 4 22 0 z" fill="#3b3129"/>
    <path d="M264 356 L282 440" fill="none" stroke="#7b6350" stroke-width="20" stroke-linecap="round"/>
    <path d="M274 440 q14 0 16 8 q-16 4 -22 0 z" fill="#3b3129"/>

    <!-- head + snout -->
    <g>
      <path d="M224 256 C248 252 274 240 288 224 C300 210 306 190 300 174 C294 158 274 154 258 166 C244 176 234 194 230 212 C226 230 218 244 224 256 Z" fill="#9b8470" class="outline"/>
      <!-- snout -->
      <path d="M258 178 C272 152 296 120 330 112 C346 108 352 116 344 128 C334 142 320 156 310 166 C300 176 288 184 276 186 Z" fill="#9b8470" class="outline"/>
      <path d="M262 174 C276 150 298 122 330 114 C344 111 350 118 343 128 C333 141 320 154 310 164 Z" fill="#b09a86" opacity="0.7"/>
      <!-- nose -->
      <circle cx="341" cy="116" r="7" fill="#3b3129"/>
      <!-- mouth -->
      <path d="M337 130 q-8 3 -14 0" fill="none" stroke="#3b3129" stroke-width="2.5" stroke-linecap="round"/>
      <!-- eye -->
      <circle cx="278" cy="196" r="7.5" fill="#ffffff" class="outline" stroke-width="2.5"/>
      <circle cx="280" cy="197" r="3.8" fill="#221a14"/>
      <circle cx="278.5" cy="195" r="1.3" fill="#ffffff"/>
      <!-- ear -->
      <ellipse cx="248" cy="176" rx="10" ry="13" fill="#9b8470" class="outline" transform="rotate(-20 248 176)"/>
      <ellipse cx="249" cy="177" rx="5" ry="7.5" fill="#c9a48f" transform="rotate(-20 249 177)"/>
      <!-- stripe -->
      <path d="M266 216 C256 232 250 246 250 258" fill="none" stroke="#5d4a3a" stroke-width="6" stroke-linecap="round" opacity="0.65"/>
    </g>
  </g>

  <!-- Juggling bottles -->
  <g class="bottle1"><use href="#bottle"/></g>
  <g class="bottle2"><use href="#bottle"/></g>
  <g class="bottle3"><use href="#bottle"/></g>

  <!-- sparkles -->
  <g stroke="#ffb703" stroke-width="3" stroke-linecap="round">
    <line x1="110" y1="200" x2="110" y2="216" class="twk"/>
    <line x1="102" y1="208" x2="118" y2="208" class="twk"/>
    <line x1="366" y1="214" x2="366" y2="230" class="twk2"/>
    <line x1="358" y1="222" x2="374" y2="222" class="twk2"/>
  </g>
</svg>
