<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Anteater riding a unicycle and juggling bottles</title>
  <desc id="desc">A looping animation of a cheerful anteater balancing on a moving unicycle while three colorful bottles arc between its paws.</desc>
  <defs>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#bcecff"/>
      <stop offset="1" stop-color="#fff7dc"/>
    </linearGradient>
    <linearGradient id="fur" x2=".8" y2="1">
      <stop stop-color="#7b6558"/>
      <stop offset="1" stop-color="#4a3a36"/>
    </linearGradient>
    <linearGradient id="cream" x2="1" y2="1">
      <stop stop-color="#f2dfbd"/>
      <stop offset="1" stop-color="#cba982"/>
    </linearGradient>
    <radialGradient id="wheel" cx="35%" cy="25%">
      <stop stop-color="#41566c"/>
      <stop offset="1" stop-color="#172432"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#3c2830" flood-opacity=".25"/>
    </filter>

    <g id="bottle-red">
      <path d="M-10-29h20v9l5 6v35q0 8-8 8H-7q-8 0-8-8v-35l5-6z" fill="#e8594f" stroke="#733b3d" stroke-width="3"/>
      <path d="M-10-29h20v8h-20z" fill="#f5d58a" stroke="#733b3d" stroke-width="3"/>
      <path d="M-13 1h26v13h-26z" fill="#fff1be" opacity=".9"/>
      <circle cy="7" r="4" fill="#e8594f"/>
    </g>
    <g id="bottle-blue">
      <path d="M-10-29h20v9l5 6v35q0 8-8 8H-7q-8 0-8-8v-35l5-6z" fill="#45a9bd" stroke="#285469" stroke-width="3"/>
      <path d="M-10-29h20v8h-20z" fill="#f5d58a" stroke="#285469" stroke-width="3"/>
      <path d="M-13 1h26v13h-26z" fill="#fff1be" opacity=".9"/>
      <path d="M-5 7h10" stroke="#45a9bd" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g id="bottle-gold">
      <path d="M-10-29h20v9l5 6v35q0 8-8 8H-7q-8 0-8-8v-35l5-6z" fill="#f0a83b" stroke="#76502d" stroke-width="3"/>
      <path d="M-10-29h20v8h-20z" fill="#f7e8ae" stroke="#76502d" stroke-width="3"/>
      <path d="M-13 1h26v13h-26z" fill="#fff6d5" opacity=".9"/>
      <path d="M0 2l2 4 5 .5-4 3 1 5-4-2.5-4 2.5 1-5-4-3 5-.5z" fill="#f0a83b"/>
    </g>
  </defs>

  <style>
    .cloud { animation: drift 18s linear infinite; }
    .cloud.two { animation-duration: 24s; animation-delay: -11s; }
    .rider { transform-origin: 500px 555px; animation: balance 1.1s ease-in-out infinite alternate; }
    .wheel-spin { transform-origin: 500px 568px; animation: spin 1.25s linear infinite; }
    .pedals { transform-origin: 500px 568px; animation: spin 1.25s linear infinite; }
    .left-leg { transform-origin: 466px 493px; animation: legA 1.25s ease-in-out infinite; }
    .right-leg { transform-origin: 532px 493px; animation: legB 1.25s ease-in-out infinite; }
    .tail { transform-origin: 392px 400px; animation: tail 1.5s ease-in-out infinite alternate; }
    .ear { transform-origin: 482px 255px; animation: ear .8s ease-in-out infinite alternate; }
    .scarf-end { transform-origin: 461px 336px; animation: scarf .6s ease-in-out infinite alternate; }
    .shadow { animation: squash 1.1s ease-in-out infinite alternate; transform-origin: 500px 646px; }
    .spark { animation: twinkle 1.2s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-180px) } to { transform: translateX(1100px) } }
    @keyframes balance { from { transform: translateY(0) rotate(-1.3deg) } to { transform: translateY(-5px) rotate(1.3deg) } }
    @keyframes spin { to { transform: rotate(360deg) } }
    @keyframes legA { 0%,100% { transform: rotate(-8deg) } 50% { transform: rotate(9deg) } }
    @keyframes legB { 0%,100% { transform: rotate(9deg) } 50% { transform: rotate(-8deg) } }
    @keyframes tail { from { transform: rotate(-5deg) } to { transform: rotate(7deg) } }
    @keyframes ear { from { transform: rotate(-4deg) } to { transform: rotate(5deg) } }
    @keyframes scarf { from { transform: rotate(-4deg) } to { transform: rotate(9deg) } }
    @keyframes squash { from { transform: scaleX(.9); opacity:.2 } to { transform: scaleX(1.05); opacity:.28 } }
    @keyframes twinkle { from { opacity:.25; transform:scale(.7) } to { opacity:1; transform:scale(1.15) } }
    @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.001ms !important; animation-iteration-count: 1 !important; } }
  </style>

  <!-- sky and distant scenery -->
  <rect width="1000" height="700" fill="url(#sky)"/>
  <circle cx="825" cy="105" r="55" fill="#ffd979" opacity=".9"/>
  <g class="cloud" fill="#fff" opacity=".75">
    <ellipse cx="0" cy="125" rx="74" ry="25"/><circle cx="-35" cy="106" r="29"/><circle cx="14" cy="99" r="37"/><circle cx="53" cy="113" r="25"/>
  </g>
  <g class="cloud two" fill="#fff" opacity=".6">
    <ellipse cx="0" cy="215" rx="62" ry="20"/><circle cx="-28" cy="198" r="24"/><circle cx="10" cy="191" r="30"/><circle cx="38" cy="205" r="20"/>
  </g>
  <path d="M0 527Q120 454 245 521t232-5q124-86 260 0 135-82 263 8V700H0z" fill="#9bc878" opacity=".55"/>
  <path d="M0 576q170-68 330 2t341-7q175-66 329 1v128H0z" fill="#6bab68" opacity=".72"/>
  <path d="M0 628q223-24 411 2t589-8v78H0z" fill="#467c55"/>
  <path d="M0 646H1000" stroke="#f3d79d" stroke-width="8" stroke-dasharray="32 20" opacity=".75"/>

  <ellipse class="shadow" cx="500" cy="646" rx="105" ry="17" fill="#193b32" filter="url(#shadow)"/>

  <g class="rider" filter="url(#soft)">
    <!-- unicycle -->
    <g class="wheel-spin">
      <circle cx="500" cy="568" r="76" fill="none" stroke="url(#wheel)" stroke-width="13"/>
      <circle cx="500" cy="568" r="63" fill="none" stroke="#d8e2df" stroke-width="3"/>
      <g stroke="#82959c" stroke-width="2">
        <path d="M500 505v126M437 568h126M455 523l90 90M545 523l-90 90"/>
        <path d="M476 510l48 116M442 544l116 48M524 510l-48 116M558 544l-116 48"/>
      </g>
      <circle cx="500" cy="568" r="11" fill="#e25b4b" stroke="#783c41" stroke-width="4"/>
    </g>
    <path d="M500 568V446" stroke="#283b4a" stroke-width="11" stroke-linecap="round"/>
    <path d="M469 445h62" stroke="#283b4a" stroke-width="15" stroke-linecap="round"/>
    <g class="pedals">
      <path d="M465 568h70" stroke="#283b4a" stroke-width="7" stroke-linecap="round"/>
      <path d="M455 568h22M523 568h22" stroke="#e8c275" stroke-width="9" stroke-linecap="round"/>
    </g>

    <!-- tail behind body -->
    <g class="tail">
      <path d="M408 385Q311 370 260 435q-23 29 5 45 38 21 93-11 47-27 73-62z" fill="url(#fur)" stroke="#3d3130" stroke-width="5"/>
      <path d="M286 458q53-4 112-57" fill="none" stroke="#e2c69e" stroke-width="23" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- legs -->
    <g class="left-leg">
      <path d="M466 475q-12 42-4 76" fill="none" stroke="#5e4a43" stroke-width="25" stroke-linecap="round"/>
      <path d="M461 550l-7 20" stroke="#e1c39d" stroke-width="18" stroke-linecap="round"/>
    </g>
    <g class="right-leg">
      <path d="M532 475q14 39 5 76" fill="none" stroke="#5e4a43" stroke-width="25" stroke-linecap="round"/>
      <path d="M538 550l7 20" stroke="#e1c39d" stroke-width="18" stroke-linecap="round"/>
    </g>

    <!-- torso -->
    <path d="M433 344q51-42 111 2 35 27 22 108-7 42-64 46-71 4-83-47-18-75 14-109z" fill="url(#fur)" stroke="#3d3130" stroke-width="5"/>
    <path d="M445 350q28 32 33 138" fill="none" stroke="#ead2aa" stroke-width="37" stroke-linecap="round"/>
    <path d="M454 340q41 22 94 2" fill="none" stroke="#e85d4f" stroke-width="15" stroke-linecap="round"/>
    <g class="scarf-end">
      <path d="M462 340q-25 37-13 72l22-13 20 7q-16-37-8-62z" fill="#e85d4f" stroke="#8f3d40" stroke-width="4"/>
    </g>

    <!-- arms behind juggling -->
    <path d="M444 369q-55 13-73 65" fill="none" stroke="#5c4941" stroke-width="25" stroke-linecap="round"/>
    <path d="M372 433q-3 16 17 17" fill="none" stroke="#e2c69e" stroke-width="16" stroke-linecap="round"/>
    <path d="M548 368q57 10 78 62" fill="none" stroke="#5c4941" stroke-width="25" stroke-linecap="round"/>
    <path d="M626 429q4 16-16 18" fill="none" stroke="#e2c69e" stroke-width="16" stroke-linecap="round"/>

    <!-- head -->
    <path d="M449 286q-4-54 41-65 53-14 82 29 17 25 0 61-21 45-82 48-43 2-41-73z" fill="url(#fur)" stroke="#3d3130" stroke-width="5"/>
    <g class="ear">
      <path d="M475 268q-31-36-55-4-17 24 17 41z" fill="#6b554c" stroke="#3d3130" stroke-width="5"/>
      <path d="M465 277q-20-16-27-2-5 11 10 17z" fill="#d99c8e"/>
    </g>
    <!-- long anteater muzzle -->
    <path d="M520 274q70 2 145 53 25 17 7 35-15 15-41 1l-124-53z" fill="url(#cream)" stroke="#3d3130" stroke-width="5"/>
    <path d="M661 327q29 15 17 33-7 11-28 4 15-12 11-37z" fill="#25272d"/>
    <path d="M500 239q20 20 22 72" fill="none" stroke="#ecd6b2" stroke-width="22" stroke-linecap="round"/>
    <circle cx="532" cy="273" r="8" fill="#171b21"/>
    <circle cx="535" cy="270" r="2.5" fill="#fff"/>
    <path d="M545 299q18 7 31 4" fill="none" stroke="#3d3130" stroke-width="3" stroke-linecap="round"/>
    <path d="M656 365q-9 13-26 10" fill="none" stroke="#e85d6a" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Juggling bottles follow the same circuit at staggered times -->
  <g>
    <g>
      <animateMotion dur="3s" repeatCount="indefinite" path="M390 417 C355 300 395 143 500 145 C605 143 645 300 610 417 C575 355 425 355 390 417" rotate="auto"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" repeatCount="indefinite"/><use href="#bottle-red"/></g>
    </g>
    <g>
      <animateMotion dur="3s" begin="-1s" repeatCount="indefinite" path="M390 417 C355 300 395 143 500 145 C605 143 645 300 610 417 C575 355 425 355 390 417" rotate="auto"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" begin="-1s" repeatCount="indefinite"/><use href="#bottle-blue"/></g>
    </g>
    <g>
      <animateMotion dur="3s" begin="-2s" repeatCount="indefinite" path="M390 417 C355 300 395 143 500 145 C605 143 645 300 610 417 C575 355 425 355 390 417" rotate="auto"/>
      <g><animateTransform attributeName="transform" type="rotate" from="0" to="720" dur="3s" begin="-2s" repeatCount="indefinite"/><use href="#bottle-gold"/></g>
    </g>
  </g>

  <!-- lively accents -->
  <g fill="#fff4ae">
    <path class="spark" style="transform-origin:341px 292px" d="M341 276l4 12 12 4-12 4-4 12-4-12-12-4 12-4z"/>
    <path class="spark" style="transform-origin:687px 253px;animation-delay:-.6s" d="M687 242l3 8 8 3-8 3-3 8-3-8-8-3 8-3z"/>
    <circle class="spark" cx="308" cy="356" r="5" style="transform-origin:308px 356px;animation-delay:-.3s"/>
  </g>
  <text x="500" y="682" text-anchor="middle" fill="#fff7d4" font-family="Verdana, sans-serif" font-size="18" font-weight="700" letter-spacing="4">THE GREAT ANT-EATER ACT</text>
</svg>
