<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <base href="../../">
  <title>{{NAME}} · max — No SVG delivered</title>
  <meta name="description" data-i18n-content="A recorded test without a delivered SVG, with evidence and limitations." content="A recorded test without a delivered SVG, with evidence and limitations.">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script src="./i18n.js" defer></script>
  <script src="./failure.js" defer></script>
</head>
<body>
  <a class="skip-link" href="./cases/{{SLUG}}/#case" data-i18n="Skip to the test result">Skip to the test result</a>
  <div class="shell">
    <header class="site-header">
      <a class="brand" href="./" aria-label="Anteater home" data-i18n-aria-label="Anteater home"><picture><source media="(prefers-color-scheme: dark)" srcset="./assets/anteater-logo-dark.svg"><img src="./assets/anteater-logo.svg" width="36" height="36" alt=""></picture><span>anteater<span class="brand-period">.</span></span></a>
      <nav aria-label="Main" data-i18n-aria-label="Main"><a href="./" data-i18n="← Collection">← Collection</a><label class="language-control"><span class="sr-only" data-i18n="Language">Language</span><select id="language"><option value="auto">Auto · EN</option><option value="en" lang="en">English</option><option value="zh" lang="zh-CN">中文</option></select></label></nav>
    </header>
    <main class="case-page" id="case" tabindex="-1">
      <p class="eyebrow">{{VENDOR}} <span aria-hidden="true">/</span> <span class="effort" data-level="max">max</span></p>
      <h1>{{NAME}}</h1>
      <div class="case-status"><span data-i18n="No SVG delivered">No SVG delivered</span><span class="badge note" data-i18n="{{STATUS}}">{{STATUS}}</span></div>
      {{COPY}}
      {{SOURCE_LINKS}}
      {{REFERENCES}}
      <a class="solid-button case-related" href="./?run={{RELATED}}"><span data-i18n="View the">View the</span><span>{{LEVEL}}</span><span data-i18n="artwork →">artwork →</span></a>
      <p class="case-date"><span data-i18n="Report dated">Report dated</span> <time datetime="{{DATE}}">{{DATE}}</time></p>
    </main>
  </div>
</body>
</html>
